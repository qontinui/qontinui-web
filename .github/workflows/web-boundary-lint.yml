name: web/backend ↔ qontinui boundary lint

# Phase 9 deliverable of plan-2026-05-17-web-runner-ws-bridge-plan-b.
#
# THE GATE LOGIC LIVES IN `scripts/ci/check_web_boundary.py`, not here.
# Phase 5 of plan 2026-08-08-ci-tool-registry-and-canonical-configuration-parity
# extracted it: this workflow used to carry a multi-line `run:` block of pipes
# and `$(...)`, which the runner-as-CI-node lane (.qontinui/ci.toml, argv-only,
# deliberately shell-free) could not mirror — so the manifest header recorded
# it as inexpressible. Three lanes now invoke the one script:
#
#   * this workflow, step "Scan backend/app for qontinui.* boundary violations"
#   * .qontinui/ci.toml, step `web-boundary-lint`
#   * .pre-commit-config.yaml, hook `web-boundary-lint` (--files mode)
#
# The rule it enforces, the qontinui-schemas carve-out, the embeddings.py
# allowlist and the import-grammar pattern are all documented in the script's
# module docstring. Change them THERE; do not re-inline them here.
#
# Self-trigger avoidance:
# - `on.pull_request.paths` deliberately does NOT include this workflow file,
#   so the introducing PR doesn't run a gate against itself before it has
#   landed on main (per feedback_self_triggering_ci_gates memo). The SCRIPT
#   paths ARE included: a PR that changes the gate's logic should be gated by
#   the version it is introducing. `workflow_dispatch` is included so the gate
#   can be manually fired after merge.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/app/**/*.py"
      - "scripts/ci/check_web_boundary.py"
      - "scripts/ci/_gate_lib.py"
  push:
    branches: [main, develop]
    paths:
      - "backend/app/**/*.py"
      - "scripts/ci/check_web_boundary.py"
      - "scripts/ci/_gate_lib.py"
  workflow_dispatch:

jobs:
  web-boundary-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Scan backend/app for qontinui.* boundary violations
        # Exits 1 on a violation and 2 if it scanned nothing — a gate that
        # passed because its input set was empty is not a pass.
        run: python scripts/ci/check_web_boundary.py
