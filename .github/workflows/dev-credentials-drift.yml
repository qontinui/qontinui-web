name: Dev Credentials Drift

# Guards the single source of truth for local dev credentials
# (dev-credentials.json). Fails if a credential literal is hardcoded
# instead of read from the JSON, or if a retired password lingers.
#
# stdlib-only check — no path-dep clones, no poetry, ~seconds to run.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'dev-credentials.json'
      - 'backend/app/core/test_credentials.py'
      - 'frontend/tests/e2e/test-credentials.ts'
      - 'scripts/check_dev_credentials_drift.py'
      - '.github/workflows/dev-credentials-drift.yml'
  push:
    branches: [main, develop]
    paths:
      - 'dev-credentials.json'
      - 'backend/app/core/test_credentials.py'
      - 'frontend/tests/e2e/test-credentials.ts'
      - 'scripts/check_dev_credentials_drift.py'
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN (zizmor excessive-permissions). A job
# that needs more declares its own `permissions:`.
permissions:
  contents: read

jobs:
  drift-check:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2), LOW-N: max 0.15 min over 2 green run(s).
    # Conservative: max(10, 3x the worst observed). Replaces GitHub's 360-min default.
    timeout-minutes: 10
    name: Check dev-credentials single source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run drift check
        run: python scripts/check_dev_credentials_drift.py
