name: Frontend Coverage Producer

# Per-test-FILE -> touched-file coverage producer for coord.
#
# This is a NON-GATING, main-only job. It runs `vitest run --coverage` once per
# test file (vitest's default per-file isolation makes that attribution exact)
# and POSTs the resulting per-file coverage map + JUnit results to coord's
# existing ingest routes. Per-file vitest startup is slow (~5-15s each) and
# there are ~70+ test files, so a full run is several minutes — far too slow for
# a PR gate, but fine here: the map is cached per (repo, head_sha) in coord and
# PR lanes only consume it. It NEVER blocks a PR and the producer script itself
# is best-effort (exits 0 on any failure), so this workflow going red cannot
# break the merge pipeline. It is intentionally NOT a required check.
#
# Granularity note: vitest 4 + @vitest/coverage-v8 have no per-test-CASE
# coverage contexts, so the resolved granularity is per-test-FILE; test_id is
# the repo-relative test file path. The JUnit results POSTed alongside are
# per-test-CASE with classname rewritten to that same repo-relative test-file
# path, so every result test_id (`classname::name`) shares the coverage
# observation's test_id as an exact prefix (documented in the script).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-coverage-producer.yml"
  workflow_dispatch:

# `cancel-in-progress: false`, matching backend-coverage-producer.yml, whose
# header carries the full argument. In short: a CANCELLED run maps no head at
# all, and with `false` GitHub still bounds the group at one running + one
# pending (a third arrival cancels the PENDING run, never the running one), so
# the in-flight run always finishes and exports while the pending slot always
# holds the newest head. Superseded runs are cancelled while pending, at zero
# runner minutes.
#
# This used to be `true`, on the reasoning that the suite (~14 min) ran far
# under the push interval. Measured 2026-09-26 on the last 40 push-on-main
# runs: median ~16-17 min (creation to completion), p90 ~18 min, and 3 of 40
# `cancelled` mid-run -- each one a land whose coverage map was thrown away.
#
# Plan: 2026-09-26-web-guard-workflows-are-thirteen-scheduling-slots-for-three-minutes-of-work
concurrency:
  group: frontend-coverage-producer-${{ github.ref }}
  cancel-in-progress: false

env:
  # Benign supersession, DECLARED (coord reads this; plan
  # 2026-10-01-coord-train-waits-on-redundant-post-land-verification
  # Decision 4): this workflow is a non-gating coverage producer, so a newer
  # main run superseding an older one loses no verification. Coord's no-reap
  # gate does not wait on it, its main-green read does not count it, and its
  # main-red fingerprint ignores it (a non-passing run here held web's train at
  # main-red on 2026-09-30). Remove this line and coord treats the workflow as
  # verification again.
  COORD_SUPERSESSION: benign

# Least privilege for GITHUB_TOKEN (zizmor excessive-permissions). A job
# that needs more declares its own `permissions:`.
permissions:
  contents: read

jobs:
  produce:
    name: Per-file coverage -> coord
    runs-on: ubuntu-latest
    # Generous budget for the per-file loop over ~70+ test files; non-gating so
    # the wall-clock never blocks anything.
    timeout-minutes: 45

    steps:
      - name: Checkout qontinui-web
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The pinned fleet-noun vocabulary (fleet-nouns.pin.toml) for
      # backend/tests/test_fleet_nouns_ratchet.py and the frontend rule's
      # vocabulary test; sets QONTINUI_FLEET_NOUNS_FILE. Plan
      # 2026-09-20-the-published-product-works-without-knowing-a-development-environment-exists A5.
      - name: Fleet-noun vocabulary (pinned)
        uses: ./.github/actions/fleet-nouns-vocab

      # Mirror frontend-ci.yml's setup so coverage runs in the same environment
      # the gating lane validates.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Produce per-file coverage and POST to coord (best-effort)
        working-directory: ./frontend
        env:
          GITHUB_SHA: ${{ github.sha }}
          # COORD_HTTP_URL defaults to https://coord.qontinui.io in the script;
          # set here only to target a non-prod coord.
        run: node scripts/export-test-coverage.mjs
