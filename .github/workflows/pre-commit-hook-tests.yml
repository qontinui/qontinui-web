name: pre-commit hook tests

# Runs the unit tests that live beside the repo's own pre-commit hooks in
# `.pre-commit-hooks/` (today: test_check_alembic_schema_args.py).
#
# WHY THIS WORKFLOW EXISTS. Those tests ran nowhere: backend-ci.yml runs
# `pytest tests/` from `backend/`, which never collects `.pre-commit-hooks/`,
# and pre-commit runs the hooks themselves, not their tests. So a regression in
# a hook's audit — e.g. the DROP INDEX pattern added by plan
# 2026-09-12-alembic-schema-arg-hook-does-not-audit-drop-index — could land
# with every check green. A test that never runs cannot fail.
#
# NOT A REQUIRED CHECK, and it must stay that way while it carries a `paths:`
# filter: a required context skipped by a paths filter leaves every PR that
# does not touch these files stuck on "Expected — waiting for status" (the
# rationale alembic-graph-pr.yml and coord-column-drop-guard.yml quote). If it
# is ever made required, delete the filters first.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.pre-commit-hooks/**'
      - '.github/workflows/pre-commit-hook-tests.yml'
  push:
    branches: [main]
    paths:
      - '.pre-commit-hooks/**'
      - '.github/workflows/pre-commit-hook-tests.yml'

permissions:
  contents: read

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land. (KNOWN coord gap: the budget-cancel candidate
# scan in stuck_pr_watcher.rs compares groups with `=`, so every "" group
# matches every other one and suppresses its auto re-run; fix belongs in coord.)
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  pre-commit-hook-tests:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2): 11 green runs measured 2026-09-23,
    # p50 0.17 / p90 0.20 / max 0.23 min; cap = max(5, 2x max). Replaces the 360-min default.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install "pytest>=9,<10"

      - name: Run hook tests
        # The hooks are stdlib-only, so pytest is the sole dependency.
        # `-rA` prints a per-test result line, so a green run shows what ran;
        # pytest exits 5 when it collects no tests, which fails this step
        # rather than passing vacuously.
        run: python -m pytest .pre-commit-hooks -rA
