name: no tracked file is gitignored

# THE GATE LOGIC LIVES IN `scripts/ci/check_tracked_ignored.py`, not here — the
# shape plan 2026-08-08-ci-tool-registry-and-canonical-configuration-parity
# Phase 5 established for forbid-public-schema, web-boundary-lint and
# alembic-single-head. Three lanes invoke the one script:
#
#   * this workflow, step "Scan for tracked-but-ignored files"
#   * .qontinui/ci.toml, step `gitignore-tracked-files`
#   * .pre-commit-config.yaml, hook `gitignore-tracked-files`
#
# WHY THIS GATE EXISTS. `ec9fae1a` un-ignored `backend/scripts/`, where a bare
# directory rule had hidden 10 TRACKED scripts from ruff (ruff honours
# .gitignore) for long enough to accumulate the lint debt `e59a14ec` then had to
# pay off. The fix was a hand-maintained negation list, and the very block it
# copied — `frontend/scripts/*` — was already missing a negation of its own. A
# hand-maintained invariant is not an invariant; this makes it one.
#
# NO `paths:` FILTER, deliberately. The trigger is not "someone edited
# .gitignore": the pair (rules, tracked files) also breaks when a file is ADDED
# under an existing rule, and that commit touches neither .gitignore nor this
# workflow. A path-scoped gate would sit out exactly the change that breaks it —
# the trap backend-ci.yml's header documents for its own nightly drift check.

on:
  pull_request:
    branches: [main, develop]
  push:
    # merge-candidate/** refs are pushed by coord's autonomous merge scheduler
    # (plan 2026-06-06-coord-ci-runner-autonomous-green-merge, Phase 4). This is
    # a merge gate, so it must run on candidate refs or the proposal hangs in
    # awaiting-ci. Validation-only (offline scan); no deploy.
    branches:
      - main
      - develop
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'

jobs:
  gitignore-tracked-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Scan for tracked-but-ignored files
        # Exits 1 naming each offending path and the .gitignore line that
        # matches it, and 2 if the index came back empty or git itself errored —
        # a scan that proved nothing is an unknown, never a pass.
        run: python scripts/ci/check_tracked_ignored.py
