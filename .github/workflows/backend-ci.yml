name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      # The composed backend is pinned by this file: backend/Dockerfile clones
      # qontinui-cloud-control at the sha it names. A pin bump changes what the
      # image contains while touching no path under backend/**, so without this
      # entry the `Test Docker Build` job below would not run for the one change
      # most likely to break the image — and the frontend half redeploys on
      # every push regardless, so the two halves would drift silently.
      - 'frontend/cloud-control.pin'
      # The frontend interfaces that tests/test_coord_down_envelope_contract.py
      # reads as the contract for the hand-written coord-down fallback
      # envelopes. A frontend-only commit adding a REQUIRED property is exactly
      # the change that breaks those envelopes, and without these entries it
      # would not run the guard — the same path-scoped-gate trap documented for
      # the nightly OpenAPI drift check below. Keep in sync with that module's
      # _CONTRACT_FILES; it asserts every entry appears in BOTH filters.
      - 'frontend/src/services/admin-dev-service.ts'
      - 'frontend/src/app/(app)/digital-twin/_lib/types.ts'
  push:
    # main is intentionally NOT here: the per-test coverage producer that used to
    # ride this gating workflow on push-to-main now lives in the standalone,
    # non-gating .github/workflows/backend-coverage-producer.yml. Keeping main off
    # this trigger avoids re-running the full gating suite (lint, security-scan,
    # build-test, tests) on every main push — it already ran on the PR.
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      # See the pull_request filter above.
      - 'frontend/src/services/admin-dev-service.ts'
      - 'frontend/src/app/(app)/digital-twin/_lib/types.ts'
  # Nightly run with NO path filter. The "Check OpenAPI snapshot is up to date"
  # step regenerates the snapshot with the sibling repos installed — notably
  # qontinui-cloud-control, which is git-cloned + `pip install -e`'d in the test
  # job but lives OUTSIDE backend/**. A cloud-control (or other sibling) route
  # change therefore never triggers the path-filtered PR/push runs above, so it
  # would SILENTLY stale the committed openapi-schema.json that coord's
  # external-surface observer reads as the api's declared-route source. The
  # nightly run makes that drift loud (the drift-check fails) instead of silent.
  schedule:
    - cron: '17 7 * * *' # 07:17 UTC daily
  workflow_dispatch: {}

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint & Format Check
    # ubuntu-latest, NOT [self-hosted, qontinui].
    #
    # This job was pinned to the self-hosted pool because those runners had
    # Python 3.12 pre-installed plus a persistent pip cache, which avoided the
    # ubuntu-latest cold-boot tax (~90s of action downloads + apt + pip warmup).
    # That optimisation stopped being free on 2026-08-24: the pool's image moved
    # to Debian 13, actions/setup-python@v5 found no 3.12 in the runner tool
    # cache, and the download it fell back to does not exist for that platform:
    #
    #   ##[error]The version '3.12' with architecture 'x64' was not found for
    #   Debian 13.
    #
    # The job then failed in ~13s having never reached ruff or mypy, on EVERY
    # branch (verified across two unrelated PRs and confirmed against the last
    # green run on this same pool at 16:37 UTC that day). A required check that
    # cannot pass is worse than a slow one: it blocks the merge train for the
    # whole repo.
    #
    # ubuntu-latest is not a guess — the `test` job below already runs there
    # with the IDENTICAL actions/setup-python@v5 + PYTHON_VERSION + pip cache,
    # and was green on the run where this job broke. So this restores a
    # configuration already proven in this file rather than inventing one.
    #
    # Re-pinning to [self-hosted, qontinui] is fine once the pool image ships a
    # 3.12 that setup-python can resolve (or once the runner tool cache is
    # seeded with one). Re-verify against a real run before doing so; the
    # comment that used to live here asserted "pre-installed" as a standing
    # fact, and that assertion is exactly what went stale.
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v5

      # Backend's pyproject.toml has path-deps on sibling repos
      # (qontinui-schemas, qontinui). actions/checkout@v5 refuses
      # `path:` outside the workspace, so clone them via git directly.
      # qontinui-cloud-control is now AGPL/public — plain clone so the test
      # harness can side-effect-import it (see backend/tests/conftest.py).
      # The `rm -rf` predates this job's move to ubuntu-latest, where the
      # workspace is fresh per run and the clones cannot be stale. It is kept
      # deliberately: it costs nothing on a clean runner and is what makes the
      # step correct again the moment this job is re-pinned to the self-hosted
      # pool, which DOES reuse $GITHUB_WORKSPACE/.. between runs.
      - name: Checkout sibling repos (qontinui-schemas, qontinui, qontinui-cloud-control)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          rm -rf qontinui-schemas qontinui qontinui-cloud-control
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/jspinak/qontinui.git
          git clone --depth 1 https://github.com/qontinui/qontinui-cloud-control.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install qontinui-cloud-control into poetry venv
        # Path is ../../qontinui-cloud-control because working-directory is
        # ./backend (one level deeper than the repo root the clone sits beside).
        run: poetry run pip install -e ../../qontinui-cloud-control

      - name: Run ruff (linting)
        run: poetry run ruff check .

      - name: Run ruff format (formatting)
        run: poetry run ruff format --check .

      - name: Run mypy (type checking)
        run: poetry run mypy app/ --ignore-missing-imports

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # This job holds an apt-dependent step and, until now, declared no
    # job-level bound at all -- so its ceiling was GitHub's DEFAULT 360
    # minutes, a number this repo never chose. Plan Phase 1 asks for a cap on
    # every job that has none; it landed on e2e-tests.yml's three jobs and
    # missed this one and migration-reversal.yml's `reverse`.
    #
    # What the cap buys: a bound this repo CHOSE, and a worst case of 90 min
    # rather than 6 h of hosted-runner time. `JOB_TIMEOUT_MINUTES` below now
    # names a declared value instead of documenting an inherited default.
    #
    # What it does NOT buy, stated because the obvious reading is wrong: it
    # does not meaningfully re-arm the marker's arm 2. That arm needs the apt
    # step still MID-FLIGHT when the JOB budget expires -- but the step below
    # carries its own `timeout-minutes: 10`, which fires first in every
    # scenario this plan measured, and the step-bound expiry is covered by arm
    # 1 or arm 2b rather than arm 2. (WHICH of those two is deliberately not
    # asserted here: which conclusion GitHub surfaces for a step-level
    # `timeout-minutes` expiry is the plan's Gate part 2, still UNMET, and the
    # marker is built correct under either semantics precisely because nobody
    # has observed it. Claiming one here would be inventing the answer that
    # gate exists to obtain.) Either way arm 2 needs the ~8 steps BEFORE apt to
    # consume ~80 of the 90 minutes, on a job whose measured max is 56.9.
    # Bounding the burn is the reason for the cap.
    #
    # Measured: 40 consecutive green runs of this job -- p50 43.4 min,
    # p90 46.4 min, max 56.9 min. 90 min is ~1.6x the worst observed success
    # and ~1.9x p90, which keeps the plan's own "sized too tight becomes a new
    # flake source" risk well clear. NOTE for whoever revisits: this job also
    # runs on `schedule:`, where cache warmth can differ from the sampled runs.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        # pgvector/pgvector:pg16 is the official pgvector-bundled image
        # (Docker Hub). It's a drop-in replacement for postgres:16 — same
        # POSTGRES_* env vars, same pg_isready healthcheck — and ships the
        # `vector` extension so the `CREATE EXTENSION` step below succeeds.
        # Stock postgres:16 doesn't, which makes conftest's
        # Base.metadata.create_all fail with:
        #   asyncpg.exceptions.UndefinedObjectError: type "vector" does not exist
        # for any model that has a pgvector.sqlalchemy.Vector column (see
        # alembic/versions/05a366f58455_initial_schema_squashed.py:13,26).
        image: pgvector/pgvector:pg16
        # Credentials must match backend/tests/conftest.py, which hardcodes
        # postgresql://qontinui_user:qontinui_dev_password@localhost:5432/qontinui_test
        # for both DATABASE_URL and TEST_DATABASE_URL. Mismatched values
        # produce: asyncpg.exceptions.InvalidPasswordError: password
        # authentication failed for user "qontinui_user".
        env:
          POSTGRES_USER: qontinui_user
          POSTGRES_PASSWORD: qontinui_dev_password
          POSTGRES_DB: qontinui_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      # Stamp THIS JOB's start time. Must stay the FIRST step of the job.
      #
      # The infrastructure marker below measures elapsed time to tell a job
      # TIMEOUT from an external cancel, and `run_started_at` (the API value it
      # falls back to) measures the RUN: it includes every upstream `needs:` job
      # and all queue time. On a `needs:`-gated job that skew can exceed the
      # budget slack, so a LATE external cancel reads as past the budget and is
      # reported as a timeout -- the same laundering of one cause into another
      # that the marker exists to prevent, merely inverted. This stamp removes
      # the skew, and removes the `gh api` dependency on the common path.
      - name: Record job start time
        run: echo "JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      # qontinui (a path-dep) pulls in torch from pytorch-cu128 — wheels
      # are large enough to overflow the runner's default disk. Remove
      # preinstalled SDKs/runtimes that this workflow doesn't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Backend's pyproject.toml has path-deps on sibling repos
      # (qontinui-schemas, qontinui). actions/checkout@v5 refuses
      # `path:` outside the workspace, so clone them via git directly.
      # qontinui-cloud-control is now AGPL/public — plain clone so the test
      # harness can side-effect-import it (see backend/tests/conftest.py).
      - name: Checkout sibling repos (qontinui-schemas, qontinui, qontinui-cloud-control)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/jspinak/qontinui.git
          git clone --depth 1 https://github.com/qontinui/qontinui-cloud-control.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install qontinui-cloud-control into poetry venv
        # Path is ../../qontinui-cloud-control because working-directory is
        # ./backend (one level deeper than the repo root the clone sits beside).
        run: poetry run pip install -e ../../qontinui-cloud-control

      # backend/tests/conftest.py uses Base.metadata.create_all (NOT
      # alembic) to bootstrap the test DB, so SQLAlchemy will try to
      # create tables in named schemas without first ensuring the
      # schemas exist. Models reference `project`, `auth`, and `cloud`
      # schemas (the last via the qontinui-cloud-control sibling repo
      # whose models are side-effect-imported in conftest.py); the
      # postgres service container doesn't run our init-scripts/, so
      # create them explicitly here. We also `CREATE EXTENSION vector`
      # — alembic does this in 05a366f58455 but conftest skips alembic,
      # so create_all hits `UndefinedObjectError: type "vector" does
      # not exist` whenever a Vector column is materialized. Without
      # the schema lines, create_all fails with:
      #   asyncpg.exceptions.InvalidSchemaNameError: schema "project"
      #   does not exist
      # Keep the committed OpenAPI snapshot authoritative. The exporter calls
      # app.openapi() (the FastAPI method — computes the schema from the
      # registered routes with no running server and no DB connection), writes
      # frontend/src/lib/api-client/openapi-schema.json deterministically, then
      # `git diff --exit-code` fails CI if a backend route change wasn't
      # accompanied by a regenerated, committed snapshot. coord's
      # external-surface (route-serving) observer reads this file as the
      # declared-route source of truth, so a stale snapshot silently
      # mis-declares the web backend's external surface. Runs before the tests
      # so a drift failure surfaces fast; the env mirrors the test step so the
      # app imports cleanly offline (no DB is contacted).
      - name: Check OpenAPI snapshot is up to date
        env:
          DATABASE_URL: postgresql://qontinui_user:qontinui_dev_password@localhost:5432/qontinui_test
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          TESTING: 1
          REDIS_ENABLED: false
        run: |
          # Two snapshots, two processes (the app is built at import time, so
          # one process cannot re-import with different env): the extended spec
          # (with the cloud-control sibling CI installs) and the BASE spec
          # (QONTINUI_DISABLE_CLOUD_EXTENSIONS=1 — the surface prod
          # api.qontinui.io actually serves; coord's route-serving observer
          # reads this one).
          poetry run python scripts/export_openapi.py
          poetry run python scripts/export_openapi.py --base
          if ! git -C "$GITHUB_WORKSPACE" diff --exit-code \
              frontend/src/lib/api-client/openapi-schema.json \
              frontend/src/lib/api-client/openapi-schema.base.json; then
            echo "::error::OpenAPI snapshot is stale. A backend route change was not committed to the snapshot(s)."
            echo "Run 'python backend/scripts/export_openapi.py' and 'python backend/scripts/export_openapi.py --base' from the repo root and commit the updated frontend/src/lib/api-client/openapi-schema*.json."
            exit 1
          fi

      # On drift, upload the CI-generated snapshot so the canonical bytes (this
      # job's exact dependency versions) can be committed verbatim — avoids
      # guessing at fastapi/starlette/pydantic version differences between a
      # local regen and CI.
      - name: Upload CI-generated OpenAPI snapshot on drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema-ci-generated
          path: |
            frontend/src/lib/api-client/openapi-schema.json
            frontend/src/lib/api-client/openapi-schema.base.json
          if-no-files-found: ignore

      - name: Install postgresql-client
        id: apt_psql
        # ONLY the apt-get call lives in this step, and it is the entire reason
        # for the bound: it reaches an external mirror at job time and is the
        # same unbounded-stall exposure as the Playwright step (plan
        # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure).
        # The psql/DDL that used to share this step now runs UNBOUNDED below.
        # It HAD to move: under `bash -e` a psql failure set this step's
        # `.outcome` to `failure` exactly like an apt timeout, so the
        # infrastructure marker could not tell a mirror stall from the author's
        # own schema breaking -- and told them their breakage was infrastructure.
        # Measured apt+psql across green runs of all 7 sites: p50 0-16s, p90
        # <=91s, max 106s (migration-reversal). This job is PR-gating, so a
        # false red here costs an author more than a late one does. With the
        # bound covering apt ALONE it can afford to be generous: 10 min is
        # ~5.7x the worst time ever observed for apt AND psql together.
        # GUARDED, as spec-ci.yml has been all along. `ubuntu-latest` ships
        # psql, so `command -v psql` short-circuits and apt is never reached --
        # measured, not assumed: across 12 consecutive green Spec CI runs this
        # step is 0-1s every time, while the six sites that were still calling
        # apt unconditionally spent 3-29s per run on an `apt-get update` against
        # the external mirror for a package apt then reports as already the
        # newest version. That round-trip is pure exposure to the stall this
        # plan exists to remove, and it buys nothing.
        # (Those 3-29s figures are from `--status success` runs, so they are a
        # LOWER bound by construction -- a run killed by the stall is excluded.)
        # The bound below is NOT redundant: it covers the fallback arm, for the
        # day an image stops shipping psql.
        # Consequence for the marker: this step normally runs NO apt, so it
        # normally concludes `success` and no arm names it -- which is correct,
        # because there was no apt call to blame. spec-ci.yml makes the same
        # observation at its own site (an arm keyed on this step's failure
        # "would have been describing a call that did not happen"); the arm
        # attribution below is this change's, not a restatement of that one.
        # When the fallback DOES run and fails, the step still exits non-zero
        # (`||` does not defeat `-e` for the group) and concludes `failure`, so
        # arm 1 fires. The guard removes the exposure; it does not silence a
        # real apt failure.
        timeout-minutes: 10
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      - name: Create test schemas and extensions
        # Deliberately UNBOUNDED and deliberately WITHOUT an `id:`. This is
        # psql/DDL against this job's own postgres service, not the external
        # mirror, so a failure here IS a verdict on the change -- it must never
        # reach the infrastructure marker's APT_STEP_OUTCOMES.
        env:
          PGPASSWORD: qontinui_dev_password
        run: |
          psql -h localhost -U qontinui_user -d qontinui_test \
            -c "CREATE SCHEMA IF NOT EXISTS project;" \
            -c "CREATE SCHEMA IF NOT EXISTS auth;" \
            -c "CREATE SCHEMA IF NOT EXISTS cloud;" \
            -c "CREATE SCHEMA IF NOT EXISTS coord;" \
            -c "CREATE SCHEMA IF NOT EXISTS strategy;" \
            -c "CREATE SCHEMA IF NOT EXISTS web;" \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests with coverage
        env:
          # conftest.py overrides this anyway, but keep aligned with the
          # postgres service creds for clarity.
          DATABASE_URL: postgresql://qontinui_user:qontinui_dev_password@localhost:5432/qontinui_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_ENABLED: true
          TESTING: 1
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          ENVIRONMENT: development
        run: |
          poetry run pytest tests/ -v \
            --cov=app \
            --cov-context=test \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=junit-results.xml

      # The per-test -> touched-file coverage producer that used to run here on
      # push-to-main now lives in the standalone, non-gating workflow
      # .github/workflows/backend-coverage-producer.yml (it re-runs the suite with
      # the same flags + service stack, then exports). It was moved out so a main
      # push no longer re-runs this entire gating workflow just to feed coord.
      # The pytest invocation above keeps --cov-context=test / --junitxml: those
      # flags are harmless on PRs and keep the two suites byte-identical.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: ./backend/htmlcov/
          retention-days: 30

      # ----------------------------------------------------------------------
      # CI-infrastructure timeout marker (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 5).
      #
      # A job-level timeout concludes the job as `cancelled`, and `gh pr checks`
      # renders `cancelled` as **fail** -- with ZERO failing steps, because no
      # step failed. An author triaging their own PR sees "fail" against their
      # diff with nothing to point at, and reads it as their own regression. On
      # 2026-08-19 that misattribution cost real time on PR #1015. This step
      # exists so the log says what actually happened.
      #
      # `cancelled` has THREE causes and only the first is this plan's defect:
      #   1. an apt-dependent step stalled against the external mirror (ours)
      #   2. coord's merge train reaping a `merge-candidate/*` ref (benign)
      #   3. a manual / external / superseding cancel (benign)
      # 2 and 3 resolved in MINUTES in every observed case. A marker that
      # shouted "infrastructure timed out" on all three would be wrong on the
      # benign ones, and a diagnostic that is wrong a quarter of the time is
      # worse than none -- it teaches readers to discard the other three
      # quarters. So the ::error:: arms demand POSITIVE evidence that an
      # apt-dependent step is what died, and every other path declines to judge
      # the diff at all.
      #
      # An apt step marked `continue-on-error: true` CAN be present when this
      # step fires. Its own soft failure cannot red the check -- but a LATER,
      # genuine failure can, and this step then runs with that soft-failed
      # outcome still in hand. So arm 1 keys on `.conclusion` (the value AFTER
      # `continue-on-error` rewrites it), never on `.outcome` alone: a step
      # that concluded `success` is not what red this job, and naming it as the
      # cause would misattribute a real regression to infrastructure -- the
      # exact cry-wolf this step exists to prevent.
      #
      # A soft-failed apt step is NOT thereby harmless, and the marker must not
      # say it is. `continue-on-error: true` stops it reding the job DIRECTLY;
      # it does nothing about the cascade. style-gate.yml is the live example:
      # six of its provisioning steps are deliberate SHADOW soft-fails, so a
      # stalled `Install postgresql-client` leaves no psql, the schema and
      # migration steps soft-fail in turn, no snapshots are captured, and with
      # STYLE_GATE_ENFORCE=1 the assert step exits 1. That job is red BECAUSE
      # of the apt stall, with no apt step concluding `failure` anywhere. So
      # every arm that would otherwise assert "this failure is a real one" or
      # "no apt-dependent step failed" is guarded on `soft_failed` being empty,
      # and warns instead of ruling when it is not.
      - name: Explain infrastructure timeout vs external cancellation
        if: cancelled() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          # declared at this job's `timeout-minutes`.
          JOB_TIMEOUT_MINUTES: '90'
          EXTERNAL_CANCEL_NOTE: >-
            this workflow declares NO `concurrency:` block, so GitHub never auto-supersedes it - an external cancel here came from a human or from coord's merge train reaping a merge-candidate/* ref
          # `<step name>|<outcome>|<conclusion>` per apt-dependent step in this
          # job. BOTH values are carried on purpose:
          #   * `.outcome` is the value BEFORE `continue-on-error` rewrites it,
          #     so a soft-failed step still reports the truth here;
          #   * `.conclusion` is what actually reached the job, and ONLY a step
          #     that concluded `failure` can be what red it.
          # Every step named below runs `apt-get` and nothing else. Two splits
          # buy that invariant across all 8 workflows: the psql/DDL work that
          # used to share the postgresql-client steps now lives in an unbounded
          # successor step, and `npx playwright install --with-deps` -- npx
          # resolution PLUS a CDN browser download PLUS apt, fused into one
          # step -- is split so that only its apt-only `install-deps` half is
          # ever named here. So a `failure` on any step below is the apt
          # mirror: never the author's schema breaking, and never a Playwright
          # bundle that 404s on cdn.playwright.dev.
          APT_STEP_OUTCOMES: |
            Install postgresql-client|${{ steps.apt_psql.outcome }}|${{ steps.apt_psql.conclusion }}
        run: |
          set -uo pipefail

          # An apt step whose CONCLUSION is `failure` hit its own step-level
          # `timeout-minutes` (or apt errored outright) and red this job --
          # either way it is infrastructure. One whose outcome is `cancelled`
          # was still mid-flight when the job ended; that is only decisive once
          # we also know the job budget had actually expired. One that failed
          # but concluded `success` is `continue-on-error: true`: it did not red
          # this job DIRECTLY, but it can still have red it through the cascade
          # of steps that needed what it installs, so it is tracked separately
          # and never dismissed.
          #
          # Every matching step is named, not just the last one: two apt steps
          # can die in the same job, and reporting only one understates it.
          apt_failed=""
          apt_running=""
          soft_failed=""
          # How many rows actually parsed. An EMPTY APT_STEP_OUTCOMES -- which is
          # what a renamed or deleted step id renders to -- leaves all three
          # buckets empty, exactly like a clean run. That is an absence of DATA,
          # not an observation of health, and arm 2d is the first arm to make a
          # POSITIVE claim on it.
          apt_rows_seen=0
          while IFS='|' read -r step_name outcome conclusion; do
            [ -z "${step_name// }" ] && continue
            apt_rows_seen=$(( apt_rows_seen + 1 ))
            case "$outcome" in
              failure)
                if [ "$conclusion" = "failure" ]; then
                  apt_failed="${apt_failed:+$apt_failed, }$step_name"
                else
                  soft_failed="${soft_failed:+$soft_failed, }$step_name"
                fi
                ;;
              cancelled) apt_running="${apt_running:+$apt_running, }$step_name" ;;
            esac
          done <<< "$APT_STEP_OUTCOMES"

          why="It shells out to apt-get against an external mirror at job time."
          why="$why That call is normally seconds, but has been observed to stall"
          why="$why for 30+ minutes (and, unbounded, for 5h59m). Nothing under test ran."
          ref="See plan 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure."
          # A separate pointer for the budget arms. $ref names the apt-stall
          # plan, which is the wrong citation for an arm that exists to say
          # this was NOT the apt stall.
          ref_budget="See plan 2026-08-27-web-backend-coverage-producer-timeout."

          # Context line, emitted before any verdict.
          if [ -n "$soft_failed" ]; then
            echo "::notice title=Soft-failed apt step - possible upstream cause::Step(s) '$soft_failed' failed but are marked 'continue-on-error: true', so they concluded 'success' and did not DIRECTLY red this job. A later step that needed what they install can still have failed as a consequence, which would make this job's red an apt cascade rather than a verdict on the diff."
          fi

          # --- Arm 1: an apt step failed AND that failure red the job.
          # Airtight: neither a merge-train reap nor any other external cancel
          # can make a step conclude `failure`.
          if [ -n "$apt_failed" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_failed' exceeded a step-level timeout-minutes or failed outright. $why This is a CI infrastructure failure, not a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 1b: no apt step concluded `failure` and none is mid-flight,
          # but one SOFT-failed. The cascade described in the step header is
          # live here, so "this job's failure is a real one" is an assertion
          # this step cannot support. Warn rather than rule -- an UNKNOWN
          # stated as UNKNOWN, not laundered into a negative.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=A soft-failed apt step may have red this job downstream::No apt-dependent step concluded 'failure', but step(s) '$soft_failed' soft-failed ('continue-on-error: true'). $why Steps that needed what they install can have failed as a consequence, so this job's red may be that cascade and NOT a verdict on the diff. Check the cascade before concluding either way. $ref"
            exit 0
          fi

          # --- Neither cancelled nor an apt failure => a genuine red. Say
          # nothing: this step explains infrastructure timeouts, it does not
          # editorialise real test failures.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ]; then
            echo "No apt-dependent step red the job, none was mid-flight, and the job was not cancelled."
            echo "This job's failure is a real one - emitting no marker."
            exit 0
          fi

          # --- Did the run actually reach its budget? A job timeout fires at
          # elapsed >= budget; a reap or a manual cancel lands at an arbitrary,
          # typically far earlier, elapsed (the two observed benign
          # cancellations were at 2m02s and 7m29s). That gap is the
          # discriminator, so resolve it from the API rather than assuming.
          # This lookup CAN fail (403, rate limit, network blip, a timestamp
          # `date -u -d` cannot parse); every failure leaves `elapsed_min`
          # empty, and empty is UNKNOWN. It is never evidence for a negative.
          # PREFER this job's own start stamp (written by the job's first
          # step). `run_started_at` measures the RUN -- it includes every
          # upstream `needs:` job and all queue time -- so on a `needs:`-gated
          # job it overstates this job's elapsed time by more than the slack
          # below, and a LATE external cancel would then be reported as a
          # timeout. The API lookup stays as the fallback for a job whose stamp
          # step did not run.
          #
          # The guards are not decoration: `-e` is on, so a non-numeric or
          # absurd value reaching `$(( ))` would ABORT this step, and a marker
          # that aborts explains nothing. `10#` forces base 10 -- bash reads a
          # leading zero as octal, where `08` is a hard error, not a value.
          # Every failure path leaves `elapsed_min` empty, and empty is UNKNOWN;
          # it is never evidence for a negative.
          elapsed_min=""
          elapsed_basis=""
          job_start="${JOB_START_EPOCH:-}"
          if [ -n "$job_start" ] && [ -z "${job_start//[0-9]/}" ] && [ ${#job_start} -le 11 ]; then
            job_start=$(( 10#$job_start ))
            # A real CI job start is a 10-digit epoch. Anything smaller is a
            # nonsense stamp -- '08' parses fine and means 8 SECONDS after 1970
            # -- and turning it into a 29-million-minute "measurement" would be
            # garbage presented as fact, which is the very laundering this
            # marker exists to stop. Below the floor, leave it UNKNOWN.
            if [ "$job_start" -ge 1600000000 ]; then
              elapsed_min=$(( ( $(date -u +%s) - job_start ) / 60 ))
              elapsed_basis="job"
            fi
          fi
          if [ -z "$elapsed_min" ]; then
            started="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' 2>/dev/null || true)"
            if [ -n "$started" ]; then
              start_epoch="$(date -u -d "$started" +%s 2>/dev/null || true)"
              if [ -n "$start_epoch" ]; then
                elapsed_min=$(( ( $(date -u +%s) - start_epoch ) / 60 ))
                elapsed_basis="run"
              fi
            fi
          fi

          # A negative elapsed means the clock moved backwards or the stamp is
          # nonsense. Report UNKNOWN rather than a garbage measurement.
          if [ -n "$elapsed_min" ] && [ "$elapsed_min" -lt 0 ]; then
            elapsed_min=""
            elapsed_basis=""
          fi

          # Named so an arm that RULES can disclose what it measured.
          case "$elapsed_basis" in
            job) basis_note="measured from this job's own start" ;;
            run) basis_note="measured from the RUN's start (this job's own start stamp was unavailable), so it also includes any upstream 'needs:' job and queue time" ;;
            *)   basis_note="not measured" ;;
          esac

          # 2 minutes of slack absorbs the gap between run start and job start.
          budget_floor=$(( JOB_TIMEOUT_MINUTES - 2 ))

          # Did the budget actually expire? THREE-valued: "yes" | "no" | ""
          # (UNKNOWN, when elapsed could not be read). NEVER collapse UNKNOWN
          # into "no". That collapse is precisely how arm 3 came to assert an
          # external cancel for a job that had in fact exhausted its own budget:
          # it interpolated `elapsed_min` into its message but never TESTED it,
          # so the only arm performing the budget test was arm 2 -- which is
          # guarded on an apt step being mid-flight and therefore unreachable on
          # any job whose apt steps are guarded to 0s.
          budget_reached=""
          if [ -n "$elapsed_min" ]; then
            if [ "$elapsed_min" -ge "$budget_floor" ]; then
              budget_reached="yes"
            else
              budget_reached="no"
            fi
          fi

          # One legible phrase per state, for the arms that REPORT rather than
          # rule. The UNKNOWN wording never implies the budget was not reached.
          case "$budget_reached" in
            yes) budget_phrase="which IS its full ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            no)  budget_phrase="short of its ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            *)   budget_phrase="against a ${JOB_TIMEOUT_MINUTES}-minute budget whose expiry could NOT be checked" ;;
          esac

          # --- Arm 2: the job budget expired while an apt step was still
          # running. Requires THREE facts. The `cancelled` guard is the one
          # arm 3 already carried and this arm was missing: a JOB_STATUS of
          # `failure` with an apt step mid-flight past the budget floor is NOT
          # a job timeout, and this text ("GitHub concludes a job timeout as
          # 'cancelled'") would be describing a mechanism that did not fire.
          # That state belongs to arm 2b, which names the real conclusion.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$apt_running" ] && [ "$budget_reached" = "yes" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::The ${JOB_TIMEOUT_MINUTES}-minute job budget expired after ${elapsed_min} min while step(s) '$apt_running' were STILL RUNNING. $why GitHub concludes a job timeout as 'cancelled', which 'gh pr checks' renders as 'fail' with zero failing steps - that rendering is what makes this look like your test failure. It is not. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2b: the job did NOT conclude `cancelled`, yet an apt step
          # was left mid-flight. A step-level `timeout-minutes` expiry is the
          # primary mechanism this change introduces, and which of the two job
          # conclusions GitHub surfaces for it is NOT something this change
          # established. So handle both: under `cancelled` semantics arms 1/2
          # cover it, and under `failure` semantics this arm does. Betting on
          # one and printing "cancelled from outside" under the other would be
          # flatly false about the mechanism we just added.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -n "$apt_running" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_running' were interrupted mid-flight (step outcome 'cancelled') and this job concluded '$JOB_STATUS'. $why Nothing here is a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2c: cancelled with an apt step mid-flight, but arm 2's
          # budget test did not fire. Two sub-cases, and NEITHER licenses
          # ruling the stall out: an apt step really was running when this job
          # died.
          if [ -n "$apt_running" ]; then
            if [ -z "$elapsed_min" ]; then
              echo "::warning title=Cannot rule the apt stall in or out::Step(s) '$apt_running' were still mid-flight when this job was cancelled, but this run's elapsed time could NOT be read - the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so the known apt-mirror stall can be NEITHER confirmed NOR ruled out here. Nothing here is a verdict on the code in this change. $ref"
            else
              echo "::warning title=Cancelled with an apt step mid-flight::Step(s) '$apt_running' were still mid-flight when this job was cancelled after ${elapsed_min} min - well short of its ${JOB_TIMEOUT_MINUTES}-minute budget, which points at an external cancel ($EXTERNAL_CANCEL_NOTE) rather than the apt-mirror stall. But an apt step was genuinely running, so this does not rule the stall out either. Nothing here is a verdict on the code in this change. $ref"
            fi
            exit 0
          fi

          # --- Arm 2d: cancelled AT OR PAST its budget, with NO apt step
          # implicated at all. The job exhausted its OWN budget running its OWN
          # work -- a job timeout. This is the FOURTH cause of `cancelled`, and
          # the one this step's header taxonomy omitted: not the apt stall, not
          # a merge-train reap, not an external cancel. Without this arm the
          # state fell through to arm 3, which reported it as "cancelled from
          # outside" -- how a producer that timed out on nearly every main push
          # for days was read as a benign supersede every single time.
          #
          # Guarded on `soft_failed` being empty for the same reason every other
          # ruling arm is: a soft-failed apt step can have red this job through
          # the cascade, and this arm asserts a positive cause. When one is
          # present, arm 3a speaks instead and hedges.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "yes" ] && [ -z "$soft_failed" ]; then
            if [ "$apt_rows_seen" -gt 0 ]; then
              echo "::error title=Job budget exhausted - a TIMEOUT, not an external cancel::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, and GitHub cancelled it when that budget expired. No apt-dependent step failed, none was mid-flight, and none soft-failed - so this is NOT the apt-mirror stall, and NOT an external cancel either (a reap or a manual cancel lands at an arbitrary, typically far earlier, elapsed). The job's own work did not fit its budget. A job timeout concludes as 'cancelled' with ZERO failing steps, which 'gh pr checks' renders as 'fail' - that rendering is what makes this look like a test failure. It is not a verdict on the diff. But re-running WITHOUT raising the budget will most likely time out again: raise the budget, or make the work fit it. $ref_budget"
            else
              echo "::warning title=Job budget exhausted, but the apt telemetry was EMPTY::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, so the budget WAS reached and a job timeout is the leading explanation. But APT_STEP_OUTCOMES parsed to ZERO rows - a step id was renamed or removed, so the expression rendered empty - which makes 'no apt-dependent step failed' an absence of DATA here, not an observation. The apt-mirror stall therefore can NOT be ruled out, and this arm will not assert a cause from telemetry it did not receive. Fix the step-id reference so the next run can rule. $ref_budget $ref"
            fi
            exit 0
          fi

          # --- Arm 3a: cancelled, nothing mid-flight, but an apt step
          # SOFT-failed. Arm 3's "No apt-dependent step failed" would be
          # flatly false here - one demonstrably did - so arm 3 does not get
          # to speak for this state.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=Cancelled, and a soft-failed apt step may have red this job downstream::This job was cancelled after ${elapsed_min:-an unknown number of} min, $budget_phrase. No apt-dependent step was mid-flight, but step(s) '$soft_failed' soft-failed ('continue-on-error: true'), so the apt-mirror stall can NOT be ruled out here, and steps that needed what they install may have failed as a consequence. Note the budget reading above: where it says the budget WAS reached, a plain job timeout is also live as a cause, and these two cannot be separated while a soft-failed apt step is in play. A cancelled run also reports no test results at all, so nothing here is a verdict on the code under test either way. $ref"
            exit 0
          fi

          # --- Arm 3: cancelled, no apt step red the job, none was mid-flight,
          # none soft-failed, and the elapsed time is KNOWN and SHORT of the
          # budget. The stall is ruled out by the step outcomes (a positive
          # fact) and a job timeout is ruled out by the measurement, so an
          # external cancel is what is left. Explicitly decline to judge the
          # diff either way.
          #
          # The `budget_reached = "no"` guard is this arm's whole correction.
          # It used to fire on ANY cancelled job, so it claimed an external
          # cancel for job timeouts too -- while printing the very elapsed
          # figure that refuted it.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "no" ]; then
            echo "::notice title=Run cancelled externally - NOT a verdict on this diff::This job was cancelled after ${elapsed_min} min, $budget_phrase. No apt-dependent step failed and none was mid-flight, so this was NOT the known apt-mirror stall; and it did not reach its own budget, so it was NOT a job timeout. It was cancelled from outside: $EXTERNAL_CANCEL_NOTE. A cancelled run reports no test results at all, so nothing here says anything about the code under test: do not read it as a failure of this change, and do not read it as a pass either. Re-run if you need a verdict."
            exit 0
          fi

          # --- Arm 3b: cancelled, nothing implicated, and the elapsed time
          # could NOT be read. A job timeout and an external cancel are
          # indistinguishable without that measurement, so say so instead of
          # picking one. This is the branch arm 3 used to swallow: it asserted
          # an external cancel from a number it did not have.
          if [ "$JOB_STATUS" = "cancelled" ]; then
            echo "::warning title=Cancelled - a timeout cannot be told from an external cancel::This job was cancelled, but this run's elapsed time could NOT be read: the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so a job-budget TIMEOUT and an external cancel ($EXTERNAL_CANCEL_NOTE) can NOT be told apart here. That is UNKNOWN - it is specifically NOT evidence of an external cancel. No apt-dependent step failed and none was mid-flight, so the apt-mirror stall IS ruled out, by the step outcomes rather than by any measurement. A cancelled run reports no test results at all, so nothing here speaks to the code under test. $ref"
            exit 0
          fi

          # --- Unreachable under `if: cancelled() || failure()`: every
          # non-cancelled path above has already returned. Kept so an unforeseen
          # state says what it knows instead of falling through silently.
          echo "::notice title=No infrastructure verdict::Job status '$JOB_STATUS', no apt-dependent step red the job, none mid-flight. This marker has nothing to add about the code under test. $ref"

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        # SARIF upload requires GitHub Advanced Security on private repos.
        # Without GHAS the API returns 403; don't red-flag the whole job —
        # the SARIF artifact is still uploaded as a workflow artifact below.
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout sibling repos (qontinui-schemas, qontinui, qontinui-cloud-control)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/jspinak/qontinui.git
          git clone --depth 1 https://github.com/qontinui/qontinui-cloud-control.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install qontinui-cloud-control into poetry venv
        # Path is ../../qontinui-cloud-control because working-directory is
        # ./backend (one level deeper than the repo root the clone sits beside).
        run: poetry run pip install -e ../../qontinui-cloud-control

      - name: Run safety check (dependency vulnerabilities)
        run: |
          poetry run pip install safety
          poetry run safety check --json || true

  build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v5

      # The Dockerfile installs torch from pytorch-cu128 (multi-GB wheels);
      # the runner's default disk allocation isn't enough for the build
      # layers + image cache. Free the host's preinstalled SDKs before
      # docker build runs.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Resolve the SAME pin deploy-web.yml passes, so this job builds the image
      # that will actually ship. Without the build-arg the Dockerfile's
      # CLOUD_CONTROL_SHA defaults to `main`, and the job would go green on a
      # cloud-control commit the pin does not reference — a green build of an
      # image nobody deploys. Path is relative to the repo root, not ./backend.
      - name: Resolve qontinui-cloud-control pin
        id: cloudcontrol
        working-directory: ${{ github.workspace }}
        run: |
          PIN_FILE=frontend/cloud-control.pin
          if [ ! -f "$PIN_FILE" ]; then
            echo "::error::$PIN_FILE is missing — the composed backend cannot be pinned"; exit 1
          fi
          SHA=$(grep -vE '^\s*(#|$)' "$PIN_FILE" | head -n1 | tr -d '[:space:]')
          if [ -z "$SHA" ]; then
            echo "::error::$PIN_FILE has no pin line"; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "qontinui-cloud-control pin = $SHA"

      # The image's own compose-or-fail step (assert a cloud-control route
      # registrar landed) runs as part of this build, so this job is what gates
      # it on every PR.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg CLOUD_CONTROL_SHA=${{ steps.cloudcontrol.outputs.sha }} \
            -t qontinui-backend:test .

      - name: Test Docker image
        run: |
          docker run --rm qontinui-backend:test python -c "import app; print('Import successful')"
