# Design guide: the generated style guide's drift check and rule check, in a
# workflow of its own.
#
# Plan 2026-11-21-design-kit-compiler-gaps-and-the-unrequired-design-guide-check
# Phase 1. The `design-guide` job below was a job of frontend-ci.yml, which
# filters `pull_request` to the bases `main` and `develop` and to its `paths:`
# list (frontend/**, docs/**, the workflow itself, and a few named files and
# action directories), and on `push` builds only `main` and `develop`, under
# the same `paths:` list. A context produced there never reports on a PR that
# touches none of those paths, on a stacked PR, or on coord's merge-candidate
# refs, so it could not be made a required check: a required context that
# nothing produces leaves every such PR on "Expected -- waiting for status".
# The job moved here byte-for-byte; only the triggers are new.
#
# NO `paths:` FILTER, and NO scope step. Every event runs the full job, so a
# green here is always a FULL run. A step-level "nothing design-related
# changed, skip" that ended green would be a SELECTED green reporting plain
# success (served policy verification-and-evidence
# a-selected-green-is-its-own-verdict), and coord's direct-merge door reads a
# selected or skipped required job as not-success
# (git-operations direct-merge-reads-the-verdict-type). The price is the full
# job on every PR and every push below: about one hosted minute with the
# Chromium install (0.6-1.2 min measured on Frontend CI runs, 2026-11-18 to
# 2026-11-22). This repo is public, so hosted minutes cost nothing.
#
# The job name IS the check-run context the plan's Phase 9 asks the operator
# to make required (an operator decision; it is not required today). Do not
# rename it, and do not add a `strategy:` matrix (which suffixes it).

name: Design guide

on:
  # The triggers are web-guards.yml's: a required check whose `pull_request`
  # trigger has no filter, and which also builds `main` and the merge-candidate
  # refs. No `branches:` or `paths:` filter on `pull_request`: the context must
  # report on every PR, including a stacked one and a backend-only one.
  pull_request:
  push:
    branches:
      - main
      - develop
      # merge-candidate/** refs are pushed by coord's autonomous merge
      # scheduler (plan 2026-06-06-coord-ci-runner-autonomous-green-merge,
      # Phase 4); a required gate must run on them or the candidate hangs in
      # awaiting-ci. Validation-only; no deploy.
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN (zizmor excessive-permissions). Nothing
# here writes.
permissions:
  contents: read

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land.
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  design-guide:
    # The generated style guide (plan
    # 2026-11-19-the-visual-system-is-prose-no-build-step-compiles-and-the-project-template-ships-no-design
    # Phase 8). frontend/src/config/qontinui-web.styleguide.uibridge.json and
    # its siblings are `design-kit compile` output of
    # frontend/design/language.dtcg.json; until this job the guide was
    # hand-written and evaluated by nothing.
    #
    # On a HOSTED runner only, deliberately: it needs Chromium and its system
    # libraries, which only the docker-rootless/webdb pool is known to
    # provision (style-gate.yml), not the `ram-4g` self-hosted light lane.
    # Public repo: hosted minutes cost nothing.
    #
    # Job cap: measured 0.6-1.2 min per run (the job's runs inside Frontend CI,
    # 2026-11-18 to 2026-11-22, which is the same steps on the same hosted
    # image); cap = max(5, 2x max), the max(5, 2x max) rule most job caps in this repo state.
    # The step caps below sum past it on purpose: each bounds one hang, the
    # job cap bounds the run.
    timeout-minutes: 5
    name: Generated style guide (compile --check + validate-guide)
    # coord-pools: [ubuntu-latest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qontinui-web
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # The kit is installed OUTSIDE frontend/ from
      # frontend/design/kit/package-lock.json (the git tag v0.2.0 resolved to
      # its commit, plus the EXACT ui-bridge peers validate-guide drives).
      # frontend/ pins older ui-bridge-wrapper / -headless versions for its own
      # e2e use, so the kit is never resolved through frontend/node_modules:
      # `--root` points validate-guide at the tool directory, where it finds
      # its own wrapper.
      - name: Install design-kit (pinned by frontend/design/kit/package-lock.json)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/design-kit"
          mkdir -p "$kit"
          cp frontend/design/kit/package.json frontend/design/kit/package-lock.json "$kit"/
          npm ci --prefix "$kit" --no-audit --no-fund
          echo "DESIGN_KIT_DIR=$kit" >> "$GITHUB_ENV"

      # APT half and CDN half split as in style-gate.yml (an apt hang is then
      # never misread as a CDN or a test failure). The Playwright version that
      # matters is the kit tool directory's, not frontend's.
      - name: Install Chromium system deps for validate-guide (apt)
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/design-kit
        run: npx playwright install-deps chromium

      - name: Install Chromium for validate-guide (CDN)
        timeout-minutes: 3
        working-directory: ${{ runner.temp }}/design-kit
        run: npx playwright install chromium

      # 1. The committed outputs are a fresh compile of the source (a hand edit
      #    to the guide, or a source edit without a recompile, is red). The
      #    compile builds @qontinui/design-tokens at the ref the source names.
      # 2. validate-guide over the conforming fixture must pass (exit 0).
      # 3. validate-guide over the seeded off-scale fixture must exit 1 AND name
      #    each of the four seeded violations: the negative control, so a guide
      #    whose rules stop catching one of them cannot pass vacuously.
      # Exit 3 (UNKNOWN: the instrument could not measure) is red everywhere.
      # Actions runs `run:` under `bash -e`; every expected non-zero exit is
      # captured with `|| rc=$?` so errexit cannot cut the step short.
      # The fixtures link `tokens.css` beside them; they are staged with the
      # COMPILED src/config/tokens.css because validate-guide serves a file
      # from its own directory.
      - name: Generated style guide is current and its rules bite
        timeout-minutes: 8
        working-directory: ./frontend
        env:
          DESIGN_KIT_CACHE: ${{ runner.temp }}/design-kit-cache
        run: |
          set -uo pipefail
          dk="$DESIGN_KIT_DIR/node_modules/.bin/design-kit"
          guide="$PWD/src/config/qontinui-web.styleguide.uibridge.json"
          rc=0
          "$dk" compile --root . --out src/config --check || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error file=frontend/design/language.dtcg.json::src/config/ is not a fresh compile of design/language.dtcg.json. Install the kit as frontend/design/kit/package-lock.json pins it, run 'design-kit compile --root . --out src/config' in frontend/ and commit the result; never edit the generated files by hand."; exit 1 ;;
            2) echo "::error file=frontend/design/language.dtcg.json::design-kit compile exited 2: the source was refused, or the tool failed (for example building @qontinui/design-tokens at the source's ref). Read the lines above; this is not a drift verdict."; exit 1 ;;
            *) echo "::error file=frontend/design/language.dtcg.json::design-kit compile exited $rc (3 = UNKNOWN). No drift verdict was reached."; exit 1 ;;
          esac
          stage="$RUNNER_TEMP/guide-fixtures"
          mkdir -p "$stage"
          cp design/fixtures/conforming.html design/fixtures/off-scale.html src/config/tokens.css "$stage"/
          rc=0
          "$dk" validate-guide --root "$DESIGN_KIT_DIR" "$guide" "$stage/conforming.html" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error file=frontend/src/config/qontinui-web.styleguide.uibridge.json::validate-guide exited $rc on the conforming fixture (1 = a rule failed, 3 = UNKNOWN: the instrument could not measure)."
            exit 1
          fi
          out="$RUNNER_TEMP/off-scale.out"
          rc=0
          "$dk" validate-guide --root "$DESIGN_KIT_DIR" "$guide" "$stage/off-scale.html" > "$out" 2>&1 || rc=$?
          cat "$out"
          if [ "$rc" -ne 1 ]; then
            echo "::error file=frontend/design/fixtures/off-scale.html::validate-guide exited $rc on the seeded off-scale fixture; the negative control needs exit 1 (rules failed). 0 means no error rule failed; 3 means UNKNOWN."
            exit 1
          fi
          missing=""
          for r in palette-color palette-background-color font-size-on-scale border-radius-on-scale; do
            grep -qE "^ERROR [^ ]*seeded-violation[^ ]* $r:" "$out" || missing="$missing $r"
          done
          if [ -n "$missing" ]; then
            echo "::error file=frontend/design/fixtures/off-scale.html::the seeded element no longer fails:$missing. The guide stopped catching that seeded violation."
            exit 1
          fi
          echo "validate-guide: conforming fixture passes; the seeded fixture fails each of its four rules, as it must."
