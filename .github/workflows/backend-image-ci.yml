name: Backend image build

# Builds `backend/Dockerfile` on PRs that can break it.
#
# WHY THIS EXISTS. Until 2026-08-26 the ONLY workflow that built this image was
# `deploy-web.yml`, which runs on push-to-main. So a Dockerfile, lockfile or
# cloud-control-pin change was completely unvalidated until it had already
# merged — and the first sign of a mistake was a failed production deploy.
# Vercel keeps the previous frontend serving when a build fails, and ECS keeps
# the previous task definition, so the blast radius was "no deploy" rather than
# "broken deploy"; that is survivable but it is not a gate, and it puts the
# discovery after the merge rather than before it.
#
# DELIBERATELY PATH-SCOPED, and narrowly. A full image build costs minutes, so
# this does not run on every `backend/**` PR — only on the inputs that actually
# decide whether the image builds: the Dockerfile itself, the dependency
# manifests, and the cloud-control pin the composed backend is built against.
# Application-code changes are covered by `backend-ci.yml`; they cannot break
# the build without also breaking that.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/Dockerfile'
      - 'backend/pyproject.toml'
      - 'backend/poetry.lock'
      - 'frontend/cloud-control.pin'
      - '.github/workflows/backend-image-ci.yml'
  workflow_dispatch: {}

jobs:
  build:
    name: Build backend image (composed)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The same pin resolution deploy-web.yml performs. Duplicated rather than
      # shared because a composite action for four lines of shell would put the
      # gate's correctness behind another indirection; if this drifts from
      # deploy-web.yml the build below fails, which is the point.
      - name: Resolve qontinui-cloud-control pin
        id: cloudcontrol
        run: |
          PIN_FILE=frontend/cloud-control.pin
          if [ ! -f "$PIN_FILE" ]; then
            echo "::error::$PIN_FILE is missing — the composed backend cannot be pinned"; exit 1
          fi
          SHA=$(grep -vE '^\s*(#|$)' "$PIN_FILE" | head -n1 | tr -d '[:space:]')
          if [ -z "$SHA" ]; then
            echo "::error::$PIN_FILE has no pin line"; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "qontinui-cloud-control pin = $SHA"

      # Build only — never pushed, never tagged for a registry. The image's own
      # compose-or-fail step (`python -c ... assert _route_registrars`) is what
      # this job is really exercising: it fails the build when cloud-control is
      # present but registers no routes, which is the silent shape that left
      # production serving 404s for every /api/v1/admin route.
      #
      # No `--platform linux/amd64`: the runner is already amd64, and naming it
      # would engage QEMU on any future arm64 runner for no gain here. The
      # deploy build keeps the flag because the image it produces must run on
      # ECS regardless of what built it.
      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            --build-arg SCHEMAS_SHA=main \
            --build-arg CLOUD_CONTROL_SHA=${{ steps.cloudcontrol.outputs.sha }} \
            -t qontinui-web-backend:ci \
            backend
