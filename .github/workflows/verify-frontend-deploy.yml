name: Verify Frontend Deploy

# Trigger half of the post-deploy frontend smoke + auto-rollback. The work
# itself -- the public + authed smokes, the SSM reads, the Vercel rollback and
# the issue paging -- lives in verify-frontend-run.yml; read its header for what
# the smoke checks and why.
#
# The frontend auto-deploys via Vercel's Git integration (vercel.json
# `git.deploymentEnabled: true`), and Vercel emits a GitHub `deployment_status`
# event when a deploy reaches a terminal state. GitHub runs a
# `deployment_status` workflow from the DEPLOYMENT'S commit, and Vercel deploys
# every commit it builds (branch and preview commits included) by SHA -- so
# whatever this file says at that commit is what runs. That is why this file
# holds NO AWS access and NO secrets (plan
# 2026-09-29-retire-the-admin-aws-key-ci-and-the-operator-box-share, review
# finding S1). Only the main-branch run workflow can assume the
# qontinui-web-verify-frontend role, and it re-validates the deployment id
# against the GitHub API (creator vercel[bot], Production environment, latest
# status success, SHA contained in main) before it does anything. A modified
# copy of THIS file at a deployed commit still runs in the base repo's context
# (it can reference repo-level secrets and request token scopes), so this repo
# keeps no abusable secret at repo level and relies on Vercel Git Fork
# Protection for fork commits -- see .github/aws-iam/README.md.

on:
  deployment_status

jobs:
  dispatch:
    name: Dispatch verify-frontend-run on main
    runs-on: ubuntu-latest
    # Cheap pre-filter; verify-frontend-run.yml re-checks all of it from the
    # API and does not trust this gate. The creator check keeps the backend's
    # own `environment: production` deployments (deploy-web.yml / migrate.yml,
    # creator = workflow actor, environment_url = a github.com job URL) from
    # dispatching anything. Vercel reports "Production" or "production"
    # depending on integration version, so both are accepted.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      (github.event.deployment_status.environment == 'Production' ||
       github.event.deployment_status.environment == 'production')
    timeout-minutes: 5
    permissions:
      # workflow_dispatch. A GITHUB_TOKEN-initiated workflow_dispatch DOES start
      # a run (it is one of the two events exempt from the no-recursion rule).
      actions: write
    steps:
      - name: Dispatch verify-frontend-run.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
        run: |
          set -euo pipefail
          echo "Dispatching verify-frontend-run.yml on main for deployment ${DEPLOYMENT_ID}"
          gh workflow run verify-frontend-run.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f deployment_id="${DEPLOYMENT_ID}"
