name: sql-through-alembic lint

on:
  pull_request:
    paths:
      - '**/*.sql'

permissions:
  contents: read

# Supersede a PR run when a newer commit is pushed to the same PR, so the
# previous head's runs stop consuming (and queueing for) runners. This
# workflow's lanes: `pull_request` only.
#
# The slug is a LITERAL, not `${{ github.workflow }}`. coord models a
# workflow's group template itself and interpolates only `github.event_name`
# and `github.ref`, collapsing every other expression to the empty string
# (`qontinui-coord` `ci_observer.rs::resolve_group_template`), so a
# `github.workflow` key would make every workflow here model to one identical
# group string. The four blocks already in this directory use a literal slug
# for the same reason.
#
# The key includes the EVENT because `schedule`, `workflow_dispatch` and a
# `push` to the default branch all resolve `github.ref` to `refs/heads/main`.
# Without it those lanes would share one group and supersede each other, and an
# in-flight run would occupy the very group a prospective land resolves into --
# which `run_is_reaper_at_risk` reads as a reap hazard and hard-blocks the
# merge train on.
#
# `cancel-in-progress` is an EXPRESSION, not `true`: only a `pull_request` run
# is ever superseded. A run on a `push` or `schedule` lane is never cancelled
# by this block, and since 2026-10-05 it is not reaped while PENDING either:
# the per-run suffix below makes it the only member of its group.
#
# NOTE this workflow has no `push` lane on the DEFAULT branch, and that is what
# makes a group safe here. A top-level group on a workflow that runs on
# `push: main` makes its post-land runs reaper-at-risk, which flips coord's
# blocking set from soft (relaxable by the optimism gate) to a hard block --
# see `merge_safety_from_observation`, whose soft-blocking arm requires those
# runs to share NO concurrency group.
#
# PR-SCOPED SUPERSESSION, re-run- and push-safe (shared hosted-job cap relief,
# 2026-10-05; pattern: qontinui-claude-config#1475). Only a FIRST-attempt
# `pull_request` run uses the bare per-PR group below and cancels within it.
# Every other run -- push (incl. merge-candidate*/**, coord's candidate CI),
# schedule, workflow_dispatch, and EVERY re-run (run_attempt > 1) -- appends
# `-run-<id>-<attempt>`, so it is the sole member of its group: never
# cancelled, never reaped while pending, and a re-run of an older head can no
# longer cancel the current head's run. The existing literal prefix is kept
# because coord models a template by interpolating only `github.event_name` /
# `github.ref` and collapsing every other expression (the suffix included) to
# "" -- so coord's modelled group is byte-identical to before the suffix.
concurrency:
  group: sql-through-alembic-${{ github.event_name }}-${{ github.ref }}${{ !(github.event_name == 'pull_request' && github.run_attempt == 1) && format('-run-{0}-{1}', github.run_id, github.run_attempt) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  sql-through-alembic:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2), LOW-N: no green run on record.
    # Conservative: max(10, 3x the worst observed). Replaces GitHub's 360-min default.
    timeout-minutes: 10
    name: Verify .sql files have companion alembic revisions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run sql-through-alembic lint
        run: |
          python .github/scripts/sql_through_alembic_lint.py \
            --base-ref origin/main \
            --head-ref HEAD
