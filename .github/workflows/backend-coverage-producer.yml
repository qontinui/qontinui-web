name: Backend Coverage Producer

# Per-test -> touched-file coverage producer for coord.
#
# This is a NON-GATING, main-only workflow. It runs the SAME pytest suite the
# gating Backend CI `test` job runs (same postgres+redis services, same
# schema/extension bootstrap, same flags: --cov=app --cov-context=test
# --junitxml), then reads the resulting coverage data and POSTs the per-test
# coverage map + JUnit results to coord's existing ingest routes. The map is
# cached per (repo, head_sha) in coord and PR lanes only consume it; this
# producer never blocks a PR and the export script itself is best-effort (exits
# 0 on any failure), so this workflow going red cannot break the merge pipeline.
# It is intentionally NOT a required check.
#
# SHAPE: a six-way shard matrix (`produce`), then ONE `export` job. Each shard
# runs one slice of the suite -- the SAME split backend-ci's `test` matrix uses
# (`scripts/ci/split_pytest_shards.py`, dealt by `tests/shard-durations.json`,
# behind the same collection/truncation floors) -- with a shard-unique coverage
# data file and JUnit file, and uploads both. `export` downloads them,
# `coverage combine`s the data files into one `.coverage` db (dynamic contexts
# survive the combine, so per-test attribution is intact), hands every JUnit
# file to the export script (which merges them into ONE results batch), and
# POSTs ONCE.
#
# Why sharded: the unsharded suite outgrew its 90-minute budget. Of the 38
# push-to-main runs 2026-10-24..10-31, 34 were cancelled at 90-91 min by the job
# budget and the 4 successes took 84-88 min, so main's per-test map had
# effectively stopped being exported. backend-ci's `test` job had already hit
# the identical wall and solved it by sharding; this reuses that mechanism
# rather than inventing a second one.
#
# A PARTIAL MAP IS NEVER PUBLISHED AS A WHOLE ONE. The unsharded contract was
# "a cancelled run exports nothing" (its truncated db never reached the POST).
# Sharding keeps that contract per shard and lifts it to the run: a shard
# uploads its files only when it was NOT cancelled, and `export` exports only
# when EVERY shard delivered BOTH files. One cancelled (or setup-failed) shard
# means the whole run exports nothing, says so in a ::warning, and coord keeps
# its last-known rows -- the same outcome a cancelled unsharded run had. A shard
# whose TESTS failed still concluded, still has real contexts, and still counts
# (see the export job).
#
# Why standalone: this used to ride Backend CI's test job on push-to-main, which
# forced the ENTIRE gating workflow (lint, security-scan, build-test, tests) to
# re-run on every main push, duplicating what already ran on the PR. Splitting it
# out means a main push runs ONLY this suite-then-export, and Backend CI is back
# to develop-push + PR-only.
#
# The service config, env blocks, schema-create, collect and select steps below
# are copied verbatim from backend-ci.yml's `test` job -- the suite needs them,
# and keeping them byte-faithful avoids a drift-induced red first run.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-coverage-producer.yml'
  workflow_dispatch: {}

# SERIALIZE, never cancel. `cancel-in-progress: true` until 2026-09-20, under the
# reasoning "don't pile up producer runs if several main pushes land quickly; the
# latest head_sha is the one worth mapping". Sound in isolation, self-defeating
# here: a CANCELLED RUN MAPS NO HEAD AT ALL.
#
# This job ran the full backend pytest suite -- measured 54-80 min wall clock on
# its own successful runs, before the 2026-10-31 shard split -- while `main` takes a `backend/**` push every 30-45
# min in working hours. Runtime exceeds inter-arrival time, so every run was
# killed by the next push before it could export anything. Measured on the 8 runs
# in the 2026-09-20 15:08-20:39Z window: 5 `cancelled`, 2 `failure`, 0 `success`.
# The successes on that same 25-run page (12 of them) all sit in quiet windows --
# overnight or mid-afternoon -- not in working-hours bursts. Read that as the
# pattern it is, not as a law: at least one success (35309612069) had another run
# created 26 s later, so a success is not proof of a long gap. The load-bearing
# claim is the window above, which is exact.
#
# Two facts decided the fix, both read from qontinui-coord's source rather than
# assumed:
#
#  1. THE CONSUMER DEGRADES ON A STALE SHA; IT DOES NOT DROP OUT.
#     `edit_effects::read_test_coverage_context` reads `coord.test_coverage_map`
#     as a freshest-row-per-test union across ALL shas (`DISTINCT ON (test_id)
#     ... ORDER BY test_id, observed_at DESC`, no sha predicate), explicitly so
#     that "a CI lane that did not re-run at the request's sha keeps its
#     last-known map instead of dropping out". Freshness is NOT free: when some
#     row predates the request's sha, `tests_subprediction` discounts the
#     prediction to `STALE_SHA_COVERAGE` (0.6) instead of 1.0 -- coord's own
#     "useful but do not trust as ground truth" band. But 0.6 beats the `unknown`
#     you get from no map at all, which is what cancellation was delivering. So
#     freshness is cheap RELATIVE TO completion, and the old setting traded the
#     dear thing for the cheap one.
#  2. A CANCELLED RUN CANNOT CLEAR A RED BASELINE. `ci_baseline::is_supersession_conclusion`
#     matches `cancelled`/`stale` and `ingest_workflow_run` returns BEFORE writing
#     for those, so they "never overwrite the last conclusive verdict". Once this
#     workflow concluded `failure` once, only another CONCLUSIVE run could replace
#     it -- and under starvation none ever happened. That is how a red main
#     baseline stayed pinned on a tree that may already have been repaired.
#
# What `false` actually buys, given GitHub's concurrency semantics: at most ONE
# run in progress and ONE pending per group -- a third arrival cancels the
# previously PENDING run, never the running one. So the in-flight run always
# finishes and always exports; the pending slot always holds the newest head;
# queue depth is bounded at 1 by the platform (the pile-up the old comment feared
# is handled by GitHub, only its remedy was wrong); and superseded runs are
# cancelled WHILE PENDING, costing zero runner minutes rather than the 7-70 each
# that mid-flight cancellation was burning. Note this is cost-NEUTRAL, not a
# saving: both regimes occupy a runner roughly continuously. The difference is
# that this one yields a coverage map for the minutes it spends.
#
# Rejected alternatives, briefly, so they are not re-litigated:
#   - `group: ...-${{ github.sha }}` (never cancel anything): 2-3x the compute for
#     a non-gating best-effort job whose consumer does not read per-sha.
#   - move to `schedule:`: runs when `backend/**` never changed, and reacts slowly
#     when it does. The existing `paths:` filter is better information than a clock.
#   - a debounce job that skips while a producer is in flight: same throughput,
#     but the LAST push of a burst gets skipped, so a burst's final state can stay
#     unmapped indefinitely -- whereas queueing always leaves a pending run.
#
# `frontend-coverage-producer.yml` used to keep `cancel-in-progress: true`, on
# the reasoning that at ~14 min it ran far under the push interval. By
# 2026-09-26 it measured median 16.3 min with 3 of the last 40 push-on-main runs
# `cancelled`, so it now uses `false` too, for the reasons above.
#
# Plan: 2026-09-20-backend-coverage-producer-cancels-itself-into-producing-nothing
concurrency:
  group: backend-coverage-producer-${{ github.ref }}
  cancel-in-progress: false

env:
  # Benign supersession, DECLARED (coord reads this; plan
  # 2026-10-01-coord-train-waits-on-redundant-post-land-verification
  # Decision 4): this workflow is a non-gating coverage producer, so a newer
  # main run superseding an older one loses no verification. Coord's no-reap
  # gate does not wait on it, its main-green read does not count it, and its
  # main-red fingerprint ignores it (a non-passing run here held web's train at
  # main-red on 2026-09-30). Remove this line and coord treats the workflow as
  # verification again.
  COORD_SUPERSESSION: benign
  PYTHON_VERSION: '3.12'

# Least privilege for GITHUB_TOKEN (zizmor excessive-permissions): read the
# repo; `actions: read` is for the job-timeout explainer's
# `gh api .../actions/runs/$GITHUB_RUN_ID` read. A job that needs more
# declares its own `permissions:`.
permissions:
  contents: read
  actions: read

jobs:
  produce:
    name: Per-test coverage (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      # fail-fast OFF, for backend-ci's reason and one of this workflow's own.
      # backend-ci's: a cancelled shard concludes `cancelled` with zero failing
      # steps, the exact misleading signal the marker below exists to explain.
      # Ours: `export` publishes only when EVERY shard delivered its files, so
      # fail-fast would turn one shard's failing TEST -- which still yields a
      # real, complete slice of the map -- into five cancelled shards and no
      # export at all.
      fail-fast: false
      matrix:
        # Kept in lockstep with the `--shards` value the select step passes AND
        # with `EXPECTED_SHARDS` in the export job;
        # backend/tests/test_pytest_shard_split.py asserts all three agree. A
        # 5-entry matrix against `--shards 6` silently never maps a sixth of the
        # suite, and the export's completeness check could not see it.
        shard: [1, 2, 3, 4, 5, 6]
    # 90 until the 2026-10-31 shard split, when it was the budget for the WHOLE
    # suite (history: 45 until 2026-08-28, an unmeasured number below the
    # suite's own median; then 90, copied from backend-ci's then-unsharded
    # `test` job). By 2026-10-24..10-31 the whole suite needed 84-88 min on its
    # 4 successes and 34 of 38 runs were cancelled AT 90 -- so the budget is
    # now PER SHARD, sized from measurement rather than inherited.
    #
    # SIZED FOR ONE SHARD, from backend-ci's own shards, which run the
    # byte-identical split, flags and service stack on the same `runs-on`: 30
    # `Run Tests (shard N/6)` check runs over 5 merged PRs (#2012, #2014, #2015,
    # #2024, #2029; 2026-10-30..10-31) took 7.3-43.3 min job wall-clock, most
    # 25-37 min, max 43.3 min. (Their sum is ~1.9x the unsharded suite's 85 min
    # -- the shards are not getting 1/6 of the work's time each, they are
    # contending -- which is why the expected time is taken from measured shards
    # and NOT computed as 85/6 + setup.) backend-ci's 45 is only 1.7 min above
    # that max; copying it here would put this lane straight back on the tail
    # of its own distribution, the failure mode this budget has now had twice.
    # 60 is ~1.4x the worst measured shard. The soft budget below (45) fires at
    # the worst measured shard, with 15 min still in hand. When it starts
    # firing, the matrix length is the lever, not this number.
    #
    # Non-gating, so the wall-clock blocks nothing; but a budget this job cannot
    # meet is not "harmless slack": it is a coverage export that silently never
    # runs, and a main baseline FROZEN on whatever its last conclusive verdict
    # was. Corrected 2026-09-20 -- this used to say a permanent "red on main's
    # baseline (`cancelled` is not in coord's passing set)". `cancelled` is
    # indeed not in that set, but it never reaches it:
    # `ci_baseline::is_supersession_conclusion` matches `cancelled`/`stale` and
    # `ingest_workflow_run` returns BEFORE writing for those, so they "never
    # overwrite the last conclusive verdict". A timing-out job therefore does not
    # turn main red -- it makes main UNFALSIFIABLE, which is worse, because no
    # later run can clear a red already standing.
    #
    # !! Keep `JOB_TIMEOUT_MINUTES` below in lockstep with this value. !!
    # The duplication is forced: GitHub does not expose a job's own timeout to
    # any expression, and `env` is NOT an available context for
    # `jobs.<job_id>.timeout-minutes` (it IS for the step-level key, which makes
    # the mistake look plausible). An unavailable context evaluates to EMPTY
    # rather than erroring, so `${{ env.X }}` here would silently restore
    # GitHub's 360-minute default with nothing in the log saying so.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        # pgvector/pgvector:pg16 is the official pgvector-bundled image
        # (Docker Hub). It's a drop-in replacement for postgres:16 — same
        # POSTGRES_* env vars, same pg_isready healthcheck — and ships the
        # `vector` extension so the `CREATE EXTENSION` step below succeeds.
        # Stock postgres:16 doesn't, which makes conftest's
        # Base.metadata.create_all fail with:
        #   asyncpg.exceptions.UndefinedObjectError: type "vector" does not exist
        # for any model that has a pgvector.sqlalchemy.Vector column (see
        # alembic/versions/05a366f58455_initial_schema_squashed.py:13,26).
        image: pgvector/pgvector:pg16
        # Credentials must match backend/tests/conftest.py, which hardcodes
        # postgresql://qontinui_user:qontinui_dev_password@localhost:5432/qontinui_test
        # for both DATABASE_URL and TEST_DATABASE_URL. Mismatched values
        # produce: asyncpg.exceptions.InvalidPasswordError: password
        # authentication failed for user "qontinui_user".
        env:
          POSTGRES_USER: qontinui_user
          POSTGRES_PASSWORD: qontinui_dev_password
          POSTGRES_DB: qontinui_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      # Stamp THIS JOB's start time. Must stay the FIRST step of the job.
      #
      # The infrastructure marker below measures elapsed time to tell a job
      # TIMEOUT from an external cancel, and `run_started_at` (the API value it
      # falls back to) measures the RUN: it includes every upstream `needs:` job
      # and all queue time. On a `needs:`-gated job that skew can exceed the
      # budget slack, so a LATE external cancel reads as past the budget and is
      # reported as a timeout -- the same laundering of one cause into another
      # that the marker exists to prevent, merely inverted. This stamp removes
      # the skew, and removes the `gh api` dependency on the common path.
      - name: Record job start time
        # `working-directory` is NOT decoration. This step runs BEFORE
        # `actions/checkout`, and a job whose `defaults.run.working-directory`
        # points into the repo (e.g. `./backend`) has no such directory yet --
        # the step then fails on a missing cwd, and because it is step 1 the
        # whole job dies with every later step skipped. Anchoring to the
        # workspace root, which the runner creates before any step, is what
        # makes a pre-checkout step safe. Set explicitly on every carrier so
        # this stays correct if a job later gains a default.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # qontinui (a path-dep) pulls in torch from pytorch-cu128 — wheels
      # are large enough to overflow the runner's default disk. Remove
      # preinstalled SDKs/runtimes that this workflow doesn't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Backend's pyproject.toml has path-deps on sibling repos
      # (qontinui-schemas, qontinui). actions/checkout@v5 refuses
      # `path:` outside the workspace, so clone them via git directly.
      # qontinui-cloud-control is now AGPL/public — plain clone so the test
      # harness can side-effect-import it (see backend/tests/conftest.py).
      - name: Checkout sibling repos (qontinui-schemas, qontinui, qontinui-cloud-control)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/jspinak/qontinui.git
          git clone --depth 1 https://github.com/qontinui/qontinui-cloud-control.git

      # The pinned fleet-noun vocabulary (fleet-nouns.pin.toml) for
      # backend/tests/test_fleet_nouns_ratchet.py and the frontend rule's
      # vocabulary test; sets QONTINUI_FLEET_NOUNS_FILE. Plan
      # 2026-09-20-the-published-product-works-without-knowing-a-development-environment-exists A5.
      - name: Fleet-noun vocabulary (pinned)
        uses: ./.github/actions/fleet-nouns-vocab

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install qontinui-cloud-control into poetry venv
        # Path is ../../qontinui-cloud-control because working-directory is
        # ./backend (one level deeper than the repo root the clone sits beside).
        run: poetry run pip install -e ../../qontinui-cloud-control

      - name: Install postgresql-client
        id: apt_psql
        # ONLY the apt-get call lives in this step, and it is the entire reason
        # for the bound: it reaches an external mirror at job time and is the
        # same unbounded-stall exposure as the Playwright step (plan
        # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure).
        # The psql/DDL that used to share this step now runs UNBOUNDED below.
        # It HAD to move: under `bash -e` a psql failure set this step's
        # `.outcome` to `failure` exactly like an apt timeout, so the
        # infrastructure marker could not tell a mirror stall from the author's
        # own schema breaking -- and told them their breakage was infrastructure.
        # Measured apt+psql across green runs of all 7 sites: p50 0-16s, p90
        # <=91s, max 106s (migration-reversal). The bound now covers apt ALONE,
        # so 5 min is p90 + ~3.5 min of headroom over a strictly smaller job.
        # GUARDED, as spec-ci.yml has been all along. `ubuntu-latest` ships
        # psql, so `command -v psql` short-circuits and apt is never reached --
        # measured, not assumed: across 12 consecutive green Spec CI runs this
        # step is 0-1s every time, while the six sites that were still calling
        # apt unconditionally spent 3-29s per run on an `apt-get update` against
        # the external mirror for a package apt then reports as already the
        # newest version. That round-trip is pure exposure to the stall this
        # plan exists to remove, and it buys nothing.
        # (Those 3-29s figures are from `--status success` runs, so they are a
        # LOWER bound by construction -- a run killed by the stall is excluded.)
        # The bound below is NOT redundant: it covers the fallback arm, for the
        # day an image stops shipping psql.
        # Consequence for the marker: this step normally runs NO apt, so it
        # normally concludes `success` and no arm names it -- which is correct,
        # because there was no apt call to blame. spec-ci.yml makes the same
        # observation at its own site (an arm keyed on this step's failure
        # "would have been describing a call that did not happen"); the arm
        # attribution below is this change's, not a restatement of that one.
        # When the fallback DOES run and fails, the step still exits non-zero
        # (`||` does not defeat `-e` for the group) and concludes `failure`, so
        # arm 1 fires. The guard removes the exposure; it does not silence a
        # real apt failure.
        timeout-minutes: 5
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      # backend/tests/conftest.py uses Base.metadata.create_all (NOT
      # alembic) to bootstrap the test DB, so SQLAlchemy will try to
      # create tables in named schemas without first ensuring the
      # schemas exist. Models reference `project`, `auth`, and `cloud`
      # schemas (the last via the qontinui-cloud-control sibling repo
      # whose models are side-effect-imported in conftest.py); the
      # postgres service container starts with none of them, so
      # create them explicitly here. We also `CREATE EXTENSION vector`
      # — alembic does this in 05a366f58455 but conftest skips alembic,
      # so create_all hits `UndefinedObjectError: type "vector" does
      # not exist` whenever a Vector column is materialized. Without
      # the schema lines, create_all fails with:
      #   asyncpg.exceptions.InvalidSchemaNameError: schema "project"
      #   does not exist
      - name: Create test schemas and extensions
        # Deliberately UNBOUNDED and deliberately WITHOUT an `id:`. This is
        # psql/DDL against this job's own postgres service, not the external
        # mirror, so a failure here IS a verdict on the change -- it must never
        # reach the infrastructure marker's APT_STEP_OUTCOMES.
        env:
          PGPASSWORD: qontinui_dev_password
        run: |
          psql -h localhost -U qontinui_user -d qontinui_test \
            -c "CREATE SCHEMA IF NOT EXISTS project;" \
            -c "CREATE SCHEMA IF NOT EXISTS auth;" \
            -c "CREATE SCHEMA IF NOT EXISTS cloud;" \
            -c "CREATE SCHEMA IF NOT EXISTS coord;" \
            -c "CREATE SCHEMA IF NOT EXISTS web;" \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Collection is the shard split's ONLY input, and it is deliberately run
      # per shard rather than once in an upstream job: every shard computes the
      # SAME assignment from the SAME collected set, so no shard waits on
      # another and there is no fan-out stage to serialize behind. ~30 s.
      #
      # `-o addopts=` is LOAD-BEARING and the reason is measured, not theoretical.
      # pytest.ini's addopts carry `-v`, which CANCELS the `-q` below back to
      # verbosity 0 -- and at verbosity 0 `--collect-only` prints the indented
      # `<Module ...>` / `<Function ...>` TREE, not node ids. On the first CI run
      # of this change that produced 5157 output lines and ZERO node ids, and the
      # splitter refused (exit 2) rather than emitting an empty selection.
      # Emptying addopts is stable against the ini's verbosity changing; `-q -q`
      # also works today and would silently break the day a second `-v` is added.
      # backend/tests/test_pytest_shard_split.py pins this flag for that reason.
      #
      # Emptying addopts also drops `--cov=app` and its three report formats, so
      # the collection cannot leave a ~0% coverage report for the real run to
      # overwrite. `--no-cov` stays as belt-and-braces if a future addopts change
      # re-adds coverage by another route.
      - name: Collect the test suite
        env:
          DATABASE_URL: postgresql://qontinui_user:qontinui_dev_password@localhost:5432/qontinui_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_ENABLED: true
          TESTING: 1
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          ENVIRONMENT: development
        run: |
          # pytest writes collection ERRORS to stdout, and stdout is redirected
          # into the file -- so a failed collection would otherwise show as a
          # dead step with no reason in the log. Print what it said. This is the
          # same misattribution class the marker step below exists to prevent.
          if ! poetry run pytest tests/ --collect-only -q -o addopts= --no-cov > collected-nodeids.txt; then
            echo "::error title=pytest collection failed::The collection command exited non-zero; its own output follows."
            cat collected-nodeids.txt
            exit 1
          fi
          echo "collection produced $(wc -l < collected-nodeids.txt) output lines"
          # The emptiness AND truncation checks both live in the splitter, which
          # already parses node ids. A second copy of that rule here was a real
          # defect, not a hypothetical one: it accepted characters the splitter
          # rejects and over-counted, and `$(grep -c … || true)` fed an EMPTY
          # string into a numeric test, which fails OPEN without tripping `-e`.
          # A tripwire that fails open is not a tripwire, so there is now exactly
          # one parser and the comparison happens in Python.
          #
          # The floor is the on-disk FILE COUNT, not a constant. A hardcoded
          # node-id floor is decoration: measured on this tree, 32 of 231 test
          # files already clear 500 node ids, so a collection truncated to a
          # seventh of the suite would pass it and six green shards would cover
          # ~14% of the tests. Deriving it means it cannot go stale as the suite
          # grows, and it makes the invariant the honest one: every `test_*.py`
          # pytest would collect must actually appear in the collection.
          expected_files=$(find tests -name 'test_*.py' -type f | wc -l)
          # VALIDATE the derived value before trusting it. A pipeline takes its
          # exit status from the LAST command, so `find … | wc -l` reports `wc`'s
          # success even when `find` failed (missing or renamed `tests/`, wrong
          # cwd): `expected_files` is then 0, the floor computes to 0, and the
          # tripwire disarms itself while the log still prints a plausible
          # number. Measured. This is the same fail-open class as the bash
          # numeric test this design already deleted, so it gets the same
          # treatment the tripwire step next door gives JOB_START_EPOCH: an
          # implausible value is UNKNOWN and stops the job, never a silent pass.
          if [ -z "${expected_files}" ] || [ -n "${expected_files//[0-9]/}" ] \
              || [ "${expected_files}" -lt 100 ]; then
            echo "::error title=Truncation floor UNKNOWN::find reported '${expected_files}' test files under tests/, which cannot be right for this suite (226 collectable of 231 on disk today). The floor was NOT applied and the collection was NOT checked, so this job stops rather than sharding an unverified collection."
            exit 1
          fi
          # TWO floors, because one is not enough and the reason is measured.
          #
          # FILES: three quarters of the on-disk count. An EXACT floor is wrong -
          # conftest.py sets `collect_ignore` (today `["integration"]`, 5 of 231
          # test files), so requiring every `test_*.py` to appear reds a
          # perfectly correct collection. Duplicating that ignore list here is
          # the drift this design removed, so the floor absorbs it by ratio.
          #
          # NODE IDS: the file floor alone is materially loose, and by a number -
          # dropping the 53 heaviest collectable files keeps 173 of 231 files and
          # PASSES a 3/4 file floor while losing 2263 of 3601 test functions, 62%
          # of the suite. A conftest import error under one heavy subtree is
          # exactly that shape: most files present, most tests gone. At ~4141
          # node ids over 231 files the suite averages ~18 per file, so a floor
          # of 10x the file count (2310 today) sits well under a healthy
          # collection and far above that 62% shape. The PAIR bounds the hole at
          # ~36%, it does not close it: dropping the 18 heaviest files keeps 208
          # files and exactly 2310 node ids while losing 1293 of 3603 tests. That
          # residue needs every other file to collect normally, which is not what
          # an import error or a plugin regression looks like - so it is accepted,
          # and named here rather than left to be discovered.
          min_files=$(( expected_files * 3 / 4 ))
          min_nodeids=$(( expected_files * 10 ))
          echo "test files on disk: ${expected_files}; floors: ${min_files} files, ${min_nodeids} node ids"
          if ! python ../scripts/ci/split_pytest_shards.py \
              --nodeids collected-nodeids.txt \
              --count-only \
              --min-files "${min_files}" \
              --min-nodeids "${min_nodeids}"; then
            echo "Last lines of the collection output, for context:"
            tail -20 collected-nodeids.txt
            exit 1
          fi

      # The split is a pure function of the collected set (see the script's
      # docstring): complete, disjoint and order-independent, so the six shards
      # partition the suite exactly. backend/tests/test_pytest_shard_split.py
      # pins those properties AND pins `--shards` against the matrix length.
      #
      # This step passes no floors on purpose: the collect step above already
      # gated the collection and exits 1 on a bad one, so a second copy of the
      # floors here would be the duplication this design keeps removing. The
      # splitter enforces them on the selection path too (there is a test for
      # that), which matters for any OTHER caller - not for this workflow, where
      # the selection is only reached after the gate passed.
      #
      # `--durations` deals the files by MEASURED SECONDS rather than by test
      # count (plan
      # 2026-09-20-web-run-tests-shards-are-balanced-by-test-count-so-one-shard-carries-the-migration-tests-back-to-the-budget).
      # Count balance put the alembic-harness files -- ~8% of the tests and
      # ~75% of the seconds -- wherever LPT happened to drop them, so one shard
      # ran at 2-4x its siblings. The map is committed (never cached: every
      # shard must compute the SAME assignment from the SAME inputs) and is
      # refreshed from the nightly's `shard-durations-proposed.json` artifact.
      # An absent or corrupt map degrades to count weights, said on the
      # splitter's verdict line; it cannot change which files run. Only THIS
      # step takes the flag -- the collect step above is a pure collection
      # check, and the splitter refuses `--durations` with `--count-only`.
      - name: Select this shard's test files
        run: |
          python ../scripts/ci/split_pytest_shards.py \
            --nodeids collected-nodeids.txt \
            --shards 6 \
            --shard ${{ matrix.shard }} \
            --durations tests/shard-durations.json \
            --out shard-files.txt

      - name: Run tests with coverage
        env:
          # conftest.py overrides this anyway, but keep aligned with the
          # postgres service creds for clarity.
          DATABASE_URL: postgresql://qontinui_user:qontinui_dev_password@localhost:5432/qontinui_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_ENABLED: true
          TESTING: 1
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          ENVIRONMENT: development
          # A shard-UNIQUE coverage data file. pytest-cov hands COVERAGE_FILE to
          # coverage.py, which writes the db there instead of `.coverage`; the
          # export job combines all six. The name carries no leading dot on
          # purpose: upload-artifact skips hidden files by default, and a
          # `.coverage.shard-N` would upload as an EMPTY artifact -- which the
          # export would then (correctly) read as a missing shard, every run.
          COVERAGE_FILE: coverage-data-shard-${{ matrix.shard }}
        run: |
          # An EXPLICIT file list, never a directory. Handing pytest a bare
          # directory here would make every shard run the entire suite, which is
          # the one failure mode of sharding that still reports green -- so the
          # empty case is a hard error rather than a fallback. The splitter
          # already refuses to emit an empty list; this is the second guard,
          # because the consequence is a silently multiplied bill or a silently
          # narrowed gate.
          mapfile -t SHARD_FILES < shard-files.txt
          if [ "${#SHARD_FILES[@]}" -eq 0 ]; then
            echo "::error::shard-files.txt is empty; refusing to invoke pytest without an explicit file list."
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/6 runs ${#SHARD_FILES[@]} test files"
          poetry run pytest "${SHARD_FILES[@]}" -v \
            --cov=app \
            --cov-context=test \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=junit-results-shard-${{ matrix.shard }}.xml

      # This shard's slice of the map: its coverage data file + its JUnit file.
      #
      # `!cancelled()` and NOT `always()` -- the unsharded export step's rule,
      # moved to where the data now leaves the shard. A RED shard (failing tests)
      # still uploads: `--cov-context=test` records which test touched which
      # lines regardless of assertion outcome, and `--junitxml` is written either
      # way, so its slice is real signal. A CANCELLED shard (external cancel, or
      # its own job timeout, which also concludes `cancelled`) has a truncated
      # db, and must not contribute it; skipping the upload is what makes its
      # absence visible to the export job's completeness check, which then
      # publishes nothing for the whole run.
      #
      # `if-no-files-found: error`: a shard that concluded without writing both
      # files (a setup step failed before pytest ran) fails this step loudly
      # rather than uploading a half-artifact that would look delivered.
      - name: Upload this shard's coverage data and junit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-producer-shard-${{ matrix.shard }}
          path: |
            ./backend/coverage-data-shard-${{ matrix.shard }}
            ./backend/junit-results-shard-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 3

      # Budget-creep tripwire. Raising `timeout-minutes` without this would
      # trade a LOUD wrong signal (a red lane blamed on an external cancel) for
      # a SILENT one -- the job creeping back up on the new budget with nothing
      # to notice until it flips red again. It warns on a GREEN run once the job
      # crosses a soft budget well below the hard one, so growth is visible with
      # a third of the budget still in hand instead of announcing itself by
      # reding the lane.
      #
      # It reads `JOB_START_EPOCH`, stamped by this job's FIRST step, so it
      # measures the same quantity the budgets are expressed in: JOB wall-clock.
      # Measuring only the pytest step would silently exclude the ~2-3 min setup
      # prefix and so overstate the remaining headroom by exactly that much.
      #
      # NEGATIVE PATH FIRST, and harder than the positive one: a missing or
      # non-numeric start says UNKNOWN and says the tripwire did NOT run. It
      # must never print "within budget" off a measurement it does not have --
      # that is the same absence-read-as-a-negative that made the marker call a
      # timeout an external cancel.
      #
      # This step must not be able to red the lane. GitHub runs `run:` under
      # `bash -eo pipefail`, so an unguarded `$(( ))` on a non-numeric value
      # would abort the step and fail the job; the digit check below is what
      # stops that, and it runs BEFORE any arithmetic.
      - name: Warn if the job is approaching its budget
        if: success()
        env:
          # Per SHARD, not per suite. 45 is the worst measured backend-ci shard
          # running this same split (43.3 min, see `timeout-minutes` above),
          # rounded up, and 15 min below the 60-minute job budget: it speaks the
          # first time a shard runs slower than any yet observed, with a quarter
          # of the hard budget still in hand.
          SOFT_BUDGET_MINUTES: '45'
          JOB_TIMEOUT_MINUTES: '60'
          # The only per-site text in an otherwise byte-identical body. Keeping
          # the prose in `env` is what lets the two carriers share one script:
          # the marker next door is carried by eight copies precisely because
          # they are identical, and a tripwire that forked its wording at two
          # sites would start the same drift over again at a smaller scale.
          JOB_LABEL: Backend Coverage Producer shard
          BUDGET_STAKES: >-
            This lane is non-gating, so a timeout here does not block a PR - it costs the coverage export and reds the main baseline instead.
        run: |
          set -uo pipefail

          # All three guards are load-bearing under `-e`. Non-numeric aborts
          # `$(( ))`; an over-long value overflows int64 and yields a garbage
          # NEGATIVE "measurement" presented as fact; and `10#` forces base 10,
          # because bash reads a leading zero as octal where `08` is a hard
          # error rather than a value. Any of them firing means UNKNOWN.
          start="${JOB_START_EPOCH:-}"
          if [ -z "$start" ] || [ -n "${start//[0-9]/}" ] || [ ${#start} -gt 11 ]; then
            echo "::warning title=Job duration UNKNOWN - budget tripwire did not run::JOB_START_EPOCH was absent, non-numeric or implausible ('${start}'), so this job's duration could not be measured and the ${SOFT_BUDGET_MINUTES}-minute budget-creep check was NOT performed. This is UNKNOWN - it is specifically NOT a statement that the job is within budget."
            exit 0
          fi

          start=$(( 10#$start ))
          if [ "$start" -lt 1600000000 ]; then
            echo "::warning title=Job duration UNKNOWN - budget tripwire did not run::JOB_START_EPOCH='${JOB_START_EPOCH:-}' is not a plausible epoch (it resolves to ${start}, i.e. before 2020), so this job's duration could not be measured and the ${SOFT_BUDGET_MINUTES}-minute budget-creep check was NOT performed. This is UNKNOWN, not a statement that the job is within budget."
            exit 0
          fi

          elapsed_min=$(( ( $(date -u +%s) - start ) / 60 ))
          if [ "$elapsed_min" -lt 0 ]; then
            echo "::warning title=Job duration UNKNOWN - budget tripwire did not run::Computed a NEGATIVE elapsed time (${elapsed_min} min) from JOB_START_EPOCH='${start}', which cannot be a real measurement, so the ${SOFT_BUDGET_MINUTES}-minute budget-creep check was NOT performed. This is UNKNOWN, not a statement that the job is within budget."
            exit 0
          fi
          echo "Job wall-clock: ${elapsed_min} min (soft budget ${SOFT_BUDGET_MINUTES} min, job budget ${JOB_TIMEOUT_MINUTES} min)."

          if [ "$elapsed_min" -ge "$SOFT_BUDGET_MINUTES" ]; then
            echo "::warning title=${JOB_LABEL} is approaching its job budget::This job took ${elapsed_min} min, at or past the ${SOFT_BUDGET_MINUTES}-minute soft budget and closing on the ${JOB_TIMEOUT_MINUTES}-minute job budget. This run PASSED - this is an early warning, not a failure. ${BUDGET_STAKES} Act on it before it becomes a timeout: this repo has already paid for a budget set below this suite's own median - every main push then produced a 'cancelled' run and no coverage export, which coord discards without writing, so main's baseline froze on its last conclusive verdict and no later run could clear it. Either make the suite faster (sharding is the obvious lever) or raise BOTH 'timeout-minutes' and 'JOB_TIMEOUT_MINUTES' together."
          fi

      # ----------------------------------------------------------------------
      # CI-infrastructure timeout marker (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 5).
      #
      # A job-level timeout concludes the job as `cancelled`, and `gh pr checks`
      # renders `cancelled` as **fail** -- with ZERO failing steps, because no
      # step failed. An author triaging their own PR sees "fail" against their
      # diff with nothing to point at, and reads it as their own regression. On
      # 2026-08-19 that misattribution cost real time on PR #1015. This step
      # exists so the log says what actually happened.
      #
      # `cancelled` has THREE causes and only the first is this plan's defect:
      #   1. an apt-dependent step stalled against the external mirror (ours)
      #   2. coord's merge train reaping a `merge-candidate/*` ref (benign)
      #   3. a manual / external / superseding cancel (benign)
      # 2 and 3 resolved in MINUTES in every observed case. A marker that
      # shouted "infrastructure timed out" on all three would be wrong on the
      # benign ones, and a diagnostic that is wrong a quarter of the time is
      # worse than none -- it teaches readers to discard the other three
      # quarters. So the ::error:: arms demand POSITIVE evidence that an
      # apt-dependent step is what died, and every other path declines to judge
      # the diff at all.
      #
      # An apt step marked `continue-on-error: true` CAN be present when this
      # step fires. Its own soft failure cannot red the check -- but a LATER,
      # genuine failure can, and this step then runs with that soft-failed
      # outcome still in hand. So arm 1 keys on `.conclusion` (the value AFTER
      # `continue-on-error` rewrites it), never on `.outcome` alone: a step
      # that concluded `success` is not what red this job, and naming it as the
      # cause would misattribute a real regression to infrastructure -- the
      # exact cry-wolf this step exists to prevent.
      #
      # A soft-failed apt step is NOT thereby harmless, and the marker must not
      # say it is. `continue-on-error: true` stops it reding the job DIRECTLY;
      # it does nothing about the cascade. style-gate.yml is the live example:
      # six of its provisioning steps are deliberate SHADOW soft-fails, so a
      # stalled `Install postgresql-client` leaves no psql, the schema and
      # migration steps soft-fail in turn, no snapshots are captured, and with
      # STYLE_GATE_ENFORCE=1 the assert step exits 1. That job is red BECAUSE
      # of the apt stall, with no apt step concluding `failure` anywhere. So
      # every arm that would otherwise assert "this failure is a real one" or
      # "no apt-dependent step failed" is guarded on `soft_failed` being empty,
      # and warns instead of ruling when it is not.
      - name: Explain infrastructure timeout vs external cancellation
        if: cancelled() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          # declared at this job's `timeout-minutes` -- now the PER-SHARD budget.
          # !! Must equal it. !!
          # See the lockstep note there for why this cannot be an expression.
          # If these two drift, `budget_floor` is computed from the wrong number
          # and the job-timeout arm misfires or fails to fire.
          JOB_TIMEOUT_MINUTES: '60'
          EXTERNAL_CANCEL_NOTE: >-
            this workflow declares `concurrency: cancel-in-progress: false`, so a RUNNING job is never auto-superseded - only a run still PENDING is cancelled when a newer push to the same ref supersedes the run, which costs no runner minutes and never reaches this step; for a job that got this far, a manual cancel is the external cause
          # `<step name>|<outcome>|<conclusion>` per apt-dependent step in this
          # job. BOTH values are carried on purpose:
          #   * `.outcome` is the value BEFORE `continue-on-error` rewrites it,
          #     so a soft-failed step still reports the truth here;
          #   * `.conclusion` is what actually reached the job, and ONLY a step
          #     that concluded `failure` can be what red it.
          # Every step named below runs `apt-get` and nothing else. Two splits
          # buy that invariant across all 8 workflows: the psql/DDL work that
          # used to share the postgresql-client steps now lives in an unbounded
          # successor step, and `npx playwright install --with-deps` -- npx
          # resolution PLUS a CDN browser download PLUS apt, fused into one
          # step -- is split so that only its apt-only `install-deps` half is
          # ever named here. So a `failure` on any step below is the apt
          # mirror: never the author's schema breaking, and never a Playwright
          # bundle that 404s on cdn.playwright.dev.
          APT_STEP_OUTCOMES: |
            Install postgresql-client|${{ steps.apt_psql.outcome }}|${{ steps.apt_psql.conclusion }}
        run: |
          set -uo pipefail

          # An apt step whose CONCLUSION is `failure` hit its own step-level
          # `timeout-minutes` (or apt errored outright) and red this job --
          # either way it is infrastructure. One whose outcome is `cancelled`
          # was still mid-flight when the job ended; that is only decisive once
          # we also know the job budget had actually expired. One that failed
          # but concluded `success` is `continue-on-error: true`: it did not red
          # this job DIRECTLY, but it can still have red it through the cascade
          # of steps that needed what it installs, so it is tracked separately
          # and never dismissed.
          #
          # Every matching step is named, not just the last one: two apt steps
          # can die in the same job, and reporting only one understates it.
          apt_failed=""
          apt_running=""
          soft_failed=""
          # How many rows actually parsed. An EMPTY APT_STEP_OUTCOMES -- which is
          # what a renamed or deleted step id renders to -- leaves all three
          # buckets empty, exactly like a clean run. That is an absence of DATA,
          # not an observation of health, and arm 2d is the first arm to make a
          # POSITIVE claim on it.
          apt_rows_seen=0
          while IFS='|' read -r step_name outcome conclusion; do
            [ -z "${step_name// }" ] && continue
            apt_rows_seen=$(( apt_rows_seen + 1 ))
            case "$outcome" in
              failure)
                if [ "$conclusion" = "failure" ]; then
                  apt_failed="${apt_failed:+$apt_failed, }$step_name"
                else
                  soft_failed="${soft_failed:+$soft_failed, }$step_name"
                fi
                ;;
              cancelled) apt_running="${apt_running:+$apt_running, }$step_name" ;;
            esac
          done <<< "$APT_STEP_OUTCOMES"

          why="It shells out to apt-get against an external mirror at job time."
          why="$why That call is normally seconds, but has been observed to stall"
          why="$why for 30+ minutes (and, unbounded, for 5h59m). Nothing under test ran."
          ref="See plan 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure."
          # A separate pointer for the budget arms. $ref names the apt-stall
          # plan, which is the wrong citation for an arm that exists to say
          # this was NOT the apt stall.
          ref_budget="See plan 2026-08-27-web-backend-coverage-producer-timeout."

          # Context line, emitted before any verdict.
          if [ -n "$soft_failed" ]; then
            echo "::notice title=Soft-failed apt step - possible upstream cause::Step(s) '$soft_failed' failed but are marked 'continue-on-error: true', so they concluded 'success' and did not DIRECTLY red this job. A later step that needed what they install can still have failed as a consequence, which would make this job's red an apt cascade rather than a verdict on the diff."
          fi

          # --- Arm 1: an apt step failed AND that failure red the job.
          # Airtight: neither a merge-train reap nor any other external cancel
          # can make a step conclude `failure`.
          if [ -n "$apt_failed" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_failed' exceeded a step-level timeout-minutes or failed outright. $why This is a CI infrastructure failure, not a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 1b: no apt step concluded `failure` and none is mid-flight,
          # but one SOFT-failed. The cascade described in the step header is
          # live here, so "this job's failure is a real one" is an assertion
          # this step cannot support. Warn rather than rule -- an UNKNOWN
          # stated as UNKNOWN, not laundered into a negative.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=A soft-failed apt step may have red this job downstream::No apt-dependent step concluded 'failure', but step(s) '$soft_failed' soft-failed ('continue-on-error: true'). $why Steps that needed what they install can have failed as a consequence, so this job's red may be that cascade and NOT a verdict on the diff. Check the cascade before concluding either way. $ref"
            exit 0
          fi

          # --- Neither cancelled nor an apt failure => a genuine red. Say
          # nothing: this step explains infrastructure timeouts, it does not
          # editorialise real test failures.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ]; then
            echo "No apt-dependent step red the job, none was mid-flight, and the job was not cancelled."
            echo "This job's failure is a real one - emitting no marker."
            exit 0
          fi

          # --- Did the run actually reach its budget? A job timeout fires at
          # elapsed >= budget; a reap or a manual cancel lands at an arbitrary,
          # typically far earlier, elapsed (the two observed benign
          # cancellations were at 2m02s and 7m29s). That gap is the
          # discriminator, so resolve it from the API rather than assuming.
          # This lookup CAN fail (403, rate limit, network blip, a timestamp
          # `date -u -d` cannot parse); every failure leaves `elapsed_min`
          # empty, and empty is UNKNOWN. It is never evidence for a negative.
          # PREFER this job's own start stamp (written by the job's first
          # step). `run_started_at` measures the RUN -- it includes every
          # upstream `needs:` job and all queue time -- so on a `needs:`-gated
          # job it overstates this job's elapsed time by more than the slack
          # below, and a LATE external cancel would then be reported as a
          # timeout. The API lookup stays as the fallback for a job whose stamp
          # step did not run.
          #
          # The guards are not decoration: `-e` is on, so a non-numeric or
          # absurd value reaching `$(( ))` would ABORT this step, and a marker
          # that aborts explains nothing. `10#` forces base 10 -- bash reads a
          # leading zero as octal, where `08` is a hard error, not a value.
          # Every failure path leaves `elapsed_min` empty, and empty is UNKNOWN;
          # it is never evidence for a negative.
          elapsed_min=""
          elapsed_basis=""
          job_start="${JOB_START_EPOCH:-}"
          if [ -n "$job_start" ] && [ -z "${job_start//[0-9]/}" ] && [ ${#job_start} -le 11 ]; then
            job_start=$(( 10#$job_start ))
            # A real CI job start is a 10-digit epoch. Anything smaller is a
            # nonsense stamp -- '08' parses fine and means 8 SECONDS after 1970
            # -- and turning it into a 29-million-minute "measurement" would be
            # garbage presented as fact, which is the very laundering this
            # marker exists to stop. Below the floor, leave it UNKNOWN.
            if [ "$job_start" -ge 1600000000 ]; then
              elapsed_min=$(( ( $(date -u +%s) - job_start ) / 60 ))
              elapsed_basis="job"
            fi
          fi
          if [ -z "$elapsed_min" ]; then
            started="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' 2>/dev/null || true)"
            if [ -n "$started" ]; then
              start_epoch="$(date -u -d "$started" +%s 2>/dev/null || true)"
              if [ -n "$start_epoch" ]; then
                elapsed_min=$(( ( $(date -u +%s) - start_epoch ) / 60 ))
                elapsed_basis="run"
              fi
            fi
          fi

          # A negative elapsed means the clock moved backwards or the stamp is
          # nonsense. Report UNKNOWN rather than a garbage measurement.
          if [ -n "$elapsed_min" ] && [ "$elapsed_min" -lt 0 ]; then
            elapsed_min=""
            elapsed_basis=""
          fi

          # Named so an arm that RULES can disclose what it measured.
          case "$elapsed_basis" in
            job) basis_note="measured from this job's own start" ;;
            run) basis_note="measured from the RUN's start (this job's own start stamp was unavailable), so it also includes any upstream 'needs:' job and queue time" ;;
            *)   basis_note="not measured" ;;
          esac

          # 2 minutes of slack absorbs the gap between run start and job start.
          budget_floor=$(( JOB_TIMEOUT_MINUTES - 2 ))

          # Did the budget actually expire? THREE-valued: "yes" | "no" | ""
          # (UNKNOWN, when elapsed could not be read). NEVER collapse UNKNOWN
          # into "no". That collapse is precisely how arm 3 came to assert an
          # external cancel for a job that had in fact exhausted its own budget:
          # it interpolated `elapsed_min` into its message but never TESTED it,
          # so the only arm performing the budget test was arm 2 -- which is
          # guarded on an apt step being mid-flight and therefore unreachable on
          # any job whose apt steps are guarded to 0s.
          budget_reached=""
          if [ -n "$elapsed_min" ]; then
            if [ "$elapsed_min" -ge "$budget_floor" ]; then
              budget_reached="yes"
            else
              budget_reached="no"
            fi
          fi

          # One legible phrase per state, for the arms that REPORT rather than
          # rule. The UNKNOWN wording never implies the budget was not reached.
          case "$budget_reached" in
            yes) budget_phrase="which IS its full ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            no)  budget_phrase="short of its ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            *)   budget_phrase="against a ${JOB_TIMEOUT_MINUTES}-minute budget whose expiry could NOT be checked" ;;
          esac

          # --- Arm 2: the job budget expired while an apt step was still
          # running. Requires THREE facts. The `cancelled` guard is the one
          # arm 3 already carried and this arm was missing: a JOB_STATUS of
          # `failure` with an apt step mid-flight past the budget floor is NOT
          # a job timeout, and this text ("GitHub concludes a job timeout as
          # 'cancelled'") would be describing a mechanism that did not fire.
          # That state belongs to arm 2b, which names the real conclusion.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$apt_running" ] && [ "$budget_reached" = "yes" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::The ${JOB_TIMEOUT_MINUTES}-minute job budget expired after ${elapsed_min} min while step(s) '$apt_running' were STILL RUNNING. $why GitHub concludes a job timeout as 'cancelled', which 'gh pr checks' renders as 'fail' with zero failing steps - that rendering is what makes this look like your test failure. It is not. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2b: the job did NOT conclude `cancelled`, yet an apt step
          # was left mid-flight. A step-level `timeout-minutes` expiry is the
          # primary mechanism this change introduces, and which of the two job
          # conclusions GitHub surfaces for it is NOT something this change
          # established. So handle both: under `cancelled` semantics arms 1/2
          # cover it, and under `failure` semantics this arm does. Betting on
          # one and printing "cancelled from outside" under the other would be
          # flatly false about the mechanism we just added.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -n "$apt_running" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_running' were interrupted mid-flight (step outcome 'cancelled') and this job concluded '$JOB_STATUS'. $why Nothing here is a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2c: cancelled with an apt step mid-flight, but arm 2's
          # budget test did not fire. Two sub-cases, and NEITHER licenses
          # ruling the stall out: an apt step really was running when this job
          # died.
          if [ -n "$apt_running" ]; then
            if [ -z "$elapsed_min" ]; then
              echo "::warning title=Cannot rule the apt stall in or out::Step(s) '$apt_running' were still mid-flight when this job was cancelled, but this run's elapsed time could NOT be read - the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so the known apt-mirror stall can be NEITHER confirmed NOR ruled out here. Nothing here is a verdict on the code in this change. $ref"
            else
              echo "::warning title=Cancelled with an apt step mid-flight::Step(s) '$apt_running' were still mid-flight when this job was cancelled after ${elapsed_min} min - well short of its ${JOB_TIMEOUT_MINUTES}-minute budget, which points at an external cancel ($EXTERNAL_CANCEL_NOTE) rather than the apt-mirror stall. But an apt step was genuinely running, so this does not rule the stall out either. Nothing here is a verdict on the code in this change. $ref"
            fi
            exit 0
          fi

          # --- Arm 2d: cancelled AT OR PAST its budget, with NO apt step
          # implicated at all. The job exhausted its OWN budget running its OWN
          # work -- a job timeout. This is the FOURTH cause of `cancelled`, and
          # the one this step's header taxonomy omitted: not the apt stall, not
          # a merge-train reap, not an external cancel. Without this arm the
          # state fell through to arm 3, which reported it as "cancelled from
          # outside" -- how a producer that timed out on nearly every main push
          # for days was read as a benign supersede every single time.
          #
          # Guarded on `soft_failed` being empty for the same reason every other
          # ruling arm is: a soft-failed apt step can have red this job through
          # the cascade, and this arm asserts a positive cause. When one is
          # present, arm 3a speaks instead and hedges.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "yes" ] && [ -z "$soft_failed" ]; then
            if [ "$apt_rows_seen" -gt 0 ]; then
              echo "::error title=Job budget exhausted - a TIMEOUT, not an external cancel::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, and GitHub cancelled it when that budget expired. No apt-dependent step failed, none was mid-flight, and none soft-failed - so this is NOT the apt-mirror stall, and NOT an external cancel either (a reap or a manual cancel lands at an arbitrary, typically far earlier, elapsed). The job's own work did not fit its budget. A job timeout concludes as 'cancelled' with ZERO failing steps, which 'gh pr checks' renders as 'fail' - that rendering is what makes this look like a test failure. It is not a verdict on the diff. But re-running WITHOUT raising the budget will most likely time out again: raise the budget, or make the work fit it. $ref_budget"
            else
              echo "::warning title=Job budget exhausted, but the apt telemetry was EMPTY::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, so the budget WAS reached and a job timeout is the leading explanation. But APT_STEP_OUTCOMES parsed to ZERO rows - a step id was renamed or removed, so the expression rendered empty - which makes 'no apt-dependent step failed' an absence of DATA here, not an observation. The apt-mirror stall therefore can NOT be ruled out, and this arm will not assert a cause from telemetry it did not receive. Fix the step-id reference so the next run can rule. $ref_budget $ref"
            fi
            exit 0
          fi

          # --- Arm 3a: cancelled, nothing mid-flight, but an apt step
          # SOFT-failed. Arm 3's "No apt-dependent step failed" would be
          # flatly false here - one demonstrably did - so arm 3 does not get
          # to speak for this state.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=Cancelled, and a soft-failed apt step may have red this job downstream::This job was cancelled after ${elapsed_min:-an unknown number of} min, $budget_phrase. No apt-dependent step was mid-flight, but step(s) '$soft_failed' soft-failed ('continue-on-error: true'), so the apt-mirror stall can NOT be ruled out here, and steps that needed what they install may have failed as a consequence. Note the budget reading above: where it says the budget WAS reached, a plain job timeout is also live as a cause, and these two cannot be separated while a soft-failed apt step is in play. A cancelled run also reports no test results at all, so nothing here is a verdict on the code under test either way. $ref"
            exit 0
          fi

          # --- Arm 3: cancelled, no apt step red the job, none was mid-flight,
          # none soft-failed, and the elapsed time is KNOWN and SHORT of the
          # budget. The stall is ruled out by the step outcomes (a positive
          # fact) and a job timeout is ruled out by the measurement, so an
          # external cancel is what is left. Explicitly decline to judge the
          # diff either way.
          #
          # The `budget_reached = "no"` guard is this arm's whole correction.
          # It used to fire on ANY cancelled job, so it claimed an external
          # cancel for job timeouts too -- while printing the very elapsed
          # figure that refuted it.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "no" ]; then
            echo "::notice title=Run cancelled externally - NOT a verdict on this diff::This job was cancelled after ${elapsed_min} min, $budget_phrase. No apt-dependent step failed and none was mid-flight, so this was NOT the known apt-mirror stall; and it did not reach its own budget, so it was NOT a job timeout. It was cancelled from outside: $EXTERNAL_CANCEL_NOTE. A cancelled run reports no test results at all, so nothing here says anything about the code under test: do not read it as a failure of this change, and do not read it as a pass either. Re-run if you need a verdict."
            exit 0
          fi

          # --- Arm 3b: cancelled, nothing implicated, and the elapsed time
          # could NOT be read. A job timeout and an external cancel are
          # indistinguishable without that measurement, so say so instead of
          # picking one. This is the branch arm 3 used to swallow: it asserted
          # an external cancel from a number it did not have.
          if [ "$JOB_STATUS" = "cancelled" ]; then
            echo "::warning title=Cancelled - a timeout cannot be told from an external cancel::This job was cancelled, but this run's elapsed time could NOT be read: the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so a job-budget TIMEOUT and an external cancel ($EXTERNAL_CANCEL_NOTE) can NOT be told apart here. That is UNKNOWN - it is specifically NOT evidence of an external cancel. No apt-dependent step failed and none was mid-flight, so the apt-mirror stall IS ruled out, by the step outcomes rather than by any measurement. A cancelled run reports no test results at all, so nothing here speaks to the code under test. $ref"
            exit 0
          fi

          # --- Unreachable under `if: cancelled() || failure()`: every
          # non-cancelled path above has already returned. Kept so an unforeseen
          # state says what it knows instead of falling through silently.
          echo "::notice title=No infrastructure verdict::Job status '$JOB_STATUS', no apt-dependent step red the job, none mid-flight. This marker has nothing to add about the code under test. $ref"

  # ONE export for the whole run, after every shard has concluded.
  #
  # `!cancelled()` and NOT the default `success()`: a shard whose TESTS failed
  # concludes `failure`, which under `success()` would skip this job and export
  # nothing -- the defect the unsharded export step's `if:` was added to fix
  # (verified 2026-09-20 on runs 35528617045 and 35520123562: suite failure,
  # export `skipped`). Serializing the workflow (see `concurrency` above) lets
  # runs CONCLUDE; this `if:` is what makes a concluding-but-red run export.
  #
  # A failing test still has coverage contexts, and a red-but-complete map is
  # real signal: coord's reader unions the freshest row PER TEST
  # (`edit_effects::read_test_coverage_context`), so tests missing from one run
  # keep their last-known rows rather than being erased.
  #
  # What `!cancelled()` does NOT decide is whether a shard was cancelled: a
  # shard that hit its own job timeout concludes `cancelled` while the RUN is
  # not, so this job can still start. That case is the completeness check's
  # job, below, and it does not depend on how GitHub folds six shard
  # conclusions into `needs.produce.result` -- it counts the files. (If GitHub
  # instead skips this job for a cancelled need, the outcome is the same: no
  # export.)
  export:
    name: Per-test coverage -> coord
    needs: produce
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Download six small artifacts, one pip install, a combine and two POSTs:
    # minutes, not tens of them. Bounded because every job here declares a
    # budget it chose rather than inheriting GitHub's 360-minute default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    env:
      # The `produce` matrix length. Pinned equal to it (and to the select
      # step's `--shards`) by backend/tests/test_pytest_shard_split.py: a
      # count that disagreed with the matrix would either never export or
      # export a map missing a shard.
      EXPECTED_SHARDS: '6'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `continue-on-error`: a run whose shards were ALL cancelled or failed in
      # setup uploaded nothing, and the download then has nothing to fetch. The
      # completeness check below is what says so; this step reding first would
      # only hide that sentence behind a less specific one.
      - name: Download the shards' coverage data and junit results
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: coverage-producer-shard-*
          path: shard-artifacts

      # The run-level form of "a cancelled run exports nothing". Every shard
      # must have delivered BOTH its coverage data file and its JUnit file;
      # a shard that was cancelled (its upload is `!cancelled()`) or that died
      # before pytest wrote them (its upload is `if-no-files-found: error`)
      # leaves a hole, and a map with a hole published under this head would
      # read as the whole suite's. So any hole means: export NOTHING, and say
      # which shards were missing. Not a failure of this job -- coord keeps its
      # last-known rows, exactly as it did for a cancelled unsharded run.
      #
      # `needs.produce.result` is read too, as a second, stricter guard: a
      # `cancelled` aggregate refuses even if every file somehow arrived.
      - name: Check every shard delivered its slice
        id: complete
        env:
          PRODUCE_RESULT: ${{ needs.produce.result }}
        run: |
          set -uo pipefail
          root="$GITHUB_WORKSPACE/shard-artifacts"
          missing=""
          : > shard-coverage-files.txt
          : > shard-junit-files.txt
          for n in $(seq 1 "$EXPECTED_SHARDS"); do
            dir="$root/coverage-producer-shard-$n"
            if [ -s "$dir/coverage-data-shard-$n" ] && [ -s "$dir/junit-results-shard-$n.xml" ]; then
              echo "$dir/coverage-data-shard-$n" >> shard-coverage-files.txt
              echo "$dir/junit-results-shard-$n.xml" >> shard-junit-files.txt
            else
              missing="${missing:+$missing, }$n"
            fi
          done
          echo "produce matrix result: ${PRODUCE_RESULT}; shards expected: ${EXPECTED_SHARDS}; missing: ${missing:-none}"
          if [ -n "$missing" ]; then
            echo "::warning title=Coverage export SKIPPED - the map would be partial::Shard(s) ${missing} of ${EXPECTED_SHARDS} delivered no coverage data and/or junit file (cancelled, timed out, or failed before pytest wrote them), so this run exports NOTHING rather than publishing a partial map as if it were the whole suite. coord keeps its last-known rows for every test. Read each missing shard's own budget/cancel marker for why."
            echo "export=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PRODUCE_RESULT" = "cancelled" ]; then
            echo "::warning title=Coverage export SKIPPED - a shard was cancelled::Every shard's files arrived, but the produce matrix concluded 'cancelled', so at least one shard did not finish cleanly. Exporting nothing rather than trusting a slice whose job was cancelled."
            echo "export=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "export=true" >> "$GITHUB_OUTPUT"

      # Same coverage.py as the shards wrote with: a db written by one coverage
      # version is combined by that version, so the pin tracks backend's
      # poetry.lock (asserted by backend/tests/test_pytest_shard_split.py). Only
      # coverage is installed -- the combine needs nothing from the app's
      # dependency tree, and the export script is stdlib only.
      - name: Combine the shards' coverage data
        if: steps.complete.outputs.export == 'true'
        run: |
          python -m pip install --disable-pip-version-check 'coverage==7.14.0'
          mapfile -t COVERAGE_FILES < shard-coverage-files.txt
          python -m coverage combine --keep --data-file=.coverage "${COVERAGE_FILES[@]}"

      # Per-test -> touched-file coverage producer. Best-effort (the script
      # exits 0 on any failure), so it cannot fail this lane even when coord is
      # unreachable. The `--cov-context=test` flag on every shard makes
      # coverage.py record which test touched each line; this step reads the
      # combined .coverage SQLite db and POSTs the observations, then merges the
      # shards' JUnit files into ONE results batch and POSTs that.
      - name: Export per-test coverage to coord (best-effort)
        if: steps.complete.outputs.export == 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
          # COORD_HTTP_URL defaults to https://coord.qontinui.io inside the
          # script; override here only if a non-prod coord is targeted.
        run: |
          # Prove the extractor's own correctness on every run before trusting
          # it against the real db (fast, no network).
          python scripts/export_test_coverage.py --self-test
          # Only main's heads are mapped. A `workflow_dispatch` from a branch
          # (how a change to this file is proven before it lands) runs every
          # shard, the completeness check and the combine, but must not POST a
          # branch head's map into coord beside main's.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice title=Export skipped off main::This run is on ${GITHUB_REF}, not refs/heads/main, so the combined map was built and checked but NOT posted to coord."
            exit 0
          fi
          junit_args=()
          while IFS= read -r f; do junit_args+=(--junit-xml "$f"); done < shard-junit-files.txt
          python scripts/export_test_coverage.py \
            --coverage-db .coverage \
            "${junit_args[@]}"
