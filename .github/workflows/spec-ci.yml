name: Spec CI

# Spec CI replaces Playwright E2E as the on-PR merge gate. Playwright E2E
# (e2e-tests.yml, frontend-tests) runs on main/develop pushes and nightly —
# not on PRs and not on coord's merge-candidate* candidate refs, both of
# which are gated by Spec CI + the backend E2E job instead.
#
# HERMETIC since 2026-06-04: the entire stack — Postgres, Redis, the FastAPI
# backend, a run-local token issuer — boots inside this job. The previous
# posture crawled the LIVE prod API (api.qontinui.io), so any prod 502/timeout
# blip red'd this required check (~1-in-3 during blips; see
# plans/2026-06-03-unbypassable-autonomous-merge-gates.md Phase 2b: a required
# check must depend only on inputs the PR author controls). `--include-write`
# transitions also wrote to prod as ci-bot; hermetically they write to the
# throwaway CI database. Real-Cognito + real-prod integration stays covered
# post-deploy by verify-frontend-deploy.yml's public + authed smokes.
#
# Pipeline:
#   1. Boot Postgres (pgvector) + Redis services; install backend deps;
#      `alembic upgrade heads` (real schema, byte-identical to prod's chain).
#   2. Mint a run-local RS256 id token + JWKS (scripts/spec_ci_local_idp.py),
#      serve the JWKS via `python -m http.server`, and point the backend's
#      COGNITO_ISSUER at it — the backend verifies the token through its REAL
#      verifier (signature/iss/aud/exp) and JIT-provisions the ci-bot user
#      (app/services/cognito_provision.py). No auth code is stubbed.
#   3. Boot the FastAPI backend (uvicorn) against the CI database.
#   4. Install deps + build the frontend; `next start` with BACKEND_URL
#      pointing at the local backend.
#   5. Run the Playwright-driven Spec-CI executor against every IR spec under
#      `frontend/specs/pages/`. The executor seeds the injected token as the
#      auth cookie, then for each spec navigates to its route, injects the
#      IR, drives transitions via ui-bridge-auto's in-browser executor, and
#      records pass/fail. Specs are authored against an EMPTY account
#      (structure + empty states), so the fresh CI database matches their
#      authored baseline by construction.
#   6. Gate: fail iff minMatchRate < 0.8 OR transitionPassRate < 1.0
#      OR any spec errored.
#
# Why not run the qontinui-runner in CI? Spec-CI's only dependency on the
# runner in dev is the multi-tenant Spec API for file storage; in CI the
# IR specs are in the repo and ui-bridge-auto runs natively in the
# browser. Skipping the runner removes the Tauri+xvfb burden.
#
# No `concurrency:` block: the old serialization existed only because runs
# shared the rate-limited (10/min) ci-bot auth endpoint. Hermetic runs share
# nothing — they can overlap freely.

on:
  pull_request:
    branches: [main, develop]
  push:
    # merge-candidate/** refs are pushed by coord's autonomous merge scheduler
    # (plan 2026-06-06-coord-ci-runner-autonomous-green-merge, Phase 4). Spec CI
    # is a required merge gate, so it must run on candidate refs or the proposal
    # hangs in awaiting-ci. Validation-only (hermetic stack); no deploy.
    branches:
      - main
      - develop
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  workflow_dispatch:

jobs:
  spec-ci:
    name: Spec CI
    runs-on: ubuntu-latest
    # 25 → 35 on hermeticization: the job now also installs backend deps and
    # boots PG/Redis/uvicorn (~5-8 min). No torch in requirements.txt — the
    # heavy-ML disk concerns from backend-ci's poetry path don't apply here.
    timeout-minutes: 35

    services:
      postgres:
        # pgvector-bundled PG16 — same image backend-ci uses; alembic
        # migrations materialize Vector columns and need the extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Path A (same-origin): the browser uses RELATIVE API URLs (empty
      # NEXT_PUBLIC_API_URL) so calls hit the Next.js /api proxy on
      # localhost:3001 — keeping auth cookies same-origin. The proxy forwards
      # to the run-local backend via the server-only BACKEND_URL.
      NEXT_PUBLIC_API_URL: ""
      BACKEND_URL: http://localhost:8000
      QONTINUI_API_BASE_URL: http://localhost:8000
      # Shared by the migrate/boot steps below. Plain-postgres scheme; the
      # backend + alembic env handle async-driver conversion (same contract
      # as e2e-tests.yml's frontend-tests job).
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      SECRET_KEY: spec-ci-secret-key-for-ci-only-minimum-32-chars-long
      ENVIRONMENT: development
      STORAGE_BACKEND: local
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      # Run-local token issuer (hermetic auth). The backend's Cognito
      # verifier trusts whatever issuer is configured and fetches
      # <issuer>/.well-known/jwks.json — both run on this VM. The
      # spec_ci_local_idp.py step below mints QONTINUI_TEST_ID_TOKEN
      # against this issuer; run-spec-ci.ts seeds it as the auth cookie.
      COGNITO_USER_POOL_ID: spec-ci-local-pool
      COGNITO_ISSUER: http://127.0.0.1:8770
      COGNITO_ALLOWED_AUDIENCES: spec-ci-local
      # Gates SpecCiInit's window-exposure to Spec-CI runs only. Production
      # builds (no env var set) get nothing on window.__qontinuiSpecCi__.
      NEXT_PUBLIC_ENABLE_SPEC_CI: "1"
      # Build-time flag: mounts the in-browser CommandRelayListener in the
      # prod `next start` bundle so /control/* actions dispatch in-process.
      # Required for transition specs to execute element actions; no-op for
      # the current structural (transition-free) specs.
      NEXT_PUBLIC_UI_BRIDGE_REMOTE_COMMANDS: "1"

    steps:
      - name: Checkout qontinui-web
        uses: actions/checkout@v5

      # ── Backend stack (hermetic) ─────────────────────────────────────────

      # backend/pyproject.toml has path deps on ../../qontinui-schemas and
      # ../../qontinui; qontinui-cloud-control is installed editable. Same
      # clone set as e2e-tests.yml's backend-tests job.
      - name: Clone backend Python sibling deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for spec in \
            "qontinui/qontinui-schemas" \
            "qontinui/qontinui" \
            "qontinui/qontinui-cloud-control" \
          ; do
            repo_name="${spec#*/}"
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${spec}.git" \
              "../${repo_name}"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Mirrors e2e-tests.yml's backend-tests install verbatim — including
      # the no-cache-dir editable schemas install (pip's wheel cache
      # otherwise DOWNGRADES schemas to a stale cached version) and
      # `--no-deps` on the backend itself (prevents re-resolving the
      # editable schemas we just installed).
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-cache-dir -e ../../qontinui-schemas
          if [ -f pyproject.toml ]; then pip install -e . --no-deps; fi
          pip install -e ../../qontinui-cloud-control

      - name: Install postgresql-client
        id: apt_psql
        # ONLY the apt-get call lives in this step, and it is the entire reason
        # for the bound: it reaches an external mirror at job time and is the
        # same unbounded-stall exposure as the Playwright step (plan
        # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure).
        # The psql/DDL that used to share this step now runs UNBOUNDED below.
        # It HAD to move: under `bash -e` a psql failure set this step's
        # `.outcome` to `failure` exactly like an apt timeout, so the
        # infrastructure marker could not tell a mirror stall from the author's
        # own schema breaking -- and told them their breakage was infrastructure.
        # The `command -v psql` guard means apt normally never runs at all on
        # `ubuntu-latest`, which ships psql. That is exactly why the DDL could
        # not stay here: an arm keyed on this step's failure would have been
        # describing a call that did not happen.
        # Measured apt+psql across green runs of all 7 sites: p50 0-16s, p90
        # <=91s, max 106s (migration-reversal). The bound now covers apt ALONE,
        # so 5 min is p90 + ~3.5 min of headroom over a strictly smaller job.
        timeout-minutes: 5
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      # Some alembic migrations reference the `runner` schema, created in dev
      # by init-scripts/ which service containers don't run. Same carve-out
      # as e2e-tests.yml.
      - name: Create runner schema
        # Deliberately UNBOUNDED and deliberately WITHOUT an `id:`. This is
        # psql/DDL against this job's own postgres service, not the external
        # mirror, so a failure here IS a verdict on the change -- it must never
        # reach the infrastructure marker's APT_STEP_OUTCOMES.
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U test_user -d test_db -c "CREATE SCHEMA IF NOT EXISTS runner;"

      # LOAD-BEARING BACKSTOP — do NOT add a `paths:` filter or a job-level `if:`
      # that would stop this from running on every PR. migration-reversal.yml's
      # head guard treats a non-zero `alembic heads` as skip-and-pass (a stacked
      # PR whose down_revision lives on an unlanded parent is the chain-
      # consolidation gate's problem, not a reversibility problem). That guard is
      # deliberately NOT narrowed by matching alembic's error prose, because a
      # wording change upstream would turn it into a false red on exactly the PRs
      # it exists to let through. The classes it therefore does not catch —
      # migration SyntaxError/ImportError, graph cycles, duplicate revision ids —
      # are caught HERE instead. Filtering this step un-backstops that decision.
      - name: Run database migrations
        working-directory: ./backend
        run: alembic upgrade heads

      # Run-local token issuer: generate an ephemeral RSA keypair + JWKS,
      # serve the JWKS at COGNITO_ISSUER, and mint the ci-bot id token the
      # executor will seed as its auth cookie. The backend JIT-provisions
      # the ci-bot auth.users row on the token's first authenticated request
      # — no user seeding step needed.
      - name: Mint local id token + serve JWKS
        working-directory: ./backend
        run: |
          set -euo pipefail
          TOKEN=$(python scripts/spec_ci_local_idp.py \
            --issuer "$COGNITO_ISSUER" \
            --audience spec-ci-local \
            --email spec-ci-bot@no-reply.qontinui.io \
            --out-dir /tmp/spec-ci-idp)
          echo "QONTINUI_TEST_ID_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          (cd /tmp/spec-ci-idp && python -m http.server 8770 --bind 127.0.0.1 > /tmp/idp.log 2>&1 &)
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8770/.well-known/jwks.json > /dev/null; then
              echo "local JWKS up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8770/.well-known/jwks.json > /dev/null

      - name: Start backend (uvicorn)
        working-directory: ./backend
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health | grep -q "^200$"; then
              echo "backend up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -s -o /dev/null -w "backend status: %{http_code}\n" http://127.0.0.1:8000/health

      # Mirror prod ci-bot's privileges: the admin-surface specs (/admin,
      # /admin/region-analysis, /admin/coord/agents/…) are superuser-gated
      # (admin/architecture/page.tsx + admin/region-analysis/page.tsx redirect
      # non-superusers) and were authored against the superuser ci-bot. The
      # curl JIT-provisions the auth.users row (+ personal org) through the
      # real token path; the UPDATE then elevates it. Deliberately a DB-side
      # step, NOT a token claim — a token must never be able to grant
      # superuser (cognito_provision.py hardcodes is_superuser=False).
      - name: Provision + elevate ci-bot (superuser parity with prod)
        env:
          PGPASSWORD: test_password
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $QONTINUI_TEST_ID_TOKEN" \
            http://127.0.0.1:8000/api/v1/auth/users/me > /dev/null
          psql -h localhost -U test_user -d test_db -c \
            "UPDATE auth.users SET is_superuser = true WHERE email = 'spec-ci-bot@no-reply.qontinui.io';"

      # ── Frontend ─────────────────────────────────────────────────────────

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # @qontinui/* packages (shared-types, ui-bridge, ui-bridge-auto,
      # design-tokens, navigation, workflow-utils, workflow-ui) are
      # published to npm — frontend/package.json declares them with
      # version ranges, not link: paths. No sibling clone needed; npm
      # pulls published artifacts. The dev-link overlay
      # (qontinui-claude-config/scripts/dev-link.ps1) is dev-only.
      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      # `npx playwright install --with-deps <engines>` was THREE things fused
      # into one step: npx resolution, a browser-bundle download from
      # cdn.playwright.dev, and `apt-get`. Only the apt part has ever hung, so
      # the fusion made the infrastructure marker's headline ("CI
      # infrastructure timeout - NOT your diff") false for the other two: an
      # author who bumped `@playwright/test` to a version whose bundle 404s on
      # the CDN would have been told the Ubuntu mirror did it. Split, exactly
      # as the postgresql-client sites were (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 3):
      #
      #   * `install-deps` = the APT half. Measured on healthy run 32264215960:
      #     all 26 Playwright system libraries report `is already the newest
      #     version`, and apt's own verdict is `0 upgraded, 9 newly installed`
      #     -- 9 FONT packages, `Need to get 21.1 MB of archives`. That 21.1 MB
      #     is the entire exposure; hung run 32289431023 crawled through it at
      #     ~0.7 kB/s for 38 minutes against azure.archive.ubuntu.com.
      #   * `install` = the CDN half. cdn.playwright.dev, a different host,
      #     EXONERATED by the logs: neither hung run ever reached it.
      #
      # Only the apt half carries `id: apt_playwright`, so only the apt half is
      # in APT_STEP_OUTCOMES and only it can ever be named as infrastructure.
      #
      # The order is preserved from `--with-deps`, not chosen: playwright-core's
      # `installBrowsers()` calls `registry.installDeps()` BEFORE
      # `registry.install()`, and `install-deps <engines>` feeds the same
      # `registry.resolveBrowsers()` result to the same `registry.installDeps()`
      # -- so the apt package list is identical to what `--with-deps` computed.

      # Phase 3's remedy: keep the 21.1 MB of font .debs across runs so a
      # healthy run does not re-fetch them from the mirror at all.
      #
      # WHAT IS CACHED: the .deb archives apt downloads, and nothing else. The
      # package SET is untouched -- `install-deps` still resolves and installs
      # exactly the same packages; apt simply finds their .debs already in
      # /var/cache/apt/archives and skips the download. Behaviour-preserving is
      # the whole point of choosing a cache over narrowing the font list: this
      # is a visual/OCR crawl, and dropping CJK/Unicode coverage would change
      # rendered text (tofu boxes) in a way nothing here would catch.
      #
      # WHAT IS *NOT* REMOVED: `install-deps` still runs `apt-get update`
      # first, unconditionally, so the index refresh remains an exposure -- and
      # hung run 32294962345 stalled in exactly that phase. The cache removes
      # the 21.1 MB download half; `timeout-minutes` on the apt step below is
      # what bounds the other half. Caching the package INDEX as well was
      # rejected: a stale index against a rotated pool turns a slow run into a
      # hard 404, i.e. it trades a bounded delay for a break.
      #
      # NOT CACHED HERE: the browser bundles under ~/.cache/ms-playwright.
      # Different host, different failure mode, not implicated in any observed
      # hang. If that is ever worth caching it gets its OWN cache entry --
      # sharing this one would couple a CDN problem back onto the apt key this
      # split exists to isolate.

      # The cache key must move whenever the package set can, and must NOT move
      # otherwise. Two inputs are in it:
      #   * `ImageOS` (e.g. `ubuntu24`) -- the Ubuntu release, which fixes both
      #     the package names and the pool the .debs come from;
      #   * the @playwright/test version -- it selects the dependency list, so
      #     a bump can add or drop packages.
      # `ImageVersion` (the weekly image build) is deliberately NOT in the key.
      # A newer image can only ever have MORE of these packages preinstalled,
      # which makes a cached set a harmless superset, so keying on it would
      # force a full re-download every week for no correctness gain. Staleness
      # is bounded by apt itself: it validates every cached .deb against the
      # live index and re-downloads any that no longer match.
      - name: Resolve Playwright apt cache key
        id: pw_cache_key
        working-directory: ./frontend
        run: |
          set -uo pipefail
          pw="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version" 2>/dev/null || true)"
          if [ -z "$pw" ]; then
            # The lockfile shape changed. Fall back to a digest of the whole
            # lock: over-keyed (any dependency bump misses) but never STALE,
            # which is the property that matters. Never fail the job over a
            # cache key -- this step is not in APT_STEP_OUTCOMES, so a red here
            # would be reported to the author as their own diff.
            pw="lock$(sha256sum package-lock.json | cut -c1-12)"
            echo "::notice::Could not read @playwright/test from package-lock.json; keying the Playwright apt cache on the whole lockfile digest instead."
          fi
          img="${ImageOS:-unknown}"
          echo "key=apt-playwright-${RUNNER_OS:-Linux}-${img}-pw${pw}${KEY_SUFFIX:-}" >> "$GITHUB_OUTPUT"
          echo "restore_prefix=apt-playwright-${RUNNER_OS:-Linux}-${img}-" >> "$GITHUB_OUTPUT"
          echo "Playwright $pw on image $img${KEY_SUFFIX:-}"

      - name: Restore Playwright apt font cache
        id: apt_playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/qontinui-apt-playwright
          key: ${{ steps.pw_cache_key.outputs.key }}
          # A prefix hit restores an older .deb set. That is safe by
          # construction: apt validates every cached .deb against the index and
          # downloads the ones that no longer match, so a partial hit is a
          # partial saving, never a wrong install.
          #
          # The step output is `restore_prefix`, not `restore-prefix`: GitHub's
          # expression parser reads `-` as subtraction, so a hyphenated output
          # name cannot be dereferenced with dot syntax at all.
          restore-keys: |
            ${{ steps.pw_cache_key.outputs.restore_prefix }}

      # /var/cache/apt/archives is root-owned and actions/cache runs as the
      # unprivileged `runner` user, so it can neither read nor write that dir
      # directly. `sudo cp` is what moves .debs across the privilege boundary.
      # This step touches local disk only -- no network, nothing to stall - so
      # it is deliberately unbounded and deliberately has no `id:`.
      - name: Seed apt archives from cache
        run: |
          set -uo pipefail
          cache_dir="$HOME/.cache/qontinui-apt-playwright"
          n=0
          if [ -d "$cache_dir" ]; then
            n=$(find "$cache_dir" -maxdepth 1 -name '*.deb' | wc -l)
          fi
          if [ "$n" -gt 0 ]; then
            # `-n` never clobbers a .deb the image already had, which could be
            # newer than the cached one.
            sudo cp -n "$cache_dir"/*.deb /var/cache/apt/archives/ || true
            echo "Seeded $n cached .deb(s) into /var/cache/apt/archives."
          else
            echo "No cached .deb archives - this run fetches them from the mirror. A MISS is slower, never broken."
          fi

      - name: Install Playwright Chromium system deps (apt)
        id: apt_playwright
        # Sized from a per-half measurement, not from the fused step: each green
        # run's log was cut at the boundary between apt's last output line and the
        # first `Downloading ` CDN banner, and the parsed halves were cross-checked
        # against the jobs API step times to +/-1s.
        #
        # The apt half over 16 green Spec CI runs (2026-08-18 -> 08-20):
        # p50 12.7s, p90 88.2s, max 205.4s (run 32250167820, whose log reads
        # `Fetched 21.1 MB in 2min 47s (126 kB/s)` - a degraded mirror that
        # happened to finish).
        #
        # 7, not the fused step's 5. That 5 was sized against an older 12-run
        # sample whose max was 47s; this 16-run window says the max is 205s, so
        # 5 min would have been only 1.5x the worst observed SUCCESS - inside
        # the range where a bound becomes a new flake source (the plan's own
        # Risk 3). 7 min is 2.0x that max and p90 + ~5.5 min, and it still
        # converts the observed 33-minute stall into a 7-minute failure well
        # inside this job's 35-minute budget.
        #
        # These are PRE-cache numbers. With the font .debs restored, a healthy run
        # should collapse toward the `apt-get update`-only floor, so the bound is
        # conservative by construction - it is sized for the MISS.
        timeout-minutes: 7
        working-directory: ./frontend
        run: npx playwright install-deps chromium

      # Hand whatever apt downloaded back across the privilege boundary so the
      # actions/cache post-step (unprivileged) can save it. Local disk only, so
      # unbounded and without an `id:`, same as the seed step. Every command is
      # `|| true`: a cache-staging problem must never red a job, and must never
      # be mistaken for the apt failure this plan exists to report accurately.
      - name: Stage apt archives for cache
        run: |
          set -uo pipefail
          cache_dir="$HOME/.cache/qontinui-apt-playwright"
          mkdir -p "$cache_dir"
          sudo cp -f /var/cache/apt/archives/*.deb "$cache_dir"/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$cache_dir" || true
          echo "$(find "$cache_dir" -maxdepth 1 -name '*.deb' | wc -l) .deb(s) staged for the cache."

      # Playwright's browser binaries aren't part of the npm install.
      # Install Chromium only — the spec-ci executor doesn't need
      # Firefox/WebKit.
      - name: Install Playwright Chromium (CDN)
        # The CDN half over the same 16 runs: p50 9.2s, p90 10.1s, max 10.5s.
        # 2 min is ~11x the observed max. Across all 178 halves measured for
        # this split the CDN maximum ANYWHERE was 38.7s, which is what
        # exonerates cdn.playwright.dev as a stall site - the whole tail lives
        # in the apt half.
        timeout-minutes: 2
        working-directory: ./frontend
        run: npx playwright install chromium

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # `next start` serves the production build — faster + more representative
      # of the user-facing app than `next dev`. The background-task pattern
      # mirrors what backend-tests.yml does for the FastAPI server.
      - name: Start frontend (next start)
        working-directory: ./frontend
        run: |
          npx next start -p 3001 -H 0.0.0.0 > frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login | grep -qE "^(200|307)$"; then
              echo "frontend up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -s -o /dev/null -w "frontend status: %{http_code}\n" http://localhost:3001/login

      - name: Run Spec CI
        working-directory: ./frontend
        # GH_TOKEN lets the Phase 0 flake-diagnostics take a `gh run list
        # --status in_progress` snapshot at run start (overlapping Spec CI runs
        # — the H1/H2 concurrency signal). Best-effort: if gh/token is absent
        # the snapshot degrades to available:false and the run is unaffected.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx tsx tests/spec-ci/run-spec-ci.ts \
            --base-url http://localhost:3001 \
            --api-base http://localhost:8000 \
            --include-write \
            --output spec-ci-report.json

      - name: Tear down frontend + backend
        if: always()
        run: |
          if [ -n "${FRONTEND_PID:-}" ]; then
            kill "$FRONTEND_PID" 2>/dev/null || true
          fi
          if [ -n "${BACKEND_PID:-}" ]; then
            kill "$BACKEND_PID" 2>/dev/null || true
          fi

      - name: Upload Spec CI report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: spec-ci-report
          path: frontend/spec-ci-report.json
          retention-days: 30

      - name: Upload frontend + backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: stack-logs
          path: |
            frontend/frontend.log
            backend/backend.log
          retention-days: 7

      # Summarize for the PR check page.
      - name: Summarize
        if: always()
        run: |
          if [ -f frontend/spec-ci-report.json ]; then
            echo "## Spec CI Summary" >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              "- specs: \(.specCount)",
              "- full_match: \(.summary.fullMatch)",
              "- partial_match: \(.summary.partialMatch)",
              "- no_match: \(.summary.noMatch)",
              "- error: \(.summary.error)",
              "- minMatchRate: \(.summary.minMatchRate)",
              "- meanMatchRate: \(.summary.meanMatchRate)",
              "- transitionPassRate: \(.summary.transitionPassRate)",
              "- consoleErrors: \(.summary.consoleErrors.total)",
              "- serverErrors: \(.summary.serverErrors.total)",
              "- apiAssertionPassRate: \(.summary.apiAssertionPassRate)",
              "- crawl: \(.crawl.visited) routes visited, \(.crawl.gatingFindings) gating findings (passRate \(.crawl.passRate))\(if .crawl.sessionLost then " — SESSION-LOST mid-crawl (\(.crawl.sessionLostRoutes) routes bounced to /login; environmental auth/rate-limit, re-run)" else "" end)",
              "- diagnostics (Phase 0): \(.diagnostics.totalResponses) responses, \(.diagnostics.notableResponses | length) notable (5xx/4xx-not-401), auth{login=\(.diagnostics.auth.loginAttempts) refresh=\(.diagnostics.auth.refreshRotations) 429=\(.diagnostics.auth.authEndpoint429s)}, concurrency \(if .diagnostics.concurrencyAtStart.available then "\(.diagnostics.concurrencyAtStart.inProgressRuns | length) overlapping run(s)" else "unavailable (\(.diagnostics.concurrencyAtStart.reason))" end), runId \(.diagnostics.run.githubRunId) attempt \(.diagnostics.run.githubRunAttempt)"
            ' frontend/spec-ci-report.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Notable responses (Phase 0 diagnostics — same-origin 5xx / 4xx-not-401):" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.diagnostics.notableResponses[]? | "- [\(.method) \(.status)] \(.url)\(if (.headers["x-amzn-trace-id"] // "") != "" then " trace=\(.headers["x-amzn-trace-id"])" else "" end)"' frontend/spec-ci-report.json >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Failing specs:" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.specs[] | select(.matchOutcome != "full_match") | "- \(.specId) (\(.matchOutcome), matchRate=\(.matchRate))"' frontend/spec-ci-report.json >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Specs with critical console errors:" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.specs[] | select((.consoleErrors // []) | length > 0) | .specId as $s | .consoleErrors[] | "- \($s) [\(.level)] \(.text)"' frontend/spec-ci-report.json >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Specs with same-origin HTTP-5xx:" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.specs[] | select((.serverErrors // []) | length > 0) | .specId as $s | .serverErrors[] | "- \($s) [\(.method) \(.status)] \(.url)"' frontend/spec-ci-report.json >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Specs with failing API assertions:" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.specs[] | select((.apiAssertions // []) | length > 0) | .specId as $s | .apiAssertions[] | select(.passed == false) | "- \($s) [\(.endpoint)] \(.error // (.assertionResults[] | select(.passed == false) | .reason))"' frontend/spec-ci-report.json >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Crawl routes with GATING findings (NEW, post-waiver):" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.crawl.routes[]? | select(((.unwaivedConsoleErrors // []) | length > 0) or ((.unwaivedServerErrors // []) | length > 0) or (.healthFail == true)) | .route as $r | ((.unwaivedConsoleErrors[]? | "- \($r) console [\(.level)] \(.text)"), (.unwaivedServerErrors[]? | "- \($r) server [\(.method) \(.status)] \(.url)"), (if .healthFail then "- \($r) health: navigation failed (\(.error))" else empty end))' frontend/spec-ci-report.json >> "$GITHUB_STEP_SUMMARY" || true
          fi

      # ----------------------------------------------------------------------
      # CI-infrastructure timeout marker (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 5).
      #
      # A job-level timeout concludes the job as `cancelled`, and `gh pr checks`
      # renders `cancelled` as **fail** -- with ZERO failing steps, because no
      # step failed. An author triaging their own PR sees "fail" against their
      # diff with nothing to point at, and reads it as their own regression. On
      # 2026-08-19 that misattribution cost real time on PR #1015. This step
      # exists so the log says what actually happened.
      #
      # `cancelled` has THREE causes and only the first is this plan's defect:
      #   1. an apt-dependent step stalled against the external mirror (ours)
      #   2. coord's merge train reaping a `merge-candidate/*` ref (benign)
      #   3. a manual / external / superseding cancel (benign)
      # 2 and 3 resolved in MINUTES in every observed case. A marker that
      # shouted "infrastructure timed out" on all three would be wrong on the
      # benign ones, and a diagnostic that is wrong a quarter of the time is
      # worse than none -- it teaches readers to discard the other three
      # quarters. So the ::error:: arms demand POSITIVE evidence that an
      # apt-dependent step is what died, and every other path declines to judge
      # the diff at all.
      #
      # An apt step marked `continue-on-error: true` CAN be present when this
      # step fires. Its own soft failure cannot red the check -- but a LATER,
      # genuine failure can, and this step then runs with that soft-failed
      # outcome still in hand. So arm 1 keys on `.conclusion` (the value AFTER
      # `continue-on-error` rewrites it), never on `.outcome` alone: a step
      # that concluded `success` is not what red this job, and naming it as the
      # cause would misattribute a real regression to infrastructure -- the
      # exact cry-wolf this step exists to prevent.
      #
      # A soft-failed apt step is NOT thereby harmless, and the marker must not
      # say it is. `continue-on-error: true` stops it reding the job DIRECTLY;
      # it does nothing about the cascade. style-gate.yml is the live example:
      # six of its provisioning steps are deliberate SHADOW soft-fails, so a
      # stalled `Install postgresql-client` leaves no psql, the schema and
      # migration steps soft-fail in turn, no snapshots are captured, and with
      # STYLE_GATE_ENFORCE=1 the assert step exits 1. That job is red BECAUSE
      # of the apt stall, with no apt step concluding `failure` anywhere. So
      # every arm that would otherwise assert "this failure is a real one" or
      # "no apt-dependent step failed" is guarded on `soft_failed` being empty,
      # and warns instead of ruling when it is not.
      - name: Explain infrastructure timeout vs external cancellation
        if: cancelled() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          # declared at this job's `timeout-minutes`.
          JOB_TIMEOUT_MINUTES: '35'
          EXTERNAL_CANCEL_NOTE: >-
            this workflow declares NO `concurrency:` block, so GitHub never auto-supersedes it - an external cancel here came from a human or from coord's merge train reaping a merge-candidate/* ref
          # `<step name>|<outcome>|<conclusion>` per apt-dependent step in this
          # job. BOTH values are carried on purpose:
          #   * `.outcome` is the value BEFORE `continue-on-error` rewrites it,
          #     so a soft-failed step still reports the truth here;
          #   * `.conclusion` is what actually reached the job, and ONLY a step
          #     that concluded `failure` can be what red it.
          # Every step named below runs `apt-get` and nothing else. Two splits
          # buy that invariant across all 8 workflows: the psql/DDL work that
          # used to share the postgresql-client steps now lives in an unbounded
          # successor step, and `npx playwright install --with-deps` -- npx
          # resolution PLUS a CDN browser download PLUS apt, fused into one
          # step -- is split so that only its apt-only `install-deps` half is
          # ever named here. So a `failure` on any step below is the apt
          # mirror: never the author's schema breaking, and never a Playwright
          # bundle that 404s on cdn.playwright.dev.
          APT_STEP_OUTCOMES: |
            Install Playwright Chromium system deps (apt)|${{ steps.apt_playwright.outcome }}|${{ steps.apt_playwright.conclusion }}
            Install postgresql-client|${{ steps.apt_psql.outcome }}|${{ steps.apt_psql.conclusion }}
        run: |
          set -uo pipefail

          # An apt step whose CONCLUSION is `failure` hit its own step-level
          # `timeout-minutes` (or apt errored outright) and red this job --
          # either way it is infrastructure. One whose outcome is `cancelled`
          # was still mid-flight when the job ended; that is only decisive once
          # we also know the job budget had actually expired. One that failed
          # but concluded `success` is `continue-on-error: true`: it did not red
          # this job DIRECTLY, but it can still have red it through the cascade
          # of steps that needed what it installs, so it is tracked separately
          # and never dismissed.
          #
          # Every matching step is named, not just the last one: two apt steps
          # can die in the same job, and reporting only one understates it.
          apt_failed=""
          apt_running=""
          soft_failed=""
          while IFS='|' read -r step_name outcome conclusion; do
            [ -z "${step_name// }" ] && continue
            case "$outcome" in
              failure)
                if [ "$conclusion" = "failure" ]; then
                  apt_failed="${apt_failed:+$apt_failed, }$step_name"
                else
                  soft_failed="${soft_failed:+$soft_failed, }$step_name"
                fi
                ;;
              cancelled) apt_running="${apt_running:+$apt_running, }$step_name" ;;
            esac
          done <<< "$APT_STEP_OUTCOMES"

          why="It shells out to apt-get against an external mirror at job time."
          why="$why That call is normally seconds, but has been observed to stall"
          why="$why for 30+ minutes (and, unbounded, for 5h59m). Nothing under test ran."
          ref="See plan 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure."

          # Context line, emitted before any verdict.
          if [ -n "$soft_failed" ]; then
            echo "::notice title=Soft-failed apt step - possible upstream cause::Step(s) '$soft_failed' failed but are marked 'continue-on-error: true', so they concluded 'success' and did not DIRECTLY red this job. A later step that needed what they install can still have failed as a consequence, which would make this job's red an apt cascade rather than a verdict on the diff."
          fi

          # --- Arm 1: an apt step failed AND that failure red the job.
          # Airtight: neither a merge-train reap nor any other external cancel
          # can make a step conclude `failure`.
          if [ -n "$apt_failed" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_failed' exceeded a step-level timeout-minutes or failed outright. $why This is a CI infrastructure failure, not a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 1b: no apt step concluded `failure` and none is mid-flight,
          # but one SOFT-failed. The cascade described in the step header is
          # live here, so "this job's failure is a real one" is an assertion
          # this step cannot support. Warn rather than rule -- an UNKNOWN
          # stated as UNKNOWN, not laundered into a negative.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=A soft-failed apt step may have red this job downstream::No apt-dependent step concluded 'failure', but step(s) '$soft_failed' soft-failed ('continue-on-error: true'). $why Steps that needed what they install can have failed as a consequence, so this job's red may be that cascade and NOT a verdict on the diff. Check the cascade before concluding either way. $ref"
            exit 0
          fi

          # --- Neither cancelled nor an apt failure => a genuine red. Say
          # nothing: this step explains infrastructure timeouts, it does not
          # editorialise real test failures.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ]; then
            echo "No apt-dependent step red the job, none was mid-flight, and the job was not cancelled."
            echo "This job's failure is a real one - emitting no marker."
            exit 0
          fi

          # --- Did the run actually reach its budget? A job timeout fires at
          # elapsed >= budget; a reap or a manual cancel lands at an arbitrary,
          # typically far earlier, elapsed (the two observed benign
          # cancellations were at 2m02s and 7m29s). That gap is the
          # discriminator, so resolve it from the API rather than assuming.
          # This lookup CAN fail (403, rate limit, network blip, a timestamp
          # `date -u -d` cannot parse); every failure leaves `elapsed_min`
          # empty, and empty is UNKNOWN. It is never evidence for a negative.
          elapsed_min=""
          started="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' 2>/dev/null || true)"
          if [ -n "$started" ]; then
            start_epoch="$(date -u -d "$started" +%s 2>/dev/null || true)"
            if [ -n "$start_epoch" ]; then
              elapsed_min=$(( ( $(date -u +%s) - start_epoch ) / 60 ))
            fi
          fi

          # 2 minutes of slack absorbs the gap between run start and job start.
          budget_floor=$(( JOB_TIMEOUT_MINUTES - 2 ))

          # --- Arm 2: the job budget expired while an apt step was still
          # running. Requires THREE facts. The `cancelled` guard is the one
          # arm 3 already carried and this arm was missing: a JOB_STATUS of
          # `failure` with an apt step mid-flight past the budget floor is NOT
          # a job timeout, and this text ("GitHub concludes a job timeout as
          # 'cancelled'") would be describing a mechanism that did not fire.
          # That state belongs to arm 2b, which names the real conclusion.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$apt_running" ] && [ -n "$elapsed_min" ] && [ "$elapsed_min" -ge "$budget_floor" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::The ${JOB_TIMEOUT_MINUTES}-minute job budget expired after ${elapsed_min} min while step(s) '$apt_running' were STILL RUNNING. $why GitHub concludes a job timeout as 'cancelled', which 'gh pr checks' renders as 'fail' with zero failing steps - that rendering is what makes this look like your test failure. It is not. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2b: the job did NOT conclude `cancelled`, yet an apt step
          # was left mid-flight. A step-level `timeout-minutes` expiry is the
          # primary mechanism this change introduces, and which of the two job
          # conclusions GitHub surfaces for it is NOT something this change
          # established. So handle both: under `cancelled` semantics arms 1/2
          # cover it, and under `failure` semantics this arm does. Betting on
          # one and printing "cancelled from outside" under the other would be
          # flatly false about the mechanism we just added.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -n "$apt_running" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_running' were interrupted mid-flight (step outcome 'cancelled') and this job concluded '$JOB_STATUS'. $why Nothing here is a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2c: cancelled with an apt step mid-flight, but arm 2's
          # budget test did not fire. Two sub-cases, and NEITHER licenses
          # ruling the stall out: an apt step really was running when this job
          # died.
          if [ -n "$apt_running" ]; then
            if [ -z "$elapsed_min" ]; then
              echo "::warning title=Cannot rule the apt stall in or out::Step(s) '$apt_running' were still mid-flight when this job was cancelled, but this run's elapsed time could NOT be read - the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so the known apt-mirror stall can be NEITHER confirmed NOR ruled out here. Nothing here is a verdict on the code in this change. $ref"
            else
              echo "::warning title=Cancelled with an apt step mid-flight::Step(s) '$apt_running' were still mid-flight when this job was cancelled after ${elapsed_min} min - well short of its ${JOB_TIMEOUT_MINUTES}-minute budget, which points at an external cancel ($EXTERNAL_CANCEL_NOTE) rather than the apt-mirror stall. But an apt step was genuinely running, so this does not rule the stall out either. Nothing here is a verdict on the code in this change. $ref"
            fi
            exit 0
          fi

          # --- Arm 3a: cancelled, nothing mid-flight, but an apt step
          # SOFT-failed. Arm 3's "No apt-dependent step failed" would be
          # flatly false here - one demonstrably did - so arm 3 does not get
          # to speak for this state.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=Cancelled, and a soft-failed apt step may have red this job downstream::This job was cancelled after ${elapsed_min:-an unknown number of} min against a ${JOB_TIMEOUT_MINUTES}-minute budget. No apt-dependent step was mid-flight, but step(s) '$soft_failed' soft-failed ('continue-on-error: true'), so the apt-mirror stall can NOT be ruled out here, and steps that needed what they install may have failed as a consequence. A cancelled run also reports no test results at all, so nothing here is a verdict on the code under test either way. $ref"
            exit 0
          fi

          # --- Arm 3: cancelled, no apt step red the job, none was
          # mid-flight and none soft-failed. The stall is ruled out BY THE
          # STEP OUTCOMES - a positive fact - not by the elapsed time, which
          # may be UNKNOWN. Explicitly decline to judge the diff either way.
          if [ "$JOB_STATUS" = "cancelled" ]; then
            echo "::notice title=Run cancelled externally - NOT a verdict on this diff::This job was cancelled after ${elapsed_min:-an unknown number of} min against a ${JOB_TIMEOUT_MINUTES}-minute budget. No apt-dependent step failed and none was mid-flight, so this was NOT the known apt-mirror stall. It was cancelled from outside: $EXTERNAL_CANCEL_NOTE. A cancelled run reports no test results at all, so nothing here says anything about the code under test: do not read it as a failure of this change, and do not read it as a pass either. Re-run if you need a verdict."
            exit 0
          fi

          # --- Unreachable under `if: cancelled() || failure()`: every
          # non-cancelled path above has already returned. Kept so an unforeseen
          # state says what it knows instead of falling through silently.
          echo "::notice title=No infrastructure verdict::Job status '$JOB_STATUS', no apt-dependent step red the job, none mid-flight. This marker has nothing to add about the code under test. $ref"
