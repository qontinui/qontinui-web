name: no tracked paths collide case-insensitively

# THE GATE LOGIC LIVES IN `scripts/ci/check_path_case_collisions.py`, not here —
# the shape plan 2026-08-08-ci-tool-registry-and-canonical-configuration-parity
# Phase 5 established for forbid-public-schema, web-boundary-lint and
# alembic-single-head, and gitignore-tracked-files followed. Four lanes invoke
# the one script:
#
#   * this workflow, step "Scan the index for case-colliding paths"
#   * .github/workflows/web-guards.yml, the consolidated guard job
#   * .qontinui/ci.toml, step `path-case-collisions`
#   * .pre-commit-config.yaml, hook `path-case-collisions`
#
# WHY THIS GATE EXISTS. `8f053ba47` (PR #1282) renamed
# `components/sessions/TranscriptStores.tsx` because the same directory tracked
# `transcriptStores.ts`. On a case-insensitive box (Windows, macOS — most of
# this fleet's workstations) `import "./TranscriptStores"` probes the `.ts`
# spelling first and finds the lowercase module, so `tsc` reported the
# component's exports missing and the `tsc-typecheck` pre-commit hook refused
# EVERY frontend commit on such a box, whatever the diff. CI never failed: this
# runner is Linux and case-sensitive, so the probe missed correctly and both
# files coexisted. A gate that can only fail on the platform CI does not run on
# never fails — so the script reads the INDEX (`git ls-files`) and reasons about
# case itself, which is the same answer on every filesystem.
#
# NO `paths:` FILTER, deliberately. A collision is a property of the PAIR of
# tracked paths: it is created when the second spelling is added, and that
# commit need not touch anything a filter could name. A path-scoped gate would
# sit out exactly the change that breaks it — the trap backend-ci.yml's header
# documents for its own nightly drift check.

on:
  pull_request:
    branches: [main, develop]
  push:
    # merge-candidate/** refs are pushed by coord's autonomous merge scheduler
    # (plan 2026-06-06-coord-ci-runner-autonomous-green-merge, Phase 4). This is
    # a merge gate, so it must run on candidate refs or the proposal hangs in
    # awaiting-ci. Validation-only (offline scan); no deploy.
    branches:
      - main
      - develop
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'

# Least privilege for GITHUB_TOKEN (zizmor excessive-permissions). A job
# that needs more declares its own `permissions:`.
permissions:
  contents: read

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land. (KNOWN coord gap: the budget-cancel candidate
# scan in stuck_pr_watcher.rs compares groups with `=`, so every "" group
# matches every other one and suppresses its auto re-run; fix belongs in coord.)
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  path-case-collisions:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2): 40 green runs measured 2026-09-23,
    # p50 0.12 / p90 0.15 / max 0.17 min; cap = max(5, 2x max). Replaces the 360-min default.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Scan the index for case-colliding paths
        # Exits 1 naming each colliding group (full paths, or TS/JS module
        # stems), and 2 if the index came back empty or git itself errored — a
        # scan that proved nothing is an unknown, never a pass.
        run: python scripts/ci/check_path_case_collisions.py
