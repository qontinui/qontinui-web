name: pre-commit ruff pin == the ruff CI runs

# THE GATE LOGIC LIVES IN `scripts/ci/check_ruff_version_parity.py`, not here —
# the shape plan 2026-08-08-ci-tool-registry-and-canonical-configuration-parity
# Phase 5 established for forbid-public-schema, web-boundary-lint,
# alembic-single-head and gitignore-tracked-files. Four lanes invoke the one
# script:
#
#   * this workflow, step "Compare the pre-commit ruff pin against the lockfiles"
#   * .github/workflows/web-guards.yml, step "ruff-version-parity: Compare the
#     pre-commit ruff pin against the lockfiles" -- the consolidated one-job
#     guard lane, running the same command beside this workflow until a later
#     phase of plan
#     2026-09-26-web-guard-workflows-are-thirteen-scheduling-slots-for-three-minutes-of-work
#     deletes this file
#   * .qontinui/ci.toml, step `ruff-version-parity`
#   * .pre-commit-config.yaml, hook `ruff-version-parity`
#
# WHY THIS GATE EXISTS. `505f5738` added the `ruff-format` pre-commit hook so
# formatting stops being enforced only by backend-ci.yml's `ruff format
# --check .`. Its commit message names the residual it left: the hook pinned
# ruff at `v0.14.0` while CI runs whatever poetry.lock resolves. Two formatters
# behind one gate is the same defect one level up — the hook can call a tree
# clean that CI reds, or "fix" a tree into one CI rejects. See the script's
# docstring for the measurement.
#
# NO `paths:` FILTER, and this one deserves its own reasoning because the usual
# argument does not apply. gitignore-tracked-files.yml runs unfiltered because
# its invariant is NOT path-expressible: the (rules, tracked files) pair breaks
# when a file is added under an existing rule, a commit touching neither side.
# This invariant IS path-expressible — only an edit to `.pre-commit-config.yaml`
# or to a `poetry.lock` can put the versions out of step — so a filter would be
# exact rather than a coverage hole.
#
# It is still the wrong shape, for the `push:` refs below. A path-filtered check
# does not run at all on a merge candidate that touches neither file, and a
# check that never runs is indistinguishable from one still pending: if this is
# ever added to branch protection, every unrelated candidate would hang in
# awaiting-ci. backend-ci.yml's own `lint` job header states the principle — "a
# required check that cannot pass is worse than a slow one" — and a check that
# cannot RUN is the same class. The whole job is a checkout plus two file reads,
# so the filter would be buying seconds at the price of that trap.
#
# What the unfiltered trigger costs is also why this gate is NOT a step in
# backend-ci.yml's `lint` job, which would otherwise be its natural home: that
# workflow's other jobs stand up Postgres, Redis and a Docker build, and the
# change that motivated this gate touches `.pre-commit-config.yaml` alone.
#
# That sentence was briefly false. `a208240e2` added exactly such a step, and
# it was WEAKER than this workflow rather than a spare copy: backend-ci.yml is
# path-filtered and its filter lists neither `.pre-commit-config.yaml` nor the
# repo-root `poetry.lock`, so the step could not run on the drift it existed to
# catch. backend/tests/test_ruff_version_parity_gate.py now pins the roster at
# the four lanes above (web-guards.yml is the deliberate fourth: an unfiltered
# guard job, not a backend-ci.yml step), so a fifth fails a test instead of
# falsifying this paragraph in silence.

on:
  pull_request:
    branches: [main, develop]
  push:
    # merge-candidate/** refs are pushed by coord's autonomous merge scheduler
    # (plan 2026-06-06-coord-ci-runner-autonomous-green-merge, Phase 4). This is
    # a merge gate, so it must run on candidate refs or the proposal hangs in
    # awaiting-ci. Validation-only (offline read of committed files); no deploy.
    branches:
      - main
      - develop
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'

# Least privilege for GITHUB_TOKEN (zizmor excessive-permissions). A job
# that needs more declares its own `permissions:`.
permissions:
  contents: read

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land. (KNOWN coord gap: the budget-cancel candidate
# scan in stuck_pr_watcher.rs compares groups with `=`, so every "" group
# matches every other one and suppresses its auto re-run; fix belongs in coord.)
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  ruff-version-parity:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2): 40 green runs measured 2026-09-23,
    # p50 0.13 / p90 0.17 / max 0.20 min; cap = max(5, 2x max). Replaces the 360-min default.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The script is stdlib-only, but `tomllib` is stdlib only from 3.11, and
      # the runner image's own python3 is not a version this repo chose. Pinning
      # it here is the lesson of this same workflow directory: backend-ci.yml's
      # `lint` job broke for every branch when a comment asserting "Python 3.12
      # is pre-installed" went stale under it. Same PYTHON_VERSION as that job.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Compare the pre-commit ruff pin against the lockfiles
        # Exits 1 naming each disagreeing lockfile and printing the exact `rev:`
        # token to write, and 2 if no pin or no lockfile was found — a
        # comparison that proved nothing is an unknown, never a pass.
        run: python scripts/ci/check_ruff_version_parity.py
