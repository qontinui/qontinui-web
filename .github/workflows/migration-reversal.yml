name: Migration Reversal Test

# S4.3 non-gating safety net (ADR 2026-06-18-review-moves-left): proves every new
# alembic migration is REVERSIBLE (up → down → up on an ephemeral Postgres) so the
# coord escalate-path gate on `alembic/versions/**` can be retired.
#
# REQUIRED-CHECK SAFE: this runs on EVERY PR (no `paths:` filter) and always emits
# the `Migration Reversal Gate` check, so it can be a required status check without
# wedging PRs that don't touch migrations (the path-filtered-required-check footgun).
# The expensive job (`reverse`) only runs when alembic/versions changed; the always-run
# `gate` job is the one to mark required.

on:
  pull_request:
    paths:
      - 'backend/alembic/versions/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect alembic migration changes
        id: detect
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^backend/alembic/versions/.*\.py$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Alembic migration changes detected — reversibility test will run."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No alembic migration changes — reversibility test not needed."
          fi

  reverse:
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image: models with a Vector column need the `vector` type, so
        # `alembic upgrade head` (which imports every model) fails on stock pg16.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qontinui_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: qontinui_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      # qontinui (a path-dep) pulls torch — large enough to overflow runner disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Backend's pyproject.toml has path-deps on sibling repos; actions/checkout
      # refuses `path:` outside the workspace, so clone them to the parent dir
      # (mirrors backend-ci.yml).
      - name: Checkout sibling repos (qontinui-schemas, qontinui, qontinui-cloud-control)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/jspinak/qontinui.git
          git clone --depth 1 https://github.com/qontinui/qontinui-cloud-control.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install poetry
          poetry install

      - name: Create named schemas + extension
        env:
          PGPASSWORD: test_password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U qontinui_user -d qontinui_test \
            -c "CREATE SCHEMA IF NOT EXISTS project;" \
            -c "CREATE SCHEMA IF NOT EXISTS auth;" \
            -c "CREATE SCHEMA IF NOT EXISTS cloud;" \
            -c "CREATE SCHEMA IF NOT EXISTS coord;" \
            -c "CREATE SCHEMA IF NOT EXISTS strategy;" \
            -c "CREATE SCHEMA IF NOT EXISTS web;" \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # up → down -1 → up. The downgrade must cleanly reverse the newest migration
      # (the one this PR adds) and the re-upgrade must re-apply it.
      - name: Reversibility test (upgrade → downgrade -1 → upgrade)
        env:
          DATABASE_URL: postgresql://qontinui_user:test_password@localhost:5432/qontinui_test
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          ENVIRONMENT: development
          TESTING: 1
        run: |
          cd backend
          set -euo pipefail
          # Defer un-consolidated chains to the alembic-heads-pr gate. A PR that
          # is behind main with an un-repointed migration has >1 head, which makes
          # `alembic upgrade head` ambiguous — that's a chain-consolidation
          # problem (alembic-heads-pr's job), NOT a reversibility problem. Failing
          # here would be a false positive that blocks an otherwise-reversible
          # migration. Such a PR can't merge anyway (alembic-heads-pr is
          # required), and once it re-points to a single head this test runs for
          # real. So skip-and-pass.
          #
          # There are TWO distinct un-consolidated states, and they look nothing
          # alike, so detect each EXPLICITLY rather than inferring both from one
          # count:
          #
          #   (a) `alembic heads` FAILS (non-zero, empty stdout). Happens when a
          #       migration names a down_revision that does not exist in this
          #       checkout — the normal shape of a stacked PR whose parent has
          #       not landed yet. alembic raises during revision-map construction
          #       and prints nothing to stdout; the cause is on stderr only.
          #       This state can never present as ">1 head", so a `(head)` counter
          #       is structurally blind to it.
          #   (b) `alembic heads` SUCCEEDS and lists >1 head — sibling heads that
          #       both resolve. This is the case the original counter aimed at.
          #
          # Both are alembic-heads-pr's problem, so both skip-and-pass here.
          # Anything else (exactly one head) is a real, resolvable chain and the
          # reversibility test below runs for real.
          #
          # Do NOT reintroduce `alembic heads 2>/dev/null | grep -c '(head)' || echo 0`.
          # It suppressed the only signal state (a) emits, and on empty input
          # `grep -c` prints "0" AND exits 1, so `|| echo 0` fired too and the
          # value became the two-line string "0\n0" — which makes `[ -gt ]` a
          # usage error that `if` reads as false. The guard could not fire at all.
          # Prove the toolchain works BEFORE the guard below starts reading a
          # non-zero `alembic heads` as "chain not consolidated". Otherwise a
          # broken poetry env or an unresolvable alembic entrypoint would take
          # the skip-and-pass path and silently green a REQUIRED gate. This line
          # runs under `set -e`, so infra breakage stays loud.
          poetry run alembic --version >/dev/null

          # Capture stderr to a file rather than letting it interleave: Actions
          # does not guarantee stdout/stderr ordering within a step, and the
          # cause must appear immediately above the skip message to be useful.
          set +e
          HEADS_OUT=$(poetry run alembic heads 2>heads.err)
          HEADS_RC=$?
          set -e
          cat heads.err >&2 || true
          rm -f heads.err
          if [ "$HEADS_RC" -ne 0 ]; then
            # Deliberately NOT narrowed by matching alembic's error prose. Any
            # other non-zero cause (migration SyntaxError, graph cycle, duplicate
            # revision id) still hard-fails on `alembic upgrade heads` in
            # spec-ci.yml, which is required and runs on every PR with no path
            # filter — so nothing here is the only thing standing between a
            # broken chain and main. Grepping stderr text would trade that
            # backstopped risk for a brittle one: an alembic wording change would
            # turn this into a FALSE RED on exactly the legitimately-waiting
            # stacked PRs this guard exists to let through. `::warning::` keeps
            # the skip visible in the checks UI so a skipped gate is never
            # mistaken for a passed one.
            echo "::warning::alembic heads exited $HEADS_RC — the revision chain does not resolve in this checkout (cause above). Deferring to the alembic-heads-pr gate; skipping the reversibility test (pass)."
            exit 0
          fi
          # `|| true`, NOT `|| echo 0`: on no-match `grep -c` already prints "0"
          # and exits 1, so `|| echo 0` would append a SECOND "0" and make this a
          # two-line string. Every degenerate path lands on 0, which falls through
          # to RUNNING the test — the fail-safe direction.
          HEADS=$(printf '%s\n' "$HEADS_OUT" | grep -c '(head)' || true)
          HEADS=${HEADS:-0}
          if [ "$HEADS" -gt 1 ]; then
            echo "Multiple alembic heads ($HEADS) — reversibility deferred to the alembic-heads-pr gate. Skipping (pass)."
            exit 0
          fi
          echo "== upgrade head =="
          poetry run alembic upgrade head
          echo "== downgrade -1 =="
          poetry run alembic downgrade -1
          echo "== upgrade head (re-apply) =="
          poetry run alembic upgrade head
          echo "Migration reversal test passed."

  # Always-run aggregate — THIS is the required status check. Passes when migrations
  # were untouched (reverse skipped) or when the reversal test succeeded; fails only
  # on a genuine reversal failure. Never a phantom: it runs on every PR.
  gate:
    name: Migration Reversal Gate
    needs: [detect, reverse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          relevant="${{ needs.detect.outputs.relevant }}"
          result="${{ needs.reverse.result }}"
          echo "relevant=$relevant reverse.result=$result"
          if [ "$relevant" = "true" ] && [ "$result" != "success" ]; then
            echo "::error::migration reversibility test did not pass (result=$result)"
            exit 1
          fi
          echo "Migration Reversal Gate OK."
