name: Migration Reversal Test

# S4.3 non-gating safety net (ADR 2026-06-18-review-moves-left): proves every new
# alembic migration is REVERSIBLE (up → down → up on an ephemeral Postgres) so the
# coord escalate-path gate on `alembic/versions/**` can be retired.
#
# ⚠️ NOT A REQUIRED-CHECK CANDIDATE — do NOT mark `Migration Reversal Gate` required,
# and do NOT mark `Migration Reversal Tested` required either.
#
# This workflow is `paths:`-filtered to `backend/alembic/versions/**` (below). On a PR
# that touches no migration the workflow never starts, so neither the `gate` job nor the
# `tested` job ever emits its check at all. Marking that context required would make every non-migration PR wait
# forever on a check that structurally cannot appear — the phantom-required-context wedge.
#
# `gate` does carry `if: always()` (see the job), which makes it emit unconditionally
# *within a run*. That is not the same property as emitting on every PR, and only the
# latter is what a required context needs. The two are easy to conflate; this workflow
# has exactly one of them.
#
# This is a deliberate, already-litigated decision, not an oversight:
#   b1566b78  created path-filtered
#   dd8233ac  dropped the filter to make it "a phantom-free required-check candidate"
#   d419d387  RESTORED the filter — "red-CI model, not a required context"
# `d419d387` is the standing decision. The old required-check-safe header survived it and
# claimed the opposite for weeks, three lines above the `paths:` filter that refuted it.
# If you want this required, you must first delete the filter and re-litigate d419d387 —
# editing this comment is not enough.
#
# `Migration Reversal Tested` (job `tested`) is unfit as a required context on two
# further counts. It carries NO `if: always()`: it is skipped -- emits no conclusion
# GitHub would count as passing a requirement -- whenever `detect` finds no migration,
# even inside a run. And it is RED BY DESIGN on legitimate PRs: two migrations in one
# PR, a migration chained off a stale head, a merge revision. Its consumer is coord's
# agent evidence door, which reads it as positive evidence that THIS PR's one migration
# was exercised; a red there only withholds an agent clearance. Requiring it would
# block every multi-migration PR outright.
#
# The expensive jobs (`reverse`, `tested`) are additionally gated on
# `needs.detect.outputs.relevant`.

on:
  pull_request:
    paths:
      - 'backend/alembic/versions/**'

# Supersede a PR run when a newer commit is pushed to the same PR, so the
# previous head's runs stop consuming (and queueing for) runners. This
# workflow's lanes: `pull_request` only.
#
# The slug is a LITERAL, not `${{ github.workflow }}`. coord models a
# workflow's group template itself and interpolates only `github.event_name`
# and `github.ref`, collapsing every other expression to the empty string
# (`qontinui-coord` `ci_observer.rs::resolve_group_template`), so a
# `github.workflow` key would make every workflow here model to one identical
# group string. The four blocks already in this directory use a literal slug
# for the same reason.
#
# The key includes the EVENT because `schedule`, `workflow_dispatch` and a
# `push` to the default branch all resolve `github.ref` to `refs/heads/main`.
# Without it those lanes would share one group and supersede each other, and an
# in-flight run would occupy the very group a prospective land resolves into --
# which `run_is_reaper_at_risk` reads as a reap hazard and hard-blocks the
# merge train on.
#
# `cancel-in-progress` is an EXPRESSION, not `true`: only a `pull_request` run
# is ever superseded. A run on a `push` or `schedule` lane is never cancelled
# by this block, and since 2026-10-05 it is not reaped while PENDING either:
# the per-run suffix below makes it the only member of its group.
#
# NOTE this workflow has no `push` lane on the DEFAULT branch, and that is what
# makes a group safe here. A top-level group on a workflow that runs on
# `push: main` makes its post-land runs reaper-at-risk, which flips coord's
# blocking set from soft (relaxable by the optimism gate) to a hard block --
# see `merge_safety_from_observation`, whose soft-blocking arm requires those
# runs to share NO concurrency group.
#
# PR-SCOPED SUPERSESSION, re-run- and push-safe (shared hosted-job cap relief,
# 2026-10-05; pattern: qontinui-claude-config#1475). Only a FIRST-attempt
# `pull_request` run uses the bare per-PR group below and cancels within it.
# Every other run -- push (incl. merge-candidate*/**, coord's candidate CI),
# schedule, workflow_dispatch, and EVERY re-run (run_attempt > 1) -- appends
# `-run-<id>-<attempt>`, so it is the sole member of its group: never
# cancelled, never reaped while pending, and a re-run of an older head can no
# longer cancel the current head's run. The existing literal prefix is kept
# because coord models a template by interpolating only `github.event_name` /
# `github.ref` and collapsing every other expression (the suffix included) to
# "" -- so coord's modelled group is byte-identical to before the suffix.
concurrency:
  group: migration-reversal-${{ github.event_name }}-${{ github.ref }}${{ !(github.event_name == 'pull_request' && github.run_attempt == 1) && format('-run-{0}-{1}', github.run_id, github.run_attempt) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

# Least privilege for GITHUB_TOKEN (zizmor excessive-permissions): read the
# repo; `actions: read` is for the job-timeout explainer's
# `gh api .../actions/runs/$GITHUB_RUN_ID` read. A job that needs more
# declares its own `permissions:`.
permissions:
  contents: read
  actions: read

jobs:
  detect:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2): 40 green runs measured 2026-09-23,
    # p50 0.23 / p90 0.28 / max 0.37 min; cap = max(5, 2x max). Replaces the 360-min default.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect alembic migration changes
        id: detect
        # The base sha reaches the script through `env:`, never as an inline
        # expression in `run:` (zizmor template-injection hygiene).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE_SHA"
          if git diff --name-only "$base"...HEAD | grep -qE '^backend/alembic/versions/.*\.py$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Alembic migration changes detected — reversibility test will run."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No alembic migration changes — reversibility test not needed."
          fi

  reverse:
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Same gap as backend-ci.yml's `test`: an apt-dependent job with no
    # job-level bound, so its ceiling was GitHub's DEFAULT 360 minutes -- not a
    # value this repo chose. This workflow is named in the plan's own Why
    # section as the third independent confirmation of the defect -- its
    # `postgresql-client` install hung ~2 h on PR #1015 -- which makes an
    # uncapped job here the least defensible of the set.
    #
    # Same caveat as backend-ci.yml's `test`, and it bites harder here: the cap
    # bounds the BURN, it does not meaningfully re-arm the marker's arm 2. Arm
    # 2 needs the apt step still mid-flight when the JOB budget expires, but
    # that step's own `timeout-minutes: 10` fires first, and a step-bound
    # expiry is covered by arm 1 or arm 2b -- which of the two is Gate part 2's
    # open question, deliberately not answered here. With four steps before apt
    # on a job whose measured max TOTAL is 7.7 min, arm 2 would need the
    # preamble alone to stall ~15 min.
    #
    # Measured: 60 consecutive green runs of this job -- p50 3.0 min,
    # p90 5.4 min, max 7.7 min. 25 min is ~3.2x the worst observed success.
    # NOTE for whoever revisits: this job replays upgrade->downgrade->upgrade
    # over the WHOLE alembic graph, so its runtime grows monotonically with the
    # migration count. 3.2x headroom today will erode; re-measure rather than
    # assuming this bound still holds in six months.
    timeout-minutes: 25

    services:
      postgres:
        # pgvector image: models with a Vector column need the `vector` type, so
        # `alembic upgrade head` (which imports every model) fails on stock pg16.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qontinui_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: qontinui_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # Stamp THIS JOB's start time. Must stay the FIRST step of the job.
      #
      # The infrastructure marker below measures elapsed time to tell a job
      # TIMEOUT from an external cancel, and `run_started_at` (the API value it
      # falls back to) measures the RUN: it includes every upstream `needs:` job
      # and all queue time. On a `needs:`-gated job that skew can exceed the
      # budget slack, so a LATE external cancel reads as past the budget and is
      # reported as a timeout -- the same laundering of one cause into another
      # that the marker exists to prevent, merely inverted. This stamp removes
      # the skew, and removes the `gh api` dependency on the common path.
      - name: Record job start time
        # `working-directory` is NOT decoration. This step runs BEFORE
        # `actions/checkout`, and a job whose `defaults.run.working-directory`
        # points into the repo (e.g. `./backend`) has no such directory yet --
        # the step then fails on a missing cwd, and because it is step 1 the
        # whole job dies with every later step skipped. Anchoring to the
        # workspace root, which the runner creates before any step, is what
        # makes a pre-checkout step safe. Set explicitly on every carrier so
        # this stays correct if a job later gains a default.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # qontinui (a path-dep) pulls torch — large enough to overflow runner disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Backend's pyproject.toml has path-deps on sibling repos; actions/checkout
      # refuses `path:` outside the workspace, so clone them to the parent dir
      # (mirrors backend-ci.yml).
      - name: Checkout sibling repos (qontinui-schemas, qontinui, qontinui-cloud-control)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/jspinak/qontinui.git
          git clone --depth 1 https://github.com/qontinui/qontinui-cloud-control.git

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install poetry
          poetry install

      - name: Install postgresql-client
        id: apt_psql
        # ONLY the apt-get call lives in this step, and it is the entire reason
        # for the bound: it reaches an external mirror at job time and is the
        # same unbounded-stall exposure as the Playwright step (plan
        # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure).
        # The psql/DDL that used to share this step now runs UNBOUNDED below.
        # It HAD to move: under `bash -e` a psql failure set this step's
        # `.outcome` to `failure` exactly like an apt timeout, so the
        # infrastructure marker could not tell a mirror stall from the author's
        # own schema breaking -- and told them their breakage was infrastructure.
        # Measured apt+psql across green runs of all 7 sites: p50 0-16s, p90
        # <=91s, max 106s (migration-reversal). This job is PR-gating, so a
        # false red here costs an author more than a late one does. With the
        # bound covering apt ALONE it can afford to be generous: 10 min is
        # ~5.7x the worst time ever observed for apt AND psql together.
        # GUARDED, as spec-ci.yml has been all along. `ubuntu-latest` ships
        # psql, so `command -v psql` short-circuits and apt is never reached --
        # measured, not assumed: across 12 consecutive green Spec CI runs this
        # step is 0-1s every time, while the six sites that were still calling
        # apt unconditionally spent 3-29s per run on an `apt-get update` against
        # the external mirror for a package apt then reports as already the
        # newest version. That round-trip is pure exposure to the stall this
        # plan exists to remove, and it buys nothing.
        # (Those 3-29s figures are from `--status success` runs, so they are a
        # LOWER bound by construction -- a run killed by the stall is excluded.)
        # The bound below is NOT redundant: it covers the fallback arm, for the
        # day an image stops shipping psql.
        # Consequence for the marker: this step normally runs NO apt, so it
        # normally concludes `success` and no arm names it -- which is correct,
        # because there was no apt call to blame. spec-ci.yml makes the same
        # observation at its own site (an arm keyed on this step's failure
        # "would have been describing a call that did not happen"); the arm
        # attribution below is this change's, not a restatement of that one.
        # When the fallback DOES run and fails, the step still exits non-zero
        # (`||` does not defeat `-e` for the group) and concludes `failure`, so
        # arm 1 fires. The guard removes the exposure; it does not silence a
        # real apt failure.
        timeout-minutes: 10
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      - name: Create named schemas + extension
        # Deliberately UNBOUNDED and deliberately WITHOUT an `id:`. This is
        # psql/DDL against this job's own postgres service, not the external
        # mirror, so a failure here IS a verdict on the change -- it must never
        # reach the infrastructure marker's APT_STEP_OUTCOMES.
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U qontinui_user -d qontinui_test \
            -c "CREATE SCHEMA IF NOT EXISTS project;" \
            -c "CREATE SCHEMA IF NOT EXISTS auth;" \
            -c "CREATE SCHEMA IF NOT EXISTS cloud;" \
            -c "CREATE SCHEMA IF NOT EXISTS coord;" \
            -c "CREATE SCHEMA IF NOT EXISTS strategy;" \
            -c "CREATE SCHEMA IF NOT EXISTS web;" \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # up → down -1 → up. The downgrade must cleanly reverse the newest migration
      # (the one this PR adds) and the re-upgrade must re-apply it.
      - name: Reversibility test (upgrade → downgrade -1 → upgrade)
        env:
          DATABASE_URL: postgresql://qontinui_user:test_password@localhost:5432/qontinui_test
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          ENVIRONMENT: development
          TESTING: 1
        run: |
          cd backend
          set -euo pipefail
          # Defer un-consolidated chains to the alembic-heads-pr gate. A PR that
          # is behind main with an un-repointed migration has >1 head, which makes
          # `alembic upgrade head` ambiguous — that's a chain-consolidation
          # problem (alembic-heads-pr's job), NOT a reversibility problem. Failing
          # here would be a false positive that blocks an otherwise-reversible
          # migration. Such a PR can't merge anyway (alembic-heads-pr is
          # required), and once it re-points to a single head this test runs for
          # real. So skip-and-pass.
          #
          # There are TWO distinct un-consolidated states, and they look nothing
          # alike, so detect each EXPLICITLY rather than inferring both from one
          # count:
          #
          #   (a) `alembic heads` FAILS (non-zero, empty stdout). Happens when a
          #       migration names a down_revision that does not exist in this
          #       checkout — the normal shape of a stacked PR whose parent has
          #       not landed yet. alembic raises during revision-map construction
          #       and prints nothing to stdout; the cause is on stderr only.
          #       This state can never present as ">1 head", so a `(head)` counter
          #       is structurally blind to it.
          #   (b) `alembic heads` SUCCEEDS and lists >1 head — sibling heads that
          #       both resolve. This is the case the original counter aimed at.
          #
          # Both are alembic-heads-pr's problem, so both skip-and-pass here.
          # Anything else (exactly one head) is a real, resolvable chain and the
          # reversibility test below runs for real.
          #
          # Do NOT reintroduce `alembic heads 2>/dev/null | grep -c '(head)' || echo 0`.
          # It suppressed the only signal state (a) emits, and on empty input
          # `grep -c` prints "0" AND exits 1, so `|| echo 0` fired too and the
          # value became the two-line string "0\n0" — which makes `[ -gt ]` a
          # usage error that `if` reads as false. The guard could not fire at all.

          # Prove the toolchain works BEFORE the guard below starts reading a
          # non-zero `alembic heads` as "chain not consolidated". Otherwise a
          # broken poetry env or an unresolvable alembic entrypoint would take
          # the skip-and-pass path and silently green a REQUIRED gate. This line
          # runs under `set -e`, so infra breakage stays loud.
          poetry run alembic --version >/dev/null

          # Capture stderr to a file rather than letting it interleave: Actions
          # drains stdout and stderr with independent handlers, so the cause must
          # be emitted immediately before the skip message AND on the same stream
          # to be reliably adjacent to it. Both go to stderr (the runner parses
          # workflow commands from stderr identically — see the `::error::`
          # precedent in alembic-graph-pr.yml).
          set +e
          HEADS_OUT=$(poetry run alembic heads 2>heads.err)
          HEADS_RC=$?
          set -e
          cat heads.err >&2 || true
          rm -f heads.err
          if [ "$HEADS_RC" -ne 0 ]; then
            # Deliberately NOT narrowed by matching alembic's error prose. Any
            # other non-zero cause (migration SyntaxError, graph cycle, duplicate
            # revision id) still hard-fails on `alembic upgrade heads` in
            # spec-ci.yml, which is required and runs on every PR with no path
            # filter — so nothing here is the only thing standing between a
            # broken chain and main. Grepping stderr text would trade that
            # backstopped risk for a brittle one: an alembic wording change would
            # turn this into a FALSE RED on exactly the legitimately-waiting
            # stacked PRs this guard exists to let through. `::warning::` keeps
            # the skip visible in the checks UI so a skipped gate is never
            # mistaken for a passed one.
            echo "::warning::alembic heads exited $HEADS_RC — the revision chain does not resolve in this checkout (cause above). Deferring to the alembic-heads-pr gate; skipping the reversibility test (pass)." >&2
            exit 0
          fi
          # `|| true`, NOT `|| echo 0`: on no-match `grep -c` already prints "0"
          # and exits 1, so `|| echo 0` would append a SECOND "0" and make this a
          # two-line string. Every degenerate path lands on 0, which falls through
          # to RUNNING the test — the fail-safe direction.
          HEADS=$(printf '%s\n' "$HEADS_OUT" | grep -c '(head)' || true)
          HEADS=${HEADS:-0}
          if [ "$HEADS" -gt 1 ]; then
            echo "Multiple alembic heads ($HEADS) — reversibility deferred to the alembic-heads-pr gate. Skipping (pass)."
            exit 0
          fi

          # A THIRD un-consolidated shape, distinct from (a)/(b) above: exactly
          # one head, but that head is itself a merge revision — a
          # `down_revision` TUPLE joining two prior branches (the
          # `merge_06_commit_effect_restack_heads` convention). `alembic
          # upgrade head` is unambiguous there (there's only one edge forward),
          # but `downgrade -1` is NOT: a merge point has two valid "one step
          # back" targets and alembic refuses to guess, raising "Ambiguous
          # walk" — a hard failure that has nothing to do with whether the
          # merge (or the branches it joins) is actually reversible. Detect it
          # structurally, the same way (a)/(b) do, rather than pattern-matching
          # that error string: read the resolved head's own `down_revision`
          # via alembic's ScriptDirectory, which is a tuple iff it is a merge
          # point. Skip-and-pass for the same reason (b) does: a human already
          # reviewed the merge revision's DAG shape in the diff, and there is
          # no DDL for this test to exercise on a pure-merge file.
          MERGE_HEAD=$(poetry run python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; script = ScriptDirectory.from_config(Config('alembic.ini')); head = script.get_revision(script.get_heads()[0]); print('1' if isinstance(head.down_revision, tuple) else '0')")
          if [ "$MERGE_HEAD" = "1" ]; then
            echo "Single head is a merge revision (multiple down_revisions) — 'downgrade -1' is structurally ambiguous there, not a reversibility defect. Skipping (pass)."
            exit 0
          fi

          echo "== upgrade head =="
          poetry run alembic upgrade head
          echo "== downgrade -1 =="
          poetry run alembic downgrade -1
          echo "== upgrade head (re-apply) =="
          poetry run alembic upgrade head
          echo "Migration reversal test passed."

      # ----------------------------------------------------------------------
      # CI-infrastructure timeout marker (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 5).
      #
      # A job-level timeout concludes the job as `cancelled`, and `gh pr checks`
      # renders `cancelled` as **fail** -- with ZERO failing steps, because no
      # step failed. An author triaging their own PR sees "fail" against their
      # diff with nothing to point at, and reads it as their own regression. On
      # 2026-08-19 that misattribution cost real time on PR #1015. This step
      # exists so the log says what actually happened.
      #
      # `cancelled` has THREE causes and only the first is this plan's defect:
      #   1. an apt-dependent step stalled against the external mirror (ours)
      #   2. coord's merge train reaping a `merge-candidate/*` ref (benign)
      #   3. a manual / external / superseding cancel (benign)
      # 2 and 3 resolved in MINUTES in every observed case. A marker that
      # shouted "infrastructure timed out" on all three would be wrong on the
      # benign ones, and a diagnostic that is wrong a quarter of the time is
      # worse than none -- it teaches readers to discard the other three
      # quarters. So the ::error:: arms demand POSITIVE evidence that an
      # apt-dependent step is what died, and every other path declines to judge
      # the diff at all.
      #
      # An apt step marked `continue-on-error: true` CAN be present when this
      # step fires. Its own soft failure cannot red the check -- but a LATER,
      # genuine failure can, and this step then runs with that soft-failed
      # outcome still in hand. So arm 1 keys on `.conclusion` (the value AFTER
      # `continue-on-error` rewrites it), never on `.outcome` alone: a step
      # that concluded `success` is not what red this job, and naming it as the
      # cause would misattribute a real regression to infrastructure -- the
      # exact cry-wolf this step exists to prevent.
      #
      # A soft-failed apt step is NOT thereby harmless, and the marker must not
      # say it is. `continue-on-error: true` stops it reding the job DIRECTLY;
      # it does nothing about the cascade. style-gate.yml is the live example:
      # six of its provisioning steps are deliberate SHADOW soft-fails, so a
      # stalled `Install postgresql-client` leaves no psql, the schema and
      # migration steps soft-fail in turn, no snapshots are captured, and with
      # STYLE_GATE_ENFORCE=1 the assert step exits 1. That job is red BECAUSE
      # of the apt stall, with no apt step concluding `failure` anywhere. So
      # every arm that would otherwise assert "this failure is a real one" or
      # "no apt-dependent step failed" is guarded on `soft_failed` being empty,
      # and warns instead of ruling when it is not.
      - name: Explain infrastructure timeout vs external cancellation
        if: cancelled() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          # declared at this job's `timeout-minutes`.
          JOB_TIMEOUT_MINUTES: '25'
          EXTERNAL_CANCEL_NOTE: >-
            this workflow's `concurrency:` block sets `cancel-in-progress` from the expression `github.event_name == 'pull_request' && github.run_attempt == 1`, so whether GitHub auto-supersedes is decided per run and cannot be stated as fixed here - on a first-attempt pull_request run a newer push to the same PR supersedes it (and a reopen supersedes the same-head run it re-does); every other run (push, schedule, dispatch, any re-run) is alone in a per-run group and is never auto-superseded or reaped while pending, so a manual cancel or coord's merge train reaping a merge-candidate/* ref are the remaining external causes
          # `<step name>|<outcome>|<conclusion>` per apt-dependent step in this
          # job. BOTH values are carried on purpose:
          #   * `.outcome` is the value BEFORE `continue-on-error` rewrites it,
          #     so a soft-failed step still reports the truth here;
          #   * `.conclusion` is what actually reached the job, and ONLY a step
          #     that concluded `failure` can be what red it.
          # Every step named below runs `apt-get` and nothing else. Two splits
          # buy that invariant across all 8 workflows: the psql/DDL work that
          # used to share the postgresql-client steps now lives in an unbounded
          # successor step, and `npx playwright install --with-deps` -- npx
          # resolution PLUS a CDN browser download PLUS apt, fused into one
          # step -- is split so that only its apt-only `install-deps` half is
          # ever named here. So a `failure` on any step below is the apt
          # mirror: never the author's schema breaking, and never a Playwright
          # bundle that 404s on cdn.playwright.dev.
          APT_STEP_OUTCOMES: |
            Install postgresql-client|${{ steps.apt_psql.outcome }}|${{ steps.apt_psql.conclusion }}
        run: |
          set -uo pipefail

          # An apt step whose CONCLUSION is `failure` hit its own step-level
          # `timeout-minutes` (or apt errored outright) and red this job --
          # either way it is infrastructure. One whose outcome is `cancelled`
          # was still mid-flight when the job ended; that is only decisive once
          # we also know the job budget had actually expired. One that failed
          # but concluded `success` is `continue-on-error: true`: it did not red
          # this job DIRECTLY, but it can still have red it through the cascade
          # of steps that needed what it installs, so it is tracked separately
          # and never dismissed.
          #
          # Every matching step is named, not just the last one: two apt steps
          # can die in the same job, and reporting only one understates it.
          apt_failed=""
          apt_running=""
          soft_failed=""
          # How many rows actually parsed. An EMPTY APT_STEP_OUTCOMES -- which is
          # what a renamed or deleted step id renders to -- leaves all three
          # buckets empty, exactly like a clean run. That is an absence of DATA,
          # not an observation of health, and arm 2d is the first arm to make a
          # POSITIVE claim on it.
          apt_rows_seen=0
          while IFS='|' read -r step_name outcome conclusion; do
            [ -z "${step_name// }" ] && continue
            apt_rows_seen=$(( apt_rows_seen + 1 ))
            case "$outcome" in
              failure)
                if [ "$conclusion" = "failure" ]; then
                  apt_failed="${apt_failed:+$apt_failed, }$step_name"
                else
                  soft_failed="${soft_failed:+$soft_failed, }$step_name"
                fi
                ;;
              cancelled) apt_running="${apt_running:+$apt_running, }$step_name" ;;
            esac
          done <<< "$APT_STEP_OUTCOMES"

          why="It shells out to apt-get against an external mirror at job time."
          why="$why That call is normally seconds, but has been observed to stall"
          why="$why for 30+ minutes (and, unbounded, for 5h59m). Nothing under test ran."
          ref="See plan 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure."
          # A separate pointer for the budget arms. $ref names the apt-stall
          # plan, which is the wrong citation for an arm that exists to say
          # this was NOT the apt stall.
          ref_budget="See plan 2026-08-27-web-backend-coverage-producer-timeout."

          # Context line, emitted before any verdict.
          if [ -n "$soft_failed" ]; then
            echo "::notice title=Soft-failed apt step - possible upstream cause::Step(s) '$soft_failed' failed but are marked 'continue-on-error: true', so they concluded 'success' and did not DIRECTLY red this job. A later step that needed what they install can still have failed as a consequence, which would make this job's red an apt cascade rather than a verdict on the diff."
          fi

          # --- Arm 1: an apt step failed AND that failure red the job.
          # Airtight: neither a merge-train reap nor any other external cancel
          # can make a step conclude `failure`.
          if [ -n "$apt_failed" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_failed' exceeded a step-level timeout-minutes or failed outright. $why This is a CI infrastructure failure, not a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 1b: no apt step concluded `failure` and none is mid-flight,
          # but one SOFT-failed. The cascade described in the step header is
          # live here, so "this job's failure is a real one" is an assertion
          # this step cannot support. Warn rather than rule -- an UNKNOWN
          # stated as UNKNOWN, not laundered into a negative.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=A soft-failed apt step may have red this job downstream::No apt-dependent step concluded 'failure', but step(s) '$soft_failed' soft-failed ('continue-on-error: true'). $why Steps that needed what they install can have failed as a consequence, so this job's red may be that cascade and NOT a verdict on the diff. Check the cascade before concluding either way. $ref"
            exit 0
          fi

          # --- Neither cancelled nor an apt failure => a genuine red. Say
          # nothing: this step explains infrastructure timeouts, it does not
          # editorialise real test failures.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ]; then
            echo "No apt-dependent step red the job, none was mid-flight, and the job was not cancelled."
            echo "This job's failure is a real one - emitting no marker."
            exit 0
          fi

          # --- Did the run actually reach its budget? A job timeout fires at
          # elapsed >= budget; a reap or a manual cancel lands at an arbitrary,
          # typically far earlier, elapsed (the two observed benign
          # cancellations were at 2m02s and 7m29s). That gap is the
          # discriminator, so resolve it from the API rather than assuming.
          # This lookup CAN fail (403, rate limit, network blip, a timestamp
          # `date -u -d` cannot parse); every failure leaves `elapsed_min`
          # empty, and empty is UNKNOWN. It is never evidence for a negative.
          # PREFER this job's own start stamp (written by the job's first
          # step). `run_started_at` measures the RUN -- it includes every
          # upstream `needs:` job and all queue time -- so on a `needs:`-gated
          # job it overstates this job's elapsed time by more than the slack
          # below, and a LATE external cancel would then be reported as a
          # timeout. The API lookup stays as the fallback for a job whose stamp
          # step did not run.
          #
          # The guards are not decoration: `-e` is on, so a non-numeric or
          # absurd value reaching `$(( ))` would ABORT this step, and a marker
          # that aborts explains nothing. `10#` forces base 10 -- bash reads a
          # leading zero as octal, where `08` is a hard error, not a value.
          # Every failure path leaves `elapsed_min` empty, and empty is UNKNOWN;
          # it is never evidence for a negative.
          elapsed_min=""
          elapsed_basis=""
          job_start="${JOB_START_EPOCH:-}"
          if [ -n "$job_start" ] && [ -z "${job_start//[0-9]/}" ] && [ ${#job_start} -le 11 ]; then
            job_start=$(( 10#$job_start ))
            # A real CI job start is a 10-digit epoch. Anything smaller is a
            # nonsense stamp -- '08' parses fine and means 8 SECONDS after 1970
            # -- and turning it into a 29-million-minute "measurement" would be
            # garbage presented as fact, which is the very laundering this
            # marker exists to stop. Below the floor, leave it UNKNOWN.
            if [ "$job_start" -ge 1600000000 ]; then
              elapsed_min=$(( ( $(date -u +%s) - job_start ) / 60 ))
              elapsed_basis="job"
            fi
          fi
          if [ -z "$elapsed_min" ]; then
            started="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' 2>/dev/null || true)"
            if [ -n "$started" ]; then
              start_epoch="$(date -u -d "$started" +%s 2>/dev/null || true)"
              if [ -n "$start_epoch" ]; then
                elapsed_min=$(( ( $(date -u +%s) - start_epoch ) / 60 ))
                elapsed_basis="run"
              fi
            fi
          fi

          # A negative elapsed means the clock moved backwards or the stamp is
          # nonsense. Report UNKNOWN rather than a garbage measurement.
          if [ -n "$elapsed_min" ] && [ "$elapsed_min" -lt 0 ]; then
            elapsed_min=""
            elapsed_basis=""
          fi

          # Named so an arm that RULES can disclose what it measured.
          case "$elapsed_basis" in
            job) basis_note="measured from this job's own start" ;;
            run) basis_note="measured from the RUN's start (this job's own start stamp was unavailable), so it also includes any upstream 'needs:' job and queue time" ;;
            *)   basis_note="not measured" ;;
          esac

          # 2 minutes of slack absorbs the gap between run start and job start.
          budget_floor=$(( JOB_TIMEOUT_MINUTES - 2 ))

          # Did the budget actually expire? THREE-valued: "yes" | "no" | ""
          # (UNKNOWN, when elapsed could not be read). NEVER collapse UNKNOWN
          # into "no". That collapse is precisely how arm 3 came to assert an
          # external cancel for a job that had in fact exhausted its own budget:
          # it interpolated `elapsed_min` into its message but never TESTED it,
          # so the only arm performing the budget test was arm 2 -- which is
          # guarded on an apt step being mid-flight and therefore unreachable on
          # any job whose apt steps are guarded to 0s.
          budget_reached=""
          if [ -n "$elapsed_min" ]; then
            if [ "$elapsed_min" -ge "$budget_floor" ]; then
              budget_reached="yes"
            else
              budget_reached="no"
            fi
          fi

          # One legible phrase per state, for the arms that REPORT rather than
          # rule. The UNKNOWN wording never implies the budget was not reached.
          case "$budget_reached" in
            yes) budget_phrase="which IS its full ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            no)  budget_phrase="short of its ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            *)   budget_phrase="against a ${JOB_TIMEOUT_MINUTES}-minute budget whose expiry could NOT be checked" ;;
          esac

          # --- Arm 2: the job budget expired while an apt step was still
          # running. Requires THREE facts. The `cancelled` guard is the one
          # arm 3 already carried and this arm was missing: a JOB_STATUS of
          # `failure` with an apt step mid-flight past the budget floor is NOT
          # a job timeout, and this text ("GitHub concludes a job timeout as
          # 'cancelled'") would be describing a mechanism that did not fire.
          # That state belongs to arm 2b, which names the real conclusion.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$apt_running" ] && [ "$budget_reached" = "yes" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::The ${JOB_TIMEOUT_MINUTES}-minute job budget expired after ${elapsed_min} min while step(s) '$apt_running' were STILL RUNNING. $why GitHub concludes a job timeout as 'cancelled', which 'gh pr checks' renders as 'fail' with zero failing steps - that rendering is what makes this look like your test failure. It is not. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2b: the job did NOT conclude `cancelled`, yet an apt step
          # was left mid-flight. A step-level `timeout-minutes` expiry is the
          # primary mechanism this change introduces, and which of the two job
          # conclusions GitHub surfaces for it is NOT something this change
          # established. So handle both: under `cancelled` semantics arms 1/2
          # cover it, and under `failure` semantics this arm does. Betting on
          # one and printing "cancelled from outside" under the other would be
          # flatly false about the mechanism we just added.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -n "$apt_running" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_running' were interrupted mid-flight (step outcome 'cancelled') and this job concluded '$JOB_STATUS'. $why Nothing here is a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2c: cancelled with an apt step mid-flight, but arm 2's
          # budget test did not fire. Two sub-cases, and NEITHER licenses
          # ruling the stall out: an apt step really was running when this job
          # died.
          if [ -n "$apt_running" ]; then
            if [ -z "$elapsed_min" ]; then
              echo "::warning title=Cannot rule the apt stall in or out::Step(s) '$apt_running' were still mid-flight when this job was cancelled, but this run's elapsed time could NOT be read - the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so the known apt-mirror stall can be NEITHER confirmed NOR ruled out here. Nothing here is a verdict on the code in this change. $ref"
            else
              echo "::warning title=Cancelled with an apt step mid-flight::Step(s) '$apt_running' were still mid-flight when this job was cancelled after ${elapsed_min} min - well short of its ${JOB_TIMEOUT_MINUTES}-minute budget, which points at an external cancel ($EXTERNAL_CANCEL_NOTE) rather than the apt-mirror stall. But an apt step was genuinely running, so this does not rule the stall out either. Nothing here is a verdict on the code in this change. $ref"
            fi
            exit 0
          fi

          # --- Arm 2d: cancelled AT OR PAST its budget, with NO apt step
          # implicated at all. The job exhausted its OWN budget running its OWN
          # work -- a job timeout. This is the FOURTH cause of `cancelled`, and
          # the one this step's header taxonomy omitted: not the apt stall, not
          # a merge-train reap, not an external cancel. Without this arm the
          # state fell through to arm 3, which reported it as "cancelled from
          # outside" -- how a producer that timed out on nearly every main push
          # for days was read as a benign supersede every single time.
          #
          # Guarded on `soft_failed` being empty for the same reason every other
          # ruling arm is: a soft-failed apt step can have red this job through
          # the cascade, and this arm asserts a positive cause. When one is
          # present, arm 3a speaks instead and hedges.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "yes" ] && [ -z "$soft_failed" ]; then
            if [ "$apt_rows_seen" -gt 0 ]; then
              echo "::error title=Job budget exhausted - a TIMEOUT, not an external cancel::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, and GitHub cancelled it when that budget expired. No apt-dependent step failed, none was mid-flight, and none soft-failed - so this is NOT the apt-mirror stall, and NOT an external cancel either (a reap or a manual cancel lands at an arbitrary, typically far earlier, elapsed). The job's own work did not fit its budget. A job timeout concludes as 'cancelled' with ZERO failing steps, which 'gh pr checks' renders as 'fail' - that rendering is what makes this look like a test failure. It is not a verdict on the diff. But re-running WITHOUT raising the budget will most likely time out again: raise the budget, or make the work fit it. $ref_budget"
            else
              echo "::warning title=Job budget exhausted, but the apt telemetry was EMPTY::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, so the budget WAS reached and a job timeout is the leading explanation. But APT_STEP_OUTCOMES parsed to ZERO rows - a step id was renamed or removed, so the expression rendered empty - which makes 'no apt-dependent step failed' an absence of DATA here, not an observation. The apt-mirror stall therefore can NOT be ruled out, and this arm will not assert a cause from telemetry it did not receive. Fix the step-id reference so the next run can rule. $ref_budget $ref"
            fi
            exit 0
          fi

          # --- Arm 3a: cancelled, nothing mid-flight, but an apt step
          # SOFT-failed. Arm 3's "No apt-dependent step failed" would be
          # flatly false here - one demonstrably did - so arm 3 does not get
          # to speak for this state.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=Cancelled, and a soft-failed apt step may have red this job downstream::This job was cancelled after ${elapsed_min:-an unknown number of} min, $budget_phrase. No apt-dependent step was mid-flight, but step(s) '$soft_failed' soft-failed ('continue-on-error: true'), so the apt-mirror stall can NOT be ruled out here, and steps that needed what they install may have failed as a consequence. Note the budget reading above: where it says the budget WAS reached, a plain job timeout is also live as a cause, and these two cannot be separated while a soft-failed apt step is in play. A cancelled run also reports no test results at all, so nothing here is a verdict on the code under test either way. $ref"
            exit 0
          fi

          # --- Arm 3: cancelled, no apt step red the job, none was mid-flight,
          # none soft-failed, and the elapsed time is KNOWN and SHORT of the
          # budget. The stall is ruled out by the step outcomes (a positive
          # fact) and a job timeout is ruled out by the measurement, so an
          # external cancel is what is left. Explicitly decline to judge the
          # diff either way.
          #
          # The `budget_reached = "no"` guard is this arm's whole correction.
          # It used to fire on ANY cancelled job, so it claimed an external
          # cancel for job timeouts too -- while printing the very elapsed
          # figure that refuted it.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "no" ]; then
            echo "::notice title=Run cancelled externally - NOT a verdict on this diff::This job was cancelled after ${elapsed_min} min, $budget_phrase. No apt-dependent step failed and none was mid-flight, so this was NOT the known apt-mirror stall; and it did not reach its own budget, so it was NOT a job timeout. It was cancelled from outside: $EXTERNAL_CANCEL_NOTE. A cancelled run reports no test results at all, so nothing here says anything about the code under test: do not read it as a failure of this change, and do not read it as a pass either. Re-run if you need a verdict."
            exit 0
          fi

          # --- Arm 3b: cancelled, nothing implicated, and the elapsed time
          # could NOT be read. A job timeout and an external cancel are
          # indistinguishable without that measurement, so say so instead of
          # picking one. This is the branch arm 3 used to swallow: it asserted
          # an external cancel from a number it did not have.
          if [ "$JOB_STATUS" = "cancelled" ]; then
            echo "::warning title=Cancelled - a timeout cannot be told from an external cancel::This job was cancelled, but this run's elapsed time could NOT be read: the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so a job-budget TIMEOUT and an external cancel ($EXTERNAL_CANCEL_NOTE) can NOT be told apart here. That is UNKNOWN - it is specifically NOT evidence of an external cancel. No apt-dependent step failed and none was mid-flight, so the apt-mirror stall IS ruled out, by the step outcomes rather than by any measurement. A cancelled run reports no test results at all, so nothing here speaks to the code under test. $ref"
            exit 0
          fi

          # --- Unreachable under `if: cancelled() || failure()`: every
          # non-cancelled path above has already returned. Kept so an unforeseen
          # state says what it knows instead of falling through silently.
          echo "::notice title=No infrastructure verdict::Job status '$JOB_STATUS', no apt-dependent step red the job, none mid-flight. This marker has nothing to add about the code under test. $ref"

  # ----------------------------------------------------------------------
  # `Migration Reversal Tested` -- a POSITIVE "this PR's migration was
  # exercised" signal, from an ISOLATED checkout (plan
  # 2026-10-05-coord-clears-a-migration-on-a-reversal-gate-it-cannot-attribute,
  # D1 / Phase 1).
  #
  # Why `reverse` is not that signal: it runs up -> down -> up from the PR's
  # own merge checkout, so every other file in the head is on its import
  # path (`alembic/env.py` imports `app.db.base`, which imports every model
  # module) -- a `backend/app/**` change can neuter the test before the
  # migration runs. And it exits 0 WITHOUT testing anything in three shapes
  # (`alembic heads` fails, >1 head, a merge-revision head), so its green
  # does not say the migration ran.
  #
  # This job inverts both. It checks out the PR BASE, overlays ONLY the
  # PR's one changed file under `backend/alembic/versions/` from the PR
  # head, and runs up -> down -> up there -- so `env.py`, `alembic.ini`, the
  # models, `pyproject.toml` and the poetry lock all come from the base, and
  # nothing else in the head runs in that process. And it emits `success`
  # ONLY when ALL of these hold; every other outcome, including every shape
  # `reverse` skips, is a FAILURE with an `::error::` naming the condition:
  #   (a) exactly one file under backend/alembic/versions/ is ADDED, and it
  #       is a regular, top-level `.py` migration file;
  #   (b) no file under backend/alembic/versions/ is modified, deleted,
  #       renamed, copied or type-changed (an edit keeps a revision id the
  #       base already has; a deletion or rename means this job would test a
  #       different tree from the one that lands), and the added path does
  #       not already exist at the base TIP (a stale-base PR whose file the
  #       base has since added would otherwise replace the base's copy);
  #   (c) after the overlay, the revision graph resolves to exactly ONE head,
  #       that head's file IS the overlaid file, alembic raised no duplicate
  #       warning while building it ("present more than once" / "loaded
  #       twice"), and the head's revision id is NOT one the base already
  #       defines (read from the pure base tree BEFORE the overlay -- a byte
  #       copy of a base revision is not a new migration);
  #   (d) that head is not a merge revision -- decided from alembic's own
  #       `Revision.down_revision` type (tuple/list => merge), never by text;
  #   (e) `upgrade <down_revision>`, `upgrade head`, `downgrade -1` and
  #       `upgrade head` all exit 0; `alembic_version` -- read by psql in the
  #       trusted shell, not by anything that imports the migration -- equals
  #       the expected revision after each (the head's down_revision after the
  #       downgrade, empty for a root revision); AND the database SCHEMA after
  #       the downgrade is identical to the schema before the upgrade
  #       (`pg_dump --schema-only`, normalized, compared in the trusted
  #       shell). The schema comparison is what catches a no-op downgrade of
  #       a schema-changing upgrade -- `CREATE TABLE IF NOT EXISTS` with
  #       `def downgrade(): pass` passes up -> down -> up, but leaves the
  #       table behind.
  #       DISCLOSED -- what (e) does NOT check: DATA reversibility. A
  #       data-only migration whose downgrade is `pass`, or a downgrade that
  #       re-adds a dropped column EMPTY, leaves the schema identical and
  #       passes. Column ORDER inside a table is also ignored (a downgrade
  #       that re-adds a dropped column appends it), so a reordering is not
  #       reported.
  # Every step that imports the migration must end with an explicit
  # `MRT_VERDICT ok ...` line that the trusted shell parses; an exit code of
  # 0 alone is never read as a pass (a top-level `sys.exit(0)` in a
  # migration exits 0 with nothing checked).
  # The changed set is computed three-dot from the PR HEAD sha
  # (`base...<head sha>`), the same sha the overlay reads, so the file that
  # is counted and the file that is tested come from one ref.
  #
  # ⚠️ TRUST BOUNDARY -- read before relying on this check. The migration
  # file is UNTRUSTED CODE, and this job EXECUTES it: alembic imports it to
  # build the revision graph and runs its upgrade()/downgrade(). The checks
  # above defeat an accidental or careless migration (an import-time exit,
  # a downgrade that leaves the schema changed, a stale chain). They do NOT
  # defeat DATA loss (see (e)), and they do NOT defeat an actively
  # hostile one: code running in this job can print a forged verdict line,
  # write the expected `alembic_version` row itself, or tamper with the
  # runner. Unsetting GITHUB_ENV / GITHUB_OUTPUT / GITHUB_PATH /
  # GITHUB_STEP_SUMMARY / BASH_ENV for those commands narrows the obvious
  # channels into later steps; it is not a sandbox. So coord MUST NOT treat
  # this check's `success` as adversarial proof of reversibility -- it is
  # evidence about a migration written in good faith, nothing stronger
  # (plan 2026-10-05-coord-clears-a-migration-on-a-reversal-gate-it-cannot-
  # attribute, section 7).
  #
  # Consumer: coord's agent evidence door for a classifier-rejected
  # migration (Phases 2-4 of the plan). It is NOT a required check -- see
  # the header -- and it is deliberately red on a PR that carries two
  # migrations or chains off a stale head: a multi-migration PR is still
  # tested by `reverse`, it just cannot be agent-cleared on this signal.
  # Cost, accepted in the plan: a migration that imports app code changed
  # in the same head fails here. That is red and visible; split the PR.
  tested:
    name: Migration Reversal Tested
    needs: detect
    if: needs.detect.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Read the repo only: the checkout and the base/head object reads. Narrower
    # than the workflow default (which adds `actions: read` for the
    # explainer's run lookup -- the explainer here falls back to that lookup
    # only when this job's own start stamp is missing).
    permissions:
      contents: read  # checkout + git object reads of the base and head shas
    # Sized like `reverse` (same up -> down -> up over the whole graph, same
    # install), whose measured max green run is 7.7 min. See `reverse`'s
    # note: the runtime grows with the migration count, so re-measure.
    timeout-minutes: 25

    services:
      postgres:
        # Same service as `reverse`: models with a Vector column need pgvector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qontinui_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: qontinui_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # Must stay the FIRST step -- see the same step in `reverse`.
      - name: Record job start time
        working-directory: ${{ github.workspace }}
        run: echo "JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      # The PR merge ref, with full history: `detect`'s three-dot diff needs
      # the merge base, and the overlay below needs the PR head sha, which is
      # a parent of the merge commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Conditions (a) and (b), then switch the whole tree to the BASE sha.
      # Runs before any install, so a PR that cannot qualify fails in
      # seconds -- and so the install below resolves the BASE's
      # pyproject.toml / poetry.lock, not the head's. The one migration file
      # is overlaid from the PR head only AFTER the base's revision set has
      # been read (see "Base revision set" below), so that read sees a pure
      # base tree.
      - name: Qualify the PR's migration and switch to the base tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Rename detection is forced on (`-M`), and NUL-separated output
          # (`-z`) is parsed rather than whitespace-split, so no path spelling
          # can smuggle a second entry past the count.
          # Three-dot from the HEAD SHA (not the merge ref's `HEAD`), so the
          # changed set and the overlay below read the same commit.
          git diff -z --name-status -M "$BASE_SHA"..."$HEAD_SHA" > "$RUNNER_TEMP/mrt-diff.bin"
          python3 - "$RUNNER_TEMP/mrt-diff.bin" <<'PY'
          import os
          import re
          import sys

          VERSIONS = "backend/alembic/versions/"
          # A top-level migration module with a plain name. Anything else under
          # versions/ (a subdirectory, a non-.py file, an odd spelling) is not a
          # file alembic loads as a revision here, so it cannot be "the" tested
          # migration -- and the name is written to $GITHUB_ENV below, so it
          # must not be able to carry a newline either.
          MIGRATION = re.compile(r"backend/alembic/versions/[A-Za-z0-9_][A-Za-z0-9_.-]*\.py")

          def fail(cond, msg):
              print(f"::error title=Migration Reversal Tested - condition ({cond}) failed::{msg}")
              sys.exit(1)

          fields = open(sys.argv[1], "rb").read().decode("utf-8", "surrogateescape").split("\0")
          if fields and fields[-1] == "":
              fields.pop()
          entries = []
          i = 0
          while i < len(fields):
              status = fields[i]
              # R<score> / C<score> carry two paths (old, new); every other
              # status carries one.
              n = 2 if status[:1] in ("R", "C") else 1
              paths = fields[i + 1 : i + 1 + n]
              if len(paths) != n:
                  fail("b", f"could not parse git diff --name-status output near {status!r}; refusing to guess.")
              entries.append((status, paths))
              i += 1 + n

          touched = [(s, p) for s, p in entries if any(x.startswith(VERSIONS) for x in p)]
          for s, p in touched:
              print(f"  {s}\t{' -> '.join(p)}")

          # ONLY an addition qualifies. An edit (M) of an existing migration
          # keeps that file's revision id -- an id the base already defines --
          # so it is not a new migration. D/R/C/T would test a different
          # revision graph from the one that lands.
          removed = [(s, p) for s, p in touched if s[:1] != "A"]
          if removed:
              shown = "; ".join(f"{s} {' -> '.join(p)}" for s, p in removed)
              fail("b", f"a file under {VERSIONS} is modified, deleted, renamed, copied or type-changed against the base ({shown}). Only a newly ADDED migration file can be the tested migration: an edit keeps a revision id the base already defines, and a deletion or rename tests a different revision graph from the one that lands.")

          if len(touched) != 1:
              fail("a", f"exactly one file under {VERSIONS} must be added; this PR adds {len(touched)}. Split the PR so each migration is tested on its own.")

          status, (path,) = touched[0]
          if not MIGRATION.fullmatch(path):
              fail("a", f"the one changed file under {VERSIONS} ({path!r}) is not a top-level .py migration file.")

          # Later steps read it from $GITHUB_ENV; the rest of THIS step reads
          # it from the file (a $GITHUB_ENV write is not visible until the
          # next step).
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"MRT_MIGRATION={path}\n")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "mrt-path"), "w", encoding="utf-8") as fh:
              fh.write(path)
          print(f"Conditions (a) and (b) hold: the one migration file is {path} ({status}).")
          PY

          MRT_MIGRATION=$(cat "$RUNNER_TEMP/mrt-path")

          # Condition (a), continued: the migration must be a REGULAR file at
          # the head. A symlink (mode 120000) pointing at an existing revision
          # would make alembic load that revision twice, and the head check
          # would then be comparing a file with itself.
          mode=$(git ls-tree "$HEAD_SHA" -- "$MRT_MIGRATION" | cut -d' ' -f1)
          case "$mode" in
            100644|100755) ;;
            *)
              echo "::error title=Migration Reversal Tested - condition (a) failed::$MRT_MIGRATION is not a regular file at the PR head (git mode '${mode:-<absent>}'; a symlink is 120000). Only a regular .py migration file can be the tested migration."
              exit 1
              ;;
          esac

          # Condition (b), continued: the path must NOT already exist at the
          # base TIP. The changed set above is three-dot (from the merge base),
          # but the overlay below lands on the base tip, so a stale-base PR
          # whose "added" file was meanwhile added on the base too would
          # otherwise REPLACE the base's own copy -- a file, and a revision id,
          # the base already has. `cat-file -e` exits 0 iff the object exists.
          if git cat-file -e "$BASE_SHA:$MRT_MIGRATION" 2>/dev/null; then
            echo "::error title=Migration Reversal Tested - condition (b) failed::$MRT_MIGRATION already exists at the base tip $BASE_SHA. This PR's branch is stale: the file it adds has since been added on the base, so overlaying it would REPLACE a base migration rather than add a new one. Rebase onto the current base and give the migration its own file."
            exit 1
          fi

          # Detach onto the BASE. Everything -- env.py, alembic.ini, app/,
          # pyproject.toml, poetry.lock, every existing migration -- is now
          # the base's; the overlay step below adds exactly one file.
          git checkout --quiet --detach "$BASE_SHA"
          # A pure base tree: no tracked difference from the base, and nothing
          # untracked under versions/ (an untracked .py there is loaded by
          # alembic just like a tracked one). Each read is captured on its own
          # line so a git failure aborts under `set -e` instead of reading as
          # "empty, therefore clean".
          untracked=$(git status --porcelain --untracked-files=all -- backend/alembic/versions)
          if [ -n "$untracked" ] || ! git diff --quiet "$BASE_SHA"; then
            echo "::error title=Migration Reversal Tested - isolation failed::the tree is not the pure base $BASE_SHA after the switch:"
            git status --short
            exit 1
          fi
          echo "Tree is the pure base $BASE_SHA."

      # qontinui (a path-dep) pulls torch — large enough to overflow runner disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # Same sibling path-deps as `reverse` (mirrors backend-ci.yml).
      - name: Checkout sibling repos (qontinui-schemas, qontinui, qontinui-cloud-control)
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/jspinak/qontinui.git
          git clone --depth 1 https://github.com/qontinui/qontinui-cloud-control.git

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Resolves the BASE's lock: the tree was switched above.
      - name: Install dependencies
        run: |
          cd backend
          pip install poetry
          poetry install

      # Condition (c), first half. The revision ids the BASE already defines,
      # read from alembic's own ScriptDirectory over the PURE base tree --
      # before the overlay, so no head file is imported here: this is the one
      # process in the job that builds a revision graph from trusted code
      # alone. The overlaid migration must define a revision id that is NOT in
      # this set. A byte copy of an existing base revision, named so it sorts
      # before the original (e.g. `0000_copy.py`), is otherwise a second
      # definition of that id -- alembic warns and keeps whichever duplicate it
      # maps last -- and the single head could then BE the overlaid file while
      # up -> down -> up exercised the base's own migration: a false
      # `success`. EVERY base revision id is in the set: only an added file
      # qualifies, and one whose path already exists at the base tip is
      # refused, so the overlay never replaces a base file.
      # Written under $RUNNER_TEMP, never $GITHUB_ENV.
      - name: Base revision set (pure base tree, before the overlay)
        env:
          DATABASE_URL: postgresql://qontinui_user:test_password@localhost:5432/qontinui_test
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          ENVIRONMENT: development
          TESTING: 1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cd backend
          set -euo pipefail
          # A pure base tree: no tracked difference from the base, and nothing
          # untracked under versions/ (an untracked .py there is loaded by
          # alembic just like a tracked one). Each read is captured on its own
          # line so a git failure aborts under `set -e` instead of reading as
          # "empty, therefore clean".
          untracked=$(git status --porcelain --untracked-files=all -- alembic/versions)
          if [ -n "$untracked" ] || ! git diff --quiet "$BASE_SHA"; then
            echo "::error title=Migration Reversal Tested - isolation failed::the tree is not the pure base $BASE_SHA, so the base revision set cannot be read from trusted code alone:"
            git status --short
            exit 1
          fi
          poetry run python - "$RUNNER_TEMP/mrt-base-revs" <<'PY'
          import sys

          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("alembic.ini"))
          revs = sorted(sc.revision for sc in script.walk_revisions(base="base", head="heads"))
          if not revs:
              print("::error title=Migration Reversal Tested - condition (c) failed::the base defines no revisions; an empty base set would read as 'nothing to collide with', so refusing.")
              sys.exit(1)
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              fh.write("".join(f"{r}\n" for r in revs))
          print(f"Base defines {len(revs)} revision id(s).")
          PY

      # The isolation: take exactly one file from the PR head onto the base.
      - name: Overlay the PR's migration onto the base tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout "$HEAD_SHA" -- "$MRT_MIGRATION"
          if [ ! -f "$MRT_MIGRATION" ] || [ -L "$MRT_MIGRATION" ]; then
            echo "::error title=Migration Reversal Tested - condition (a) failed::after the overlay, $MRT_MIGRATION is not a regular file in the working tree (missing or a symlink)."
            exit 1
          fi
          echo "Tree is base $BASE_SHA plus $MRT_MIGRATION from head $HEAD_SHA:"
          git status --short
          # Prove the overlay is the ONLY difference from the base, rather
          # than trusting the two commands above to have done exactly that.
          others=$(git diff --name-only "$BASE_SHA" | grep -vxF "$MRT_MIGRATION" || true)
          if [ -n "$others" ]; then
            echo "::error title=Migration Reversal Tested - isolation failed::files other than $MRT_MIGRATION differ from the base: $others"
            exit 1
          fi

      - name: Install postgresql-client
        id: apt_psql
        # Same guarded, apt-only, bounded step as `reverse` -- see the long
        # note there for why only apt lives here and why it is bounded.
        # This job ALSO needs the major-16 pg_dump (the service image is
        # pgvector/pgvector:pg16; keep the two in step): the reversibility
        # step compares schema dumps and refuses a pg_dump whose major is not
        # the server's. The runner image normally ships it, so apt is skipped.
        timeout-minutes: 10
        run: |
          if command -v psql >/dev/null && [ -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            echo "psql and the major-16 pg_dump are present; no apt needed."
          else
            sudo apt-get update && sudo apt-get install -y postgresql-client-16
          fi

      - name: Create named schemas + extension
        # Unbounded and without an `id:`, as in `reverse`: a failure here is a
        # verdict on the change, never the infrastructure marker's business.
        env:
          PGPASSWORD: test_password
        run: |
          psql -X -h localhost -U qontinui_user -d qontinui_test -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS project;" \
            -c "CREATE SCHEMA IF NOT EXISTS auth;" \
            -c "CREATE SCHEMA IF NOT EXISTS cloud;" \
            -c "CREATE SCHEMA IF NOT EXISTS coord;" \
            -c "CREATE SCHEMA IF NOT EXISTS strategy;" \
            -c "CREATE SCHEMA IF NOT EXISTS web;" \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Conditions (c) and (d), read from alembic's own ScriptDirectory over
      # the isolated tree -- the same object `alembic heads` prints from --
      # never from the migration file's text.
      - name: Head identity (one head, it is the overlaid file, not a merge)
        env:
          DATABASE_URL: postgresql://qontinui_user:test_password@localhost:5432/qontinui_test
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          ENVIRONMENT: development
          TESTING: 1
        run: |
          cd backend
          set -euo pipefail
          # Toolchain first, so a broken env is an infra failure, not a
          # misreported condition.
          poetry run alembic --version
          # Building the revision graph IMPORTS the migration, so this python
          # runs untrusted code: strip the channels into later steps (see the
          # job's TRUST BOUNDARY note), and never read its exit code as a
          # pass -- the verdict is the final `MRT_VERDICT ok` line, parsed
          # below in this trusted shell.
          set +e
          env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STEP_SUMMARY -u GITHUB_STATE -u BASH_ENV \
            poetry run python - <<'PY' | tee "$RUNNER_TEMP/mrt-identity.out"
          import os
          import re
          import sys
          import warnings

          from alembic.config import Config
          from alembic.script import ScriptDirectory

          def fail(cond, msg):
              print(f"::error title=Migration Reversal Tested - condition ({cond}) failed::{msg}")
              sys.exit(1)

          # abspath, NOT realpath: realpath would let a symlink and its target
          # compare equal, which is exactly the shape condition (a) refuses.
          overlaid = os.path.abspath(os.path.join("..", os.environ["MRT_MIGRATION"]))
          # Record every warning raised while the graph is built. alembic warns
          # -- it does not fail -- on the two duplicate shapes, and silently
          # keeps one copy: "Revision <id> is present more than once" (two files
          # define one revision id) and "File <path> loaded twice! ignoring" (one
          # file reached twice). Either means the graph this job verifies is not
          # the one the files describe, so either is a failure of (c).
          try:
              with warnings.catch_warnings(record=True) as caught:
                  warnings.simplefilter("always")
                  script = ScriptDirectory.from_config(Config("alembic.ini"))
                  heads = script.get_heads()
          except BaseException as exc:  # incl. SystemExit/KeyboardInterrupt from an import-time exit
              fail("c", f"the revision graph does not resolve on the base plus {os.environ['MRT_MIGRATION']}: {type(exc).__name__}: {exc}")

          dupes = [str(w.message) for w in caught if "more than once" in str(w.message) or "loaded twice" in str(w.message)]
          if dupes:
              fail("c", f"alembic loaded a duplicate while building the revision graph on the base plus {os.environ['MRT_MIGRATION']}: {' | '.join(dupes)}. It keeps one copy and ignores the other, so the revision this job would exercise is not decided by the PR's file.")

          if len(heads) != 1:
              fail("c", f"the base plus this migration has {len(heads)} heads ({', '.join(sorted(heads))}), not exactly one. The migration must chain off the base's single head; re-point its down_revision onto the current head.")

          head = script.get_revision(heads[0])
          if os.path.islink(head.path):
              fail("c", f"the single head {heads[0]} is loaded from a symlink ({head.path}); only a regular migration file can be the tested migration.")
          head_path = os.path.abspath(head.path)
          if head_path != overlaid:
              fail("c", f"the single head is {heads[0]} ({os.path.relpath(head_path)}), not the PR's migration {os.environ['MRT_MIGRATION']}. Only the head is exercised by upgrade -> downgrade -1 -> upgrade, so this PR's migration would not be the one tested.")

          if isinstance(head.down_revision, (tuple, list)):
              fail("d", f"the head {heads[0]} is a merge revision (down_revision = {head.down_revision!r}); 'downgrade -1' is ambiguous at a merge point, so there is no single step for this job to exercise.")

          REV = re.compile(r"[A-Za-z0-9_]+")
          down = head.down_revision
          if not REV.fullmatch(heads[0]) or not (down is None or (isinstance(down, str) and REV.fullmatch(down))):
              fail("c", f"head {heads[0]!r} / down_revision {down!r} is not a plain [A-Za-z0-9_]+ revision id this job can verify against alembic_version.")

          print(f"Conditions (c) and (d) hold: single head {heads[0]} is {os.environ['MRT_MIGRATION']}, down_revision {down!r}.")
          sys.stdout.flush()
          print(f"MRT_VERDICT ok head={heads[0]} down={'None' if down is None else down}")
          PY
          rc=${PIPESTATUS[0]}
          set -e
          last=$(tail -n 1 "$RUNNER_TEMP/mrt-identity.out")
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Migration Reversal Tested - condition (c) failed::the head-identity check exited $rc."
            exit 1
          fi
          if ! [[ "$last" =~ ^MRT_VERDICT\ ok\ head=([A-Za-z0-9_]+)\ down=([A-Za-z0-9_]+)$ ]]; then
            echo "::error title=Migration Reversal Tested - condition (c) failed::the head-identity check exited 0 without its final 'MRT_VERDICT ok head=<rev> down=<rev>' line (last line: '${last}'). An exit code of 0 is not a verdict: a migration that calls sys.exit(0) at import ends the check with nothing verified."
            exit 1
          fi
          head_rev=${BASH_REMATCH[1]}
          down_rev=${BASH_REMATCH[2]}
          # Condition (c), second half, decided HERE in the trusted shell from
          # the set the pure-base step wrote: the head's revision id must be
          # new. A head whose id the base already defines is a copy of a base
          # revision, and up -> down -> up would exercise that revision, not a
          # migration this PR authored. (The untrusted process above could
          # rewrite this file; per the job's TRUST BOUNDARY note this defeats
          # an accidental copy, not a hostile migration.)
          base_revs="$RUNNER_TEMP/mrt-base-revs"
          if [ ! -s "$base_revs" ]; then
            echo "::error title=Migration Reversal Tested - condition (c) failed::the base revision set ($base_revs) is missing or empty, so whether head $head_rev is a new revision is UNKNOWN -- not passed."
            exit 1
          fi
          if grep -qxF -- "$head_rev" "$base_revs"; then
            echo "::error title=Migration Reversal Tested - condition (c) failed::the head revision $head_rev from $MRT_MIGRATION is ALREADY defined by the base. The PR's file is a copy of an existing revision, not a new migration, so upgrade -> downgrade -1 -> upgrade would exercise the base's own migration."
            exit 1
          fi
          {
            echo "MRT_HEAD=$head_rev"
            echo "MRT_DOWN=$down_rev"
          } >> "$GITHUB_ENV"
          echo "Verdict parsed: head=$head_rev (not in the base's revision set) down=$down_rev."

      # Condition (e). Same env, working directory and database as `reverse`,
      # but with NO skip path, and with the schema compared across the step
      # under test: any non-zero exit, unexpected alembic_version, or schema
      # difference fails the job.
      - name: Reversibility test (upgrade → downgrade -1 → upgrade, schema compared)
        env:
          DATABASE_URL: postgresql://qontinui_user:test_password@localhost:5432/qontinui_test
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          ENVIRONMENT: development
          TESTING: 1
          PGPASSWORD: test_password
        run: |
          cd backend
          set -euo pipefail
          # MRT_HEAD / MRT_DOWN were parsed from the identity verdict by the
          # previous step's trusted shell. "None" is a root revision.
          : "${MRT_HEAD:?}" "${MRT_DOWN:?}"
          # -X: never read a ~/.psqlrc. Everything below that reads the
          # database is psql / pg_dump in THIS shell -- nothing here imports
          # the migration.
          PSQL=(psql -X -h localhost -U qontinui_user -d qontinui_test -v ON_ERROR_STOP=1 -tA)

          # pg_dump of the SERVER's major version, by explicit path: the
          # pg_wrapper `pg_dump` on PATH picks the newest installed client,
          # which need not be the server's. An unreadable server version or a
          # missing binary is an error, never a skipped comparison.
          server_num=$("${PSQL[@]}" -c "SHOW server_version_num")
          if ! [[ "$server_num" =~ ^[0-9]{5,6}$ ]]; then
            echo "::error title=Migration Reversal Tested - condition (e) failed::could not read the server version (got '$server_num'), so the schema comparison cannot be made -- not passed."
            exit 1
          fi
          server_major=$(( 10#$server_num / 10000 ))
          PG_DUMP="/usr/lib/postgresql/$server_major/bin/pg_dump"
          if [ ! -x "$PG_DUMP" ]; then
            echo "::error title=Migration Reversal Tested - condition (e) failed::no pg_dump for the server's major version $server_major at $PG_DUMP, so the schema comparison cannot be made -- not passed. Keep 'Install postgresql-client' in step with the service image."
            exit 1
          fi
          echo "Server major $server_major; schema snapshots by $("$PG_DUMP" --version)."

          # Normalizes a schema-only dump into a stable form for comparison:
          # drops comments, blank lines, SET / set_config preamble and the
          # per-dump random `\restrict` key lines, and sorts the column lines
          # inside each CREATE TABLE (a downgrade that re-adds a dropped column
          # appends it; order is DISCLOSED as unchecked in the job header).
          # Held in a shell variable, not a file, so the migration code that
          # runs between snapshots cannot rewrite it.
          NORMALIZE=$(cat <<'PY'
          import re
          import sys

          out, block = [], None
          for line in open(sys.argv[1], encoding="utf-8").read().splitlines():
              if not line.strip() or line.startswith("--"):
                  continue
              if line.startswith(("SET ", "SELECT pg_catalog.set_config(", "\\restrict", "\\unrestrict")):
                  continue
              if block is not None:
                  if line.startswith(")"):
                      out.extend(sorted(x.rstrip().rstrip(",") for x in block))
                      out.append(line)
                      block = None
                  else:
                      block.append(line)
                  continue
              out.append(line)
              if re.match(r"CREATE (UNLOGGED )?TABLE .* \($", line):
                  block = []
          if block is not None:
              sys.exit("unterminated CREATE TABLE block in the dump")
          print("\n".join(out))
          PY
          )
          snapshot() {
            local label="$1" raw="$RUNNER_TEMP/mrt-schema-$1.raw.sql" norm="$RUNNER_TEMP/mrt-schema-$1.sql"
            # alembic_version is excluded: it is bookkeeping, checked by
            # expect_version, and absent before the first upgrade of a root.
            if ! "$PG_DUMP" -h localhost -U qontinui_user -d qontinui_test \
                  --schema-only --no-owner --no-privileges \
                  --exclude-table=public.alembic_version > "$raw"; then
              echo "::error title=Migration Reversal Tested - condition (e) failed::pg_dump failed taking the '$label' schema snapshot for $MRT_MIGRATION -- not passed."
              exit 1
            fi
            if ! python3 -c "$NORMALIZE" "$raw" > "$norm" || [ ! -s "$norm" ]; then
              echo "::error title=Migration Reversal Tested - condition (e) failed::could not normalize the '$label' schema snapshot for $MRT_MIGRATION -- not passed."
              exit 1
            fi
            echo "schema snapshot '$label': $(wc -l < "$norm") normalized lines."
          }
          expect_version() {
            local want="$1" label="$2" got
            if ! got=$("${PSQL[@]}" -c "SELECT version_num FROM alembic_version ORDER BY version_num"); then
              echo "::error title=Migration Reversal Tested - condition (e) failed::could not read alembic_version after '$label' for $MRT_MIGRATION."
              exit 1
            fi
            if [ "$want" = "None" ]; then want=""; fi
            if [ "$got" != "$want" ]; then
              echo "::error title=Migration Reversal Tested - condition (e) failed::after '$label', alembic_version is '${got//$'\n'/,}' but must be '${want:-<empty: root downgraded>}' for $MRT_MIGRATION."
              exit 1
            fi
            echo "alembic_version after '$label': '${got:-<empty>}' (expected)."
          }
          step() {
            echo "== $1 =="
            # Untrusted code runs here (the migration): strip the channels into
            # later steps -- see the job's TRUST BOUNDARY note.
            if ! env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STEP_SUMMARY -u GITHUB_STATE -u BASH_ENV \
                poetry run alembic "${@:3}"; then
              echo "::error title=Migration Reversal Tested - condition (e) failed::'alembic ${*:3}' exited non-zero for $MRT_MIGRATION (step: $1)."
              exit 1
            fi
            expect_version "$2" "$1"
          }

          # 1. The base, up to the migration's parent. For a root revision
          #    the pre-state is the database as created above.
          if [ "$MRT_DOWN" = "None" ]; then
            echo "== root revision: the pre-migration state is the freshly created database =="
          else
            step "upgrade $MRT_DOWN (the migration's parent)" "$MRT_DOWN" upgrade "$MRT_DOWN"
          fi
          snapshot before
          # 2. The migration under test, then its downgrade.
          step "upgrade head" "$MRT_HEAD" upgrade head
          snapshot upgraded
          step "downgrade -1" "$MRT_DOWN" downgrade -1
          snapshot downgraded
          # 3. The downgrade must restore the schema exactly.
          before="$RUNNER_TEMP/mrt-schema-before.sql"
          if ! schema_diff=$(diff -u --label before-upgrade --label after-downgrade "$before" "$RUNNER_TEMP/mrt-schema-downgraded.sql"); then
            echo "Schema after 'downgrade -1' differs from the schema before 'upgrade head':"
            printf '%s\n' "$schema_diff"
            # `|| true`: under pipefail, printf's SIGPIPE when head closes
            # early would otherwise abort this shell before the error prints.
            head_lines=$(printf '%s\n' "$schema_diff" | head -n 20 || true)
            head_lines=${head_lines//'%'/%25}
            head_lines=${head_lines//$'\r'/%0D}
            head_lines=${head_lines//$'\n'/%0A}
            echo "::error title=Migration Reversal Tested - condition (e) failed::the schema after 'downgrade -1' is NOT the schema before 'upgrade head' for $MRT_MIGRATION: its downgrade does not reverse its upgrade (a no-op downgrade of a schema change is the usual cause). Diff head:%0A${head_lines}"
            exit 1
          fi
          if cmp -s "$before" "$RUNNER_TEMP/mrt-schema-upgraded.sql"; then
            echo "Note: the upgrade left the schema unchanged (a data-only or idempotent migration); its DATA reversibility is NOT checked."
          else
            echo "The upgrade changed the schema, and 'downgrade -1' restored it exactly."
          fi
          # 4. Re-apply, as `reverse` does.
          step "upgrade head (re-apply)" "$MRT_HEAD" upgrade head
          echo "Migration Reversal Tested: $MRT_MIGRATION passed upgrade -> downgrade -1 -> upgrade on the isolated base tree, with the schema restored by the downgrade."

      # ----------------------------------------------------------------------
      # CI-infrastructure timeout marker (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 5).
      #
      # A job-level timeout concludes the job as `cancelled`, and `gh pr checks`
      # renders `cancelled` as **fail** -- with ZERO failing steps, because no
      # step failed. An author triaging their own PR sees "fail" against their
      # diff with nothing to point at, and reads it as their own regression. On
      # 2026-08-19 that misattribution cost real time on PR #1015. This step
      # exists so the log says what actually happened.
      #
      # `cancelled` has THREE causes and only the first is this plan's defect:
      #   1. an apt-dependent step stalled against the external mirror (ours)
      #   2. coord's merge train reaping a `merge-candidate/*` ref (benign)
      #   3. a manual / external / superseding cancel (benign)
      # 2 and 3 resolved in MINUTES in every observed case. A marker that
      # shouted "infrastructure timed out" on all three would be wrong on the
      # benign ones, and a diagnostic that is wrong a quarter of the time is
      # worse than none -- it teaches readers to discard the other three
      # quarters. So the ::error:: arms demand POSITIVE evidence that an
      # apt-dependent step is what died, and every other path declines to judge
      # the diff at all.
      #
      # An apt step marked `continue-on-error: true` CAN be present when this
      # step fires. Its own soft failure cannot red the check -- but a LATER,
      # genuine failure can, and this step then runs with that soft-failed
      # outcome still in hand. So arm 1 keys on `.conclusion` (the value AFTER
      # `continue-on-error` rewrites it), never on `.outcome` alone: a step
      # that concluded `success` is not what red this job, and naming it as the
      # cause would misattribute a real regression to infrastructure -- the
      # exact cry-wolf this step exists to prevent.
      #
      # A soft-failed apt step is NOT thereby harmless, and the marker must not
      # say it is. `continue-on-error: true` stops it reding the job DIRECTLY;
      # it does nothing about the cascade. style-gate.yml is the live example:
      # six of its provisioning steps are deliberate SHADOW soft-fails, so a
      # stalled `Install postgresql-client` leaves no psql, the schema and
      # migration steps soft-fail in turn, no snapshots are captured, and with
      # STYLE_GATE_ENFORCE=1 the assert step exits 1. That job is red BECAUSE
      # of the apt stall, with no apt step concluding `failure` anywhere. So
      # every arm that would otherwise assert "this failure is a real one" or
      # "no apt-dependent step failed" is guarded on `soft_failed` being empty,
      # and warns instead of ruling when it is not.
      - name: Explain infrastructure timeout vs external cancellation
        if: cancelled() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          # declared at this job's `timeout-minutes`.
          JOB_TIMEOUT_MINUTES: '25'
          EXTERNAL_CANCEL_NOTE: >-
            this workflow's `concurrency:` block sets `cancel-in-progress` from the expression `github.event_name == 'pull_request' && github.run_attempt == 1`, so whether GitHub auto-supersedes is decided per run and cannot be stated as fixed here - on a first-attempt pull_request run a newer push to the same PR supersedes it (and a reopen supersedes the same-head run it re-does); every other run (push, schedule, dispatch, any re-run) is alone in a per-run group and is never auto-superseded or reaped while pending, so a manual cancel or coord's merge train reaping a merge-candidate/* ref are the remaining external causes
          # `<step name>|<outcome>|<conclusion>` per apt-dependent step in this
          # job. BOTH values are carried on purpose:
          #   * `.outcome` is the value BEFORE `continue-on-error` rewrites it,
          #     so a soft-failed step still reports the truth here;
          #   * `.conclusion` is what actually reached the job, and ONLY a step
          #     that concluded `failure` can be what red it.
          # Every step named below runs `apt-get` and nothing else. Two splits
          # buy that invariant across all 8 workflows: the psql/DDL work that
          # used to share the postgresql-client steps now lives in an unbounded
          # successor step, and `npx playwright install --with-deps` -- npx
          # resolution PLUS a CDN browser download PLUS apt, fused into one
          # step -- is split so that only its apt-only `install-deps` half is
          # ever named here. So a `failure` on any step below is the apt
          # mirror: never the author's schema breaking, and never a Playwright
          # bundle that 404s on cdn.playwright.dev.
          APT_STEP_OUTCOMES: |
            Install postgresql-client|${{ steps.apt_psql.outcome }}|${{ steps.apt_psql.conclusion }}
        run: |
          set -uo pipefail

          # An apt step whose CONCLUSION is `failure` hit its own step-level
          # `timeout-minutes` (or apt errored outright) and red this job --
          # either way it is infrastructure. One whose outcome is `cancelled`
          # was still mid-flight when the job ended; that is only decisive once
          # we also know the job budget had actually expired. One that failed
          # but concluded `success` is `continue-on-error: true`: it did not red
          # this job DIRECTLY, but it can still have red it through the cascade
          # of steps that needed what it installs, so it is tracked separately
          # and never dismissed.
          #
          # Every matching step is named, not just the last one: two apt steps
          # can die in the same job, and reporting only one understates it.
          apt_failed=""
          apt_running=""
          soft_failed=""
          # How many rows actually parsed. An EMPTY APT_STEP_OUTCOMES -- which is
          # what a renamed or deleted step id renders to -- leaves all three
          # buckets empty, exactly like a clean run. That is an absence of DATA,
          # not an observation of health, and arm 2d is the first arm to make a
          # POSITIVE claim on it.
          apt_rows_seen=0
          while IFS='|' read -r step_name outcome conclusion; do
            [ -z "${step_name// }" ] && continue
            apt_rows_seen=$(( apt_rows_seen + 1 ))
            case "$outcome" in
              failure)
                if [ "$conclusion" = "failure" ]; then
                  apt_failed="${apt_failed:+$apt_failed, }$step_name"
                else
                  soft_failed="${soft_failed:+$soft_failed, }$step_name"
                fi
                ;;
              cancelled) apt_running="${apt_running:+$apt_running, }$step_name" ;;
            esac
          done <<< "$APT_STEP_OUTCOMES"

          why="It shells out to apt-get against an external mirror at job time."
          why="$why That call is normally seconds, but has been observed to stall"
          why="$why for 30+ minutes (and, unbounded, for 5h59m). Nothing under test ran."
          ref="See plan 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure."
          # A separate pointer for the budget arms. $ref names the apt-stall
          # plan, which is the wrong citation for an arm that exists to say
          # this was NOT the apt stall.
          ref_budget="See plan 2026-08-27-web-backend-coverage-producer-timeout."

          # Context line, emitted before any verdict.
          if [ -n "$soft_failed" ]; then
            echo "::notice title=Soft-failed apt step - possible upstream cause::Step(s) '$soft_failed' failed but are marked 'continue-on-error: true', so they concluded 'success' and did not DIRECTLY red this job. A later step that needed what they install can still have failed as a consequence, which would make this job's red an apt cascade rather than a verdict on the diff."
          fi

          # --- Arm 1: an apt step failed AND that failure red the job.
          # Airtight: neither a merge-train reap nor any other external cancel
          # can make a step conclude `failure`.
          if [ -n "$apt_failed" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_failed' exceeded a step-level timeout-minutes or failed outright. $why This is a CI infrastructure failure, not a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 1b: no apt step concluded `failure` and none is mid-flight,
          # but one SOFT-failed. The cascade described in the step header is
          # live here, so "this job's failure is a real one" is an assertion
          # this step cannot support. Warn rather than rule -- an UNKNOWN
          # stated as UNKNOWN, not laundered into a negative.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=A soft-failed apt step may have red this job downstream::No apt-dependent step concluded 'failure', but step(s) '$soft_failed' soft-failed ('continue-on-error: true'). $why Steps that needed what they install can have failed as a consequence, so this job's red may be that cascade and NOT a verdict on the diff. Check the cascade before concluding either way. $ref"
            exit 0
          fi

          # --- Neither cancelled nor an apt failure => a genuine red. Say
          # nothing: this step explains infrastructure timeouts, it does not
          # editorialise real test failures.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ]; then
            echo "No apt-dependent step red the job, none was mid-flight, and the job was not cancelled."
            echo "This job's failure is a real one - emitting no marker."
            exit 0
          fi

          # --- Did the run actually reach its budget? A job timeout fires at
          # elapsed >= budget; a reap or a manual cancel lands at an arbitrary,
          # typically far earlier, elapsed (the two observed benign
          # cancellations were at 2m02s and 7m29s). That gap is the
          # discriminator, so resolve it from the API rather than assuming.
          # This lookup CAN fail (403, rate limit, network blip, a timestamp
          # `date -u -d` cannot parse); every failure leaves `elapsed_min`
          # empty, and empty is UNKNOWN. It is never evidence for a negative.
          # PREFER this job's own start stamp (written by the job's first
          # step). `run_started_at` measures the RUN -- it includes every
          # upstream `needs:` job and all queue time -- so on a `needs:`-gated
          # job it overstates this job's elapsed time by more than the slack
          # below, and a LATE external cancel would then be reported as a
          # timeout. The API lookup stays as the fallback for a job whose stamp
          # step did not run.
          #
          # The guards are not decoration: `-e` is on, so a non-numeric or
          # absurd value reaching `$(( ))` would ABORT this step, and a marker
          # that aborts explains nothing. `10#` forces base 10 -- bash reads a
          # leading zero as octal, where `08` is a hard error, not a value.
          # Every failure path leaves `elapsed_min` empty, and empty is UNKNOWN;
          # it is never evidence for a negative.
          elapsed_min=""
          elapsed_basis=""
          job_start="${JOB_START_EPOCH:-}"
          if [ -n "$job_start" ] && [ -z "${job_start//[0-9]/}" ] && [ ${#job_start} -le 11 ]; then
            job_start=$(( 10#$job_start ))
            # A real CI job start is a 10-digit epoch. Anything smaller is a
            # nonsense stamp -- '08' parses fine and means 8 SECONDS after 1970
            # -- and turning it into a 29-million-minute "measurement" would be
            # garbage presented as fact, which is the very laundering this
            # marker exists to stop. Below the floor, leave it UNKNOWN.
            if [ "$job_start" -ge 1600000000 ]; then
              elapsed_min=$(( ( $(date -u +%s) - job_start ) / 60 ))
              elapsed_basis="job"
            fi
          fi
          if [ -z "$elapsed_min" ]; then
            started="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' 2>/dev/null || true)"
            if [ -n "$started" ]; then
              start_epoch="$(date -u -d "$started" +%s 2>/dev/null || true)"
              if [ -n "$start_epoch" ]; then
                elapsed_min=$(( ( $(date -u +%s) - start_epoch ) / 60 ))
                elapsed_basis="run"
              fi
            fi
          fi

          # A negative elapsed means the clock moved backwards or the stamp is
          # nonsense. Report UNKNOWN rather than a garbage measurement.
          if [ -n "$elapsed_min" ] && [ "$elapsed_min" -lt 0 ]; then
            elapsed_min=""
            elapsed_basis=""
          fi

          # Named so an arm that RULES can disclose what it measured.
          case "$elapsed_basis" in
            job) basis_note="measured from this job's own start" ;;
            run) basis_note="measured from the RUN's start (this job's own start stamp was unavailable), so it also includes any upstream 'needs:' job and queue time" ;;
            *)   basis_note="not measured" ;;
          esac

          # 2 minutes of slack absorbs the gap between run start and job start.
          budget_floor=$(( JOB_TIMEOUT_MINUTES - 2 ))

          # Did the budget actually expire? THREE-valued: "yes" | "no" | ""
          # (UNKNOWN, when elapsed could not be read). NEVER collapse UNKNOWN
          # into "no". That collapse is precisely how arm 3 came to assert an
          # external cancel for a job that had in fact exhausted its own budget:
          # it interpolated `elapsed_min` into its message but never TESTED it,
          # so the only arm performing the budget test was arm 2 -- which is
          # guarded on an apt step being mid-flight and therefore unreachable on
          # any job whose apt steps are guarded to 0s.
          budget_reached=""
          if [ -n "$elapsed_min" ]; then
            if [ "$elapsed_min" -ge "$budget_floor" ]; then
              budget_reached="yes"
            else
              budget_reached="no"
            fi
          fi

          # One legible phrase per state, for the arms that REPORT rather than
          # rule. The UNKNOWN wording never implies the budget was not reached.
          case "$budget_reached" in
            yes) budget_phrase="which IS its full ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            no)  budget_phrase="short of its ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            *)   budget_phrase="against a ${JOB_TIMEOUT_MINUTES}-minute budget whose expiry could NOT be checked" ;;
          esac

          # --- Arm 2: the job budget expired while an apt step was still
          # running. Requires THREE facts. The `cancelled` guard is the one
          # arm 3 already carried and this arm was missing: a JOB_STATUS of
          # `failure` with an apt step mid-flight past the budget floor is NOT
          # a job timeout, and this text ("GitHub concludes a job timeout as
          # 'cancelled'") would be describing a mechanism that did not fire.
          # That state belongs to arm 2b, which names the real conclusion.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$apt_running" ] && [ "$budget_reached" = "yes" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::The ${JOB_TIMEOUT_MINUTES}-minute job budget expired after ${elapsed_min} min while step(s) '$apt_running' were STILL RUNNING. $why GitHub concludes a job timeout as 'cancelled', which 'gh pr checks' renders as 'fail' with zero failing steps - that rendering is what makes this look like your test failure. It is not. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2b: the job did NOT conclude `cancelled`, yet an apt step
          # was left mid-flight. A step-level `timeout-minutes` expiry is the
          # primary mechanism this change introduces, and which of the two job
          # conclusions GitHub surfaces for it is NOT something this change
          # established. So handle both: under `cancelled` semantics arms 1/2
          # cover it, and under `failure` semantics this arm does. Betting on
          # one and printing "cancelled from outside" under the other would be
          # flatly false about the mechanism we just added.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -n "$apt_running" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_running' were interrupted mid-flight (step outcome 'cancelled') and this job concluded '$JOB_STATUS'. $why Nothing here is a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2c: cancelled with an apt step mid-flight, but arm 2's
          # budget test did not fire. Two sub-cases, and NEITHER licenses
          # ruling the stall out: an apt step really was running when this job
          # died.
          if [ -n "$apt_running" ]; then
            if [ -z "$elapsed_min" ]; then
              echo "::warning title=Cannot rule the apt stall in or out::Step(s) '$apt_running' were still mid-flight when this job was cancelled, but this run's elapsed time could NOT be read - the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so the known apt-mirror stall can be NEITHER confirmed NOR ruled out here. Nothing here is a verdict on the code in this change. $ref"
            else
              echo "::warning title=Cancelled with an apt step mid-flight::Step(s) '$apt_running' were still mid-flight when this job was cancelled after ${elapsed_min} min - well short of its ${JOB_TIMEOUT_MINUTES}-minute budget, which points at an external cancel ($EXTERNAL_CANCEL_NOTE) rather than the apt-mirror stall. But an apt step was genuinely running, so this does not rule the stall out either. Nothing here is a verdict on the code in this change. $ref"
            fi
            exit 0
          fi

          # --- Arm 2d: cancelled AT OR PAST its budget, with NO apt step
          # implicated at all. The job exhausted its OWN budget running its OWN
          # work -- a job timeout. This is the FOURTH cause of `cancelled`, and
          # the one this step's header taxonomy omitted: not the apt stall, not
          # a merge-train reap, not an external cancel. Without this arm the
          # state fell through to arm 3, which reported it as "cancelled from
          # outside" -- how a producer that timed out on nearly every main push
          # for days was read as a benign supersede every single time.
          #
          # Guarded on `soft_failed` being empty for the same reason every other
          # ruling arm is: a soft-failed apt step can have red this job through
          # the cascade, and this arm asserts a positive cause. When one is
          # present, arm 3a speaks instead and hedges.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "yes" ] && [ -z "$soft_failed" ]; then
            if [ "$apt_rows_seen" -gt 0 ]; then
              echo "::error title=Job budget exhausted - a TIMEOUT, not an external cancel::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, and GitHub cancelled it when that budget expired. No apt-dependent step failed, none was mid-flight, and none soft-failed - so this is NOT the apt-mirror stall, and NOT an external cancel either (a reap or a manual cancel lands at an arbitrary, typically far earlier, elapsed). The job's own work did not fit its budget. A job timeout concludes as 'cancelled' with ZERO failing steps, which 'gh pr checks' renders as 'fail' - that rendering is what makes this look like a test failure. It is not a verdict on the diff. But re-running WITHOUT raising the budget will most likely time out again: raise the budget, or make the work fit it. $ref_budget"
            else
              echo "::warning title=Job budget exhausted, but the apt telemetry was EMPTY::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, so the budget WAS reached and a job timeout is the leading explanation. But APT_STEP_OUTCOMES parsed to ZERO rows - a step id was renamed or removed, so the expression rendered empty - which makes 'no apt-dependent step failed' an absence of DATA here, not an observation. The apt-mirror stall therefore can NOT be ruled out, and this arm will not assert a cause from telemetry it did not receive. Fix the step-id reference so the next run can rule. $ref_budget $ref"
            fi
            exit 0
          fi

          # --- Arm 3a: cancelled, nothing mid-flight, but an apt step
          # SOFT-failed. Arm 3's "No apt-dependent step failed" would be
          # flatly false here - one demonstrably did - so arm 3 does not get
          # to speak for this state.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=Cancelled, and a soft-failed apt step may have red this job downstream::This job was cancelled after ${elapsed_min:-an unknown number of} min, $budget_phrase. No apt-dependent step was mid-flight, but step(s) '$soft_failed' soft-failed ('continue-on-error: true'), so the apt-mirror stall can NOT be ruled out here, and steps that needed what they install may have failed as a consequence. Note the budget reading above: where it says the budget WAS reached, a plain job timeout is also live as a cause, and these two cannot be separated while a soft-failed apt step is in play. A cancelled run also reports no test results at all, so nothing here is a verdict on the code under test either way. $ref"
            exit 0
          fi

          # --- Arm 3: cancelled, no apt step red the job, none was mid-flight,
          # none soft-failed, and the elapsed time is KNOWN and SHORT of the
          # budget. The stall is ruled out by the step outcomes (a positive
          # fact) and a job timeout is ruled out by the measurement, so an
          # external cancel is what is left. Explicitly decline to judge the
          # diff either way.
          #
          # The `budget_reached = "no"` guard is this arm's whole correction.
          # It used to fire on ANY cancelled job, so it claimed an external
          # cancel for job timeouts too -- while printing the very elapsed
          # figure that refuted it.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "no" ]; then
            echo "::notice title=Run cancelled externally - NOT a verdict on this diff::This job was cancelled after ${elapsed_min} min, $budget_phrase. No apt-dependent step failed and none was mid-flight, so this was NOT the known apt-mirror stall; and it did not reach its own budget, so it was NOT a job timeout. It was cancelled from outside: $EXTERNAL_CANCEL_NOTE. A cancelled run reports no test results at all, so nothing here says anything about the code under test: do not read it as a failure of this change, and do not read it as a pass either. Re-run if you need a verdict."
            exit 0
          fi

          # --- Arm 3b: cancelled, nothing implicated, and the elapsed time
          # could NOT be read. A job timeout and an external cancel are
          # indistinguishable without that measurement, so say so instead of
          # picking one. This is the branch arm 3 used to swallow: it asserted
          # an external cancel from a number it did not have.
          if [ "$JOB_STATUS" = "cancelled" ]; then
            echo "::warning title=Cancelled - a timeout cannot be told from an external cancel::This job was cancelled, but this run's elapsed time could NOT be read: the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so a job-budget TIMEOUT and an external cancel ($EXTERNAL_CANCEL_NOTE) can NOT be told apart here. That is UNKNOWN - it is specifically NOT evidence of an external cancel. No apt-dependent step failed and none was mid-flight, so the apt-mirror stall IS ruled out, by the step outcomes rather than by any measurement. A cancelled run reports no test results at all, so nothing here speaks to the code under test. $ref"
            exit 0
          fi

          # --- Unreachable under `if: cancelled() || failure()`: every
          # non-cancelled path above has already returned. Kept so an unforeseen
          # state says what it knows instead of falling through silently.
          echo "::notice title=No infrastructure verdict::Job status '$JOB_STATUS', no apt-dependent step red the job, none mid-flight. This marker has nothing to add about the code under test. $ref"

  # Always-run aggregate — THIS is the required status check. Passes when migrations
  # were untouched (reverse skipped) or when the reversal test succeeded; fails only
  # on a genuine reversal failure. Never a phantom: it runs on every PR.
  gate:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2): 40 green runs measured 2026-09-23,
    # p50 0.05 / p90 0.07 / max 0.08 min; cap = max(5, 2x max). Replaces the 360-min default.
    timeout-minutes: 5
    name: Migration Reversal Gate
    needs: [detect, reverse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          DETECT_RELEVANT: ${{ needs.detect.outputs.relevant }}
          DETECT_RESULT: ${{ needs.detect.result }}
          REVERSE_RESULT: ${{ needs.reverse.result }}
        run: |
          relevant="${DETECT_RELEVANT}"
          result="${REVERSE_RESULT}"
          echo "detect.result=$DETECT_RESULT relevant=$relevant reverse.result=$result"
          # A failed or cancelled `detect` writes no `relevant` output, and an
          # empty `relevant` is not "true" -- so without this check the branch
          # below read an UNRUN detection as "no migration touched" and passed
          # (plan 2026-10-05-coord-clears-a-migration-on-a-reversal-gate-it-
          # cannot-attribute, section 7). An absent verdict is not a negative.
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::migration detection did not complete (detect.result=$DETECT_RESULT), so whether this PR's migrations are reversible is UNKNOWN -- not passed"
            exit 1
          fi
          if [ "$relevant" = "true" ] && [ "$result" != "success" ]; then
            echo "::error::migration reversibility test did not pass (result=$result)"
            exit 1
          fi
          echo "Migration Reversal Gate OK."
