name: Style Gate (shadow)

# ============================================================================
# CI STYLE GATING — SHADOW STAGE (plan: 2026-06-03-ci-style-gating-web-first)
# ============================================================================
#
# This is the SHADOW (report-only) stage of the style-gate rollout. It captures
# the authed style snapshots/frames (Phase 1 Playwright `style-gate` project),
# then runs the version-pinned `vision-audit` analyzer (qontinui-schemas,
# rust-vision-core crate) per route in BOTH of its gating modes and reports the
# findings in the job summary:
#
#   * `analyze` — runs all 5 page-wide analyzers (layout, elements, typography,
#     color) with NO element ids and NO specs required. This is the broad,
#     day-one signal: it works the moment a snapshot+frame exist. Invoked with
#     `--analyzer all --fail-on critical`, so it exits 2 iff a finding is at/above
#     CRITICAL (and 0 otherwise — without --fail-on the bin always exits 0, so the
#     flag is what gives us a gate signal at all).
#
#   * `assert` — runs the committed invariant specs (Phase 2). These are precise
#     but thin on day one: most DSL assertions (no_overlap, contrast_meets_wcag,
#     text_fits_container) need specific element ids that aren't known until real
#     snapshots exist, so the seed specs can only assert page-wide no_clipping.
#     This pass grows as specs + baselines expand.
#
# Both passes honor the same shadow/enforce exit logic below.
#
# ROLLOUT DISCIPLINE (mirrors the alembic-fork gate: prevent > detect, and a
# gate becomes blocking ONLY via branch protection, never by a workflow quietly
# turning red):
#
#   * Stage A (NOW): SHADOW. This job EXITS 0 (green) even when routes report
#     gate findings (analyzer exit 2). It is NOT in the required-checks set, so
#     it can never block a merge. Reviewers read the job-summary table.
#
#   * Stage B (LATER): ENFORCE. After a burn-in (>= ~2 weeks / >= ~30 runs with
#     ZERO flake-attributable false gate-2s), promotion to a REQUIRED check is
#     done by (1) adding this job to branch protection AND (2) setting the repo
#     variable / dispatch input STYLE_GATE_ENFORCE=1. With enforce on, the job
#     FAILS (non-zero) if ANY route reports a gate finding (analyzer exit 2).
#     There is NO second workflow — the same file serves both stages.
#
# In BOTH stages an analyzer INFRA error (exit 1: usage/IO/parse) on a PRESENT
# snapshot/frame FAILS the job: a broken gate must always be visible, never
# silently green.
#
# CAPTURE-UNAVAILABLE (distinct from INFRA-ERROR): if a route produced NO
# snapshot/frame, the gate could not be run at all for that route — an
# ENVIRONMENT/capture-availability problem, not a gate verdict. This is handled
# asymmetrically by stage:
#   * SHADOW (Stage A): report it as `CAPTURE-UNAVAILABLE` in the job summary and
#     EXIT 0 (green, non-blocking). Stage A must NEVER fail the check on capture
#     availability — it is report-only.
#   * ENFORCE (Stage B): FAIL — you cannot enforce a gate you could not run.
# This is separate from a genuine analyzer INFRA error (exit 1) on a PRESENT
# input, which keeps failing in BOTH modes (a broken analyzer must always show).
#
# The qontinui-schemas commit the analyzer is built from is pinned in
# `style-gate.lock` at the repo root — bumping it is a deliberate, reviewable
# PR. This workflow READS that file; the SHA is never hardcoded here.
#
# CAPTURE STACK: the capture step reuses the existing e2e harness's
# `globalSetup` (frontend/tests/e2e/global-setup.ts), which boots a LOCAL Python
# backend (uvicorn) against an ephemeral postgres, seeds it, then Playwright's
# webServer boots `npm run dev`. So this job provisions the SAME full stack as
# the Frontend E2E job in e2e-tests.yml (postgres service + sibling clones +
# python/pip + migrations + dev user). The pinned analyzer schemas checkout
# (path: qontinui-schemas, in-workspace) and the backend's schemas sibling clone
# (../qontinui-schemas, parent dir) use DISTINCT paths and never collide.
# ============================================================================

on:
  pull_request:
    paths:
      - "frontend/**"
      - "frontend/tests/e2e/style-gate/**"
      - "style-gate.lock"
      - ".github/workflows/style-gate.yml"
  workflow_dispatch:
    inputs:
      enforce:
        description: "Set to '1' to ENFORCE (fail the check on any gate finding). Default shadow/report-only."
        required: false
        default: "0"

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: style-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-gate:
    name: Style Gate (shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Ephemeral DB for the captured backend boot. Mirrors the Frontend E2E job
    # in e2e-tests.yml exactly (image, creds, health-check, port) — the
    # global-setup.ts the capture reuses hardcodes
    # postgresql://test_user:test_password@localhost:5432/test_db.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # The capture reuses the e2e harness's global-setup.ts, which boots a
      # LOCAL uvicorn backend on :8000 against the ephemeral postgres service
      # above and then Playwright's webServer boots `npm run dev` on :3001.
      # So the capture renders against the SAME local stack the Frontend E2E job
      # in e2e-tests.yml uses — not prod.
      #
      # empty NEXT_PUBLIC_API_URL => the browser hits the Next /api proxy on
      # :3001 (also satisfies the isDev relay gate the style-gate spec relies
      # on); the proxy forwards to the local backend via the server-only
      # BACKEND_URL. BACKEND_URL points at the LOCAL backend so global-setup.ts
      # actually boots uvicorn (it would SKIP local boot if BACKEND_URL/docs were
      # already reachable, e.g. prod) and the dev proxy targets local.
      NEXT_PUBLIC_API_URL: ""
      BACKEND_URL: http://localhost:8000
      QONTINUI_API_BASE_URL: http://localhost:8000
      # DB the captured backend + migrations + seed all share. Matches the value
      # hardcoded in global-setup.ts and the e2e-tests.yml Frontend E2E job.
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      # HERMETIC AUTH (mirrors spec-ci.yml — the canonical pattern). The capture
      # renders against the LOCAL backend booted by global-setup.ts; a real
      # Cognito token's `iss` is NOT trusted by that local backend, so the
      # previous real-Cognito creds lane left every authed route bounced to
      # /login (the P0 "the gate audits the login page"). Instead the
      # "Mint local id token + serve JWKS" step below mints an RS256 id token
      # against a RUN-LOCAL issuer and exports QONTINUI_TEST_ID_TOKEN; the local
      # backend's verifier is pointed at that issuer and JIT-provisions the
      # ci-bot user. auth.setup.ts's injected lane seeds it as the access_token
      # cookie. No real Cognito, no shared account, no create_admin.py seed.
      SECRET_KEY: style-gate-secret-key-for-ci-only-minimum-32-chars-long
      ENVIRONMENT: development
      COGNITO_USER_POOL_ID: style-gate-local-pool
      COGNITO_ISSUER: http://127.0.0.1:8770
      COGNITO_ALLOWED_AUDIENCES: style-gate-local
      # The style-gate spec self-enables the per-user co-pilot pref + seeds
      # consent; the build-time relay surface mirrors Spec CI.
      NEXT_PUBLIC_UI_BRIDGE_REMOTE_COMMANDS: "1"

    steps:
      - name: Checkout qontinui-web
        uses: actions/checkout@v5

      # Read the pinned qontinui-schemas SHA from style-gate.lock. The SHA is
      # NEVER hardcoded in this YAML — a bump is a reviewable change to the lock
      # file, surfaced under this workflow's paths filter.
      - name: Read pinned qontinui-schemas SHA from style-gate.lock
        id: lock
        run: |
          set -euo pipefail
          if [ ! -f style-gate.lock ]; then
            echo "::error::style-gate.lock not found at repo root."
            exit 1
          fi
          SHA="$(jq -r '.qontinui_schemas_sha' style-gate.lock)"
          CRATE="$(jq -r '.crate' style-gate.lock)"
          BIN="$(jq -r '.bin' style-gate.lock)"
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::error::qontinui_schemas_sha missing/null in style-gate.lock."
            exit 1
          fi
          echo "schemas_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "crate=${CRATE}" >> "$GITHUB_OUTPUT"
          echo "bin=${BIN}" >> "$GITHUB_OUTPUT"
          echo "Pinned qontinui-schemas: $SHA (crate=$CRATE bin=$BIN)"

      # Resolve the effective enforce flag. Precedence:
      #   1. workflow_dispatch input `enforce` (manual override), else
      #   2. repo/org variable STYLE_GATE_ENFORCE.
      # "1" => ENFORCE (Stage B). Anything else => SHADOW (Stage A, default).
      - name: Resolve enforce mode
        id: mode
        env:
          DISPATCH_ENFORCE: ${{ github.event.inputs.enforce }}
          VAR_ENFORCE: ${{ vars.STYLE_GATE_ENFORCE }}
        run: |
          set -euo pipefail
          ENFORCE="0"
          if [ "${DISPATCH_ENFORCE:-}" = "1" ]; then
            ENFORCE="1"
            echo "Enforce source: workflow_dispatch input"
          elif [ "${VAR_ENFORCE:-}" = "1" ]; then
            ENFORCE="1"
            echo "Enforce source: repo variable STYLE_GATE_ENFORCE"
          fi
          echo "enforce=$ENFORCE" >> "$GITHUB_OUTPUT"
          if [ "$ENFORCE" = "1" ]; then
            echo "Mode: ENFORCE (Stage B) — gate findings FAIL this check."
          else
            echo "Mode: SHADOW (Stage A) — report-only, gate findings do NOT fail this check."
          fi

      # The qontinui-schemas repo is public (AGPL) — mirrors the unauthenticated
      # clone convention in backend-ci.yml / migrate.yml. Clone into a sibling of
      # the workspace (../qontinui-schemas) and check out the pinned SHA.
      - name: Checkout pinned qontinui-schemas (analyzer source)
        uses: actions/checkout@v5
        with:
          repository: qontinui/qontinui-schemas
          ref: ${{ steps.lock.outputs.schemas_sha }}
          path: qontinui-schemas
          fetch-depth: 1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache cargo registry + the analyzer's build output, keyed on the pinned
      # SHA so a schemas bump invalidates cleanly.
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            qontinui-schemas/target
          key: ${{ runner.os }}-vision-audit-${{ steps.lock.outputs.schemas_sha }}
          restore-keys: |
            ${{ runner.os }}-vision-audit-

      # Verified build invocation (rust-vision-core crate, [[bin]] name
      # `vision-audit`, path src/bin/vision_audit.rs at the pinned SHA). Run from
      # the schemas checkout root.
      - name: Build vision-audit
        working-directory: qontinui-schemas
        env:
          # crates.io registry fetches occasionally flake on a cold cache (a
          # transient "download of <crate> failed" / "unable to update registry
          # crates-io" — observed 2026-06-13 during the Stage-A burn-in, which
          # failed this step outright). Because an INFRA error here fails the job
          # in BOTH shadow and enforce modes, an unhardened registry hiccup would
          # become a FALSE required-check failure once the gate is enforced
          # (Stage B). cargo's own net-retry plus the bounded outer
          # retry-with-backoff below neutralize that single observed flake vector
          # without masking a genuine build break (still fails after `max`).
          CARGO_NET_RETRY: "5"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          attempt=0
          max=3
          until cargo build --release \
            --manifest-path rust-vision-core/Cargo.toml \
            --bin vision-audit; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::cargo build failed after ${max} attempts — likely a genuine build break (a transient crates.io fetch would normally clear within the retries)."
              exit 1
            fi
            echo "::warning::cargo build attempt ${attempt} failed; retrying after backoff (probable transient registry/network fetch)."
            sleep "$((attempt * 15))"
          done
          BIN_PATH="$GITHUB_WORKSPACE/qontinui-schemas/target/release/vision-audit"
          if [ ! -x "$BIN_PATH" ]; then
            echo "::error::vision-audit binary not found at $BIN_PATH after build."
            exit 1
          fi
          echo "VISION_AUDIT=$BIN_PATH" >> "$GITHUB_ENV"
          "$BIN_PATH" --help || true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      # `npx playwright install --with-deps <engines>` was THREE things fused
      # into one step: npx resolution, a browser-bundle download from
      # cdn.playwright.dev, and `apt-get`. Only the apt part has ever hung, so
      # the fusion made the infrastructure marker's headline ("CI
      # infrastructure timeout - NOT your diff") false for the other two: an
      # author who bumped `@playwright/test` to a version whose bundle 404s on
      # the CDN would have been told the Ubuntu mirror did it. Split, exactly
      # as the postgresql-client sites were (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 3):
      #
      #   * `install-deps` = the APT half. Measured on healthy run 32264215960:
      #     all 26 Playwright system libraries report `is already the newest
      #     version`, and apt's own verdict is `0 upgraded, 9 newly installed`
      #     -- 9 FONT packages, `Need to get 21.1 MB of archives`. That 21.1 MB
      #     is the entire exposure; hung run 32289431023 crawled through it at
      #     ~0.7 kB/s for 38 minutes against azure.archive.ubuntu.com.
      #   * `install` = the CDN half. cdn.playwright.dev, a different host,
      #     EXONERATED by the logs: neither hung run ever reached it.
      #
      # Only the apt half carries `id: apt_playwright`, so only the apt half is
      # in APT_STEP_OUTCOMES and only it can ever be named as infrastructure.
      #
      # The order is preserved from `--with-deps`, not chosen: playwright-core's
      # `installBrowsers()` calls `registry.installDeps()` BEFORE
      # `registry.install()`, and `install-deps <engines>` feeds the same
      # `registry.resolveBrowsers()` result to the same `registry.installDeps()`
      # -- so the apt package list is identical to what `--with-deps` computed.

      # Phase 3's remedy: keep the 21.1 MB of font .debs across runs so a
      # healthy run does not re-fetch them from the mirror at all.
      #
      # WHAT IS CACHED: the .deb archives apt downloads, and nothing else. The
      # package SET is untouched -- `install-deps` still resolves and installs
      # exactly the same packages; apt simply finds their .debs already in
      # /var/cache/apt/archives and skips the download. Behaviour-preserving is
      # the whole point of choosing a cache over narrowing the font list: this
      # is a visual/OCR crawl, and dropping CJK/Unicode coverage would change
      # rendered text (tofu boxes) in a way nothing here would catch.
      #
      # WHAT IS *NOT* REMOVED: `install-deps` still runs `apt-get update`
      # first, unconditionally, so the index refresh remains an exposure -- and
      # hung run 32294962345 stalled in exactly that phase. The cache removes
      # the 21.1 MB download half; `timeout-minutes` on the apt step below is
      # what bounds the other half. Caching the package INDEX as well was
      # rejected: a stale index against a rotated pool turns a slow run into a
      # hard 404, i.e. it trades a bounded delay for a break.
      #
      # NOT CACHED HERE: the browser bundles under ~/.cache/ms-playwright.
      # Different host, different failure mode, not implicated in any observed
      # hang. If that is ever worth caching it gets its OWN cache entry --
      # sharing this one would couple a CDN problem back onto the apt key this
      # split exists to isolate.

      # The cache key must move whenever the package set can, and must NOT move
      # otherwise. Two inputs are in it:
      #   * `ImageOS` (e.g. `ubuntu24`) -- the Ubuntu release, which fixes both
      #     the package names and the pool the .debs come from;
      #   * the @playwright/test version -- it selects the dependency list, so
      #     a bump can add or drop packages.
      # `ImageVersion` (the weekly image build) is deliberately NOT in the key.
      # A newer image can only ever have MORE of these packages preinstalled,
      # which makes a cached set a harmless superset, so keying on it would
      # force a full re-download every week for no correctness gain. Staleness
      # is bounded by apt itself: it validates every cached .deb against the
      # live index and re-downloads any that no longer match.
      - name: Resolve Playwright apt cache key
        id: pw_cache_key
        working-directory: ./frontend
        run: |
          set -uo pipefail
          pw="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version" 2>/dev/null || true)"
          if [ -z "$pw" ]; then
            # The lockfile shape changed. Fall back to a digest of the whole
            # lock: over-keyed (any dependency bump misses) but never STALE,
            # which is the property that matters. Never fail the job over a
            # cache key -- this step is not in APT_STEP_OUTCOMES, so a red here
            # would be reported to the author as their own diff.
            pw="lock$(sha256sum package-lock.json | cut -c1-12)"
            echo "::notice::Could not read @playwright/test from package-lock.json; keying the Playwright apt cache on the whole lockfile digest instead."
          fi
          img="${ImageOS:-unknown}"
          echo "key=apt-playwright-${RUNNER_OS:-Linux}-${img}-pw${pw}${KEY_SUFFIX:-}" >> "$GITHUB_OUTPUT"
          echo "restore_prefix=apt-playwright-${RUNNER_OS:-Linux}-${img}-" >> "$GITHUB_OUTPUT"
          echo "Playwright $pw on image $img${KEY_SUFFIX:-}"

      - name: Restore Playwright apt font cache
        id: apt_playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/qontinui-apt-playwright
          key: ${{ steps.pw_cache_key.outputs.key }}
          # A prefix hit restores an older .deb set. That is safe by
          # construction: apt validates every cached .deb against the index and
          # downloads the ones that no longer match, so a partial hit is a
          # partial saving, never a wrong install.
          #
          # The step output is `restore_prefix`, not `restore-prefix`: GitHub's
          # expression parser reads `-` as subtraction, so a hyphenated output
          # name cannot be dereferenced with dot syntax at all.
          restore-keys: |
            ${{ steps.pw_cache_key.outputs.restore_prefix }}

      # /var/cache/apt/archives is root-owned and actions/cache runs as the
      # unprivileged `runner` user, so it can neither read nor write that dir
      # directly. `sudo cp` is what moves .debs across the privilege boundary.
      # This step touches local disk only -- no network, nothing to stall - so
      # it is deliberately unbounded and deliberately has no `id:`.
      - name: Seed apt archives from cache
        run: |
          set -uo pipefail
          cache_dir="$HOME/.cache/qontinui-apt-playwright"
          n=0
          if [ -d "$cache_dir" ]; then
            n=$(find "$cache_dir" -maxdepth 1 -name '*.deb' | wc -l)
          fi
          if [ "$n" -gt 0 ]; then
            # `-n` never clobbers a .deb the image already had, which could be
            # newer than the cached one.
            sudo cp -n "$cache_dir"/*.deb /var/cache/apt/archives/ || true
            echo "Seeded $n cached .deb(s) into /var/cache/apt/archives."
          else
            echo "No cached .deb archives - this run fetches them from the mirror. A MISS is slower, never broken."
          fi

      - name: Install Playwright Chromium system deps (apt)
        id: apt_playwright
        # Sized from a per-half measurement, not from the fused step: each green
        # run's log was cut at the boundary between apt's last output line and the
        # first `Downloading ` CDN banner, and the parsed halves were cross-checked
        # against the jobs API step times to +/-1s.
        #
        # The apt half over 16 green style-gate runs (2026-08-08 -> 08-20):
        # p50 13.8s, p90 45.3s, max 111.6s (run 32268572480,
        # `Fetched 11.4 MB in 1min 40s (114 kB/s)`).
        #
        # Keeping the fused step's 5 min: 2.7x that max and p90 + ~4.2 min, on
        # a strictly SMALLER job than the bound was originally sized for, so
        # the split tightens nothing.
        #
        # These are PRE-cache numbers. With the font .debs restored, a healthy run
        # should collapse toward the `apt-get update`-only floor, so the bound is
        # conservative by construction - it is sized for the MISS.
        timeout-minutes: 5
        working-directory: ./frontend
        run: npx playwright install-deps chromium

      # Hand whatever apt downloaded back across the privilege boundary so the
      # actions/cache post-step (unprivileged) can save it. Local disk only, so
      # unbounded and without an `id:`, same as the seed step. Every command is
      # `|| true`: a cache-staging problem must never red a job, and must never
      # be mistaken for the apt failure this plan exists to report accurately.
      - name: Stage apt archives for cache
        run: |
          set -uo pipefail
          cache_dir="$HOME/.cache/qontinui-apt-playwright"
          mkdir -p "$cache_dir"
          sudo cp -f /var/cache/apt/archives/*.deb "$cache_dir"/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$cache_dir" || true
          echo "$(find "$cache_dir" -maxdepth 1 -name '*.deb' | wc -l) .deb(s) staged for the cache."

      - name: Install Playwright Chromium (CDN)
        # The CDN half over the same 16 runs: p50 9.1s, p90 10.1s, max 10.7s.
        # 2 min is ~11x the observed max.
        timeout-minutes: 2
        working-directory: ./frontend
        run: npx playwright install chromium

      # ----------------------------------------------------------------------
      # BACKEND STACK PROVISIONING (ported from e2e-tests.yml).
      #
      # The capture's global-setup.ts boots a LOCAL uvicorn backend; without
      # this stack it failed with `No module named uvicorn` → "Backend failed to
      # start" → zero snapshots/frames. The steps below mirror the Frontend E2E
      # job (services: postgres + sibling clones + python/pip + runner schema +
      # migrations + dev user) so the capture has a real app/backend to render.
      #
      # IMPORTANT: these backend schemas/sibling clones land in the PARENT dir
      # (../qontinui-schemas, what backend/pyproject.toml's ../../qontinui-schemas
      # path-dep resolves to) and are DISTINCT from the pinned analyzer schemas
      # checkout at the in-workspace path `qontinui-schemas/` above — no collision.
      # ----------------------------------------------------------------------

      # backend/pyproject.toml has path deps on ../../qontinui-schemas and
      # ../../qontinui; without these clones `pip install -e .` fails ENOENT.
      # qontinui-cloud-control is needed for the test harness's side-effect
      # import (backend/tests/conftest.py). Same set + method as e2e-tests.yml's
      # "Clone backend Python sibling deps" step.
      - name: Clone backend Python sibling deps
        # SHADOW soft-fail: a provisioning failure must NOT abort the job — it
        # must flow through to no-snapshots -> CAPTURE-UNAVAILABLE (green shadow).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for spec in \
            "qontinui/qontinui-schemas" \
            "qontinui/qontinui" \
            "qontinui/qontinui-cloud-control" \
          ; do
            repo_name="${spec#*/}"
            target="../${repo_name}"
            echo "::group::Cloning ${spec} → ${target}"
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${spec}.git" \
              "${target}"
            echo "::endgroup::"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Mirror e2e-tests.yml's backend install: editable schemas first (avoid the
      # wheel-cache downgrade), then backend itself --no-deps, then cloud-control.
      - name: Install backend dependencies
        # SHADOW soft-fail (see Clone step): failure -> CAPTURE-UNAVAILABLE, not red.
        continue-on-error: true
        working-directory: ./backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-cache-dir -e ../../qontinui-schemas
          if [ -f pyproject.toml ]; then pip install -e . --no-deps; fi
          pip install -e ../../qontinui-cloud-control

      - name: Install postgresql-client
        id: apt_psql
        # ONLY the apt-get call lives in this step, and it is the entire reason
        # for the bound: it reaches an external mirror at job time and is the
        # same unbounded-stall exposure as the Playwright step (plan
        # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure).
        # The psql/DDL that used to share this step now runs UNBOUNDED below.
        # It HAD to move: under `bash -e` a psql failure set this step's
        # `.outcome` to `failure` exactly like an apt timeout, so the
        # infrastructure marker could not tell a mirror stall from the author's
        # own schema breaking -- and told them their breakage was infrastructure.
        # Measured apt+psql across green runs of all 7 sites: p50 0-16s, p90
        # <=91s, max 106s (migration-reversal). The bound now covers apt ALONE,
        # so 5 min is p90 + ~3.5 min of headroom over a strictly smaller job.
        timeout-minutes: 5
        # SHADOW soft-fail (see Clone step): failure -> CAPTURE-UNAVAILABLE, not red.
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y postgresql-client

      # Some alembic migrations reference the `runner` schema, created in dev by
      # init-scripts/01-create-runner-schema.sql. CI service containers don't run
      # those init scripts, so create it explicitly (same as e2e-tests.yml).
      - name: Create runner schema
        # Deliberately UNBOUNDED and deliberately WITHOUT an `id:`. This is
        # psql/DDL against this job's own postgres service, not the external
        # mirror, so a failure here IS a verdict on the change -- it must never
        # reach the infrastructure marker's APT_STEP_OUTCOMES.
        # SHADOW soft-fail (see Clone step): failure -> CAPTURE-UNAVAILABLE, not red.
        continue-on-error: true
        env:
          PGPASSWORD: test_password
        run: |
          set -euo pipefail
          psql -h localhost -U test_user -d test_db -c "CREATE SCHEMA IF NOT EXISTS runner;"

      - name: Run database migrations
        # SHADOW soft-fail (see Clone step): failure -> CAPTURE-UNAVAILABLE, not red.
        continue-on-error: true
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          TESTING: "1"
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-chars-required
          STORAGE_BACKEND: local
          REDIS_ENABLED: "false"
        run: |
          alembic upgrade heads

      # HERMETIC AUTH (canonical pattern, ported from spec-ci.yml's "Mint local
      # id token + serve JWKS" step). Generate an ephemeral RS256 keypair + JWKS,
      # serve the JWKS at COGNITO_ISSUER (http://127.0.0.1:8770), and mint the
      # ci-bot id token that auth.setup.ts's injected lane seeds as the
      # access_token cookie. The LOCAL backend booted by global-setup.ts (it
      # inherits the job-level COGNITO_* env via `...process.env`) verifies the
      # token through its REAL verifier (RS256/iss/aud/exp) and JIT-provisions
      # the ci-bot auth.users row on auth.setup's first authed probe — so NO
      # create_admin.py / dev-user seed step is needed (the dead create_admin.py
      # reference that previously soft-failed here is gone).
      #
      # This REPLACES the real-Cognito creds lane: a real-Cognito token's `iss`
      # is not trusted by the local backend, which is exactly why every authed
      # route previously bounced to /login (P0). The JWKS server must be up
      # before the capture step's auth.setup probe; the backend fetches JWKS
      # lazily on first verification, so ordering this before the capture is
      # sufficient.
      #
      # SHADOW soft-fail: a mint/serve failure flows through to no-snapshots ->
      # CAPTURE-UNAVAILABLE (green shadow), never a red check.
      - name: Mint local id token + serve JWKS (hermetic auth)
        id: mint_token
        continue-on-error: true
        working-directory: ./backend
        run: |
          set -euo pipefail
          TOKEN=$(python scripts/spec_ci_local_idp.py \
            --issuer "$COGNITO_ISSUER" \
            --audience "$COGNITO_ALLOWED_AUDIENCES" \
            --email style-gate-bot@no-reply.qontinui.io \
            --out-dir /tmp/style-gate-idp)
          echo "QONTINUI_TEST_ID_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          (cd /tmp/style-gate-idp && python -m http.server 8770 --bind 127.0.0.1 > /tmp/idp.log 2>&1 &)
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8770/.well-known/jwks.json > /dev/null; then
              echo "local JWKS up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8770/.well-known/jwks.json > /dev/null

      # Run the Phase 1 capture. The config's `webServer` boots `npm run dev` on
      # :3001 and `global-setup.ts` boots the LOCAL uvicorn backend (inheriting
      # the job-level COGNITO_* env so it trusts the run-local issuer). The
      # `setup` project (auth.setup.ts) seeds the hermetic QONTINUI_TEST_ID_TOKEN
      # minted above as the access_token cookie and probes /users/me (which
      # JIT-provisions the ci-bot user); the spec renders the 3 authed routes,
      # asserts each is NOT the login surface, and writes per-route snapshot JSON
      # + frame PNG under frontend/tests/e2e/style-gate/.artifacts/.
      #
      # continue-on-error: a capture hiccup must still let the assert step run +
      # report (the per-route assert step itself flags a missing snapshot/frame
      # as INFRA-ERROR).
      - name: Capture style snapshots + frames
        id: capture
        continue-on-error: true
        working-directory: ./frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:3001
        run: |
          npx playwright test --project=style-gate

      # Per-route audit: run the pinned analyzer in BOTH gating modes against each
      # route's captured snapshot/frame, then build a job-summary table with one
      # row per route and a labeled cell for each pass (analyze | assert).
      #
      #   * analyze — page-wide, NO element ids / NO spec needed. Invoked with
      #       analyze --snapshot S --frame F --analyzer all --fail-on critical
      #     so it exits 2 iff a finding is at/above CRITICAL (without --fail-on
      #     the bin always exits 0). Needs only snapshot+frame to run; the broad
      #     day-one signal.
      #   * assert — the committed invariant spec ($SPEC_DIR/<id>.json). Pass
      #     --baseline-dir ONLY when a per-route baseline exists (else
      #     `no_layout_shift_since` isn't seeded and passing the dir is
      #     meaningless). Needs snapshot+frame+spec; thin on day one, grows with
      #     baselines.
      #
      # Passes fold into THREE accumulators below: any_gate2 (gate verdict),
      # any_infra (broken analyzer on a present input), and any_capture_missing
      # (no snapshot/frame produced — a capture-availability problem, NOT a gate
      # verdict). The three are scored differently against shadow/enforce.
      #
      # Analyzer exit-code contract (the gate contract, identical for both modes):
      #   0 = ok / passed (analyze: ran, or no finding at/above --fail-on)
      #   2 = GATE FAILED (analyze: finding at/above --fail-on; assert: an
      #       assertion failed)            -> any_gate2
      #   1 = usage/IO/parse error (CI INFRA error) on a PRESENT snapshot/frame
      #                                    -> any_infra
      # Plus, OUTSIDE the analyzer contract:
      #   missing snapshot/frame for a route (capture produced nothing)
      #                                    -> any_capture_missing (CAPTURE-UNAVAILABLE)
      - name: Run vision-audit (analyze + assert) per route + summarize
        id: assert
        # Run ALWAYS — even when an upstream provisioning/capture step hit a
        # continue-on-error failure. This is the step that converts no-snapshots
        # into the CAPTURE-UNAVAILABLE (green shadow) verdict; it must never be
        # skipped by an earlier failure.
        if: always()
        env:
          ENFORCE: ${{ steps.mode.outputs.enforce }}
        run: |
          set -uo pipefail

          ROUTES="co-pilot build-workflows library"
          SG="frontend/tests/e2e/style-gate"
          SNAP_DIR="$SG/.artifacts/snapshots"
          FRAME_DIR="$SG/.artifacts/frames"
          SPEC_DIR="$SG/specs"
          BASELINE_DIR="$SG/baselines"
          # Per-route analyzer findings JSON (stdout) — preserved as artifacts so
          # the SHADOW burn-in can actually triage findings, author element-id
          # specs, and seed baselines. Lives under .artifacts/ so the single
          # upload path covers it.
          FINDINGS_DIR="$SG/.artifacts/findings"
          mkdir -p "$FINDINGS_DIR"

          any_gate2=0           # >=1 pass (analyze or assert) returned exit 2
          any_infra=0           # >=1 pass returned exit 1 on a PRESENT input (broken analyzer)
          any_capture_missing=0 # >=1 route had no snapshot/frame (CAPTURE-UNAVAILABLE)

          # Run the analyzer in a given mode and set three globals from the result:
          #   CELL  — a markdown-table cell (status + the bin's human detail)
          #   plus a fold into any_gate2 / any_infra per the exit code.
          # Args: <mode-label> <exit-code> <stderr-human-summary>
          fold_result() {
            local label="$1" rc="$2" stderr_out="$3"
            local summary
            summary="$(printf '%s' "$stderr_out" | tr '\n' ' ' | sed 's/|/\\|/g')"
            summary="$(printf '%.350s' "$summary")"
            [ -z "$summary" ] && summary="(no analyzer output)"
            case "$rc" in
              0) CELL="PASS — ${summary}" ;;
              2) any_gate2=1; CELL="GATE-FINDINGS — ${summary}" ;;
              *) any_infra=1; CELL="INFRA-ERROR (exit $rc) — ${summary}" ;;
            esac
          }

          {
            echo "## Style Gate — ${{ steps.mode.outputs.enforce == '1' && 'ENFORCE (Stage B)' || 'SHADOW (Stage A, report-only)' }}"
            echo ""
            echo "> SHADOW never blocks: this check stays GREEN regardless of findings or capture availability. If routes show \`CAPTURE-UNAVAILABLE\`, the capture environment is still being wired (Stage-A burn-in) — that is NOT a code regression."
            echo ""
            echo "Pinned qontinui-schemas: \`${{ steps.lock.outputs.schemas_sha }}\` (crate \`${{ steps.lock.outputs.crate }}\`, bin \`${{ steps.lock.outputs.bin }}\`)"
            echo ""
            echo "Each route runs two passes: **analyze** (page-wide findings, \`--fail-on critical\`; the primary day-one signal) and **assert** (committed invariant specs; grows with baselines). Both honor shadow/enforce."
            echo ""
            echo "| Route | analyze | assert |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for id in $ROUTES; do
            snap="$SNAP_DIR/$id.json"
            frame="$FRAME_DIR/$id.png"
            spec="$SPEC_DIR/$id.json"

            # ---- analyze pass (needs snapshot + frame only) -------------------
            if [ ! -f "$snap" ] || [ ! -f "$frame" ]; then
              # No snapshot/frame => the gate could not be RUN for this route.
              # This is a capture-availability problem, NOT a gate verdict and
              # NOT a broken-analyzer INFRA error: fold into any_capture_missing.
              # In SHADOW it is reported but does not fail; in ENFORCE it fails
              # (can't enforce a gate that couldn't run). Applies to BOTH passes.
              miss=""
              [ -f "$snap" ]  || miss="$miss snapshot($snap)"
              [ -f "$frame" ] || miss="$miss frame($frame)"
              any_capture_missing=1
              echo "Route $id: CAPTURE-UNAVAILABLE — no capture inputs:$miss"
              det="no capture inputs:$(printf '%s' "$miss" | sed 's/|/\\|/g')"
              echo "| \`$id\` | CAPTURE-UNAVAILABLE — ${det} | CAPTURE-UNAVAILABLE — ${det} |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            echo "::group::vision-audit analyze — $id"
            set +e
            # 2>&1 1>FILE: stderr (human summary) is captured into $an_err for the
            # table cell; stdout (the machine-readable per-finding JSON) is saved
            # to the findings artifact for burn-in triage.
            an_err="$("$VISION_AUDIT" analyze \
              --snapshot "$snap" \
              --frame "$frame" \
              --analyzer all \
              --fail-on critical 2>&1 1>"$FINDINGS_DIR/$id.analyze.json")"
            an_rc=$?
            set -e
            echo "$an_err"
            echo "exit code: $an_rc"
            echo "::endgroup::"
            fold_result "analyze" "$an_rc" "$an_err"
            an_cell="$CELL"

            # ---- assert pass (needs snapshot + frame + spec) -----------------
            if [ ! -f "$spec" ]; then
              # analyze still ran above; only assert is blocked by a missing spec
              # (Phase 2 specs may be absent for this route).
              any_infra=1
              echo "Route $id: assert INFRA-ERROR — missing spec($spec)"
              as_cell="INFRA-ERROR — missing spec($(printf '%s' "$spec" | sed 's/|/\\|/g'))"
            else
              # Pass --baseline-dir only if a per-route baseline exists.
              baseline_args=""
              if [ -f "$BASELINE_DIR/$id.json" ]; then
                baseline_args="--baseline-dir $BASELINE_DIR"
              fi
              echo "::group::vision-audit assert — $id"
              set +e
              as_err="$("$VISION_AUDIT" assert \
                --snapshot "$snap" \
                --frame "$frame" \
                --assertions "$spec" \
                $baseline_args 2>&1 1>"$FINDINGS_DIR/$id.assert.json")"
              as_rc=$?
              set -e
              echo "$as_err"
              echo "exit code: $as_rc"
              echo "::endgroup::"
              fold_result "assert" "$as_rc" "$as_err"
              as_cell="$CELL"
            fi

            echo "| \`$id\` | ${an_cell} | ${as_cell} |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Surface the capture step's own outcome (it is continue-on-error).
          if [ "${{ steps.capture.outcome }}" != "success" ]; then
            {
              echo ""
              echo "> NOTE: the capture step concluded \`${{ steps.capture.outcome }}\` (continue-on-error). Routes whose snapshot/frame are missing above are a downstream symptom."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Legend for the status cells used in the table above.
          {
            echo ""
            echo "**Legend** — \`PASS\`: ran clean. \`GATE-FINDINGS\`: analyzer exit 2 (a real gate verdict; fails only in ENFORCE). \`INFRA-ERROR\`: analyzer exit 1 on a PRESENT snapshot/frame, or a missing spec (a broken/unrunnable gate; fails in BOTH modes). \`CAPTURE-UNAVAILABLE\`: no snapshot/frame was produced for the route — a capture/environment problem, not a gate verdict; in **SHADOW it is report-only and does NOT block** (exit 0), in ENFORCE it fails (a gate that couldn't run can't be enforced)."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            if [ "$any_infra" = "1" ]; then
              echo "**Outcome: INFRA-ERROR** — at least one route's analyzer errored on a present input (or a spec was missing): a broken gate. Fails the job in BOTH shadow and enforce modes."
            elif [ "$any_capture_missing" = "1" ] && [ "$ENFORCE" = "1" ]; then
              echo "**Outcome: CAPTURE-UNAVAILABLE (ENFORCE)** — at least one route produced no snapshot/frame; the gate could not be run, so it cannot be enforced. Failing this required check."
            elif [ "$any_gate2" = "1" ] && [ "$ENFORCE" = "1" ]; then
              echo "**Outcome: GATE FAILED (ENFORCE)** — at least one route's analyze or assert pass reported findings; failing this required check."
            elif [ "$any_capture_missing" = "1" ] && [ "$any_gate2" = "1" ]; then
              echo "**Outcome: GATE FINDINGS + CAPTURE-UNAVAILABLE (SHADOW)** — reported only; SHADOW never blocks on gate findings or capture availability. This check stays GREEN."
            elif [ "$any_capture_missing" = "1" ]; then
              echo "**Outcome: CAPTURE-UNAVAILABLE (SHADOW)** — at least one route produced no snapshot/frame: the capture pipeline is unavailable, so environment wiring is the Stage-A burn-in task (NOT a code regression). Reported only; SHADOW never blocks on capture availability. This check stays GREEN."
            elif [ "$any_gate2" = "1" ]; then
              echo "**Outcome: GATE FINDINGS (SHADOW)** — reported only; this check stays GREEN and does not block merge."
            else
              echo "**Outcome: PASS** — no gate findings."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ---- Exit-code logic (shadow vs enforce) -----------------------------
          # Three independent accumulators, scored against the mode:
          #   any_infra           (broken analyzer on a present input / missing
          #                        spec): ALWAYS fail — a broken gate must be
          #                        visible in BOTH modes.
          #   any_gate2           (analyzer exit 2 — a real gate verdict):
          #                        ENFORCE => fail; SHADOW => exit 0 (report-only).
          #   any_capture_missing (no snapshot/frame — capture unavailable):
          #                        ENFORCE => fail (can't enforce an unrun gate);
          #                        SHADOW  => exit 0 (report-only, never blocks).
          if [ "$any_infra" = "1" ]; then
            echo "::error::Style gate hit an INFRA error (broken/uninterpretable gate on a present input) — failing in both modes."
            exit 1
          fi
          if [ "$ENFORCE" = "1" ]; then
            if [ "$any_capture_missing" = "1" ]; then
              echo "::error::STYLE_GATE_ENFORCE=1 and >=1 route had no snapshot/frame (CAPTURE-UNAVAILABLE) — cannot enforce a gate that could not run. Failing the required check."
              exit 1
            fi
            if [ "$any_gate2" = "1" ]; then
              echo "::error::STYLE_GATE_ENFORCE=1 and >=1 route reported gate findings — failing the required check."
              exit 1
            fi
          else
            if [ "$any_capture_missing" = "1" ]; then
              echo "::warning::Style gate had CAPTURE-UNAVAILABLE routes, but SHADOW mode is active (report-only) — not failing. See the job summary table."
            fi
            if [ "$any_gate2" = "1" ]; then
              echo "::warning::Style gate found findings, but SHADOW mode is active (report-only) — not failing. See the job summary table."
            fi
          fi
          exit 0

      - name: Upload style-gate artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: style-gate-artifacts
          # `.artifacts/` is a HIDDEN dir; upload-artifact skips hidden files
          # unless include-hidden-files is set — without this the captured
          # snapshots/frames/findings never upload (only playwright-report did),
          # leaving the burn-in unable to triage. Keep this true.
          include-hidden-files: true
          path: |
            frontend/tests/e2e/style-gate/.artifacts/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # ----------------------------------------------------------------------
      # CI-infrastructure timeout marker (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 5).
      #
      # A job-level timeout concludes the job as `cancelled`, and `gh pr checks`
      # renders `cancelled` as **fail** -- with ZERO failing steps, because no
      # step failed. An author triaging their own PR sees "fail" against their
      # diff with nothing to point at, and reads it as their own regression. On
      # 2026-08-19 that misattribution cost real time on PR #1015. This step
      # exists so the log says what actually happened.
      #
      # `cancelled` has THREE causes and only the first is this plan's defect:
      #   1. an apt-dependent step stalled against the external mirror (ours)
      #   2. coord's merge train reaping a `merge-candidate/*` ref (benign)
      #   3. a manual / external / superseding cancel (benign)
      # 2 and 3 resolved in MINUTES in every observed case. A marker that
      # shouted "infrastructure timed out" on all three would be wrong on the
      # benign ones, and a diagnostic that is wrong a quarter of the time is
      # worse than none -- it teaches readers to discard the other three
      # quarters. So the ::error:: arms demand POSITIVE evidence that an
      # apt-dependent step is what died, and every other path declines to judge
      # the diff at all.
      #
      # An apt step marked `continue-on-error: true` CAN be present when this
      # step fires. Its own soft failure cannot red the check -- but a LATER,
      # genuine failure can, and this step then runs with that soft-failed
      # outcome still in hand. So arm 1 keys on `.conclusion` (the value AFTER
      # `continue-on-error` rewrites it), never on `.outcome` alone: a step
      # that concluded `success` is not what red this job, and naming it as the
      # cause would misattribute a real regression to infrastructure -- the
      # exact cry-wolf this step exists to prevent.
      #
      # A soft-failed apt step is NOT thereby harmless, and the marker must not
      # say it is. `continue-on-error: true` stops it reding the job DIRECTLY;
      # it does nothing about the cascade. style-gate.yml is the live example:
      # six of its provisioning steps are deliberate SHADOW soft-fails, so a
      # stalled `Install postgresql-client` leaves no psql, the schema and
      # migration steps soft-fail in turn, no snapshots are captured, and with
      # STYLE_GATE_ENFORCE=1 the assert step exits 1. That job is red BECAUSE
      # of the apt stall, with no apt step concluding `failure` anywhere. So
      # every arm that would otherwise assert "this failure is a real one" or
      # "no apt-dependent step failed" is guarded on `soft_failed` being empty,
      # and warns instead of ruling when it is not.
      - name: Explain infrastructure timeout vs external cancellation
        if: cancelled() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          # declared at this job's `timeout-minutes`.
          JOB_TIMEOUT_MINUTES: '30'
          EXTERNAL_CANCEL_NOTE: >-
            this workflow declares `concurrency: cancel-in-progress: true`, so a newer push to the same ref supersedes the run - that, a manual cancel, or coord's merge train reaping a merge-candidate/* ref are the external causes
          # `<step name>|<outcome>|<conclusion>` per apt-dependent step in this
          # job. BOTH values are carried on purpose:
          #   * `.outcome` is the value BEFORE `continue-on-error` rewrites it,
          #     so a soft-failed step still reports the truth here;
          #   * `.conclusion` is what actually reached the job, and ONLY a step
          #     that concluded `failure` can be what red it.
          # Every step named below runs `apt-get` and nothing else. Two splits
          # buy that invariant across all 8 workflows: the psql/DDL work that
          # used to share the postgresql-client steps now lives in an unbounded
          # successor step, and `npx playwright install --with-deps` -- npx
          # resolution PLUS a CDN browser download PLUS apt, fused into one
          # step -- is split so that only its apt-only `install-deps` half is
          # ever named here. So a `failure` on any step below is the apt
          # mirror: never the author's schema breaking, and never a Playwright
          # bundle that 404s on cdn.playwright.dev.
          APT_STEP_OUTCOMES: |
            Install Playwright Chromium system deps (apt)|${{ steps.apt_playwright.outcome }}|${{ steps.apt_playwright.conclusion }}
            Install postgresql-client|${{ steps.apt_psql.outcome }}|${{ steps.apt_psql.conclusion }}
        run: |
          set -uo pipefail

          # An apt step whose CONCLUSION is `failure` hit its own step-level
          # `timeout-minutes` (or apt errored outright) and red this job --
          # either way it is infrastructure. One whose outcome is `cancelled`
          # was still mid-flight when the job ended; that is only decisive once
          # we also know the job budget had actually expired. One that failed
          # but concluded `success` is `continue-on-error: true`: it did not red
          # this job DIRECTLY, but it can still have red it through the cascade
          # of steps that needed what it installs, so it is tracked separately
          # and never dismissed.
          #
          # Every matching step is named, not just the last one: two apt steps
          # can die in the same job, and reporting only one understates it.
          apt_failed=""
          apt_running=""
          soft_failed=""
          while IFS='|' read -r step_name outcome conclusion; do
            [ -z "${step_name// }" ] && continue
            case "$outcome" in
              failure)
                if [ "$conclusion" = "failure" ]; then
                  apt_failed="${apt_failed:+$apt_failed, }$step_name"
                else
                  soft_failed="${soft_failed:+$soft_failed, }$step_name"
                fi
                ;;
              cancelled) apt_running="${apt_running:+$apt_running, }$step_name" ;;
            esac
          done <<< "$APT_STEP_OUTCOMES"

          why="It shells out to apt-get against an external mirror at job time."
          why="$why That call is normally seconds, but has been observed to stall"
          why="$why for 30+ minutes (and, unbounded, for 5h59m). Nothing under test ran."
          ref="See plan 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure."

          # Context line, emitted before any verdict.
          if [ -n "$soft_failed" ]; then
            echo "::notice title=Soft-failed apt step - possible upstream cause::Step(s) '$soft_failed' failed but are marked 'continue-on-error: true', so they concluded 'success' and did not DIRECTLY red this job. A later step that needed what they install can still have failed as a consequence, which would make this job's red an apt cascade rather than a verdict on the diff."
          fi

          # --- Arm 1: an apt step failed AND that failure red the job.
          # Airtight: neither a merge-train reap nor any other external cancel
          # can make a step conclude `failure`.
          if [ -n "$apt_failed" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_failed' exceeded a step-level timeout-minutes or failed outright. $why This is a CI infrastructure failure, not a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 1b: no apt step concluded `failure` and none is mid-flight,
          # but one SOFT-failed. The cascade described in the step header is
          # live here, so "this job's failure is a real one" is an assertion
          # this step cannot support. Warn rather than rule -- an UNKNOWN
          # stated as UNKNOWN, not laundered into a negative.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=A soft-failed apt step may have red this job downstream::No apt-dependent step concluded 'failure', but step(s) '$soft_failed' soft-failed ('continue-on-error: true'). $why Steps that needed what they install can have failed as a consequence, so this job's red may be that cascade and NOT a verdict on the diff. Check the cascade before concluding either way. $ref"
            exit 0
          fi

          # --- Neither cancelled nor an apt failure => a genuine red. Say
          # nothing: this step explains infrastructure timeouts, it does not
          # editorialise real test failures.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ]; then
            echo "No apt-dependent step red the job, none was mid-flight, and the job was not cancelled."
            echo "This job's failure is a real one - emitting no marker."
            exit 0
          fi

          # --- Did the run actually reach its budget? A job timeout fires at
          # elapsed >= budget; a reap or a manual cancel lands at an arbitrary,
          # typically far earlier, elapsed (the two observed benign
          # cancellations were at 2m02s and 7m29s). That gap is the
          # discriminator, so resolve it from the API rather than assuming.
          # This lookup CAN fail (403, rate limit, network blip, a timestamp
          # `date -u -d` cannot parse); every failure leaves `elapsed_min`
          # empty, and empty is UNKNOWN. It is never evidence for a negative.
          elapsed_min=""
          started="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' 2>/dev/null || true)"
          if [ -n "$started" ]; then
            start_epoch="$(date -u -d "$started" +%s 2>/dev/null || true)"
            if [ -n "$start_epoch" ]; then
              elapsed_min=$(( ( $(date -u +%s) - start_epoch ) / 60 ))
            fi
          fi

          # 2 minutes of slack absorbs the gap between run start and job start.
          budget_floor=$(( JOB_TIMEOUT_MINUTES - 2 ))

          # --- Arm 2: the job budget expired while an apt step was still
          # running. Requires THREE facts. The `cancelled` guard is the one
          # arm 3 already carried and this arm was missing: a JOB_STATUS of
          # `failure` with an apt step mid-flight past the budget floor is NOT
          # a job timeout, and this text ("GitHub concludes a job timeout as
          # 'cancelled'") would be describing a mechanism that did not fire.
          # That state belongs to arm 2b, which names the real conclusion.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$apt_running" ] && [ -n "$elapsed_min" ] && [ "$elapsed_min" -ge "$budget_floor" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::The ${JOB_TIMEOUT_MINUTES}-minute job budget expired after ${elapsed_min} min while step(s) '$apt_running' were STILL RUNNING. $why GitHub concludes a job timeout as 'cancelled', which 'gh pr checks' renders as 'fail' with zero failing steps - that rendering is what makes this look like your test failure. It is not. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2b: the job did NOT conclude `cancelled`, yet an apt step
          # was left mid-flight. A step-level `timeout-minutes` expiry is the
          # primary mechanism this change introduces, and which of the two job
          # conclusions GitHub surfaces for it is NOT something this change
          # established. So handle both: under `cancelled` semantics arms 1/2
          # cover it, and under `failure` semantics this arm does. Betting on
          # one and printing "cancelled from outside" under the other would be
          # flatly false about the mechanism we just added.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -n "$apt_running" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_running' were interrupted mid-flight (step outcome 'cancelled') and this job concluded '$JOB_STATUS'. $why Nothing here is a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2c: cancelled with an apt step mid-flight, but arm 2's
          # budget test did not fire. Two sub-cases, and NEITHER licenses
          # ruling the stall out: an apt step really was running when this job
          # died.
          if [ -n "$apt_running" ]; then
            if [ -z "$elapsed_min" ]; then
              echo "::warning title=Cannot rule the apt stall in or out::Step(s) '$apt_running' were still mid-flight when this job was cancelled, but this run's elapsed time could NOT be read - the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so the known apt-mirror stall can be NEITHER confirmed NOR ruled out here. Nothing here is a verdict on the code in this change. $ref"
            else
              echo "::warning title=Cancelled with an apt step mid-flight::Step(s) '$apt_running' were still mid-flight when this job was cancelled after ${elapsed_min} min - well short of its ${JOB_TIMEOUT_MINUTES}-minute budget, which points at an external cancel ($EXTERNAL_CANCEL_NOTE) rather than the apt-mirror stall. But an apt step was genuinely running, so this does not rule the stall out either. Nothing here is a verdict on the code in this change. $ref"
            fi
            exit 0
          fi

          # --- Arm 3a: cancelled, nothing mid-flight, but an apt step
          # SOFT-failed. Arm 3's "No apt-dependent step failed" would be
          # flatly false here - one demonstrably did - so arm 3 does not get
          # to speak for this state.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=Cancelled, and a soft-failed apt step may have red this job downstream::This job was cancelled after ${elapsed_min:-an unknown number of} min against a ${JOB_TIMEOUT_MINUTES}-minute budget. No apt-dependent step was mid-flight, but step(s) '$soft_failed' soft-failed ('continue-on-error: true'), so the apt-mirror stall can NOT be ruled out here, and steps that needed what they install may have failed as a consequence. A cancelled run also reports no test results at all, so nothing here is a verdict on the code under test either way. $ref"
            exit 0
          fi

          # --- Arm 3: cancelled, no apt step red the job, none was
          # mid-flight and none soft-failed. The stall is ruled out BY THE
          # STEP OUTCOMES - a positive fact - not by the elapsed time, which
          # may be UNKNOWN. Explicitly decline to judge the diff either way.
          if [ "$JOB_STATUS" = "cancelled" ]; then
            echo "::notice title=Run cancelled externally - NOT a verdict on this diff::This job was cancelled after ${elapsed_min:-an unknown number of} min against a ${JOB_TIMEOUT_MINUTES}-minute budget. No apt-dependent step failed and none was mid-flight, so this was NOT the known apt-mirror stall. It was cancelled from outside: $EXTERNAL_CANCEL_NOTE. A cancelled run reports no test results at all, so nothing here says anything about the code under test: do not read it as a failure of this change, and do not read it as a pass either. Re-run if you need a verdict."
            exit 0
          fi

          # --- Unreachable under `if: cancelled() || failure()`: every
          # non-cancelled path above has already returned. Kept so an unforeseen
          # state says what it knows instead of falling through silently.
          echo "::notice title=No infrastructure verdict::Job status '$JOB_STATUS', no apt-dependent step red the job, none mid-flight. This marker has nothing to add about the code under test. $ref"
