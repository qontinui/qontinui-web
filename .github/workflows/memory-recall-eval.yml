name: memory recall eval

# Phase 3 of plan `2026-07-29-memory-recall-efficacy-benchmark`.
#
# Runs the retrieval-efficacy harness on PRs that touch the memory
# retrieval path and posts the scores as a PR comment.
#
# ** NOT A REQUIRED CHECK — BY DESIGN. **
# A golden set of a few dozen cases is too small and too subjective to
# block a merge on, and a flaky quality gate on the merge train is a
# self-inflicted wedge that consumes a global merge permit. This job
# REPORTS; a human reads the delta and decides. Do not add it to the
# branch protection required-checks list. Revisit only if the set grows
# past a few hundred reviewed cases (plan §3 Phase 3 / §4).
#
# Same shape as alembic-graph-check.yml: path-filtered, pull-requests:
# write, github-script comment, explicitly informational.
#
# Safe to trigger on `pull_request` here specifically because this repo
# already has workflows that run on coord's `merge-candidate/*` ref. A
# repo whose ONLY trigger is `pull_request` can never satisfy coord's
# awaiting-ci wait and permanently consumes one of the three global merge
# permits — do not copy this file into such a repo as its first workflow.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/app/services/memory_*'
      - 'backend/app/jobs/memory_*'
      - 'backend/app/api/v1/endpoints/memory.py'
      - 'backend/tests/memory_recall/**'
      - 'backend/tests/fixtures/memory_golden/**'
      - 'backend/tests/test_memory_recall_eval_db.py'
      # The job runs this suite first and lets a failure fail the job, so a
      # change to it must be able to trigger the job that gates on it.
      - 'backend/tests/test_memory_recall_scorer.py'
      - '.github/workflows/memory-recall-eval.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write   # so the job can comment the scores on the PR

env:
  PYTHON_VERSION: '3.12'

jobs:
  recall-eval:
    name: Recall eval (report only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        # pgvector-bundled image — coord.memory_records is vector-typed and
        # its migration hard-requires pgvector. On stock postgres:16 the
        # harness SKIPS wholesale, which would post a report claiming
        # nothing rather than reporting health.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qontinui_user
          POSTGRES_PASSWORD: qontinui_dev_password
          POSTGRES_DB: qontinui_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      # qontinui (a path-dep) pulls torch from pytorch-cu128; the wheels
      # overflow the runner's default disk without this.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # backend/pyproject.toml has path-deps on sibling repos, which
      # actions/checkout cannot place outside the workspace.
      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/jspinak/qontinui.git
          git clone --depth 1 https://github.com/qontinui/qontinui-cloud-control.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install qontinui-cloud-control into poetry venv
        run: poetry run pip install -e ../../qontinui-cloud-control

      - name: Run the recall harness
        id: eval
        env:
          DATABASE_URL: postgresql://qontinui_user:qontinui_dev_password@localhost:5432/qontinui_test
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-characters-long
          TESTING: 1
          REDIS_ENABLED: false
          MEMORY_RECALL_EVAL_REPORT: ${{ github.workspace }}/recall-eval.json
        run: |
          set -euo pipefail
          # The scorer suite is pure logic and must pass — it is what makes
          # every number below trustworthy. Run it first and let a failure
          # fail the JOB (the job is still not a REQUIRED check).
          poetry run pytest tests/test_memory_recall_scorer.py -q --no-cov

          # The harness itself. `|| true` deliberately: this job reports,
          # so a harness assertion (e.g. the FTS-sparsity baseline moving)
          # must surface as a comment rather than a bare red X with no
          # explanation. The outcome is captured and rendered below.
          if poetry run pytest tests/test_memory_recall_eval_db.py -q --no-cov; then
            echo "outcome=pass" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert the harness actually ran
        id: ran
        run: |
          set -euo pipefail
          report="${{ github.workspace }}/recall-eval.json"
          # A skip and a pass are the same colour. If the report file is
          # absent the suite skipped (no Postgres / no pgvector) and the
          # comment must say so rather than implying a clean result.
          if [ -f "$report" ]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the recall harness produced no report — it skipped (no Postgres or no pgvector). This is NOT a passing result."
          fi

      - name: Comment the scores on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          PRODUCED: ${{ steps.ran.outputs.produced }}
          OUTCOME: ${{ steps.eval.outputs.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.GITHUB_WORKSPACE}/recall-eval.json`;
            const lines = ['### Memory recall eval', ''];

            if (process.env.PRODUCED !== 'true') {
              lines.push(
                '⚠️ **The harness did not run.** No report was produced, which means the',
                'suite skipped (Postgres or pgvector unavailable) — a skip and a pass are',
                'the same colour, so this is *not* evidence that retrieval is healthy.',
                '',
                'Nothing was measured for this PR.',
              );
            } else {
              const r = JSON.parse(fs.readFileSync(path, 'utf8'));
              const pct = (x) => (x * 100).toFixed(1) + '%';
              const arm = (name) => r.arms.find((a) => a.arm === name);
              const fts = arm('fts_only');
              const hyb = arm('hybrid');

              lines.push(
                `Golden set: **${r.records} records, ${fts.cases} cases** · ` +
                  `vectors: \`${r.embedding_source}\``,
                '',
              );

              if (!r.semantic_quality_measurable) {
                lines.push(
                  '> ⚠️ `semantic_quality_measurable: false` — the fixture carries **stub**',
                  '> vectors, so the `hybrid` column measures fusion **mechanics**, not',
                  '> semantic retrieval quality. Vocabulary-mismatch cases are unmeasurable',
                  '> under a bag-of-words stub. See `tests/fixtures/memory_golden/README.md`.',
                  '',
                );
              }

              lines.push(
                '| Metric | `fts_only` (production today) | `hybrid` |',
                '|---|---|---|',
                `| reported \`vector_arm\` | \`${fts.vector_arm}\` | \`${hyb.vector_arm}\` |`,
                `| Recall@5 | ${pct(fts.recall_at_5)} | ${pct(hyb.recall_at_5)} |`,
                `| Recall@10 | ${pct(fts.recall_at_10)} | ${pct(hyb.recall_at_10)} |`,
                `| Recall@20 | ${pct(fts.recall_at_20)} | ${pct(hyb.recall_at_20)} |`,
                `| MRR | ${fts.mrr.toFixed(4)} | ${hyb.mrr.toFixed(4)} |`,
                `| nDCG@10 | ${fts.ndcg_at_10.toFixed(4)} | ${hyb.ndcg_at_10.toFixed(4)} |`,
                `| Noise rate@10 | ${pct(fts.noise_rate_at_10)} | ${pct(hyb.noise_rate_at_10)} |`,
                `| Token cost@10 (bytes) | ${fts.total_token_cost_at_10.toLocaleString()} | ${hyb.total_token_cost_at_10.toLocaleString()} |`,
                `| Correction precedence | ${fts.correction_precedence_passes}/${fts.correction_pairs} | ${hyb.correction_precedence_passes}/${hyb.correction_pairs} |`,
                '',
                '<details><summary>Per class (Recall@10 / MRR)</summary>',
                '',
                '| Class | `fts_only` | `hybrid` |',
                '|---|---|---|',
              );

              for (const cls of Object.keys(r.by_class.fts_only)) {
                const f = r.by_class.fts_only[cls];
                const h = r.by_class.hybrid[cls];
                lines.push(
                  `| ${cls} (${f.cases}) | ${f.recall_at_10.toFixed(3)} / ${f.mrr.toFixed(3)} ` +
                    `| ${h.recall_at_10.toFixed(3)} / ${h.mrr.toFixed(3)} |`,
                );
              }
              lines.push('', '</details>', '');

              // Paired comparison (plan 2026-08-11 §3.3 items 1-2). Every
              // field is optional-guarded: a report written by an older
              // harness has no `paired` key at all and must render a note
              // rather than throw and lose the whole comment.
              const paired = r.paired;
              const pmetrics = (paired && paired.metrics) || null;
              if (pmetrics && Object.keys(pmetrics).length > 0) {
                const num = (x, digits) =>
                  typeof x === 'number' && isFinite(x) ? x.toFixed(digits) : null;
                const signed = (x, digits) => {
                  const v = num(x, digits);
                  if (v === null) return '_n/a_';
                  return (x >= 0 ? '+' : '') + v;
                };
                const flag = (b) => (b === true ? '**yes**' : b === false ? 'no' : '_n/a_');

                lines.push(
                  `**Paired comparison** — candidate \`${paired.candidate || 'hybrid'}\` ` +
                    `vs control \`${paired.control || 'fts_only'}\`, matched case-by-case.`,
                  '',
                  '| Metric | n | mean lift | z | `promoted` | `credited_2sigma` |',
                  '|---|---|---|---|---|---|',
                );
                for (const name of Object.keys(pmetrics)) {
                  const p = pmetrics[name] || {};
                  const n = typeof p.n === 'number' ? String(p.n) : '_n/a_';
                  const zCell = p.insufficient_n
                    ? '_n<2_'
                    : '`' + (p.z_display || num(p.z, 4) || 'n/a') + '`';
                  const lowerBetter = p.lower_is_better === true ? ' ↓better' : '';
                  lines.push(
                    `| ${name}${lowerBetter} | ${n} | ${signed(p.mean_lift, 4)} | ${zCell} ` +
                      `| ${flag(p.promoted)} | ${flag(p.credited_2sigma)} |`,
                  );
                }
                lines.push(
                  '',
                  '> `promoted` and `credited_2sigma` are **separate on purpose and are never',
                  '> collapsed**. `promoted` = `candidate_mean > control_mean` — that is what banks.',
                  '> `credited_2sigma` = `z >= 2.0` — a reported label, not a gate. A candidate that',
                  '> banks a real lift at z=1.71 is `promoted` **and not** `credited_2sigma`: an',
                  '> expected outcome, not an error. Permissive bank, honest label.',
                  '',
                );
              } else {
                lines.push(
                  '_No paired comparison in this report — it was written by a harness',
                  'predating plan `2026-08-11-coord-ambient-recall-and-efficacy-statistical-rigor`.',
                  'That is a missing measurement, not a null result._',
                  '',
                );
              }

              // Denominator honesty: `cases` is the divisor every mean above
              // was taken over. If any arm scored fewer cases than that, the
              // missing ones contributed 0.0 and the headline is a FLOOR.
              const shortArms = (r.arms || []).filter((a) => (a.missing_cases || 0) > 0);
              if (shortArms.length > 0) {
                lines.push(
                  '⚠️ **Some cases did not score.** The missing cases contributed `0.0` to',
                  'every mean and were **kept in the denominator** (dropping them would',
                  'shrink the divisor and overstate the result — the fair-subset',
                  'extrapolation trap). The numbers above are a floor:',
                  '',
                  ...shortArms.map(
                    (a) =>
                      `- \`${a.arm}\`: ${a.missing_cases} of ${a.cases} cases missing ` +
                      `(${a.scored_cases} scored)`,
                  ),
                  '',
                );
              }

              if (process.env.OUTCOME === 'fail') {
                lines.push(
                  '❌ **A harness assertion failed.** The most likely cause is that a',
                  'baseline this suite pins has moved — which is the signal the benchmark',
                  'exists to produce, not necessarily a defect. Read the job log, then',
                  're-record the baseline in the plan\'s §3 Phase 2 if the change is intended.',
                  '',
                );
              }
            }

            lines.push(
              '---',
              '_Informational only — this check is **not required** and does not gate the merge._',
              '_Compare against the recorded baseline in `2026-07-29-memory-recall-efficacy-benchmark.md` §3 Phase 2._',
            );

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
