name: Apply Migrations to RDS

# Echo the coord gate-executor dispatch_id (when present) so the dispatcher
# can find this run by name — the dispatches API returns 204 with no run id.
# On push/schedule the `inputs` context is empty (missing inputs evaluate to
# '' in expressions), so this degrades to the plain base name.
run-name: "Apply Migrations to RDS${{ inputs.dispatch_id != '' && format(' [dispatch:{0}]', inputs.dispatch_id) || '' }}"

# Auto-runs `alembic upgrade head` against the staging canonical DB by building
# the migrator image and dispatching the ECS task. The migrator image is the
# one defined in qontinui-stack/migrator/ — it embeds the full alembic chain
# from backend/alembic + the qontinui-schemas dependency at build time.
#
# Triggers:
#   - push to main when alembic chain or backend pyproject changes
#   - workflow_dispatch for manual catch-up runs (schemas-only drift, etc.)
#   - nightly schedule so schema drift never accumulates more than ~24h
#
# The migrator entrypoint is idempotent — if the DB is already at head it
# exits 0 without writing. Cost of an unnecessary run is ~3 min CI + a few
# seconds of Fargate; cheaper than a drift incident.
#
# Memory: proj_staging_pg_schema_drift_2026-05-22 — the manual-only model
# this workflow replaces silently broke /coord/status + the multi-tenant
# audit INSERT path. Auto-deploy of migrations is the documented fix.
#
# FORWARD-ONLY — NOT covered by deploy auto-rollback. The post-deploy
# auto-rollback in deploy-web.yml (and verify-frontend-run.yml) reverts the
# APPLICATION (ECS task-def / Vercel alias) to a prior revision, but it does
# NOT and MUST NOT revert the schema: alembic downgrades are not data-safe
# (dropped columns/tables lose data). Treat migrations as forward-only —
# additive + backward-compatible with the currently-live app so a rolled-back
# app keeps working against the new schema — and fix forward, never auto-revert
# a migration. (Do not add a naive `alembic downgrade` rollback step here.)

on:
  push:
    branches: [main]
    paths:
      - 'backend/alembic/**'
      - 'backend/pyproject.toml'
      - 'backend/poetry.lock'
  schedule:
    - cron: '0 3 * * *'  # daily 03:00 UTC catches schemas-only drifts
  workflow_dispatch:
    inputs:
      # Coord's deploy/migrate gate executor (plan
      # 2026-06-10-coord-deploy-migrate-executor) dispatches this workflow with
      # dispatch_id and correlates the spawned run via the run-name echo above.
      # Must stay DECLARED: GitHub 422-rejects a dispatch carrying undeclared
      # inputs. Optional with a default, so manual/empty dispatches still work.
      dispatch_id:
        description: "Coord gate-executor correlation id — echoed in run-name so the dispatcher can find this run (leave empty for manual runs)"
        required: false
        default: ""
      # How long the migrator step waits for the task to STOP before it reports
      # outcome UNKNOWN (integer seconds, 1..960; anything else -> 900). For a
      # known-slow apply, and for exercising the UNKNOWN path: a tiny value
      # expires while Fargate is still provisioning, and the idempotent migrator
      # then finishes as a no-op at head.
      wait_deadline_secs:
        description: "Seconds to wait for the migrator task to stop before reporting outcome UNKNOWN (1..960; empty = 900)"
        required: false
        default: ""

# Migrator runs as a one-shot ECS task; concurrent runs are safe (alembic
# acquires its own advisory lock on the DB) but pointless. Cancel-in-progress
# is OFF: cancelling a migration mid-flight risks half-applied DDL that
# alembic's advisory lock can't roll back. Pending runs queue and the latest
# wins naturally (alembic stamps head, intermediate runs no-op).
concurrency:
  group: migrate
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: qontinui-migrator
  IMAGE_TAG: staging
  ECS_CLUSTER: ${{ secrets.STAGING_ECS_CLUSTER }}
  ECS_TASK_FAMILY: qontinui-staging-migrator
  ECS_SUBNETS: ${{ secrets.STAGING_PRIVATE_SUBNET_IDS }}
  ECS_SECURITY_GROUP: ${{ secrets.STAGING_CLIENT_SG_ID }}

jobs:
  migrate:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2).
    # A deliberate number, not the green-run formula: 40 green runs are p50 2.70 /
    # p90 3.44 / max 4.88 min, but they are mostly no-op runs at head. A run that
    # applies real DDL spends up to the migrator step's full wait deadline (900 s
    # by default, 960 s max via the wait_deadline_secs input) on top of build (~3)
    # + task start (~1) + reporting. A timeout CANCELS the job, and `failure()` is
    # false for a cancelled job, so a cap below that path would skip the
    # migration-failure page. 25 covers the worst path with headroom — the cap and
    # the wait deadline must move TOGETHER.
    timeout-minutes: 25
    name: Build, push, run migrator
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # issues: write powers the page-on-failure step below (create/comment a
      # tracking issue when the migration apply fails).
      issues: write
      # OIDC: configure-aws-credentials assumes the scoped qontinui-web-migrate
      # role with this job's GitHub token (no stored AWS key).
      id-token: write

    steps:
      - name: Check out qontinui-web
        uses: actions/checkout@v5
        with:
          # Full history so the DAG-snapshot step can resolve each migration
          # file's INTRODUCING commit (`git log --diff-filter=A`) into
          # `authored_in_sha` — the join key coord's lifecycle view uses against
          # `commit_lineage`. Shallow (default depth-1) would leave it null.
          fetch-depth: 0

      # ── Φ_Schema authored-DAG snapshot ────────────────────────────────────
      # Phase 3 of the coord migration/drift/provenance plan, and now the SOLE
      # declared-side report to coord (the old single chain-head attestation was
      # retired — coord derives the declared head first-party from its mirror of
      # web main, so a second-hand POST of just the head(s) is redundant). This
      # POSTs the FULL authored DAG so coord can render per-revision provenance
      # (parents, the objects each revision touches, reversibility, merge
      # points). Stdlib-only scan, bearer-gated, fail-open — observes, never
      # gates. Upserts one row per revision into coord.migration_revisions.
      - name: Report alembic DAG snapshot to coord
        continue-on-error: true
        env:
          COORD_INGEST_TOKEN: ${{ secrets.COORD_INGEST_TOKEN }}
        run: |
          set -uo pipefail
          # Map each version file to its INTRODUCING commit (the one that ADDED
          # it) + that commit's date, in ONE git pass (newest-first). Powers
          # per-revision authored_in_sha / authored_at below. Best-effort: a
          # shallow clone or git failure yields an empty map → authored_in_sha
          # stays null (the prior behavior), never a hard fail.
          git log --diff-filter=A --name-only --format='C|%H|%cI' \
            -- backend/alembic/versions/ > /tmp/addmap.txt 2>/dev/null || : > /tmp/addmap.txt
          # `|| :` because GitHub runs this step under `bash -e {0}` and
          # `set -uo pipefail` above does NOT clear `-e`: without it a python
          # that dies (a bad import, an unparseable file) aborts the step at
          # this line and the best-effort `::warning::` below never prints —
          # a red X with a traceback instead of the one-line reason. The step
          # is continue-on-error either way; what is at stake is the diagnostic.
          python3 - <<'PY' > /tmp/snap.json || :
          import json, os, re, sys

          # The revision/parent parse is DELEGATED to scripts/ci/_alembic_graph.py,
          # the module the BLOCKING head gate already uses, so this lane cannot drift
          # from the one that fails a PR. It had its own line-scoped copy until
          # 2026-09-16, when a ruff-wrapped `down_revision` parsed as zero parents
          # here and the snapshot reported a parent as a head — a fork alembic did
          # not see. That module masks docstrings and reads a wrapped right-hand
          # side; keeping a second parser in this file is what made the drift
          # possible.
          sys.path.insert(0, "scripts/ci")
          import _alembic_graph as G

          D = "backend/alembic/versions"
          GITHUB_SHA = os.environ.get("GITHUB_SHA")

          # filename (basename) -> (introducing_sha, committer_date_iso). Parsed
          # from the `git log --diff-filter=A --name-only` dump above: each
          # `C|<sha>|<date>` line sets the current commit, each subsequent path
          # line attributes that file's ADD. Newest-first, so the FIRST add seen
          # per file wins (the most recent add if a file was ever re-added).
          add_map = {}
          try:
              cur_sha = cur_date = None
              with open("/tmp/addmap.txt", encoding="utf-8") as fh:
                  for line in fh:
                      line = line.rstrip("\n")
                      if line.startswith("C|"):
                          parts = line.split("|", 2)
                          cur_sha = parts[1] if len(parts) > 1 else None
                          cur_date = parts[2] if len(parts) > 2 else None
                      elif line.endswith(".py") and cur_sha:
                          base = os.path.basename(line)
                          add_map.setdefault(base, (cur_sha, cur_date))
          except OSError:
              add_map = {}


          def parse_revision_and_parents(src):
              # (revision, parents) in ONE pass — `parse_source` tokenizes the
              # file to mask docstrings, so asking it twice per file doubles the
              # step's parse time for nothing. Parents: `None` -> [], a single
              # id -> [id], a tuple -> every id, in any spelling the gate
              # accepts (including a formatter-wrapped right-hand side).
              parsed = G.parse_source(src)
              if not parsed:
                  return None, []
              return parsed[0], G.PARENT_REF_RE.findall(parsed[1])


          def block_after(src, header_regex):
              # Return the source from the matched def header to the next
              # top-level `def ` (or EOF). Good enough for our flat migration
              # files.
              m = re.search(header_regex, src, re.M)
              if not m:
                  return ""
              start = m.end()
              nxt = re.search(r"^def ", src[start:], re.M)
              return src[start: start + nxt.start()] if nxt else src[start:]


          def parse_reversible(src):
              body = block_after(src, r"^def downgrade\s*\(")
              # Reversible iff the downgrade body actually does DDL (`op.`),
              # i.e. it is not just pass / comments / `...`.
              return bool(re.search(r"\bop\.", body))


          def parse_objects_touched(src):
              body = block_after(src, r"^def upgrade\s*\(")
              objs = []
              for name in re.findall(r"op\.create_table\(\s*[\"']([^\"']+)", body):
                  objs.append({"op": "created", "object_type": "table", "name": name})
              for name in re.findall(r"op\.drop_table\(\s*[\"']([^\"']+)", body):
                  objs.append({"op": "dropped", "object_type": "table", "name": name})
              for name in re.findall(r"op\.create_index\(\s*[\"']([^\"']+)", body):
                  objs.append({"op": "created", "object_type": "index", "name": name})
              for name in re.findall(r"op\.drop_index\(\s*[\"']([^\"']+)", body):
                  objs.append({"op": "dropped", "object_type": "index", "name": name})
              # add_column: best-effort grab of the sa.Column("c") first arg in
              # the same call. If not easily grabbable, skip (empty is fine).
              for chunk in re.findall(r"op\.add_column\((.*?)\)\s*$", body, re.M | re.S):
                  cm = re.search(r"sa\.Column\(\s*[\"']([^\"']+)", chunk)
                  if cm:
                      objs.append(
                          {"op": "created", "object_type": "column", "name": cm.group(1)}
                      )
              return objs


          revisions = []
          try:
              files = sorted(f for f in os.listdir(D) if f.endswith(".py"))
          except OSError:
              files = []
          for f in files:
              try:
                  src = open(os.path.join(D, f), encoding="utf-8").read()
                  rev, downs = parse_revision_and_parents(src)
                  if not rev:
                      continue
                  authored_in_sha, authored_at = add_map.get(f, (None, None))
                  revisions.append({
                      "revision": rev,
                      "down_revisions": downs,
                      "objects_touched": parse_objects_touched(src),
                      "reversible": parse_reversible(src),
                      "is_merge_point": len(downs) > 1,
                      "authored_in_sha": authored_in_sha,
                      "authored_at": authored_at,
                  })
              except Exception as e:  # best-effort — never crash the step
                  print(f"# skip {f}: {e}")

          print(json.dumps({
              "repo": "qontinui/qontinui-web",
              "source_sha": GITHUB_SHA,
              "revisions": revisions,
          }))
          PY
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/snap.json'))['revisions']))" 2>/dev/null || echo 0)
          if [ "${N:-0}" = "0" ]; then
            echo "::warning::DAG snapshot parsed 0 revisions — skipping (best-effort)"
            exit 0
          fi
          echo "DAG snapshot: $N revisions"
          CODE=$(curl -s -o /tmp/snap_resp -w '%{http_code}' --max-time 20 \
            -X POST "https://coord.qontinui.io/coord/schema/revisions-snapshot" \
            -H "Authorization: Bearer $COORD_INGEST_TOKEN" \
            -H 'Content-Type: application/json' \
            -d @/tmp/snap.json || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "snapshot reported: $(head -c 200 /tmp/snap_resp)"
          else
            echo "::warning::revisions-snapshot returned $CODE (best-effort, migration proceeds): $(head -c 300 /tmp/snap_resp 2>/dev/null)"
          fi
          exit 0

      # The migrator Dockerfile uses qontinui-root as build context (one
      # level up from any sibling repo's checkout). Sibling-checkout pattern
      # mirrors backend-deploy-production.yml and the runner CI.
      - name: Check out qontinui-stack + qontinui-schemas siblings
        working-directory: ${{ github.workspace }}/..
        run: |
          git clone --depth 1 https://github.com/qontinui/qontinui-stack.git
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
        shell: bash

      # Scoped qontinui-web-migrate role via GitHub OIDC: ECR on
      # qontinui-migrator only, the qontinui-staging-migrator task-def + task,
      # and the migrator log group.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::047719635665:role/qontinui-web-migrate
          role-session-name: migrate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "uri=$REGISTRY/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" >/dev/null 2>&1 \
          || aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" \
            --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${{ steps.ecr.outputs.registry }}"

      # Build context = parent of qontinui-web checkout (i.e. the directory
      # containing qontinui-web/, qontinui-stack/, qontinui-schemas/). The
      # Dockerfile COPYs from qontinui-web/backend/{alembic,app}/ and from
      # qontinui-schemas/ relative to that context.
      - name: Build migrator image
        working-directory: ${{ github.workspace }}/..
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f qontinui-stack/migrator/Dockerfile \
            -t "${{ steps.ecr.outputs.uri }}" \
            -t "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            --load \
            .

      - name: Push migrator image
        run: |
          docker push "${{ steps.ecr.outputs.uri }}"
          docker push "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"

      # Register a fresh task-def revision pinned to THIS run's SHA image and
      # run that revision explicitly. Do NOT rely on the family's latest
      # revision pointing at a current image: on 2026-05-23 the live
      # qontinui-staging-migrator task-def had drifted to a pinned SHA tag
      # (`qontinui-migrator:721ebf8`, pre-`pair_codes_table`) while this
      # workflow dutifully pushed fresh `:staging` images that run-task never
      # used. The migrator silently no-op'd ("DB already at head") for a full
      # day, stranding staging at `coord_session_substrate` and 500ing the
      # pair-codes mint endpoint. Pinning the just-pushed SHA here makes the
      # migrate run self-sufficient and immune to task-def image drift —
      # mirrors staging-web-deploy.yml's deploy step.
      - name: Register task-def revision (fresh SHA image)
        id: taskdef
        run: |
          NEW_IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          aws ecs describe-task-definition --task-definition "${ECS_TASK_FAMILY}" \
            --region "${AWS_REGION}" --query 'taskDefinition' --output json > td.json
          python3 - "$NEW_IMAGE" <<'PY'
          import json, sys
          new_image = sys.argv[1]
          td = json.load(open("td.json"))
          for c in td["containerDefinitions"]:
              if "qontinui-migrator" in c.get("image", ""):
                  c["image"] = new_image
          for k in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                    "compatibilities", "registeredAt", "registeredBy", "deregisteredAt"):
              td.pop(k, None)
          json.dump(td, open("td-new.json", "w"))
          PY
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
            --region "${AWS_REGION}" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $NEW_TD (image $NEW_IMAGE)"
          echo "arn=$NEW_TD" >> "$GITHUB_OUTPUT"

      - name: Run migrator task
        id: runtask
        run: |
          # Convert comma-separated subnet list into JSON array literal for
          # the awsvpcConfiguration argument. STAGING_PRIVATE_SUBNET_IDS is
          # stored as e.g. "subnet-aaaa,subnet-bbbb".
          SUBNETS_JSON=$(echo "${ECS_SUBNETS}" | python3 -c 'import sys,json; print(json.dumps([s.strip() for s in sys.stdin.read().split(",") if s.strip()]))')

          TASK_ARN=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=${SUBNETS_JSON},securityGroups=[${ECS_SECURITY_GROUP}],assignPublicIp=DISABLED}" \
            --started-by "github-actions-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "::error::run-task returned no taskArn"
            exit 1
          fi
          echo "task_arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"
          echo "Started ${TASK_ARN}"

      # ── Wait for the migrator (bounded) and classify its outcome ──────────
      # One step, not a waiter followed by a reporter. `aws ecs wait
      # tasks-stopped` gives up by itself after ~10 min (100 polls x 6 s) and
      # FAILS its step, which skipped the exit-code/log report and fired the
      # page below as "apply failed" about a task that was still running and
      # might succeed (plan
      # 2026-09-26-migrate-waiter-timeout-hides-the-outcome-and-pages-a-running-migration-as-failed).
      # This step polls to its own deadline and sets `outcome`:
      #   succeeded — the task STOPPED with container exitCode 0
      #   failed    — the task STOPPED with any other exitCode, including null
      #               (it stopped without the container exiting cleanly: image
      #               pull, OOM, essential container stopped — see stop_reason)
      #   unknown   — the task was never observed STOPPED before the deadline;
      #               it keeps running and may still succeed
      # Only `succeeded` exits 0 — an unconfirmed apply must not read green; the
      # page tells `failed` and `unknown` apart. It NEVER stops the task:
      # stopping a migration mid-DDL is the half-applied-schema risk the
      # concurrency comment at the top of this file forbids for cancellation.
      # Logs are tailed in every outcome — a running task has logs too.
      - name: Wait for migrator + report outcome
        id: migrator
        env:
          TASK_ARN: ${{ steps.runtask.outputs.task_arn }}
          WAIT_DEADLINE_INPUT: ${{ inputs.wait_deadline_secs }}
          # The per-call --cli-*-timeout flags bound ONE attempt; the CLI's
          # default retries could still stack several. Two attempts max keeps
          # the deadline + tail inside the job cap.
          AWS_MAX_ATTEMPTS: "2"
          AWS_RETRY_MODE: standard
        run: |
          set -uo pipefail

          DEADLINE=900
          # No leading zero: bash arithmetic reads `0900` as (invalid) octal
          # and would abort this step before it writes any output.
          if [[ "${WAIT_DEADLINE_INPUT:-}" =~ ^[1-9][0-9]{0,3}$ ]] \
            && [ "${WAIT_DEADLINE_INPUT}" -le 960 ]; then
            DEADLINE="${WAIT_DEADLINE_INPUT}"
          elif [ -n "${WAIT_DEADLINE_INPUT:-}" ]; then
            echo "::warning::wait_deadline_secs is not an integer in 1..960; using ${DEADLINE}"
          fi
          echo "Waiting up to ${DEADLINE}s for ${TASK_ARN} to stop"

          START=$(date +%s)
          LAST_STATUS="UNOBSERVED"
          TASK_DESC=""
          DESCRIBE_ERR=$(mktemp)
          while :; do
            # A failed describe (throttling, a network blip) is logged and the
            # poll continues — it is not an outcome. stderr is kept apart so a
            # CLI warning on a SUCCESSFUL call cannot corrupt the JSON.
            # Per-call timeouts: the AWS CLI defaults (60 s connect + 60 s read,
            # plus retries) would let one slow call run past the job cap.
            if RESP=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" \
                  --tasks "${TASK_ARN}" --output json \
                  --cli-connect-timeout 10 --cli-read-timeout 20 2>"$DESCRIBE_ERR"); then
              # lastStatus, or ECS's own failure reason (e.g. MISSING) when it
              # returns no task.
              STATUS=$(printf '%s' "$RESP" | python3 -c 'import sys,json; r=json.load(sys.stdin); t=(r.get("tasks") or [None])[0]; f=(r.get("failures") or [{}])[0]; print((t or {}).get("lastStatus") or ("ECS_" + f["reason"] if f.get("reason") else "NO_STATUS"))' 2>/dev/null) || STATUS="UNPARSEABLE"
              LAST_STATUS="$STATUS"
              if [ "$STATUS" = "STOPPED" ]; then
                TASK_DESC=$(printf '%s' "$RESP" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin)["tasks"][0]))' 2>/dev/null) || TASK_DESC=""  # unreadable -> outcome unknown, never a false "failed"
                break
              fi
            else
              echo "::warning::describe-tasks failed (poll continues): $(head -c 300 "$DESCRIBE_ERR" | tr '\n' ' ')"
            fi
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -ge "$DEADLINE" ]; then
              break
            fi
            REMAINING=$(( DEADLINE - ELAPSED ))
            sleep $(( REMAINING < 10 ? REMAINING : 10 ))
          done
          WAITED=$(( $(date +%s) - START ))

          EXIT_CODE="null"
          STOP_REASON=""
          if [ -n "$TASK_DESC" ]; then
            EXIT_CODE=$(printf '%s' "$TASK_DESC" | python3 -c 'import sys,json; t=json.load(sys.stdin); c=(t.get("containers") or [{}])[0]; print(c.get("exitCode") if c.get("exitCode") is not None else "null")' 2>/dev/null) || EXIT_CODE="null"
            # One line: it lands in $GITHUB_OUTPUT and in the page text.
            STOP_REASON=$(printf '%s' "$TASK_DESC" | python3 -c 'import sys,json; t=json.load(sys.stdin); print(" ".join((t.get("stoppedReason") or "").split())[:300])' 2>/dev/null) || STOP_REASON=""
            if [ "$EXIT_CODE" = "0" ]; then OUTCOME=succeeded; else OUTCOME=failed; fi
          else
            OUTCOME=unknown
          fi

          echo "outcome=${OUTCOME}"
          echo "lastStatus=${LAST_STATUS}"
          echo "exitCode=${EXIT_CODE}"
          echo "stoppedReason=${STOP_REASON}"
          echo "waited=${WAITED}s (deadline ${DEADLINE}s)"
          {
            echo "outcome=${OUTCOME}"
            echo "last_status=${LAST_STATUS}"
            echo "exit_code=${EXIT_CODE}"
            echo "stop_reason=${STOP_REASON}"
            echo "waited_secs=${WAITED}"
          } >> "$GITHUB_OUTPUT"

          # CloudWatch logs (last 100 events) for diagnostic capture in the
          # workflow run output. The log group + stream naming is
          # /ecs/qontinui-staging/migrator + migrator/migrator/<task-id>.
          TASK_ID="${TASK_ARN##*/}"
          aws logs get-log-events \
            --log-group-name "/ecs/qontinui-staging/migrator" \
            --log-stream-name "migrator/migrator/${TASK_ID}" \
            --limit 100 \
            --query 'events[].message' \
            --output text \
            --cli-connect-timeout 10 --cli-read-timeout 20 2>/dev/null \
            || echo "(log stream not yet flushed)"

          case "$OUTCOME" in
            succeeded)
              exit 0 ;;
            failed)
              echo "::error::Migrator exited with code ${EXIT_CODE} (reason: ${STOP_REASON})"
              exit 1 ;;
            *)
              echo "::error::migrator task still ${LAST_STATUS} after ${WAITED}s; outcome UNKNOWN — the task keeps running and may still succeed; do NOT treat this as a failed apply"
              exit 1 ;;
          esac

      # ── Report the migration apply to coord (best-effort) ─────────────────
      # NEVER `if: always()`. POST /coord/schema/applications has no outcome
      # field — every POST asserts that `revision` WAS applied to `database` —
      # so running this after a `failed` or `unknown` migrator outcome would
      # insert a false row into coord.migration_applications. An `unknown` run
      # tells coord nothing; the next green run (a no-op at head still posts the
      # head) records the true state.
      # Phase 3 provenance: after the migrator one-shot succeeds (the step
      # above `exit 1`s otherwise), record the apply event in
      # coord.migration_applications. The applied revision == the authored head
      # computed by the same stdlib scan used for chain-head attestation. This
      # workflow targets the STAGING CANONICAL DB (see header line ~9), so
      # database = canonical-pg. Best-effort, fail-open — never gates, never
      # alters the (already-green) migrate outcome.
      - name: Report migration apply to coord
        if: steps.migrator.outputs.outcome == 'succeeded'
        continue-on-error: true
        env:
          COORD_INGEST_TOKEN: ${{ secrets.COORD_INGEST_TOKEN }}
        run: |
          set -uo pipefail
          HEADS_LINE=$(python3 - <<'PY'
          import sys
          from pathlib import Path

          # Same delegation as the DAG-snapshot step above, for the same reason:
          # scripts/ci/_alembic_graph.py is the parser the blocking head gate
          # uses, and a second copy here drifted from it (2026-09-16 — a
          # ruff-wrapped `down_revision` made this census read 2 heads where
          # alembic read 1, and this step skipped its apply report).
          sys.path.insert(0, "scripts/ci")
          import _alembic_graph as G

          scan = G.scan_dir(Path("backend/alembic/versions"))
          heads = list(scan.heads)
          if scan.duplicates:
              # Two files declaring one revision id collapse into a single node,
              # so the head set was computed over a graph that lost one. Report
              # no head rather than a head derived from it; the caller's
              # single-head guard then skips this best-effort report.
              heads = []
          print(f"{','.join(heads)} {len(heads)}")
          PY
          ) || HEADS_LINE=""
          # `|| HEADS_LINE=""` for the same reason as the `|| :` in the DAG
          # snapshot step: this step runs under `bash -e {0}`, so without it a
          # python failure aborts before the `::warning::` below.
          HEADS="${HEADS_LINE% *}"
          COUNT="${HEADS_LINE##* }"
          if [ -z "${HEADS:-}" ] || [ "${COUNT:-0}" != "1" ]; then
            echo "::warning::cannot report apply — authored head count=${COUNT:-0} (expected single head); skipping"
            exit 0
          fi
          echo "applied head: $HEADS"
          BODY=$(python3 -c "
          import json, os, sys
          print(json.dumps({
              'repo': 'qontinui/qontinui-web',
              'revision': sys.argv[1],
              'database': 'canonical-pg',
              'applied_by': 'migrate-workflow',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'duration_ms': None,
          }))" "$HEADS")
          CODE=$(curl -s -o /tmp/apply_resp -w '%{http_code}' --max-time 20 \
            -X POST "https://coord.qontinui.io/coord/schema/applications" \
            -H "Authorization: Bearer $COORD_INGEST_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$BODY" || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "apply reported: $(head -c 200 /tmp/apply_resp)"
          else
            echo "::warning::applications POST returned $CODE (best-effort): $(head -c 300 /tmp/apply_resp 2>/dev/null)"
          fi
          exit 0

      # ── Page on migration failure (best-effort) ───────────────────────────
      # A failed migrate run used to just turn red — nobody was paged, which is
      # exactly how web #538's silent migration failure went unnoticed on
      # 2026-06-08 (the /commits page then 500'd against the missing column for
      # hours). The org has no SNS/PagerDuty channel in any workflow, so this
      # mirrors the two patterns that DO exist:
      #   1. deploy-coord.yml's loud, page-worthy `::error::` annotation
      #      demanding manual intervention (its auto-rollback step), and
      #   2. automated GitHub-issue creation (qontinui/comprehensive-analysis.yml)
      #      — the one channel that actually emails repo watchers.
      # Best-effort: `continue-on-error` + trailing `exit 0` so a paging hiccup
      # can never mask (or alter) the underlying red run. De-dupes into one
      # open `migration-failure` issue (the nightly cron would otherwise file a
      # new issue every 24h while broken).
      #
      # The page names WHICH of three things happened, from the migrator step's
      # `outcome` (empty when that step never ran):
      #   unknown — the task was still running at the wait deadline; it may
      #             still succeed, so this is NOT an apply failure
      #   failed  — the task stopped with a non-zero / null exit: apply failed
      #   (empty) — no outcome recorded. With no task ARN the job failed
      #             BEFORE the migrator ran (build / push / task-def /
      #             run-task) and did not touch the schema; WITH one, the task
      #             started and its fate is UNKNOWN
      # One open issue collects runs of every class, so its title is
      # outcome-neutral and each comment carries the class.
      - name: Page on migration failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.migrator.outputs.outcome }}
          LAST_STATUS: ${{ steps.migrator.outputs.last_status }}
          EXIT_CODE: ${{ steps.migrator.outputs.exit_code }}
          STOP_REASON: ${{ steps.migrator.outputs.stop_reason }}
          WAITED_SECS: ${{ steps.migrator.outputs.waited_secs }}
          TASK_ARN: ${{ steps.runtask.outputs.task_arn }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-9)"

          case "${OUTCOME}" in
            unknown)
              CLASS="migration outcome UNKNOWN"
              DETAIL="The migrator task was still ${LAST_STATUS} after ${WAITED_SECS}s. It may still succeed — this is NOT a failed apply. Check the task / its log stream; the next migrate run reports the true state."
              echo "::error::MIGRATION OUTCOME UNKNOWN on ${GITHUB_REPOSITORY}@${SHORT_SHA} — the migrator task was still ${LAST_STATUS} after ${WAITED_SECS}s and may still succeed. Check the task before intervening: ${RUN_URL}"
              ;;
            failed)
              CLASS="migration apply FAILED"
              DETAIL="The migrator task stopped with exit code ${EXIT_CODE} (reason: ${STOP_REASON:-none}). The staging RDS schema may be BEHIND the authored alembic head; coord routes that need the new columns degrade to 503 \`schema_migration_pending\`."
              echo "::error::MIGRATION APPLY FAILED on ${GITHUB_REPOSITORY}@${SHORT_SHA} (exit ${EXIT_CODE}) — the staging RDS schema may be BEHIND the authored alembic head. Coord-proxied pages (e.g. /commits) degrade to 503 schema_migration_pending until this is fixed forward. MANUAL INTERVENTION REQUIRED: ${RUN_URL}"
              ;;
            *)
              if [ -n "${TASK_ARN}" ]; then
                # The task WAS started, but the migrator step recorded no
                # outcome (it aborted early). Its fate is unknown.
                CLASS="migration outcome UNKNOWN (not recorded)"
                DETAIL="The migrator task ${TASK_ARN##*/} was started, but this run recorded no outcome for it. It may still be running and may succeed — this is NOT a confirmed failed apply. Check the task / its log stream; the next migrate run reports the true state."
                echo "::error::MIGRATION OUTCOME NOT RECORDED on ${GITHUB_REPOSITORY}@${SHORT_SHA} — the migrator task was started but its outcome was not captured. Check the task before intervening: ${RUN_URL}"
              else
                CLASS="failed BEFORE the migrator ran"
                DETAIL="migrate.yml failed before the migrator task ran (build / push / task-def / run-task). This run did not touch the schema; if the authored head is ahead of the database, the schema is still behind."
                echo "::error::migrate.yml FAILED BEFORE THE MIGRATOR RAN on ${GITHUB_REPOSITORY}@${SHORT_SHA} — this run did not touch the schema. ${RUN_URL}"
              fi
              ;;
          esac

          TITLE="migrate.yml did not confirm a clean apply"
          BODY="Outcome: **${CLASS}**. ${DETAIL}

          - **Repo:** ${GITHUB_REPOSITORY}
          - **Run:** ${RUN_URL}
          - **Head SHA:** ${GITHUB_SHA}
          - **Trigger:** ${GITHUB_EVENT_NAME}

          Migrations are FORWARD-ONLY — fix forward (see the workflow header comment), never downgrade.

          _Auto-filed by .github/workflows/migrate.yml; closes manually once a migrate run is green._"

          # Ensure the label exists (idempotent), then de-dupe into one issue.
          gh label create migration-failure \
            --repo "${GITHUB_REPOSITORY}" \
            --description "Auto-filed: migrate.yml did not confirm a clean apply" \
            --color B60205 --force || true

          EXISTING=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label migration-failure \
            --state open \
            --json number \
            --jq '.[0].number // empty' || true)

          if [ -n "${EXISTING}" ]; then
            echo "Open migration-failure issue #${EXISTING} exists — commenting."
            gh issue comment "${EXISTING}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Again (${CLASS}): ${RUN_URL} (head ${GITHUB_SHA}, trigger ${GITHUB_EVENT_NAME}). ${DETAIL}" \
              || echo "::warning::could not comment on issue #${EXISTING} (best-effort)"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --label migration-failure \
              --body "${BODY}" \
              || echo "::warning::could not create the migration-failure issue (best-effort)"
          fi
          exit 0
