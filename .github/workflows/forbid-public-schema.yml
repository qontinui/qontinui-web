name: forbid public.* schema regressions

# Phase 7 deliverable of the migration consolidation
# (D:/qontinui-root/tmp_consolidation_phase7_public_drift.md §5.6).
#
# THE GATE LOGIC LIVES IN `scripts/ci/check_forbidden_public_schema.py`, not
# here. Phase 5 of plan
# 2026-08-08-ci-tool-registry-and-canonical-configuration-parity extracted it:
# this workflow used to carry a multi-line `run:` block of pipes, arrays and
# `$(...)`, which the runner-as-CI-node lane (.qontinui/ci.toml, argv-only,
# deliberately shell-free) could not mirror — so the manifest header recorded
# it as inexpressible. Three lanes now invoke the one script:
#
#   * this workflow, step "Scan for forbidden public.* references"
#   * .github/workflows/web-guards.yml, the consolidated guard job
#   * .qontinui/ci.toml, step `forbid-public-schema`
#
# The match pattern, the exclusion pathspecs and their reasons, and the
# alembic-bookkeeping carve-out are documented in the script. Change them
# THERE; do not re-inline them here. Note in particular that the script
# pathspec-excludes ITSELF (it is the pattern's home) — this workflow file
# used to hold that exclusion because it used to hold the pattern.

on:
  pull_request:
    branches: [main, develop]
  push:
    # merge-candidate/** refs are pushed by coord's autonomous merge scheduler
    # (plan 2026-06-06-coord-ci-runner-autonomous-green-merge, Phase 4). This is
    # a required merge gate, so it must run on candidate refs or the proposal
    # hangs in awaiting-ci. Validation-only (offline scan); no deploy.
    branches:
      - main
      - develop
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'

# Least privilege for GITHUB_TOKEN (zizmor excessive-permissions). A job
# that needs more declares its own `permissions:`.
permissions:
  contents: read

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land. (KNOWN coord gap: the budget-cancel candidate
# scan in stuck_pr_watcher.rs compares groups with `=`, so every "" group
# matches every other one and suppresses its auto re-run; fix belongs in coord.)
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  forbid-public-schema:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2): 40 green runs measured 2026-09-23,
    # p50 0.13 / p90 0.15 / max 0.18 min; cap = max(5, 2x max). Replaces the 360-min default.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Scan for forbidden public.* references
        # Exits 1 on a forbidden reference, and 2 if the pathspec set selected
        # no tracked files or `git grep` itself errored — the shell original
        # ended in `|| true`, which turned both of those into a silent pass.
        run: python scripts/ci/check_forbidden_public_schema.py
