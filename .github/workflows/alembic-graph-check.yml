name: alembic graph check

# Phase 5C of the multi-machine coordinator plan
# (D:/qontinui-root/tmp_multimachine_coordinator_plan.md §9).
#
# Two sweeps after every land on main that touches the versions dir.
#
#   1. `main`'s OWN chain. If more than one head appears, comment on the
#      merging PR. Both heads are on `main` by then, so `alembic merge` is
#      the correct remedy for THIS case (and only this case).
#
#   2. Every OPEN PR that carries a revision — `notify_forked_open_prs.py`.
#      This is the one that matters. A land silently forks every open PR
#      whose revision hung off the head it just superseded, and until this
#      step existed nothing told those authors. All three forks on record
#      (#1048, #989, 066c2e6c) were created that way, 83 minutes to days
#      AFTER the forked revision was authored — so no author-time check
#      could have caught them, and #989 sat red for 9.7 days.
#
# NOTE the one behaviour change to this job: when `main` ITSELF is multi-headed
# the notifier exits 2 and reddens the job, where before it stayed green with a
# comment. That is deliberate — the sweep cannot advise other PRs against a
# baseline that should not exist — but it means a forked `main` now shows up as
# a red workflow as well as a PR comment, and the sweep is offline until it is
# fixed.
#
# The job is informational about `main`, not blocking — by the time it runs,
# the merge has already happened. Its purpose is to turn "silent fork lying
# around in the chain for weeks" into "loud notification right at merge
# time", for the merging PR AND for everyone it just forked.

on:
  push:
    branches: [main]
    paths:
      - "backend/alembic/versions/**"

# Serialise the sweeps. The one-marker-comment-per-PR rule is enforced by
# reading the comments first, which is a check-then-write, not a lock: two
# lands landing within the same window would both see no marker and both POST,
# double-notifying the same author. `cancel-in-progress: false` so the run
# in flight is allowed to finish rather than being killed mid-sweep, having
# notified some authors and not others. Note what it does NOT buy: GitHub
# keeps at most one PENDING run per group, so a third land while one is
# running still drops the middle one. Harmless here — every sweep is a full
# recomputation against the then-current main, so the last one wins and is
# correct.
concurrency:
  group: alembic-graph-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write   # so the job can comment on the just-merged PR
  issues: write          # the notifier EDITS its own comment via
                         # PATCH /repos/{repo}/issues/comments/{id}, which is
                         # addressed by comment id — GitHub cannot tell it
                         # targets a PR, so `pull-requests: write` alone may
                         # not carry it. Cheap insurance against every land
                         # after the first notice failing.

jobs:
  alembic-heads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count heads
        id: heads
        working-directory: backend
        run: |
          # THE COUNTER LIVES IN `scripts/ci/count_alembic_heads.py`. This step
          # used to carry its own inline copy of it — a fourth one, alongside
          # alembic-graph-pr.yml, .qontinui/ci.toml and the manifest. Phase 5 of
          # plan 2026-08-08-ci-tool-registry-and-canonical-configuration-parity
          # made it one script that every lane invokes.
          #
          # `--report-only` is what keeps THIS workflow informational: the shared
          # script exits 1 on a forked chain (that is the point of the PR gate),
          # and under `set -e` that would abort this step before the comment
          # below is ever posted. It still exits non-zero if the scan proved
          # nothing, which SHOULD redden this job — a counter that counted no
          # revisions has told us nothing about the chain.
          #
          # The script is CWD-independent (it resolves the repo root from its own
          # location), so running it from `backend/` is fine. Its stdout keeps the
          # `HEAD_COUNT=` / `HEAD=` line format this step's shell parses below.
          set -euo pipefail
          # `--baseline-ref HEAD`: this lane runs ON main after the land, so
          # every revision in the checkout has landed by definition. That
          # makes `alembic merge` the correct remedy here and the script
          # says so — which is NOT true of the open-PR sweep below, where
          # the forked revision is unlanded and a one-token re-point is the
          # fix. Same script, opposite advice, because the graphs differ.
          python ../scripts/ci/count_alembic_heads.py --report-only \
            --baseline-ref HEAD | tee heads.txt
          count=$(grep -c '^HEAD=' heads.txt || true)
          # grep exiting 2 (hard error) leaves count empty, which would make the
          # `[ -gt ]` below a usage error rather than a comparison. Normalise.
          count=${count:-0}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 1 ]; then
            heads_list=$(grep '^HEAD=' heads.txt | sed 's/^HEAD=//' | tr '\n' ' ')
            echo "heads_list=$heads_list" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on merging PR if forked
        if: steps.heads.outputs.count > 1 && github.event.head_commit.message != ''
        uses: actions/github-script@v7
        env:
          # Via `env`, not `${{ }}` inside the script: a direct interpolation
          # into a double-quoted JS string breaks on a revision id containing a
          # quote or a trailing backslash, and is an injection point if a
          # hostile revision ever lands on main.
          HEADS_LIST: ${{ steps.heads.outputs.heads_list }}
        with:
          script: |
            const heads = (process.env.HEADS_LIST || "").trim().split(/\s+/).filter(Boolean);
            if (!heads.length) {
              core.warning("no heads parsed; skipping comment");
              return;
            }
            const sha = context.sha;
            // Find the PR that produced this merge commit.
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            if (!prs.data.length) {
              core.warning(`No PR associated with ${sha}; skipping comment`);
              return;
            }
            const pr_number = prs.data[0].number;
            const heads_md = heads.map(h => `\`${h}\``).join(', ');
            const merge_cmd = `alembic merge -m "merge ${heads.join(' and ')}" ${heads.join(' ')}`;
            const body = [
              `### ⚠️ Alembic chain forked`,
              ``,
              `After merging this PR, \`backend/alembic/versions/\` now has **${heads.length} heads**:`,
              ``,
              ...heads.map(h => `- \`${h}\``),
              ``,
              `Concurrent revision authoring landed without a coordinated merge. **Every head listed above is now on \`main\`**, so nothing can be re-pointed without rewriting landed history — which is exactly the case a merge revision is for:`,
              ``,
              '```bash',
              `cd backend`,
              merge_cmd,
              `git add alembic/versions/<merge_file>.py && git commit -m "chore(alembic): merge sibling heads"`,
              `git push`,
              '```',
              ``,
              `The merge revision is empty bookkeeping (just joins parents); it's a no-op DDL.`,
              ``,
              `> ⚠️ **Do not copy this remedy to an open PR whose chain forked.** There the forked revision has *not* landed, so the fix is a one-token \`down_revision\` edit and a merge revision would be permanent bookkeeping added for nothing. \`notify_forked_open_prs.py\` (next step in this workflow) comments the exact token on each affected PR.`,
              ``,
              `<sub>The advice this comment used to carry — claim \`down_revision\` via \`/coord/claims/acquire\` before authoring — is **retired**: coord answers 410 Gone for \`ClaimKind::AlembicRevision\` and the author-time sibling-head guard was deleted in favour of land-time re-pointing. It also could not have helped: in all three recorded forks the declared parent WAS the single head at authoring time.</sub>`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body,
            });
            core.warning(`Alembic chain has ${heads.length} heads after this merge: ${heads.join(', ')}`);

      - name: Notify open PRs this land forked
        # THE SWEEP LIVES IN `scripts/ci/notify_forked_open_prs.py`, not here.
        # It rebuilds each open PR's chain against the `main` this push
        # created (the real files, overlaid — a simulation, not a guess) and
        # comments the exact `down_revision` token on the ones that forked.
        # It only ever comments: coord's restack engine owns branch rewriting
        # and is shadow-mode by default, so notification is the missing half.
        #
        # It exits 2 — reddening this job — if it could not sweep at all (no
        # token, an API error). That is deliberate: a sweep that could not run
        # must not be indistinguishable from a sweep that found nothing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/notify_forked_open_prs.py
