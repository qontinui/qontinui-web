name: E2E Integration Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    # merge-candidate/** refs are pushed by coord's autonomous merge scheduler
    # (plan 2026-06-06-coord-ci-runner-autonomous-green-merge, Phase 4). The
    # workflow must still trigger on them so the required `Test Summary` +
    # `Backend E2E Tests` contexts report and a candidate proposal gets a real
    # CI verdict instead of hanging in awaiting-ci — but the Playwright
    # frontend-tests shards are skipped there (see that job's `if:`); Spec CI
    # is the merge gate for candidates. Validation-only; no deploy.
    branches:
      - main
      - develop
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  # Run the full sharded E2E suite nightly. Spec CI (spec-ci.yml) is the
  # merge gate; this scheduled run — plus the `push: main` trigger above —
  # catches regressions Spec CI doesn't cover, without ever blocking a PR
  # or a merge-candidate proposal.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# CANCEL ONLY THE PR LANE. The original guard here was a bare
# `cancel-in-progress: true`, added because every push or PR update spawned a
# fresh ~1h+ E2E run while the prior one kept grinding - six concurrent 5h runs
# were observed in flight at once. That problem is real and the PR lane below
# still solves it; what the bare flag also did was cancel the two lanes this
# workflow exists to report on.
#
# It contradicted this file's own `push:` comment. That comment states the
# workflow must trigger on `merge-candidate*` refs so "the required `Test
# Summary` + `Backend E2E Tests` contexts report and a candidate proposal gets a
# real CI verdict instead of hanging in awaiting-ci". A cancelled run does not
# report those contexts. `ci_baseline.rs` `ingest_workflow_run` returns before
# the write when `is_supersession_conclusion` matches (`cancelled` | `stale`),
# so the verdict is dropped SILENTLY and the proposal sits in `awaiting-ci` -
# precisely the failure the trigger was added to prevent. `E2E Integration
# Tests` is not on `ci_observer.rs` `BENIGN_SUPERSESSION_WORKFLOWS`
# (`test-coverage-producer`, `deploy-coord`), so nothing downgrades it.
#
# `main` has the same shape: the group a prospective land's
# `(push, refs/heads/main)` event enters is `reaper_at_risk` by `ci_observer.rs`
# `run_is_reaper_at_risk`, and `true` upgrades GitHub's pending-reap into an
# actual cancellation on a main SHA's baseline.
#
# THE GROUP IS ALSO EVENT-KEYED NOW, and that is not cosmetic here. This
# workflow has FOUR triggers, and `schedule`, `workflow_dispatch` and
# `push: main` all resolve `github.ref` to `refs/heads/main` - so before this
# change the 04:00 UTC cron and a main land shared one group and could cancel
# each other outright. Keying by `github.event_name` separates them, the shape
# `qontinui-coord/.github/workflows/ci.yml` already uses
# (`ci-${{ github.event_name }}-${{ github.ref }}`).
#
# The PR lane is where the saving was and it keeps cancelling: coord excludes
# PR-lane runs from the no-reap blocking set (`ci_observer.rs`
# `is_excluded_from_blocking` - "a main push neither cancels nor invalidates a
# PR run") and reads PR checks through `coord.pr_check_runs_latest`, partitioned
# by `(repo, head_sha, name)`, so a superseded attempt sits in a different
# partition and is never consulted for the new head. Superseding a ~1h sharded
# Playwright run is exactly the waste the original guard was aimed at.
#
# `false` on the other lanes does not pile runs up: GitHub keeps at most one
# PENDING run per group, so the ceiling is one running plus one queued.
concurrency:
  group: e2e-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    # Job cap. This workflow carried NO `timeout-minutes` at any level, so a
    # hung step fell through to GitHub's DEFAULT 360-minute ceiling — that is
    # how run 32207280679 burned 2h28m and 32216356137 burned 5h59m in
    # `Install Playwright browsers`. Sized from 7 green runs on `main`
    # (2026-08-18/19): this job ran 1m54s-2m26s, max 2m26s. 20 min is ~8x the
    # observed max — deliberately loose, because its purpose is to catch a
    # hang, not to police normal variance.
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # backend/pyproject.toml has path deps on ../../qontinui-schemas
      # and ../../qontinui; without these clones, `pip install -e .`
      # fails with ENOENT. qontinui-cloud-control is needed for the test
      # harness's side-effect import (see backend/tests/conftest.py); it is
      # now AGPL/public under qontinui/, cloned the same way as the others.
      - name: Clone backend Python sibling deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for spec in \
            "qontinui/qontinui-schemas" \
            "qontinui/qontinui" \
            "qontinui/qontinui-cloud-control" \
          ; do
            repo_name="${spec#*/}"
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${spec}.git" \
              "../${repo_name}"
          done

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          # All non-path runtime deps are already pinned in requirements.txt;
          # path-deps (qontinui-schemas, qontinui-cloud-control) are installed
          # editable below. Together this satisfies every dep backend's
          # pyproject declares.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Force fresh editable install of qontinui-schemas before backend itself.
          # Without this, `pip install -e .` resolves the schemas path-dep against
          # pip's wheel cache (actions/cache@v3 above) and DOWNGRADES schemas to
          # whichever version was cached (e.g., 0.2.1) even though the cloned
          # ../../qontinui-schemas is at HEAD (0.4.0). Surfaces as
          # `ModuleNotFoundError: No module named 'qontinui_schemas.commands'`
          # whenever schemas ships a new sub-package.
          pip install --no-cache-dir -e ../../qontinui-schemas
          # `--no-deps` is critical: it prevents `pip install -e .` from
          # re-resolving (and downgrading) the editable schemas we just
          # installed. All backend deps are already satisfied above.
          if [ -f pyproject.toml ]; then pip install -e . --no-deps; fi
          pip install -e ../../qontinui-cloud-control

      - name: Run backend E2E tests
        working-directory: ./backend
        env:
          TESTING: 1
          ENVIRONMENT: test
        run: |
          pytest tests/test_integration_e2e.py -v --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Upload backend coverage HTML
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage-report
          path: ./backend/htmlcov/
          retention-days: 30

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-results
          path: ./backend/test-results/
          retention-days: 30

      # This job has NO apt-dependent step, so it carries no full
      # infrastructure marker. It does now carry a `timeout-minutes: 20` cap
      # that did not exist before, and a job cap concludes the job `cancelled`
      # — which `gh pr checks` renders as **fail** with ZERO failing steps.
      # That rendering is the precise defect plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure
      # removes, so adding the cap without this notice would have reintroduced
      # it in a job that previously could not produce it.
      - name: Explain a cancelled job (no apt step here)
        if: cancelled()
        run: |
          echo "::notice title=Job cancelled - NOT a verdict on this diff::This job was cancelled. Either its 20-minute cap expired (it normally runs 1m54s-2m26s, so that would mean something wedged, not that your tests failed) or the run was cancelled externally - this workflow's 'concurrency: cancel-in-progress' is an expression (pull_request events only), so on a PR run a newer push to the same ref supersedes it and on a push or schedule run only a manual cancel does. Either way a cancelled job reports no test results at all: 'gh pr checks' will render it as 'fail' with zero failing steps, and that rendering says nothing about the code under test. Re-run if you need a verdict. See plan 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure."

  # Full 4-shard suite. Runs on pushes to main/develop, on the nightly schedule,
  # and on workflow_dispatch — never on PRs and never on coord's merge-candidate*
  # candidate refs (Spec CI gates both; see the comment on the `if:` below for
  # the candidate-ref rationale). The merge gate is Spec CI
  # (.github/workflows/spec-ci.yml); the Playwright E2E smoke job that used to
  # gate PRs here was retired 2026-05-25 once Spec CI gained a default-on
  # console-error invariant (see spec-ci/console-policy.ts) that subsumed its
  # last unique guarantee. This sharded suite remains the deeper
  # nightly/on-main-push backstop.
  frontend-tests:
    name: Frontend E2E Tests (shard ${{ matrix.shard }}/4)
    # Candidate refs (merge-candidate/**, -spec/**, -batch/**) are coord's
    # proposal-validation pushes. Spec CI is the merge gate; this suite is the
    # deeper nightly net. Running it per-candidate cost ~16m wall / ~87m compute
    # per proposal (coord pushes TWO candidate refs per proposal, which run
    # concurrently), for a suite that is by design not the gate. `push: main`
    # is retained, so every LAND still runs it — detection lag is one merge,
    # not one day. Test Summary (the required check) treats `skipped` as
    # non-failing (see its result loop), so candidate proposals still get a
    # green required context instead of hanging in awaiting-ci.
    if: >-
      github.event_name != 'pull_request' &&
      !startsWith(github.ref, 'refs/heads/merge-candidate')
    runs-on: ubuntu-latest
    # Job cap — see `backend-tests` above for why this workflow needed one.
    # Sized from 28 green shard runs on `main` (2026-08-18/19): p50 ~12m,
    # p90 ~18m, max 41m39s (run 32264216432 shard 2/4, which went green after
    # a 30m24s `Install Playwright browsers` — the apt stall partially
    # self-resolving). 60 min = p90 + 42 min headroom and covers that worst
    # observed GREEN run with ~44% to spare.
    #
    # Scope note, because it is easy to read too much into that: THIS CAP
    # cannot red a run that would otherwise have passed. The 10-minute step
    # bound below deliberately CAN — run 32264216432 shard 2/4 is exactly the
    # run it would now cut, and cutting it is the point: a 30m24s
    # `Install Playwright browsers` IS the stall this plan exists to fail
    # fast on, green outcome or not. So this is the backstop for everything
    # else; the step bound is the part that trades a rare slow green for a
    # fast, correctly-labelled red.
    timeout-minutes: 60

    services:
      postgres:
        # pgvector/pgvector:pg16 matches production — AWS RDS `qontinui-staging`,
        # engine 16.13, us-east-1 — and every sibling workflow that provisions a
        # Postgres service (backend-ci, backend-coverage-producer,
        # memory-recall-eval, migration-reversal, spec-ci, style-gate,
        # cross-browser-survey). This job's `Run database migrations`
        # step runs `alembic upgrade heads` against this service, so this pin
        # decides which major the migration graph is exercised on; keeping it
        # behind prod means CI clears migrations on a version prod never runs.
        # pg16 is the proven target: migration-reversal.yml replays the WHOLE
        # graph up->down->up on pg16. The pgvector-bundled image rather than
        # stock postgres:16 is required because the squashed initial schema
        # creates `vector` columns (see backend-ci.yml for the full rationale).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      # Don't cancel sibling shards if one fails — we want the full failure
      # picture from every shard, not just the first one to die.
      fail-fast: false
      matrix:
        # Run the suite in 4 parallel shards. Each matrix entry gets its
        # own runner with its own ephemeral postgres + backend + frontend,
        # so there is no shared state between shards. Wall clock ≈
        # max(shard times), not sum. Shard spans are duration-balanced via
        # PWTEST_SHARD_WEIGHTS on the test step below. (Historical: while
        # ~309 tests were failing at 60s each under retries=0, a single
        # shard took 5h+. The suite is green now; per-shard parallelism is
        # set in playwright.config.ts `workers` — see plan
        # 2026-07-22-web-playwright-single-worker-stale-rationale.)
        shard: [1, 2, 3, 4]
        node-version: [20]

    steps:
      # Stamp THIS JOB's start time. Must stay the FIRST step of the job.
      #
      # The infrastructure marker below measures elapsed time to tell a job
      # TIMEOUT from an external cancel, and `run_started_at` (the API value it
      # falls back to) measures the RUN: it includes every upstream `needs:` job
      # and all queue time. On a `needs:`-gated job that skew can exceed the
      # budget slack, so a LATE external cancel reads as past the budget and is
      # reported as a timeout -- the same laundering of one cause into another
      # that the marker exists to prevent, merely inverted. This stamp removes
      # the skew, and removes the `gh api` dependency on the common path.
      - name: Record job start time
        # `working-directory` is NOT decoration. This step runs BEFORE
        # `actions/checkout`, and a job whose `defaults.run.working-directory`
        # points into the repo (e.g. `./backend`) has no such directory yet --
        # the step then fails on a missing cwd, and because it is step 1 the
        # whole job dies with every later step skipped. Anchoring to the
        # workspace root, which the runner creates before any step, is what
        # makes a pre-checkout step safe. Set explicitly on every carrier so
        # this stays correct if a job later gains a default.
        working-directory: ${{ github.workspace }}
        run: echo "JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v5

      # Both backend pyproject.toml and frontend package.json have path
      # deps on these five sibling repos. Without this clone, `pip
      # install -e .` and `npm ci` fail with ENOENT.
      - name: Clone sibling dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for spec in \
            "qontinui/qontinui-schemas" \
            "qontinui/qontinui" \
            "qontinui/ui-bridge" \
            "qontinui/qontinui-workflow-ui" \
            "qontinui/qontinui-workflow-utils" \
            "qontinui/qontinui-navigation" \
            "qontinui/qontinui-cloud-control" \
          ; do
            repo_name="${spec#*/}"
            target="../${repo_name}"
            echo "::group::Cloning ${spec} → ${target}"
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${spec}.git" \
              "${target}"
            echo "::endgroup::"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install -e ../../qontinui-cloud-control

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # `npx playwright install --with-deps <engines>` was THREE things fused
      # into one step: npx resolution, a browser-bundle download from
      # cdn.playwright.dev, and `apt-get`. Only the apt part has ever hung, so
      # the fusion made the infrastructure marker's headline ("CI
      # infrastructure timeout - NOT your diff") false for the other two: an
      # author who bumped `@playwright/test` to a version whose bundle 404s on
      # the CDN would have been told the Ubuntu mirror did it. Split, exactly
      # as the postgresql-client sites were (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 3):
      #
      #   * `install-deps` = the APT half. Measured on healthy run 32264215960:
      #     all 26 Playwright system libraries report `is already the newest
      #     version`, and apt's own verdict is `0 upgraded, 9 newly installed`
      #     -- 9 FONT packages, `Need to get 21.1 MB of archives`. That 21.1 MB
      #     is the entire exposure; hung run 32289431023 crawled through it at
      #     ~0.7 kB/s for 38 minutes against azure.archive.ubuntu.com.
      #   * `install` = the CDN half. cdn.playwright.dev, a different host,
      #     EXONERATED by the logs: neither hung run ever reached it.
      #
      # Only the apt half carries `id: apt_playwright`, so only the apt half is
      # in APT_STEP_OUTCOMES and only it can ever be named as infrastructure.
      #
      # The order is preserved from `--with-deps`, not chosen: playwright-core's
      # `installBrowsers()` calls `registry.installDeps()` BEFORE
      # `registry.install()`, and `install-deps <engines>` feeds the same
      # `registry.resolveBrowsers()` result to the same `registry.installDeps()`
      # -- so the apt package list is identical to what `--with-deps` computed.

      # Phase 3's remedy: keep the 21.1 MB of font .debs across runs so a
      # healthy run does not re-fetch them from the mirror at all.
      #
      # WHAT IS CACHED: the .deb archives apt downloads, and nothing else. The
      # package SET is untouched -- `install-deps` still resolves and installs
      # exactly the same packages; apt simply finds their .debs already in
      # /var/cache/apt/archives and skips the download. Behaviour-preserving is
      # the whole point of choosing a cache over narrowing the font list: this
      # is a visual/OCR crawl, and dropping CJK/Unicode coverage would change
      # rendered text (tofu boxes) in a way nothing here would catch.
      #
      # WHAT IS *NOT* REMOVED: `install-deps` still runs `apt-get update`
      # first, unconditionally, so the index refresh remains an exposure -- and
      # hung run 32294962345 stalled in exactly that phase. The cache removes
      # the 21.1 MB download half; `timeout-minutes` on the apt step below is
      # what bounds the other half. Caching the package INDEX as well was
      # rejected: a stale index against a rotated pool turns a slow run into a
      # hard 404, i.e. it trades a bounded delay for a break.
      #
      # NOT CACHED HERE: the browser bundles under ~/.cache/ms-playwright.
      # Different host, different failure mode, not implicated in any observed
      # hang. If that is ever worth caching it gets its OWN cache entry --
      # sharing this one would couple a CDN problem back onto the apt key this
      # split exists to isolate.

      # The cache key must move whenever the package set can, and must NOT move
      # otherwise. Two inputs are in it:
      #   * `ImageOS` (e.g. `ubuntu24`) -- the Ubuntu release, which fixes both
      #     the package names and the pool the .debs come from;
      #   * the @playwright/test version -- it selects the dependency list, so
      #     a bump can add or drop packages.
      # `ImageVersion` (the weekly image build) is deliberately NOT in the key,
      # but NOT because a newer image is a superset of an older one. It is not:
      # GitHub removes packages from the runner images as well as adding them,
      # and this branch measured the consequence -- the identical
      # `install-deps chromium` reports `Need to get 21.1 MB of archives` on
      # Spec CI's runner and `Fetched 11.4 MB` on style-gate's. Same command,
      # different preinstalled baseline, one key.
      #
      # What makes that safe is the SAVE key below, not a superset guarantee.
      # Every run saves under its own run-unique key, so a run against a
      # different baseline writes a DIFFERENT entry instead of being frozen out
      # by whichever run populated a shared key first, and the prefix restore
      # always takes the NEWEST match. A differing baseline therefore costs one
      # partial hit -- never a permanently wrong set.
      #
      # A restored .deb that the live index no longer lists is still not a
      # wrong install, and that does not rest on apt re-verifying anything. A
      # Debian pool filename carries the version (`<pkg>_<ver>_<arch>.deb`) and
      # is content-immutable for that version, so a rotated version arrives
      # under a DIFFERENT name and apt just downloads the one it wants. (apt's
      # fast path on an archive that is already present is a size check, with
      # dpkg's own checks as the corruption backstop -- not a full hash
      # re-verify. The filename is what fixes identity here.)
      - name: Resolve Playwright apt cache key
        id: pw_cache_key
        working-directory: ./frontend
        run: |
          set -uo pipefail
          pw="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version" 2>/dev/null || true)"
          if [ -z "$pw" ]; then
            # The lockfile shape changed. Fall back to a digest of the whole
            # lock: over-keyed (any dependency bump misses) but never STALE,
            # which is the property that matters. Never fail the job over a
            # cache key -- this step is not in APT_STEP_OUTCOMES, so a red here
            # would be reported to the author as their own diff. The `|| true`
            # is what makes that true rather than merely intended: GitHub's
            # default shell is `bash -e -o pipefail`, which the `set` line
            # above does not undo, so without it a missing or unreadable
            # lockfile would abort this step outright.
            pw="lock$(sha256sum package-lock.json 2>/dev/null | cut -c1-12 || true)"
            echo "::notice::Could not read @playwright/test from package-lock.json; keying the Playwright apt cache on the whole lockfile digest instead."
          fi
          img="${ImageOS:-unknown}"
          base="apt-playwright-${RUNNER_OS:-Linux}-${img}-pw${pw}${KEY_SUFFIX:-}"
          # RUN-UNIQUE save key. `actions/cache` (the combined action) does not
          # re-save when its primary key hit exactly, so a shared key is frozen
          # at whatever the FIRST run to populate it happened to download. A
          # run-unique key cannot collide, so every run that has something new
          # writes its own entry and the restore below picks the newest.
          # `run_attempt` is in it because re-running a run keeps its `run_id`.
          #
          # Restore is prefix-only (a run-unique key can never be hit by name).
          # `base_prefix` matches only entries for THIS image + Playwright
          # version (+ engine leg, via KEY_SUFFIX) and returns the newest of
          # them; `restore_prefix` is the wider same-image fallback.
          {
            echo "save_key=${base}-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
            echo "base_prefix=${base}-"
            echo "restore_prefix=apt-playwright-${RUNNER_OS:-Linux}-${img}-"
          } >> "$GITHUB_OUTPUT"
          echo "Playwright $pw on image $img${KEY_SUFFIX:-}"

      # Restore and save are SPLIT (`actions/cache/restore` here,
      # `actions/cache/save` after the staging step) rather than the combined
      # `actions/cache`. Two defects forced it, and neither is fixable alone:
      #
      #   1. The combined action saves from a post-step, but the only thing
      #      that ever CREATES this cache directory is the staging step below,
      #      and a failed apt step (its `timeout-minutes` firing) skips every
      #      ordinary step after it. So on a degraded mirror the cache could
      #      only ever be seeded by a run that did not need it: run 1 fetches
      #      15 of 21 .debs, reds, saves nothing, and every re-run restarts
      #      from zero for as long as the mirror is slow.
      #   2. The combined action does not re-save on an exact primary-key hit,
      #      so one shared key is frozen at the first populating run's package
      #      set -- see the ImageVersion note above for why "first" is not
      #      necessarily "most complete".
      #
      # Fixing only (1) would be worse than fixing neither: `if: always()` on
      # staging, with a shared key, freezes a PARTIAL set under that key
      # forever -- trading "0% cached" for "70% cached, permanently".
      #
      # Neither this step nor the save can red the job: `continue-on-error`,
      # and no `fail-on-cache-miss`. Neither carries an `id:` -- an id here
      # would be a step name available to APT_STEP_OUTCOMES, and nothing in
      # this pair runs apt.
      - name: Restore Playwright apt font cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ~/.cache/qontinui-apt-playwright
          # This run's own save key. It is run-unique, so it can never match an
          # existing entry -- which is deliberate: it makes the restore fall
          # through to the prefix list below every time, and keeps the key that
          # is saved and the key that is looked for spelled the same way.
          key: ${{ steps.pw_cache_key.outputs.save_key }}
          # Prefix matching, newest entry first, in narrowing-to-widening
          # order. A prefix hit restores an older .deb set; that is safe by
          # construction, because a rotated package version has a different
          # pool FILENAME (see above), so apt downloads what the current index
          # names and ignores the rest. A partial hit is a partial saving,
          # never a wrong install.
          #
          # The step outputs are `base_prefix` / `restore_prefix`, not
          # `base-prefix` / `restore-prefix`: GitHub's expression parser reads
          # `-` as subtraction, so a hyphenated output name cannot be
          # dereferenced with dot syntax at all.
          restore-keys: |
            ${{ steps.pw_cache_key.outputs.base_prefix }}
            ${{ steps.pw_cache_key.outputs.restore_prefix }}

      # /var/cache/apt/archives is root-owned and actions/cache/restore runs as
      # the unprivileged `runner` user, so it can neither read nor write that
      # dir directly. `sudo cp` is what moves .debs across the privilege
      # boundary. This step touches local disk only -- no network, nothing to
      # stall - so it is deliberately unbounded and deliberately has no `id:`.
      - name: Seed apt archives from cache
        run: |
          set -uo pipefail
          cache_dir="$HOME/.cache/qontinui-apt-playwright"
          n=0
          if [ -d "$cache_dir" ]; then
            n=$(find "$cache_dir" -maxdepth 1 -name '*.deb' 2>/dev/null | wc -l || true)
          fi
          if [ "$n" -gt 0 ]; then
            # `-n` never clobbers a .deb the image already had, which could be
            # newer than the cached one. `--preserve=timestamps` is
            # load-bearing, not tidiness: the staging step prunes superseded
            # versions by mtime, and a plain `cp` would stamp every archive
            # with the current run's time and destroy that ordering. Only
            # timestamps are preserved -- not ownership or mode, which must
            # stay root's inside /var/cache/apt/archives.
            sudo cp -n --preserve=timestamps "$cache_dir"/*.deb /var/cache/apt/archives/ || true
            echo "Seeded $n cached .deb(s) into /var/cache/apt/archives."
          else
            echo "No cached .deb archives - this run fetches them from the mirror. A MISS is slower, never broken."
          fi

      - name: Install Playwright browser system deps (apt)
        id: apt_playwright
        # Sized from a per-half measurement, not from the fused step: each green
        # run's log was cut at the boundary between apt's last output line and the
        # first `Downloading ` CDN banner, and the parsed halves were cross-checked
        # against the jobs API step times to +/-1s.
        #
        # The apt half over 40 green shard samples from 15 runs (2026-08-15 ->
        # 08-20): p50 15.7s, p90 3m36s, max 30m13s. That max is run
        # 32264216432 job 96104608719, whose log reads `Fetched 21.1 MB in
        # 30min 1s (11.7 kB/s)` - and which SUCCEEDED.
        #
        # 10 min sits between p90 and that max ON PURPOSE: it would have cut
        # that 30-minute success. That is the trade this plan chose. A step
        # crawling 21.1 MB at 11.7 kB/s is the degraded mirror, and a fast,
        # obvious failure plus a re-run costs the fleet far less than 30
        # minutes of a 60-minute job budget spent fetching fonts. 10 min is
        # p90 + ~6.4 min, covering every other sample in the window.
        #
        # These are PRE-cache numbers. With the font .debs restored, a healthy run
        # should collapse toward the `apt-get update`-only floor, so the bound is
        # conservative by construction - it is sized for the MISS.
        timeout-minutes: 10
        working-directory: ./frontend
        run: npx playwright install-deps chromium

      # Hand whatever apt downloaded back across the privilege boundary so the
      # `actions/cache/save` step below (unprivileged) can save it. Local disk
      # only, so unbounded and without an `id:`, same as the seed step. Every
      # command is `|| true`: a cache-staging problem must never red a job, and
      # must never be mistaken for the apt failure this plan exists to report
      # accurately. (GitHub's default shell is `bash -e -o pipefail`, so the
      # guards are what make that true, not the `set` line.)
      #
      # `if: always()` is the point of the restore/save split. The apt step
      # above carries `timeout-minutes` and no `continue-on-error`, so when the
      # mirror stalls, the job fails AT that step and every ordinary later step
      # is skipped -- including this one, which is the only thing that creates
      # the cache directory. Without `always()` the cache can only ever be
      # seeded by a run that did not need it. With it, a run that fetched 15 of
      # 21 .debs before its bound fired contributes those 15, and the next
      # re-run starts from them instead of from zero.
      #
      # A truncated download cannot be staged by that: apt writes in-flight
      # downloads into /var/cache/apt/archives/partial/ and only rename(2)s
      # them up into the top level once they are complete and verified. The
      # `-maxdepth 1` `*.deb` glob below matches the top level only, so
      # `partial/` -- one level deeper -- is never picked up.
      - name: Stage apt archives for cache
        if: always()
        run: |
          set -uo pipefail
          cache_dir="$HOME/.cache/qontinui-apt-playwright"
          mkdir -p "$cache_dir" || true
          # Fingerprint of what the restore put here. apt never writes into
          # $cache_dir, so at this point it is still exactly the restored set.
          # Filenames alone are a sound identity: a pool .deb is immutable for
          # its version, so a changed set means changed filenames.
          before="$(find "$cache_dir" -maxdepth 1 -name '*.deb' -printf '%f\n' 2>/dev/null | sort | sha256sum | cut -c1-16 || true)"
          sudo cp -f --preserve=timestamps /var/cache/apt/archives/*.deb "$cache_dir"/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$cache_dir" || true
          # Drop superseded versions. Run-unique save keys mean the newest
          # entry is always restored, so without this the directory would
          # accumulate every version ever downloaded, forever. `<pkg>_<ver>_
          # <arch>.deb` -> package name is everything before the first `_`;
          # keep only the newest-mtime file per package (both copies above
          # preserve timestamps, so mtime is genuine download time). A wrong
          # guess costs one re-download and nothing else.
          find "$cache_dir" -maxdepth 1 -name '*.deb' -printf '%T@ %f\n' 2>/dev/null \
            | sort -rn \
            | awk '{ n = $2; sub(/_.*/, "", n); if (seen[n]++) print $2 }' \
            | while IFS= read -r stale; do rm -f "$cache_dir/$stale" || true; done || true
          after="$(find "$cache_dir" -maxdepth 1 -name '*.deb' -printf '%f\n' 2>/dev/null | sort | sha256sum | cut -c1-16 || true)"
          n=$(find "$cache_dir" -maxdepth 1 -name '*.deb' 2>/dev/null | wc -l || true)
          if [ "$before" = "$after" ]; then
            # Nothing new to contribute. Writing an identical copy under a
            # fresh run-unique key every run would spend the repo's 10 GB
            # cache budget on duplicates and evict unrelated caches (GitHub
            # evicts least-recently-ACCESSED first). Skipping is safe: the
            # restore above already refreshed the existing entry's access
            # time, which is exactly what keeps it alive.
            echo "APT_CACHE_DIRTY=false" >> "$GITHUB_ENV"
            echo "$n .deb(s) staged, identical to the restored set - no new cache entry will be written."
          else
            echo "APT_CACHE_DIRTY=true" >> "$GITHUB_ENV"
            echo "$n .deb(s) staged for the cache - changed from the restored set, so a new entry will be written."
          fi

      # The other half of the split restore/save. Runs on `always()` so a run
      # whose apt step timed out still contributes what it managed to fetch,
      # and under this run's RUN-UNIQUE key so it can never be blocked by an
      # existing entry the way the combined action's exact-hit skip did.
      #
      # `env.APT_CACHE_DIRTY` is set by the staging step above and is `true`
      # only when this run actually added or pruned something; a run that
      # restored a complete set writes no entry at all. That is what keeps
      # run-unique keys from churning the repo's cache budget.
      #
      # No `id:` here, deliberately: an id would be a step name reachable from
      # APT_STEP_OUTCOMES, and this step runs no apt.
      - name: Save Playwright apt font cache
        if: always() && env.APT_CACHE_DIRTY == 'true'
        # `actions/cache/save` already downgrades its own failures to log
        # lines, but a cache WRITE must never be able to red a job or be
        # mistaken for the apt failure this plan exists to report. Belt and
        # braces.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/qontinui-apt-playwright
          key: ${{ steps.pw_cache_key.outputs.save_key }}

      - name: Install Playwright browsers (CDN)
        # The CDN half over the same 40 samples: p50 10.9s, p90 12.0s, max
        # 13.0s. 2 min is ~9x the observed max. The fused step's minutes-long
        # tail does NOT come from here - not once in 40 samples.
        timeout-minutes: 2
        working-directory: ./frontend
        run: npx playwright install chromium

      - name: Install postgresql-client
        id: apt_psql
        # ONLY the apt-get call lives in this step, and it is the entire reason
        # for the bound: it reaches an external mirror at job time and is the
        # same unbounded-stall exposure as the Playwright step (plan
        # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure).
        # The psql/DDL that used to share this step now runs UNBOUNDED below.
        # It HAD to move: under `bash -e` a psql failure set this step's
        # `.outcome` to `failure` exactly like an apt timeout, so the
        # infrastructure marker could not tell a mirror stall from the author's
        # own schema breaking -- and told them their breakage was infrastructure.
        # Measured apt+psql across green runs of all 7 sites: p50 0-16s, p90
        # <=91s, max 106s (migration-reversal). The bound now covers apt ALONE,
        # so 5 min is p90 + ~3.5 min of headroom over a strictly smaller job.
        # GUARDED, as spec-ci.yml has been all along. `ubuntu-latest` ships
        # psql, so `command -v psql` short-circuits and apt is never reached --
        # measured, not assumed: across 12 consecutive green Spec CI runs this
        # step is 0-1s every time, while the six sites that were still calling
        # apt unconditionally spent 3-29s per run on an `apt-get update` against
        # the external mirror for a package apt then reports as already the
        # newest version. That round-trip is pure exposure to the stall this
        # plan exists to remove, and it buys nothing.
        # (Those 3-29s figures are from `--status success` runs, so they are a
        # LOWER bound by construction -- a run killed by the stall is excluded.)
        # The bound below is NOT redundant: it covers the fallback arm, for the
        # day an image stops shipping psql.
        # Consequence for the marker: this step normally runs NO apt, so it
        # normally concludes `success` and no arm names it -- which is correct,
        # because there was no apt call to blame. spec-ci.yml makes the same
        # observation at its own site (an arm keyed on this step's failure
        # "would have been describing a call that did not happen"); the arm
        # attribution below is this change's, not a restatement of that one.
        # When the fallback DOES run and fails, the step still exits non-zero
        # (`||` does not defeat `-e` for the group) and concludes `failure`, so
        # arm 1 fires. The guard removes the exposure; it does not silence a
        # real apt failure.
        timeout-minutes: 5
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      # Some alembic migrations (unify_runner_concepts onward) reference
      # the `runner` schema, which is created by
      # qontinui-web/init-scripts/01-create-runner-schema.sql in dev's
      # docker-entrypoint-initdb.d. CI service containers don't run
      # those init scripts, so create the schema explicitly.
      - name: Create runner schema
        # Deliberately UNBOUNDED and deliberately WITHOUT an `id:`. This is
        # psql/DDL against this job's own postgres service, not the external
        # mirror, so a failure here IS a verdict on the change -- it must never
        # reach the infrastructure marker's APT_STEP_OUTCOMES.
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U test_user -d test_db -c "CREATE SCHEMA IF NOT EXISTS runner;"

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          TESTING: '1'
          ENVIRONMENT: development
          SECRET_KEY: test-secret-key-for-testing-only-minimum-32-chars-required
          STORAGE_BACKEND: local
          REDIS_ENABLED: 'false'
        run: |
          alembic upgrade heads

      # Hermetic auth (mirrors spec-ci.yml + style-gate.yml — the ONE
      # canonical CI auth contract): mint a run-local RS256 id token + JWKS,
      # point the backend's Cognito verifier at the local issuer, and let
      # auth.setup.ts lane 1 (QONTINUI_TEST_ID_TOKEN) seed it. The backend
      # JIT-provisions the ci-bot user on the fixture's first authed probe —
      # no DB seeding step. This replaces the deleted create_admin.py step:
      # the local-password stack was retired in #342 (Cognito sole auth) and
      # this workflow was never ported, which red-failed every main run from
      # 2026-05-30 onward at "Create dev user for E2E auth setup".
      - name: Mint local id token + serve JWKS
        working-directory: ./backend
        run: |
          set -euo pipefail
          # Mint as the canonical dev user (dev-credentials.json — single
          # source of truth; the drift guard forbids hardcoding it). The
          # global-setup seeder creates this user as a superuser shell row
          # owning the seeded project/snapshots, and cognito_provision's
          # link-by-verified-email arm stamps the token's sub onto that row
          # on first authed probe. Minting any OTHER email (e.g. spec-ci's
          # empty-account ci-bot) JIT-provisions a second, data-less,
          # non-superuser user — every data-dependent spec then renders
          # empty states ("No projects yet") and admin-gated suites 403.
          EMAIL=$(python -c "import json; print(json.load(open('../dev-credentials.json'))['email'])")
          TOKEN=$(python scripts/spec_ci_local_idp.py \
            --issuer "http://127.0.0.1:8770" \
            --audience spec-ci-local \
            --email "$EMAIL" \
            --out-dir /tmp/e2e-idp)
          echo "QONTINUI_TEST_ID_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          (cd /tmp/e2e-idp && python -m http.server 8770 --bind 127.0.0.1 > /tmp/idp.log 2>&1 &)
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8770/.well-known/jwks.json > /dev/null; then
              echo "local JWKS up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8770/.well-known/jwks.json > /dev/null

      - name: Run frontend E2E tests
        working-directory: ./frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          # Duration-balanced shard weights (colon-separated ints; Playwright's
          # filterForShard sizes each shard's test-count span proportionally —
          # parse: cli/testActions.js resolveShardWeightsOption, semi-internal,
          # re-verify on Playwright upgrades). Equal-count spans were badly
          # duration-skewed (23.8m/6.7m/8.6m/17.6m of test time → max shard
          # ~16m wall); these weights equalize measured span time (~14.2m
          # each, ≈12m wall at workers:1 — span times were measured under the
          # workers:2 trial run, so their absolute values are ~2× real; only
          # the ratios matter for the weights). Derived from per-test
          # durations in run 29937298955's results.json artifacts; recompute
          # when the suite's shape shifts (see plan
          # 2026-07-22-web-playwright-single-worker-stale-rationale).
          PWTEST_SHARD_WEIGHTS: "92:168:218:115"
          # Hermetic-auth backend config. global-setup.ts spawns uvicorn with
          # `...process.env`, so these reach the backend's Cognito verifier:
          # it trusts the run-local issuer above and fetches its JWKS from
          # 127.0.0.1:8770. Values mirror spec-ci.yml.
          COGNITO_USER_POOL_ID: spec-ci-local-pool
          COGNITO_ISSUER: http://127.0.0.1:8770
          COGNITO_ALLOWED_AUDIENCES: spec-ci-local
          # Authenticate the backend's GitHub Releases fetch
          # (backend/app/api/v1/endpoints/releases.py reads GITHUB_TOKEN and
          # sends it as a Bearer). Shared Actions runner IPs exhaust the 60/hr
          # anonymous api.github.com limit, silently degrading the release
          # payload to an empty asset list and timing out download-page
          # assertions (runs 29859706423 + 29696362417). The token lifts the
          # limit to 5000/hr; read-only, public-repo metadata only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx playwright test --project=chromium --shard=${{ matrix.shard }}/4

      # Artifact names must be unique across matrix entries (actions/upload-artifact@v4
      # rejects collisions). Suffix with the shard index so each shard's
      # output uploads cleanly and can be downloaded independently.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-test-results-shard-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 30

      - name: Upload test artifacts (screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 30

      # ----------------------------------------------------------------------
      # CI-infrastructure timeout marker (plan
      # 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure,
      # Phase 5).
      #
      # A job-level timeout concludes the job as `cancelled`, and `gh pr checks`
      # renders `cancelled` as **fail** -- with ZERO failing steps, because no
      # step failed. An author triaging their own PR sees "fail" against their
      # diff with nothing to point at, and reads it as their own regression. On
      # 2026-08-19 that misattribution cost real time on PR #1015. This step
      # exists so the log says what actually happened.
      #
      # `cancelled` has THREE causes and only the first is this plan's defect:
      #   1. an apt-dependent step stalled against the external mirror (ours)
      #   2. coord's merge train reaping a `merge-candidate/*` ref (benign)
      #   3. a manual / external / superseding cancel (benign)
      # 2 and 3 resolved in MINUTES in every observed case. A marker that
      # shouted "infrastructure timed out" on all three would be wrong on the
      # benign ones, and a diagnostic that is wrong a quarter of the time is
      # worse than none -- it teaches readers to discard the other three
      # quarters. So the ::error:: arms demand POSITIVE evidence that an
      # apt-dependent step is what died, and every other path declines to judge
      # the diff at all.
      #
      # An apt step marked `continue-on-error: true` CAN be present when this
      # step fires. Its own soft failure cannot red the check -- but a LATER,
      # genuine failure can, and this step then runs with that soft-failed
      # outcome still in hand. So arm 1 keys on `.conclusion` (the value AFTER
      # `continue-on-error` rewrites it), never on `.outcome` alone: a step
      # that concluded `success` is not what red this job, and naming it as the
      # cause would misattribute a real regression to infrastructure -- the
      # exact cry-wolf this step exists to prevent.
      #
      # A soft-failed apt step is NOT thereby harmless, and the marker must not
      # say it is. `continue-on-error: true` stops it reding the job DIRECTLY;
      # it does nothing about the cascade. style-gate.yml is the live example:
      # six of its provisioning steps are deliberate SHADOW soft-fails, so a
      # stalled `Install postgresql-client` leaves no psql, the schema and
      # migration steps soft-fail in turn, no snapshots are captured, and with
      # STYLE_GATE_ENFORCE=1 the assert step exits 1. That job is red BECAUSE
      # of the apt stall, with no apt step concluding `failure` anywhere. So
      # every arm that would otherwise assert "this failure is a real one" or
      # "no apt-dependent step failed" is guarded on `soft_failed` being empty,
      # and warns instead of ruling when it is not.
      - name: Explain infrastructure timeout vs external cancellation
        if: cancelled() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          # declared at this job's `timeout-minutes`.
          JOB_TIMEOUT_MINUTES: '60'
          EXTERNAL_CANCEL_NOTE: >-
            this workflow's `concurrency:` supersedes a running job only on pull_request events (it is an expression, `github.event_name == 'pull_request'`, so whether GitHub auto-supersedes is decided per run and cannot be stated as fixed here). On a pull_request run, a newer push to the same ref supersedes it; on a push or schedule run it does not, and a manual cancel is then the only external cause. A coord merge-train reap is NOT one of them in this job: its own `if:` skips every refs/heads/merge-candidate ref, so it never runs on one to be reaped
          # `<step name>|<outcome>|<conclusion>` per apt-dependent step in this
          # job. BOTH values are carried on purpose:
          #   * `.outcome` is the value BEFORE `continue-on-error` rewrites it,
          #     so a soft-failed step still reports the truth here;
          #   * `.conclusion` is what actually reached the job, and ONLY a step
          #     that concluded `failure` can be what red it.
          # Every step named below runs `apt-get` and nothing else. Two splits
          # buy that invariant across all 8 workflows: the psql/DDL work that
          # used to share the postgresql-client steps now lives in an unbounded
          # successor step, and `npx playwright install --with-deps` -- npx
          # resolution PLUS a CDN browser download PLUS apt, fused into one
          # step -- is split so that only its apt-only `install-deps` half is
          # ever named here. So a `failure` on any step below is the apt
          # mirror: never the author's schema breaking, and never a Playwright
          # bundle that 404s on cdn.playwright.dev.
          APT_STEP_OUTCOMES: |
            Install Playwright browser system deps (apt)|${{ steps.apt_playwright.outcome }}|${{ steps.apt_playwright.conclusion }}
            Install postgresql-client|${{ steps.apt_psql.outcome }}|${{ steps.apt_psql.conclusion }}
        run: |
          set -uo pipefail

          # An apt step whose CONCLUSION is `failure` hit its own step-level
          # `timeout-minutes` (or apt errored outright) and red this job --
          # either way it is infrastructure. One whose outcome is `cancelled`
          # was still mid-flight when the job ended; that is only decisive once
          # we also know the job budget had actually expired. One that failed
          # but concluded `success` is `continue-on-error: true`: it did not red
          # this job DIRECTLY, but it can still have red it through the cascade
          # of steps that needed what it installs, so it is tracked separately
          # and never dismissed.
          #
          # Every matching step is named, not just the last one: two apt steps
          # can die in the same job, and reporting only one understates it.
          apt_failed=""
          apt_running=""
          soft_failed=""
          # How many rows actually parsed. An EMPTY APT_STEP_OUTCOMES -- which is
          # what a renamed or deleted step id renders to -- leaves all three
          # buckets empty, exactly like a clean run. That is an absence of DATA,
          # not an observation of health, and arm 2d is the first arm to make a
          # POSITIVE claim on it.
          apt_rows_seen=0
          while IFS='|' read -r step_name outcome conclusion; do
            [ -z "${step_name// }" ] && continue
            apt_rows_seen=$(( apt_rows_seen + 1 ))
            case "$outcome" in
              failure)
                if [ "$conclusion" = "failure" ]; then
                  apt_failed="${apt_failed:+$apt_failed, }$step_name"
                else
                  soft_failed="${soft_failed:+$soft_failed, }$step_name"
                fi
                ;;
              cancelled) apt_running="${apt_running:+$apt_running, }$step_name" ;;
            esac
          done <<< "$APT_STEP_OUTCOMES"

          why="It shells out to apt-get against an external mirror at job time."
          why="$why That call is normally seconds, but has been observed to stall"
          why="$why for 30+ minutes (and, unbounded, for 5h59m). Nothing under test ran."
          ref="See plan 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure."
          # A separate pointer for the budget arms. $ref names the apt-stall
          # plan, which is the wrong citation for an arm that exists to say
          # this was NOT the apt stall.
          ref_budget="See plan 2026-08-27-web-backend-coverage-producer-timeout."

          # Context line, emitted before any verdict.
          if [ -n "$soft_failed" ]; then
            echo "::notice title=Soft-failed apt step - possible upstream cause::Step(s) '$soft_failed' failed but are marked 'continue-on-error: true', so they concluded 'success' and did not DIRECTLY red this job. A later step that needed what they install can still have failed as a consequence, which would make this job's red an apt cascade rather than a verdict on the diff."
          fi

          # --- Arm 1: an apt step failed AND that failure red the job.
          # Airtight: neither a merge-train reap nor any other external cancel
          # can make a step conclude `failure`.
          if [ -n "$apt_failed" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_failed' exceeded a step-level timeout-minutes or failed outright. $why This is a CI infrastructure failure, not a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 1b: no apt step concluded `failure` and none is mid-flight,
          # but one SOFT-failed. The cascade described in the step header is
          # live here, so "this job's failure is a real one" is an assertion
          # this step cannot support. Warn rather than rule -- an UNKNOWN
          # stated as UNKNOWN, not laundered into a negative.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=A soft-failed apt step may have red this job downstream::No apt-dependent step concluded 'failure', but step(s) '$soft_failed' soft-failed ('continue-on-error: true'). $why Steps that needed what they install can have failed as a consequence, so this job's red may be that cascade and NOT a verdict on the diff. Check the cascade before concluding either way. $ref"
            exit 0
          fi

          # --- Neither cancelled nor an apt failure => a genuine red. Say
          # nothing: this step explains infrastructure timeouts, it does not
          # editorialise real test failures.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -z "$apt_running" ]; then
            echo "No apt-dependent step red the job, none was mid-flight, and the job was not cancelled."
            echo "This job's failure is a real one - emitting no marker."
            exit 0
          fi

          # --- Did the run actually reach its budget? A job timeout fires at
          # elapsed >= budget; a reap or a manual cancel lands at an arbitrary,
          # typically far earlier, elapsed (the two observed benign
          # cancellations were at 2m02s and 7m29s). That gap is the
          # discriminator, so resolve it from the API rather than assuming.
          # This lookup CAN fail (403, rate limit, network blip, a timestamp
          # `date -u -d` cannot parse); every failure leaves `elapsed_min`
          # empty, and empty is UNKNOWN. It is never evidence for a negative.
          # PREFER this job's own start stamp (written by the job's first
          # step). `run_started_at` measures the RUN -- it includes every
          # upstream `needs:` job and all queue time -- so on a `needs:`-gated
          # job it overstates this job's elapsed time by more than the slack
          # below, and a LATE external cancel would then be reported as a
          # timeout. The API lookup stays as the fallback for a job whose stamp
          # step did not run.
          #
          # The guards are not decoration: `-e` is on, so a non-numeric or
          # absurd value reaching `$(( ))` would ABORT this step, and a marker
          # that aborts explains nothing. `10#` forces base 10 -- bash reads a
          # leading zero as octal, where `08` is a hard error, not a value.
          # Every failure path leaves `elapsed_min` empty, and empty is UNKNOWN;
          # it is never evidence for a negative.
          elapsed_min=""
          elapsed_basis=""
          job_start="${JOB_START_EPOCH:-}"
          if [ -n "$job_start" ] && [ -z "${job_start//[0-9]/}" ] && [ ${#job_start} -le 11 ]; then
            job_start=$(( 10#$job_start ))
            # A real CI job start is a 10-digit epoch. Anything smaller is a
            # nonsense stamp -- '08' parses fine and means 8 SECONDS after 1970
            # -- and turning it into a 29-million-minute "measurement" would be
            # garbage presented as fact, which is the very laundering this
            # marker exists to stop. Below the floor, leave it UNKNOWN.
            if [ "$job_start" -ge 1600000000 ]; then
              elapsed_min=$(( ( $(date -u +%s) - job_start ) / 60 ))
              elapsed_basis="job"
            fi
          fi
          if [ -z "$elapsed_min" ]; then
            started="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' 2>/dev/null || true)"
            if [ -n "$started" ]; then
              start_epoch="$(date -u -d "$started" +%s 2>/dev/null || true)"
              if [ -n "$start_epoch" ]; then
                elapsed_min=$(( ( $(date -u +%s) - start_epoch ) / 60 ))
                elapsed_basis="run"
              fi
            fi
          fi

          # A negative elapsed means the clock moved backwards or the stamp is
          # nonsense. Report UNKNOWN rather than a garbage measurement.
          if [ -n "$elapsed_min" ] && [ "$elapsed_min" -lt 0 ]; then
            elapsed_min=""
            elapsed_basis=""
          fi

          # Named so an arm that RULES can disclose what it measured.
          case "$elapsed_basis" in
            job) basis_note="measured from this job's own start" ;;
            run) basis_note="measured from the RUN's start (this job's own start stamp was unavailable), so it also includes any upstream 'needs:' job and queue time" ;;
            *)   basis_note="not measured" ;;
          esac

          # 2 minutes of slack absorbs the gap between run start and job start.
          budget_floor=$(( JOB_TIMEOUT_MINUTES - 2 ))

          # Did the budget actually expire? THREE-valued: "yes" | "no" | ""
          # (UNKNOWN, when elapsed could not be read). NEVER collapse UNKNOWN
          # into "no". That collapse is precisely how arm 3 came to assert an
          # external cancel for a job that had in fact exhausted its own budget:
          # it interpolated `elapsed_min` into its message but never TESTED it,
          # so the only arm performing the budget test was arm 2 -- which is
          # guarded on an apt step being mid-flight and therefore unreachable on
          # any job whose apt steps are guarded to 0s.
          budget_reached=""
          if [ -n "$elapsed_min" ]; then
            if [ "$elapsed_min" -ge "$budget_floor" ]; then
              budget_reached="yes"
            else
              budget_reached="no"
            fi
          fi

          # One legible phrase per state, for the arms that REPORT rather than
          # rule. The UNKNOWN wording never implies the budget was not reached.
          case "$budget_reached" in
            yes) budget_phrase="which IS its full ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            no)  budget_phrase="short of its ${JOB_TIMEOUT_MINUTES}-minute budget" ;;
            *)   budget_phrase="against a ${JOB_TIMEOUT_MINUTES}-minute budget whose expiry could NOT be checked" ;;
          esac

          # --- Arm 2: the job budget expired while an apt step was still
          # running. Requires THREE facts. The `cancelled` guard is the one
          # arm 3 already carried and this arm was missing: a JOB_STATUS of
          # `failure` with an apt step mid-flight past the budget floor is NOT
          # a job timeout, and this text ("GitHub concludes a job timeout as
          # 'cancelled'") would be describing a mechanism that did not fire.
          # That state belongs to arm 2b, which names the real conclusion.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$apt_running" ] && [ "$budget_reached" = "yes" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::The ${JOB_TIMEOUT_MINUTES}-minute job budget expired after ${elapsed_min} min while step(s) '$apt_running' were STILL RUNNING. $why GitHub concludes a job timeout as 'cancelled', which 'gh pr checks' renders as 'fail' with zero failing steps - that rendering is what makes this look like your test failure. It is not. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2b: the job did NOT conclude `cancelled`, yet an apt step
          # was left mid-flight. A step-level `timeout-minutes` expiry is the
          # primary mechanism this change introduces, and which of the two job
          # conclusions GitHub surfaces for it is NOT something this change
          # established. So handle both: under `cancelled` semantics arms 1/2
          # cover it, and under `failure` semantics this arm does. Betting on
          # one and printing "cancelled from outside" under the other would be
          # flatly false about the mechanism we just added.
          if [ "$JOB_STATUS" != "cancelled" ] && [ -n "$apt_running" ]; then
            echo "::error title=CI infrastructure timeout - NOT your diff::Step(s) '$apt_running' were interrupted mid-flight (step outcome 'cancelled') and this job concluded '$JOB_STATUS'. $why Nothing here is a verdict on the code in this change. Re-run the job. $ref"
            exit 0
          fi

          # --- Arm 2c: cancelled with an apt step mid-flight, but arm 2's
          # budget test did not fire. Two sub-cases, and NEITHER licenses
          # ruling the stall out: an apt step really was running when this job
          # died.
          if [ -n "$apt_running" ]; then
            if [ -z "$elapsed_min" ]; then
              echo "::warning title=Cannot rule the apt stall in or out::Step(s) '$apt_running' were still mid-flight when this job was cancelled, but this run's elapsed time could NOT be read - the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so the known apt-mirror stall can be NEITHER confirmed NOR ruled out here. Nothing here is a verdict on the code in this change. $ref"
            else
              echo "::warning title=Cancelled with an apt step mid-flight::Step(s) '$apt_running' were still mid-flight when this job was cancelled after ${elapsed_min} min - well short of its ${JOB_TIMEOUT_MINUTES}-minute budget, which points at an external cancel ($EXTERNAL_CANCEL_NOTE) rather than the apt-mirror stall. But an apt step was genuinely running, so this does not rule the stall out either. Nothing here is a verdict on the code in this change. $ref"
            fi
            exit 0
          fi

          # --- Arm 2d: cancelled AT OR PAST its budget, with NO apt step
          # implicated at all. The job exhausted its OWN budget running its OWN
          # work -- a job timeout. This is the FOURTH cause of `cancelled`, and
          # the one this step's header taxonomy omitted: not the apt stall, not
          # a merge-train reap, not an external cancel. Without this arm the
          # state fell through to arm 3, which reported it as "cancelled from
          # outside" -- how a producer that timed out on nearly every main push
          # for days was read as a benign supersede every single time.
          #
          # Guarded on `soft_failed` being empty for the same reason every other
          # ruling arm is: a soft-failed apt step can have red this job through
          # the cascade, and this arm asserts a positive cause. When one is
          # present, arm 3a speaks instead and hedges.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "yes" ] && [ -z "$soft_failed" ]; then
            if [ "$apt_rows_seen" -gt 0 ]; then
              echo "::error title=Job budget exhausted - a TIMEOUT, not an external cancel::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, and GitHub cancelled it when that budget expired. No apt-dependent step failed, none was mid-flight, and none soft-failed - so this is NOT the apt-mirror stall, and NOT an external cancel either (a reap or a manual cancel lands at an arbitrary, typically far earlier, elapsed). The job's own work did not fit its budget. A job timeout concludes as 'cancelled' with ZERO failing steps, which 'gh pr checks' renders as 'fail' - that rendering is what makes this look like a test failure. It is not a verdict on the diff. But re-running WITHOUT raising the budget will most likely time out again: raise the budget, or make the work fit it. $ref_budget"
            else
              echo "::warning title=Job budget exhausted, but the apt telemetry was EMPTY::This job ran ${elapsed_min} min (${basis_note}) against its ${JOB_TIMEOUT_MINUTES}-minute budget, so the budget WAS reached and a job timeout is the leading explanation. But APT_STEP_OUTCOMES parsed to ZERO rows - a step id was renamed or removed, so the expression rendered empty - which makes 'no apt-dependent step failed' an absence of DATA here, not an observation. The apt-mirror stall therefore can NOT be ruled out, and this arm will not assert a cause from telemetry it did not receive. Fix the step-id reference so the next run can rule. $ref_budget $ref"
            fi
            exit 0
          fi

          # --- Arm 3a: cancelled, nothing mid-flight, but an apt step
          # SOFT-failed. Arm 3's "No apt-dependent step failed" would be
          # flatly false here - one demonstrably did - so arm 3 does not get
          # to speak for this state.
          if [ "$JOB_STATUS" = "cancelled" ] && [ -n "$soft_failed" ]; then
            echo "::warning title=Cancelled, and a soft-failed apt step may have red this job downstream::This job was cancelled after ${elapsed_min:-an unknown number of} min, $budget_phrase. No apt-dependent step was mid-flight, but step(s) '$soft_failed' soft-failed ('continue-on-error: true'), so the apt-mirror stall can NOT be ruled out here, and steps that needed what they install may have failed as a consequence. Note the budget reading above: where it says the budget WAS reached, a plain job timeout is also live as a cause, and these two cannot be separated while a soft-failed apt step is in play. A cancelled run also reports no test results at all, so nothing here is a verdict on the code under test either way. $ref"
            exit 0
          fi

          # --- Arm 3: cancelled, no apt step red the job, none was mid-flight,
          # none soft-failed, and the elapsed time is KNOWN and SHORT of the
          # budget. The stall is ruled out by the step outcomes (a positive
          # fact) and a job timeout is ruled out by the measurement, so an
          # external cancel is what is left. Explicitly decline to judge the
          # diff either way.
          #
          # The `budget_reached = "no"` guard is this arm's whole correction.
          # It used to fire on ANY cancelled job, so it claimed an external
          # cancel for job timeouts too -- while printing the very elapsed
          # figure that refuted it.
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$budget_reached" = "no" ]; then
            echo "::notice title=Run cancelled externally - NOT a verdict on this diff::This job was cancelled after ${elapsed_min} min, $budget_phrase. No apt-dependent step failed and none was mid-flight, so this was NOT the known apt-mirror stall; and it did not reach its own budget, so it was NOT a job timeout. It was cancelled from outside: $EXTERNAL_CANCEL_NOTE. A cancelled run reports no test results at all, so nothing here says anything about the code under test: do not read it as a failure of this change, and do not read it as a pass either. Re-run if you need a verdict."
            exit 0
          fi

          # --- Arm 3b: cancelled, nothing implicated, and the elapsed time
          # could NOT be read. A job timeout and an external cancel are
          # indistinguishable without that measurement, so say so instead of
          # picking one. This is the branch arm 3 used to swallow: it asserted
          # an external cancel from a number it did not have.
          if [ "$JOB_STATUS" = "cancelled" ]; then
            echo "::warning title=Cancelled - a timeout cannot be told from an external cancel::This job was cancelled, but this run's elapsed time could NOT be read: the 'gh api' run lookup failed, was rate-limited, or returned a timestamp 'date -u -d' could not parse. Without it the ${JOB_TIMEOUT_MINUTES}-minute budget test cannot be performed, so a job-budget TIMEOUT and an external cancel ($EXTERNAL_CANCEL_NOTE) can NOT be told apart here. That is UNKNOWN - it is specifically NOT evidence of an external cancel. No apt-dependent step failed and none was mid-flight, so the apt-mirror stall IS ruled out, by the step outcomes rather than by any measurement. A cancelled run reports no test results at all, so nothing here speaks to the code under test. $ref"
            exit 0
          fi

          # --- Unreachable under `if: cancelled() || failure()`: every
          # non-cancelled path above has already returned. Kept so an unforeseen
          # state says what it knows instead of falling through silently.
          echo "::notice title=No infrastructure verdict::Job status '$JOB_STATUS', no apt-dependent step red the job, none mid-flight. This marker has nothing to add about the code under test. $ref"

  # The cross-browser-survey job lives in its own workflow file
  # (.github/workflows/cross-browser-survey.yml) so it isn't subject
  # to this workflow's `cancel-in-progress:` expression above — the
  # slowest matrix entry (Mobile Chrome) takes ~30min and was being
  # cancelled mid-run by every push to main. See that file for
  # details.

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    # Job cap — see `backend-tests` above. This job only downloads artifacts
    # and tallies results: 3-9s across the same 7 green runs. 10 min is ~65x
    # the observed max and exists purely so a wedged download cannot inherit
    # the 360-minute default.
    timeout-minutes: 10
    needs: [backend-tests, frontend-tests]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Generate test summary
        run: |
          echo "# E2E Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Test reports and artifacts are available in the Actions artifacts section." >> $GITHUB_STEP_SUMMARY

      # Propagate shard/backend failures into this job's conclusion. Without
      # this, `if: always()` means Test Summary stays GREEN even when a
      # frontend shard or the backend job goes red, so push/nightly reds are
      # invisible on the required `Test Summary` check. We treat `skipped` as
      # OK so the cases where `frontend-tests` is skipped by its `if:` guard
      # (PRs, and coord's merge-candidate* proposal-validation refs) do not
      # fail the summary — only a job that actually RAN and ended
      # `failure`/`cancelled` turns this red. `needs.<job>.result` for a
      # matrix job aggregates across shards: it is `failure` if ANY shard failed.
      - name: Fail if any needed job failed
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
        run: |
          echo "backend-tests:  ${BACKEND_RESULT}"
          echo "frontend-tests: ${FRONTEND_RESULT}"
          status=0
          for result in "${BACKEND_RESULT}" "${FRONTEND_RESULT}"; do
            case "${result}" in
              failure|cancelled)
                echo "::error::A needed job concluded '${result}' — failing Test Summary."
                status=1
                ;;
              success|skipped|"")
                # success = passed; skipped = job's `if` guard excluded it
                # (e.g. frontend-tests on PRs); "" = no such dependency. All OK.
                ;;
              *)
                echo "::error::A needed job concluded unexpected status '${result}' — failing Test Summary."
                status=1
                ;;
            esac
          done
          exit "${status}"

      # Same reasoning as `backend-tests`'s notice above: this job's
      # `timeout-minutes: 10` cap is new, and a cap expiry concludes the job
      # `cancelled` -> rendered as **fail** with zero failing steps. `if:
      # cancelled()` (not `always()`) so it stays silent on the normal red,
      # where the step above has already said exactly which needed job failed.
      - name: Explain a cancelled job (no apt step here)
        if: cancelled()
        run: |
          echo "::notice title=Job cancelled - NOT a verdict on this diff::Test Summary was cancelled. It only downloads artifacts and tallies results (3-9s observed), so its 10-minute cap expiring would mean a wedged download, not a test failure; the other possibility is an external cancel, since this workflow's 'concurrency: cancel-in-progress' supersedes a running job on pull_request events. Either way this job produced no tally at all, and 'gh pr checks' renders a cancelled job as 'fail' with zero failing steps - that rendering says nothing about the code under test. Re-run if you need a verdict. See plan 2026-08-19-ci-apt-hang-unbounded-steps-misreported-as-test-failure."
