name: Secret Scan
on:
  pull_request:
permissions:
  contents: read

# Supersede a PR run when a newer commit is pushed to the same PR, so the
# previous head's runs stop consuming (and queueing for) runners. This
# workflow's lanes: `pull_request` only.
#
# The slug is a LITERAL, not `${{ github.workflow }}`. coord models a
# workflow's group template itself and interpolates only `github.event_name`
# and `github.ref`, collapsing every other expression to the empty string
# (`qontinui-coord` `ci_observer.rs::resolve_group_template`), so a
# `github.workflow` key would make every workflow here model to one identical
# group string. The four blocks already in this directory use a literal slug
# for the same reason.
#
# The key includes the EVENT because `schedule`, `workflow_dispatch` and a
# `push` to the default branch all resolve `github.ref` to `refs/heads/main`.
# Without it those lanes would share one group and supersede each other, and an
# in-flight run would occupy the very group a prospective land resolves into --
# which `run_is_reaper_at_risk` reads as a reap hazard and hard-blocks the
# merge train on.
#
# `cancel-in-progress` is an EXPRESSION, not `true`: only a `pull_request` run
# is ever superseded. A run on a `push` or `schedule` lane is never cancelled
# by this block, though note that a still-PENDING run in a group IS reaped when
# a newer run enters it -- GitHub keeps at most one pending run per group.
#
# NOTE this workflow has no `push` lane on the DEFAULT branch, and that is what
# makes a group safe here. A top-level group on a workflow that runs on
# `push: main` makes its post-land runs reaper-at-risk, which flips coord's
# blocking set from soft (relaxable by the optimism gate) to a hard block --
# see `merge_safety_from_observation`, whose soft-blocking arm requires those
# runs to share NO concurrency group.
concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2): 40 green runs measured 2026-09-23,
    # p50 0.25 / p90 0.29 / max 0.33 min; cap = max(5, 2x max). Replaces the 360-min default.
    timeout-minutes: 5
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (binary — the marketplace action requires a paid org license)
        run: |
          # Version resolution must never be able to fail the scan.
          # Unauthenticated api.github.com is 60 req/hr per runner IP, shared across
          # the whole GitHub-hosted fleet; when rate-limited the response body has no
          # tag_name, grep exits 1, and `bash -e` killed this step ~200ms in — before
          # the download, before anything was scanned. That surfaced as a bogus secret
          # scan FAILURE on clean diffs. github.token raises the budget to 1000/hr,
          # and the `|| true` + pinned fallback degrade a lookup miss to "scan with a
          # slightly older pinned gitleaks" instead of "abort the job".
          # Do not "tidy" the auth header, the `|| true`, or the fallback away.
          GL_FALLBACK=8.30.1
          GL=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" \
                 https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                 | grep -oP '"tag_name":\s*"v\K[^"]+' || true)
          GL="${GL:-$GL_FALLBACK}"
          echo "gitleaks v${GL}"
          # A scanner we could not obtain must fail loudly, never silently pass
          # the job — and it must say WHICH kind of failure it was, because
          # "secret scan failed" and "secrets found" are read very differently
          # by whoever sees the red check.
          #
          # Download to a FILE rather than through a pipe. `curl | tar` reports
          # TAR's exit status, so a failed download surfaces as
          # "gzip: stdin: unexpected end of file" — which reads as a corrupt
          # release or a broken scanner rather than as a CDN outage. Measured on
          # qontinui-coord 2026-09-21: the GitHub release CDN answered 504 four
          # times, tar died on the empty stream, and that workflow's own
          # "THE SCAN DID NOT RUN" guard never printed, because tar had already
          # failed the step before the guard was reached. A guard placed after a
          # pipe that can fail is unreachable for the case it exists to explain.
          #
          # `-f` is load-bearing on its own: without it curl exits 0 on an HTTP
          # error and streams the error PAGE onward as if it were the tarball.
          if ! curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
                 -o gitleaks.tar.gz \
                 "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz"; then
            echo "::error::Could not download gitleaks v${GL} — THE SCAN DID NOT RUN. This is an infrastructure failure (the GitHub release CDN did not serve the binary), NOT a leak finding. Re-run the job."
            exit 1
          fi
          # Split from the executable check so the annotation names the actual
          # failure. This arm is the one a served error PAGE lands in: curl saw
          # HTTP 200, so nothing resembling gitleaks was downloaded and saying
          # "downloaded gitleaks, could not extract" would misdescribe it.
          if ! tar -xzf gitleaks.tar.gz gitleaks; then
            echo "::error::The file served for gitleaks v${GL} is not a usable gitleaks tarball (tar rejected it) — THE SCAN DID NOT RUN. Infrastructure failure, NOT a leak finding. Re-run the job."
            exit 1
          fi
          if [ ! -x ./gitleaks ]; then
            echo "::error::Extracted gitleaks v${GL} but it is not executable — THE SCAN DID NOT RUN. Infrastructure failure, NOT a leak finding."
            exit 1
          fi
          rm -f gitleaks.tar.gz
          ./gitleaks version
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
