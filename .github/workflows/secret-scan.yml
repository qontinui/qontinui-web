name: Secret Scan
on:
  pull_request:
permissions:
  contents: read

# Supersede a PR run when a newer commit is pushed to the same PR, so the
# previous head's runs stop consuming (and queueing for) runners. This
# workflow's lanes: `pull_request` only.
#
# The slug is a LITERAL, not `${{ github.workflow }}`. coord models a
# workflow's group template itself and interpolates only `github.event_name`
# and `github.ref`, collapsing every other expression to the empty string
# (`qontinui-coord` `ci_observer.rs::resolve_group_template`), so a
# `github.workflow` key would make every workflow here model to one identical
# group string. The four blocks already in this directory use a literal slug
# for the same reason.
#
# The key includes the EVENT because `schedule`, `workflow_dispatch` and a
# `push` to the default branch all resolve `github.ref` to `refs/heads/main`.
# Without it those lanes would share one group and supersede each other, and an
# in-flight run would occupy the very group a prospective land resolves into --
# which `run_is_reaper_at_risk` reads as a reap hazard and hard-blocks the
# merge train on.
#
# `cancel-in-progress` is an EXPRESSION, not `true`: only a `pull_request` run
# is ever superseded. A run on a `push` or `schedule` lane is never cancelled
# by this block, and since 2026-10-05 it is not reaped while PENDING either:
# the per-run suffix below makes it the only member of its group.
#
# NOTE this workflow has no `push` lane on the DEFAULT branch, and that is what
# makes a group safe here. A top-level group on a workflow that runs on
# `push: main` makes its post-land runs reaper-at-risk, which flips coord's
# blocking set from soft (relaxable by the optimism gate) to a hard block --
# see `merge_safety_from_observation`, whose soft-blocking arm requires those
# runs to share NO concurrency group.
#
# PR-SCOPED SUPERSESSION, re-run- and push-safe (shared hosted-job cap relief,
# 2026-10-05; pattern: qontinui-claude-config#1475). Only a FIRST-attempt
# `pull_request` run uses the bare per-PR group below and cancels within it.
# Every other run -- push (incl. merge-candidate*/**, coord's candidate CI),
# schedule, workflow_dispatch, and EVERY re-run (run_attempt > 1) -- appends
# `-run-<id>-<attempt>`, so it is the sole member of its group: never
# cancelled, never reaped while pending, and a re-run of an older head can no
# longer cancel the current head's run. The existing literal prefix is kept
# because coord models a template by interpolating only `github.event_name` /
# `github.ref` and collapsing every other expression (the suffix included) to
# "" -- so coord's modelled group is byte-identical to before the suffix.
concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}${{ !(github.event_name == 'pull_request' && github.run_attempt == 1) && format('-run-{0}-{1}', github.run_id, github.run_attempt) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  gitleaks:
    # Job cap (plan 2026-09-07-nothing-escalates-a-pr-wedged-on-one-block-reason Phase 2): 40 green runs measured 2026-09-23,
    # p50 0.25 / p90 0.29 / max 0.33 min; cap = max(5, 2x max). Replaces the 360-min default.
    timeout-minutes: 5
    name: Gitleaks Secret Detection
    # coord-pools: [self-hosted, Linux, X64, qontinui-host-nawa, qontinui, ram-2g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(((vars.WEB_CI_LANE_SECRET_SCAN || vars.WEB_CI_LIGHT_LANE) == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","Linux","X64","qontinui-host-nawa","qontinui","ram-2g"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned, sha256-verified, host-cached fetch; the script's header says
      # why (canonical copy: qontinui-coord .github/scripts/fetch-gitleaks.sh).
      # Never rename this step with a "Set up "/"Setup "/"Cache" prefix:
      # coord's INFRA_STEP_PREFIXES would make a failed fetch bypass-landable
      # on merge-candidate CI, and a secret scan that did not run must block.
      # A version bump is its own PR and re-derives GITLEAKS_SHA256 from the
      # release's gitleaks_<version>_checksums.txt. The script itself is pinned
      # by sha256 below, so a change to it is a change to this file too (and so
      # seen by every workflow-file guard); update the pin in all seven repos.
      - name: Fetch gitleaks (pinned, sha256-verified, host-cached)
        id: gitleaks
        # Cold worst case about 3 min (curl --retry-max-time 120 plus one
        # --max-time 60 attempt); a cache hit is a copy and a sha256 check.
        timeout-minutes: 4
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          echo "f2702c6bee2275cc9d3daaf0d8f6d22b05fe3a3fadfd4fe7e13a93546d1f2de2  .github/scripts/fetch-gitleaks.sh" | sha256sum -c --quiet - \
            || { echo "::error title=fetch-gitleaks.sh does not match its pinned sha256::the script this workflow pins was changed without updating the pin here."; exit 1; }
          bash .github/scripts/fetch-gitleaks.sh
      - name: Run gitleaks
        env:
          GITLEAKS: ${{ steps.gitleaks.outputs.bin }}
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "scan range: ${SCAN_BASE}..${SCAN_HEAD}"
          "$GITLEAKS" version
          # --exit-code 3: leaks found = 3; a gitleaks error is any other nonzero
          # (1, or 2 on a config panic); the fetch step's 75 is neither. Both ARE
          # verdicts (a broken .gitleaks.toml can come from the diff), so neither
          # title carries coord's not-a-verdict phrase.
          rc=0
          "$GITLEAKS" detect --source . --config .gitleaks.toml --redact --no-banner \
            --exit-code 3 --log-opts="${SCAN_BASE}..${SCAN_HEAD}" || rc=$?
          case "$rc" in
            0) ;;
            3) echo "::error title=Gitleaks found leaks::gitleaks reported leaks in ${SCAN_BASE}..${SCAN_HEAD} (see the findings above)."
               exit 3 ;;
            *) echo "::error title=Gitleaks errored (exit $rc)::gitleaks itself failed (exit $rc), so the scan did not complete; a broken .gitleaks.toml in the diff can cause this."
               exit "$rc" ;;
          esac
