# NOTE (2026-05-01): Postgres service removed. Canonical PG runs from
# qontinui-stack at port 5433; this repo's containers no longer ship
# their own. Run `docker compose -f D:/qontinui-root/qontinui-stack/docker-compose.yml up -d`
# to start canonical PG/Redis/object store. See topology plan §3 for context.
#
# Redis and the object store are kept here because the FastAPI backend
# currently uses them on the legacy ports (6379, 9000) for sessions and blob
# storage. Migration to the canonical Redis/object store is a follow-up if
# needed.
#
# The object store is versitygw, the S3 store qontinui-stack adopted in place
# of MinIO, whose GitHub repository reports `archived: true` (plan
# 2026-11-22-fetches-stop-depending-on-upstreams, Phase 2). This file pulls the
# project's own image by digest, so it needs no sibling checkout to build.
#
# Version: v1.10.0, not the v1.11.0 qontinui-stack runs. The v1.11.0 image
# digest was pushed 2026-11-10, inside the plan's 14-day release-age cooldown
# on the pin date, so qontinui-stack builds v1.11.0 from its release tarball
# instead; this file avoids that build dependency by taking the newest image
# outside the cooldown. The binary IN this image was run against the D7
# conformance subset on nilan on 2026-11-22: 7/7 PASS, recorded in
# qontinui-dev-notes investigation-results/2026-11-19-in-house-substrate-strategy/
# phase1/s3-versitygw-1.10.0-web-image.json (image and binary digests, the
# instrument's commit). qontinui-stack's CI job `s3 store conformance` (arm 3)
# re-runs the subset against this same digest on every PR there; keep the two
# digests equal. Move to v1.11.0 once that digest is 14 days old (2026-11-24).
# `released:` is Docker Hub's tag_last_pushed for this digest, read 2026-11-22.
#
# CUTOVER from the MinIO this file used to run. The old `minio` /
# `minio-client` containers are no longer declared but still exist and hold
# port 9000, so remove them BY NAME first (-v drops only anonymous volumes; the
# named minio_data volume is kept), then start as usual:
#
#   docker rm -fv qontinui-minio qontinui-minio-client
#   docker compose up -d
#
# Not `--remove-orphans`: this file and docker-compose.staging.yml share this
# directory's default compose project, so pruning "orphans" from one would
# remove the other's containers. scripts/start-dev.sh does the removal. Then point backend/.env at the new
# credentials (backend/.env.example) and copy any data you need with
# qontinui-stack/scripts/s3-migrate-from-minio.sh.

services:
  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: qontinui-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object store (S3-compatible): versitygw. S3 API on 9000; there is no
  # console port (MinIO's 9001 is gone). The backend reaches it through
  # STORAGE_ENDPOINT_URL=http://localhost:9000 with the S3_ACCESS_KEY /
  # S3_SECRET_KEY pair below (see backend/.env.example).
  object-store:
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316 # released: 2026-10-22 pinned: 2026-11-22
    container_name: qontinui-object-store
    # The image's entrypoint runs explicit arguments as-is. /health is the
    # unauthenticated liveness route the healthcheck reads; metadata is kept in
    # xattrs on the volume (Docker local volumes support them).
    command: ["--port", ":9000", "--health", "/health", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-qontinui_dev_s3}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-qontinui_dev_s3_secret}
    ports:
      - "9000:9000"  # S3 API
    volumes:
      - object_store_data:/data
    healthcheck:
      # versitygw's unauthenticated liveness route; 127.0.0.1 because busybox
      # wget tries ::1 first for localhost.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bucket sidecar - creates `qontinui` (anonymous download) on startup
  object-store-init:
    image: amazon/aws-cli:2.39.6@sha256:eccdb3ec77e159d43ca6a750a70738c546883138be7f094498294a1477ec7e42 # released: 2026-11-06 pinned: 2026-11-22
    container_name: qontinui-object-store-init
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-qontinui_dev_s3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-qontinui_dev_s3_secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://object-store:9000
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        aws s3api head-bucket --bucket qontinui >/dev/null 2>&1 || aws s3api create-bucket --bucket qontinui >/dev/null
        aws s3api put-bucket-policy --bucket qontinui --policy '{"Version":"2012-10-17","Statement":[{"Sid":"AnonymousDownload","Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::qontinui/*"]}]}'
        echo "object-store bucket qontinui ready"
    restart: "no"

volumes:
  redis_data:
    driver: local
  object_store_data:
    driver: local
  # The retired MinIO's data: declared but mounted by nothing, so it is kept
  # (only `down -v` would remove it). Copy it into the object store with
  # qontinui-stack/scripts/s3-migrate-from-minio.sh (point --dest-endpoint at
  # http://127.0.0.1:9000 and --buckets at "qontinui").
  minio_data:
    driver: local
