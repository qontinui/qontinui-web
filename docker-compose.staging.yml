version: '3.8'

# Staging environment docker-compose
# This runs a complete staging stack including database, cache, and application

services:
  # PostgreSQL Database (staging)
  postgres-staging:
    image: postgres:16-alpine
    container_name: qontinui-postgres-staging
    environment:
      POSTGRES_USER: qontinui_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qontinui_staging_password}
      POSTGRES_DB: qontinui_staging
    ports:
      - "5434:5432"  # Different port to not conflict with dev
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qontinui_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # Redis Cache & Queue (staging)
  redis-staging:
    image: redis:7-alpine
    container_name: qontinui-redis-staging
    ports:
      - "6381:6379"  # Different port to not conflict with dev
    volumes:
      - redis_staging_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # Object store (staging): versitygw, built from the sibling
  # qontinui-stack/object-store/Dockerfile (see docker-compose.yml's header).
  # S3 API on 9004; no console port (MinIO's 9005 is gone).
  object-store-staging:
    build:
      context: ../qontinui-stack/object-store
      dockerfile: Dockerfile
    image: qontinui-canonical-object-store:latest
    container_name: qontinui-object-store-staging
    environment:
      ROOT_ACCESS_KEY: ${S3_STAGING_ACCESS_KEY:-qontinui_staging_s3}
      ROOT_SECRET_KEY: ${S3_STAGING_SECRET_KEY:-qontinui_staging_s3_secret}
    ports:
      - "9004:9000"  # S3 API
    volumes:
      - object_store_staging_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # Bucket sidecar - creates `qontinui-staging` (anonymous download) on startup
  object-store-init-staging:
    image: amazon/aws-cli:2.39.6@sha256:eccdb3ec77e159d43ca6a750a70738c546883138be7f094498294a1477ec7e42 # released: 2026-11-06 pinned: 2026-11-22
    container_name: qontinui-object-store-init-staging
    depends_on:
      object-store-staging:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_STAGING_ACCESS_KEY:-qontinui_staging_s3}
      AWS_SECRET_ACCESS_KEY: ${S3_STAGING_SECRET_KEY:-qontinui_staging_s3_secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://object-store-staging:9000
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        aws s3api head-bucket --bucket qontinui-staging >/dev/null 2>&1 || aws s3api create-bucket --bucket qontinui-staging >/dev/null
        aws s3api put-bucket-policy --bucket qontinui-staging --policy '{"Version":"2012-10-17","Statement":[{"Sid":"AnonymousDownload","Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::qontinui-staging/*"]}]}'
        echo "object-store bucket qontinui-staging ready"
    restart: "no"
    networks:
      - staging-network

  # Backend API (staging)
  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qontinui-backend-staging
    restart: unless-stopped
    ports:
      - "8002:8000"
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://qontinui_staging:${POSTGRES_PASSWORD:-qontinui_staging_password}@postgres-staging:5432/qontinui_staging
      - REDIS_HOST=redis-staging
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_ENABLED=true
      - SECRET_KEY=${SECRET_KEY:-staging-secret-key-change-me}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - REMEMBER_ME_TOKEN_EXPIRE_DAYS=90
      - BACKEND_CORS_ORIGINS=["http://localhost:3002"]
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=False
      - DEBUG=False
      - ENVIRONMENT=staging
      - FRONTEND_URL=http://localhost:3002
      # S3Backend is endpoint-driven boto3: any non-`local` backend with an
      # endpoint URL talks to that S3 store.
      - STORAGE_BACKEND=s3
      - STORAGE_BUCKET_NAME=qontinui-staging
      - STORAGE_REGION=us-east-1
      - STORAGE_ACCESS_KEY=${S3_STAGING_ACCESS_KEY:-qontinui_staging_s3}
      - STORAGE_SECRET_KEY=${S3_STAGING_SECRET_KEY:-qontinui_staging_s3_secret}
      - STORAGE_ENDPOINT_URL=http://object-store-staging:9000
      - STORAGE_USE_SSL=false
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - staging-network

  # Background Worker (staging)
  worker-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qontinui-worker-staging
    restart: unless-stopped
    command: python run_worker.py
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://qontinui_staging:${POSTGRES_PASSWORD:-qontinui_staging_password}@postgres-staging:5432/qontinui_staging
      - REDIS_HOST=redis-staging
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_ENABLED=true
      - SECRET_KEY=${SECRET_KEY:-staging-secret-key-change-me}
      - FRONTEND_URL=http://localhost:3002
      - ENVIRONMENT=staging
    networks:
      - staging-network

networks:
  staging-network:
    driver: bridge

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  object_store_staging_data:
    driver: local
  # The retired MinIO's staging data, declared and kept (see docker-compose.yml).
  minio_staging_data:
    driver: local
