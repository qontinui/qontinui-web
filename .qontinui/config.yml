# .qontinui/config.yml — qontinui PR-merge policy (edit to override dashboard settings)
version: 1
framework: node+python
merge:
  confidence_threshold: 0.75
  escalate_paths:
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - '**/alembic/versions/**'
  - pyproject.toml
  - requirements.txt
  - setup.py
  - '**/migrations/**'
  auto_merge_categories:
  - docs
  - test
  - chore
