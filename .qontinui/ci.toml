# CI manifest for the runner-as-CI-node lane
# (plan qontinui-dev-notes/plans/2026-08-07-runner-local-ci-parity-and-web-
#  configuration.md, Phase 5 — this repo is the one that motivated the plan and
#  had no manifest at all, so it could not run on the product's local-CI lane).
#
# PARITY IS A REVIEW-TIME INVARIANT: the steps below mirror the gate commands of
# .github/workflows/frontend-ci.yml's `lint-and-typecheck` AND
# `composed-cloud-build` jobs, and .github/workflows/backend-ci.yml's `lint` job
# plus that workflow's "Check OpenAPI snapshot is up to date" step. When those gates change, update
# this file in the SAME PR. Actions steps are referenced by NAME below, never by
# line number — line numbers in those files move constantly and a stale citation
# makes the invariant unauditable.
#
# Five gates are stronger than "mirrored": web-boundary-lint, forbid-public-
# schema, alembic-single-head, gitignore-tracked-files and ruff-version-parity
# invoke the SAME committed script the workflow invokes (scripts/ci/*.py), so
# there is nothing left to keep in sync — the two lanes cannot drift because
# there is only one copy of the logic. That is the preferred shape for any
# future gate here; the string-mirroring above is what you settle for when the
# workflow step is a third-party action or a package.json script this lane must
# name for itself.
#
# Commands are argv arrays (never shell strings); env is limited to the runner's
# allowlist (qontinui-runner/src-tauri/src/ci_node/manifest.rs::ENV_ALLOWLIST);
# `[limits]` values are ceilings the executor caps against host-derived sizing.
#
# ===========================================================================
# WHAT THIS MANIFEST CANNOT YET EXPRESS
#
# Recorded rather than silently omitted — the precedent is qontinui-coord's
# manifest header: "a manifest that parses but cannot run is worse than one that
# announces why." A reviewer comparing this file against the workflows must be
# able to tell a deliberate gap from an oversight.
#
# 1. backend-ci.yml's `test` job — THE POSTGRES/REDIS SUITE.
#    "Run tests with coverage" needs the job's `services:` block: a
#    pgvector/pgvector:pg16 container and a redis:7-alpine container, plus the
#    "Create test schemas and extensions" psql step that creates the project /
#    auth / cloud / coord / strategy / web schemas and `CREATE EXTENSION vector`.
#    The ci_node executor provisions sibling repos and registry tools; it
#    provisions no DATABASE. Nothing in this manifest can stand a server up, and
#    a step that assumed a local Postgres would fail on exactly the clean user
#    machine this lane exists to serve. So the backend unit suite is NOT gated
#    here — the Actions lane remains its only gate.
#
# 2. backend-ci.yml's `build-test` job — DOCKER.
#    "Build Docker image" / "Test Docker image" need a working docker daemon.
#    The runner does not provision one and a user's box may not have it.
#
# 3. backend-ci.yml's `security-scan` job.
#    "Run Trivy vulnerability scanner" is a GitHub Action
#    (aquasecurity/trivy-action), not a command; the ci_node tool registry is
#    CLOSED (a manifest names a tool, it never supplies a URL) and trivy is not
#    in it. "Run safety check" ends in `|| true` — a shell metacharacter that is
#    banned in argv, and a step that cannot fail is not a gate worth mirroring.
#
# 4. secret-scan.yml's "Run gitleaks" step — A TOOL THIS LANE CANNOT OBTAIN,
#    AND A DIFF RANGE THAT DOES NOT EXIST OFF GITHUB.
#    Blockers, in order of how load-bearing they are. None is removed by a
#    committed script, which is why this gate is NOT extracted the way the three
#    below were:
#      * DECISIVE — the scan is `--log-opts <base.sha>..<head.sha>`, i.e. the
#        commit range of a pull request. This lane dispatches a detached
#        WORKTREE, not a PR: there is no base/head pair to scan between, and
#        `GITHUB_TOKEN` / the `github.event.pull_request.*` context are not in
#        ENV_ALLOWLIST (verified against the runner source) and should not be. A
#        whole-tree scan instead would be a DIFFERENT gate with different
#        findings, not a mirror of this one, so substituting it would be
#        parity theatre.
#      * DECISIVE — the download URL is hard-coded `gitleaks_${GL}_linux_x64`.
#        The Actions lane is always ubuntu-latest; this lane runs on whatever
#        the contributor's box is, including Windows and macOS. The step cannot
#        be mirrored without re-deriving the platform asset, i.e. rewriting the
#        gate rather than sharing it.
#      * SUPPORTING — the step fetches that tarball from github.com at run time.
#        The ci_node tool registry is CLOSED (a manifest NAMES a tool, it never
#        supplies a URL) and gitleaks is not in it; an in-manifest curl would be
#        an unpinned network fetch wearing a step's clothes. Stated as
#        SUPPORTING and not decisive on purpose: gap 6 below already admits this
#        manifest assumes npm / poetry / python / git on PATH without registry
#        entries, so "not in the registry" alone would be a weak argument — it
#        is a judgement that gitleaks is not ambient on a developer machine the
#        way those four are, not an absolute bar.
#    So secret-scan stays Actions-only and its logic stays inline: extracting it
#    to a script would buy nothing, because there is no second lane to share the
#    script with. The OTHER THREE shell-scan workflows that used to be listed
#    here — web-boundary-lint.yml, forbid-public-schema.yml and
#    alembic-graph-pr.yml — are now expressible and ARE expressed below: Phase 5
#    of plan 2026-08-08-ci-tool-registry-and-canonical-configuration-parity moved
#    each one's logic into a committed script under scripts/ci/ and rewrote the
#    workflow to invoke it.
#
# 5. style-gate.yml is titled "Style Gate (shadow)" — non-gating by
#    construction, and it needs a Rust toolchain, a Playwright Chromium install
#    and a running app. Out of scope for a parity mirror of the GATES.
#
# 6. NO [[tools]] ARE DECLARED, AND THAT IS NOT THE SAME AS "NEEDS NOTHING".
#    The runner's tool registry (ci_node/tools.rs — `static KNOWN_TOOLS` at
#    :107, and the "The registry is CLOSED" rationale at :20) currently
#    provisions exactly one tool, cargo-nextest. Cited by line here ON PURPOSE,
#    against this file's own name-not-line-number rule: a 2026-08-18 review of
#    the Phase 5 diff reported "there is no tool registry in the runner — `find
#    -name tools.rs` returns nothing" and recommended deleting the closed-
#    registry framing. That was a STALE CHECKOUT artifact: the primary
#    qontinui-runner checkout sat at 33500d706 (2026-08-07, 97 commits behind)
#    whose ci_node/ has 7 files and no tools.rs, while origin/main has 12
#    including it — added by a4e040c7c, shipped 2026-08-08 with the preceding
#    plan. Verify against origin/main, never a local checkout. Every step below
#    assumes `npm` (Node 22, per
#    frontend-ci.yml's setup-node) and `poetry` (Python 3.12, per backend-ci.yml's
#    PYTHON_VERSION) are already on PATH. Until those enter the registry this
#    repo is not yet a zero-install target; declaring a tool the registry does
#    not know would be REJECTED at validation, so the honest move is to say so
#    here rather than to declare a lie.
#
#    THE REPO-WIDE GATE STEPS ADD TWO MORE PATH ASSUMPTIONS, recorded here for
#    the same reason: a bare `python` (>= 3.9; the scripts use only the standard
#    library) and `git`. `python` is what the workflows themselves invoke on
#    ubuntu-latest, and `poetry` cannot exist without an interpreter behind it,
#    so this is not a new class of assumption — but it IS a new name on PATH and
#    a manifest that silently assumed it would be lying by omission. `git` was
#    already assumed by the `openapi-snapshot-drift` step below.
#
#    PORTABILITY NOTE, NOT A CORRECTNESS HOLE: bare `python` (as opposed to
#    `python3`) is typically ABSENT on macOS, and unlike the Actions lane — which
#    is always ubuntu-latest — this lane runs on whatever a contributor's box is.
#    The failure mode there is the safe one: the step cannot start, so it fails
#    LOUD AND RED with a "program not found" spawn error. It cannot produce a
#    vacuous green, which is the failure this manifest actually guards against.
#    The fix, when `python` enters the registry (gap 1's problem, not this
#    file's), is a provisioned interpreter rather than a spelling change here —
#    `python3` would merely move the same gap to Windows.
# ===========================================================================

version = 1

# ---------------------------------------------------------------------------
# SIBLING REPOS — the ci_node analogue of the workflows' "Checkout sibling repos
# (qontinui-schemas, qontinui, qontinui-cloud-control)" step. Declared rather
# than cloned by a step: the executor materialises each one NEXT TO this repo's
# worktree inside the dispatch-scoped directory, so backend/pyproject.toml's
# `path = "../../qontinui-schemas"` resolves, and so cleanup stays a single
# directory removal. An in-manifest `git clone` would pass argv validation but
# would be unpinned and would leak.
#
# WHAT THIS LIST DELIBERATELY OMITS, and the open question attached to it:
#
#   `jspinak/qontinui` is cloned by all three backend-ci.yml jobs under a step
#   whose comment reads "Backend's pyproject.toml has path-deps on sibling repos
#   (qontinui-schemas, qontinui)". THAT COMMENT IS STALE. backend/pyproject.toml
#   carries exactly ONE `path =` entry — `qontinui-schemas` — so
#   `poetry install --no-root` never reads the qontinui clone, and no step below
#   imports it. Declaring it here would provision a multi-gigabyte torch-pulling
#   tree for nothing.
#
#   It is an OPEN QUESTION, not a settled one: the clone may still be load-
#   bearing for the `test` job this manifest cannot express (see gap 1 above) —
#   that job's "Free disk space" step exists specifically because "qontinui (a
#   path-dep) pulls in torch". Whoever resolves gap 1 must re-check this before
#   assuming the omission still holds, and fix the workflow comment either way.
# ---------------------------------------------------------------------------

[[siblings]]
# backend/pyproject.toml's `qontinui-schemas = {path = "../../qontinui-schemas",
# develop = true}` — the repo's only path dependency. `../../` from `backend/`
# and coord's `../` from its repo root resolve to the SAME place, a sibling of
# the checkout, which is the single layout rule the executor implements.
#
# Pinned by DECLARED ADAPTATION PR — the coord dep edge this PR and its
# qontinui-schemas PR already have to declare for merge ordering — exactly as
# .github/actions/checkout-sibling does, so a breaking schema change can go
# green as a declared pair instead of deadlocking. A branch NAME resolves
# nothing: matching on one let an un-PR'd scratch branch satisfy a mirror gate
# in production on 2026-07-28.
repo = "qontinui/qontinui-schemas"
pin = "declared-adaptation"

[[siblings]]
# Installed into the poetry venv by the `backend-install-cloud-control` step
# below, mirroring backend-ci.yml's "Install qontinui-cloud-control into poetry
# venv". Two things need it and both are gates:
#   * the EXTENDED OpenAPI export — without cloud-control installed the export
#     silently drops the ~31 admin/billing/organizations routes, so the drift
#     check would compare a truncated spec against the committed one;
#   * backend/tests/conftest.py's side-effect `import qontinui_cloud_control`,
#     which raises rather than skipping when CI=true (the executor exports
#     CI=true), because a missing import on CI is a real workflow bug.
# Public AGPL-3.0, plain clone — there is no access problem here, only a
# provisioning one.
#
# `default-branch`: consumed as a published extension package, not co-evolved
# with this repo through adaptation pairs, so there is no declaration protocol
# to read. Matches the workflows, which clone it `--depth 1` at the default
# branch.
repo = "qontinui/qontinui-cloud-control"
pin = "default-branch"

# NO [limits] TABLE, deliberately.
#
# CiLimits carries `cargo_build_jobs` and `test_threads`, and every step below
# is Node or Python — neither knob binds anything here. Omitting a limit means
# "size me from the host", which is the right answer when the manifest author
# has no measurement to contribute. Adding a table of no-ops would be a lie
# about what has been measured.

# ---------------------------------------------------------------------------
# REPO-WIDE GATES — first, because they are the only steps here that need no
# provisioning at all: no npm install, no poetry venv, no sibling repo. Each is
# an offline scan of the checked-out tree taking a few seconds (measured on this
# lane's own platform, 2026-08-18: 2.6-3.8s apiece, ~9s for the first three;
# `gitignore-tracked-files` was added later and is the same order of magnitude —
# two `git ls-files` calls over the index; `ruff-version-parity`, added later
# still, is cheaper than any of them — it reads two committed files and
# compares two strings, with no subprocess at all), against minutes for the
# installs
# that follow. So putting them ahead of
# `frontend-install` means a dispatch that is going to fail on one of them fails
# before it pays for a dependency install.
#
# These five are NOT string-mirrors of their workflows — both lanes invoke the
# same committed script, so they cannot drift.
#
# Each script exits 1 on the violation it checks for and 2 when it COULD NOT
# SCAN. Stated precisely, because the guarantee is narrower than "no green
# without a scan" and should not be oversold: what each script guarantees is
# that it never returns 0 after finding its INPUT SET EMPTY or its underlying
# tool erroring — no revision files, no tracked files, a `git grep` that failed,
# a path it could not place, a file it could not read. It can still legitimately
# return 0 having scanned nothing in a case where emptiness is the honest
# answer: `check_web_boundary.py --files` given a non-empty list of files that
# are all out of scope says so and passes. That is the pre-commit path, not a
# gate path; the two dispatch steps below always take the repo-wide branch,
# where an empty input set is always exit 2.
# ---------------------------------------------------------------------------

[[steps]]
name = "web-boundary-lint"
# web-boundary-lint.yml, step "Scan backend/app for qontinui.* boundary
# violations". The cloud FastAPI tier must not import the `qontinui` namespace
# (torch, CV, ML, OCR); shared types come from qontinui-schemas. No working_dir:
# the script resolves the repo root from its own location, so it behaves
# identically from any cwd.
command = ["python", "scripts/ci/check_web_boundary.py"]

[[steps]]
name = "forbid-public-schema"
# forbid-public-schema.yml, step "Scan for forbidden public.* references".
# Post-Phase-7 the default schema holds only alembic's bookkeeping table; domain
# tables live in project / coord / agent / auth / cloud / strategy / web. The
# scan is a `git grep` over tracked files, so it needs the dispatch checkout to
# be a real git worktree — which it is (the `openapi-snapshot-drift` step below
# already depends on that).
command = ["python", "scripts/ci/check_forbidden_public_schema.py"]

[[steps]]
name = "alembic-single-head"
# alembic-graph-pr.yml, step "Count alembic heads". Offline textual scan of
# backend/alembic/versions/*.py — it never imports env.py, so it costs nothing
# and needs no database, which is exactly why this gate CAN live here while the
# rest of backend-ci.yml's `test` job (gap 1 above) cannot.
#
# FOUR lanes now share this script: the required PR check, this manifest, the
# post-land companion (alembic-graph-check.yml), and .pre-commit-config.yaml's
# `alembic-single-head` hook. The workflow passes `--baseline-ref origin/main`
# explicitly because its depth-1 checkout has no such ref until it fetches one;
# here the default already IS `origin/main` and a runner checkout has it, so
# the argv stays bare. `--baseline-ref` only selects the remediation text — it
# cannot move the verdict — so the two lanes are the same gate.
command = ["python", "scripts/ci/count_alembic_heads.py"]

[[steps]]
name = "ruff-version-parity"
# backend-ci.yml's `lint` job, step "Check ruff version parity (pre-commit vs
# poetry.lock)". Asserts that the ruff `backend-ruff-check` and
# `backend-ruff-format` below actually run — the one backend/poetry.lock
# resolves — is the same ruff that a contributor's pre-commit hooks run.
#
# Belongs in THIS block rather than beside the backend steps: it reads two
# committed files and needs no poetry venv, no sibling repo and no npm, which
# is the property that defines this section. It is also the cheapest possible
# way to fail a dispatch that is going to fail anyway.
#
# A FIFTH gate of the "same committed script" shape the header calls the
# preferred one — and the only one here guarding a TOOL VERSION rather than
# the tree's contents. That is deliberate: this manifest can mirror a
# workflow's commands, but nothing in it can mirror a third-party pre-commit
# `rev`, so the equality has to be asserted by a script both lanes run.
command = ["python", "scripts/ci/check_ruff_version_parity.py"]

[[steps]]
name = "gitignore-tracked-files"
# gitignore-tracked-files.yml, step "Scan for tracked-but-ignored files". Fails
# if any file in the index is matched by a committed .gitignore rule — the state
# that hid backend/scripts' 10 tracked files from ruff until `ec9fae1a`. Like
# forbid-public-schema, it reads the index, so it needs the dispatch checkout to
# be a real git worktree, which it is.
command = ["python", "scripts/ci/check_tracked_ignored.py"]

# ---------------------------------------------------------------------------
# FRONTEND — mirrors frontend-ci.yml's `lint-and-typecheck` job, step for step
# and in its order. Cheapest gates first: lint and typecheck fail fast before
# the test suite is paid for.
# ---------------------------------------------------------------------------

[[steps]]
name = "frontend-install"
# frontend-ci.yml "Install dependencies". `npm ci` (not `npm install`) — the
# lockfile is the input, and a resolver that is free to move makes two
# dispatches of one commit incomparable.
command = ["npm", "ci"]
working_dir = "frontend"

[[steps]]
name = "frontend-lint"
# frontend-ci.yml "Lint" → package.json `lint` = `next lint --max-warnings 0`.
command = ["npm", "run", "lint"]
working_dir = "frontend"

[[steps]]
name = "frontend-typecheck"
# frontend-ci.yml "TypeScript check" -> package.json `type-check` =
# `tsc --noEmit -p tsconfig.typecheck.json`. Both lanes invoke the SCRIPT, so
# they cannot drift on which config is used.
#
# THE `-p` IS LOAD-BEARING AND THIS COMMENT USED TO GET IT WRONG. It said the
# workflow ran a bare `npx tsc --noEmit` and that the script was "the same
# compiler, same flags, same tsconfig". That stopped being true when the
# `@cloud/*` route alias landed: `tsconfig.typecheck.json` extends
# `tsconfig.json` and adds the `@cloud/*` mapping, which must NOT live in
# `tsconfig.json` — Next feeds tsconfig `paths` to webpack through
# `JsConfigPathsPlugin`, which would then override the real webpack alias and
# resolve every composed cloud build back to the OSS stubs. So a bare
# `tsc --noEmit` on this tree now FAILS on every route shim, and the two
# configs are deliberately different files. See frontend/tsconfig.typecheck.json
# and frontend/docs/composed-cloud-build.md.
command = ["npm", "run", "type-check"]
working_dir = "frontend"

[[steps]]
name = "frontend-test"
# frontend-ci.yml "Unit tests" → package.json `test` = `vitest run`.
command = ["npm", "test"]
working_dir = "frontend"

# ---------------------------------------------------------------------------
# FRONTEND, COMPOSED CLOUD SHAPE — mirrors frontend-ci.yml's
# `composed-cloud-build` job, step for step and in its order.
#
# ONE TREE, TWO SHAPES, IN SEQUENCE. The Actions lane needs two jobs for this
# because each job gets a fresh checkout; this lane has one worktree, so it gets
# both shapes by ORDERING: the four steps above run before the overlay exists
# and are therefore genuinely the OSS shape, and the five below run from
# `composed-cloud-install` onward and are genuinely the composed one.
# `frontend/node_modules/@qontinui/cloud-control` is the only switch — every
# other piece (`transpilePackages`, the `@qontinui/cloud-control` fallback
# alias, the `@cloud/*` route alias, vitest's inlining) keys off whether that
# path exists. The tree is left in the composed shape when the dispatch ends;
# that is fine, the dispatch directory is scoped and removed.
#
# THE SIBLING IS ALREADY DECLARED — the `qontinui/qontinui-cloud-control`
# `[[siblings]]` entry above, provisioned for the BACKEND half of this same
# composition, is the same tree the frontend half needs. `pin =
# "default-branch"` also matches what the Actions job does (its
# `actions/checkout` for the sibling passes no `ref:`), so the two lanes gate
# the same pair.
# ---------------------------------------------------------------------------

[[steps]]
name = "composed-cloud-install"
# frontend-ci.yml "Install the cloud-control overlay" -> package.json
# `cloud:install` = `node scripts/cloud-control-overlay.mjs install`. Links the
# sibling checkout into `frontend/node_modules/@qontinui/cloud-control`.
#
# NO `--source`, AND NO `QONTINUI_CLOUD_CONTROL_PATH` — the workflow sets that
# env var, this step deliberately does not, and the divergence is forced from
# both directions:
#   * The workflow needs it because `actions/checkout` cannot write outside
#     $GITHUB_WORKSPACE, so its sibling lands at
#     `.sibling/qontinui-cloud-control` INSIDE the checkout rather than beside
#     it. This lane has no such restriction: the executor materialises siblings
#     NEXT TO the worktree, which is exactly what the script's own
#     `DEFAULT_SOURCE` resolves to — `path.resolve(FRONTEND_DIR, "..", "..",
#     "qontinui-cloud-control")`, the same arithmetic
#     `backend-install-cloud-control` below does from `working_dir = "backend"`.
#     The default is already correct here; passing the path again would be noise.
#   * `QONTINUI_CLOUD_CONTROL_PATH` is NOT in manifest.rs::ENV_ALLOWLIST, and
#     that list is a security boundary with no batch approval. Declaring it
#     would be a hard validation REJECTION of this whole manifest, not a
#     warning. So the default is not merely preferable here — it is the only
#     spelling that parses.
command = ["npm", "run", "cloud:install"]
working_dir = "frontend"

[[steps]]
name = "composed-lint"
# frontend-ci.yml "Lint (composed)" -> package.json `lint`.
#
# MIRRORED EVEN THOUGH IT IS A DUPLICATE OF `frontend-lint`, and the duplication
# is a fact about the WORKFLOW, not about this lane. `.eslintrc.json`
# `ignorePatterns` contains "node_modules/", which is exactly where the overlay
# links cloud-control — and ESLint takes its file set from directory globs, not
# from the module graph, so the `@cloud/*` alias cannot pull those sources in.
# Same files, same rules, no type-aware rules configured: the composed lint can
# only ever report what the OSS lint already reported.
#
# It is mirrored anyway because this file's contract is to mirror the workflow's
# gate commands. Deciding here that one workflow step is not worth mirroring
# would embed a judgement the parity invariant exists to forbid and make the two
# lanes un-diffable. If the duplication should go, it should go from
# frontend-ci.yml — and then from here, in the same PR.
command = ["npm", "run", "lint"]
working_dir = "frontend"

[[steps]]
name = "composed-typecheck"
# frontend-ci.yml "TypeScript check (composed)" -> package.json `type-check`.
#
# THIS IS THE STEP THE COMPOSED SHAPE EXISTS FOR. `@qontinui/cloud-control`
# ships raw `.ts`/`.tsx` with no tsconfig, no build step and no CI of its own,
# and `@cloud/*` resolves into those sources only when the overlay is present —
# so this is the ONLY place in either repo where they are type-checked at all,
# and they are checked under this app's `strict` settings. `preserveSymlinks`
# in tsconfig.json is what makes the package's own bare imports (`react`,
# `next/navigation`, ...) resolve through the link.
command = ["npm", "run", "type-check"]
working_dir = "frontend"

[[steps]]
name = "composed-test"
# frontend-ci.yml "Unit tests (composed)" -> package.json `test`.
#
# NOT a re-run of `frontend-test`: two suites change behaviour with the overlay
# present. `cloud-extensions-boot.registration.test.tsx` has a composed half
# that is skipped in the OSS shape and asserts cloud-control's services and
# components are really in the client-side slot registry; and
# `src/cloud-absent/cloud-route-shims.test.ts` can only diff the shims against
# cloud-control's actual `routes/` tree when that tree is on disk — in the OSS
# shape it has nothing to diff against.
command = ["npm", "test"]
working_dir = "frontend"

[[steps]]
name = "composed-build"
# frontend-ci.yml "Build (composed)" -> package.json `build`.
#
# Proves webpack can RESOLVE AND TRANSPILE the composed graph — which is what
# makes a deleted host module impossible to lose silently, since cloud-control
# imports 26 distinct `@/...` modules from this app. It proves nothing about
# types: next.config.mjs sets `typescript.ignoreBuildErrors: true` and
# `eslint.ignoreDuringBuilds: true`, which is why `composed-typecheck` above is
# a separate gate rather than something `build` subsumes.
#
# EASILY THE MOST EXPENSIVE STEP HERE — a full `next build`, minutes rather than
# seconds. Mirrored regardless: the disclosed-gap list at the top of this file
# is for steps that CANNOT run, and cost has never been a reason to drop a gate
# from it (gap 1 is impossibility, not expense). It runs last so everything
# cheaper has already had its chance to fail.
command = ["npm", "run", "build"]
working_dir = "frontend"

# ---------------------------------------------------------------------------
# BACKEND — mirrors backend-ci.yml's `lint` job, plus the `test` job's
# "Check OpenAPI snapshot is up to date" step (which needs no database: the
# exporter builds the FastAPI app from its route table and self-configures the
# minimal env it needs, so it is the one gate of that job this lane CAN hold).
# ---------------------------------------------------------------------------

[[steps]]
name = "backend-install"
# backend-ci.yml "Install dependencies".
command = ["poetry", "install", "--no-interaction", "--no-root"]
working_dir = "backend"

[[steps]]
name = "backend-install-cloud-control"
# backend-ci.yml "Install qontinui-cloud-control into poetry venv". The path is
# `../../qontinui-cloud-control` because working_dir is `backend`, one level
# deeper than the checkout the sibling sits beside — the same arithmetic the
# workflow does against $GITHUB_WORKSPACE/.., and the reason the executor's
# one-level-deeper dispatch layout matters.
command = ["poetry", "run", "pip", "install", "-e", "../../qontinui-cloud-control"]
working_dir = "backend"

[[steps]]
name = "backend-ruff-check"
# backend-ci.yml "Run ruff (linting)".
command = ["poetry", "run", "ruff", "check", "."]
working_dir = "backend"

[[steps]]
name = "backend-ruff-format"
# backend-ci.yml "Run ruff format (formatting)".
command = ["poetry", "run", "ruff", "format", "--check", "."]
working_dir = "backend"

[[steps]]
name = "backend-mypy"
# backend-ci.yml "Run mypy (type checking)".
command = ["poetry", "run", "mypy", "app/", "--ignore-missing-imports"]
working_dir = "backend"

[[steps]]
name = "openapi-export-extended"
# backend-ci.yml "Check OpenAPI snapshot is up to date", first of its two
# exports: the EXTENDED spec, the app as built with the cloud-control sibling
# installed. Split into three steps here because the workflow's version is one
# `run:` block and this lane has no shell — the drift check is the third step.
command = ["poetry", "run", "python", "scripts/export_openapi.py"]
working_dir = "backend"

[[steps]]
name = "openapi-export-base"
# Same workflow step, second export: the BASE spec
# (QONTINUI_DISABLE_CLOUD_EXTENSIONS=1), the surface prod api.qontinui.io
# actually serves and the one coord's route-serving observer reads for that
# host. Two exports need two PROCESSES — the app is built at import time, so
# one process cannot re-import it with different env.
command = ["poetry", "run", "python", "scripts/export_openapi.py", "--base"]
working_dir = "backend"

[[steps]]
name = "openapi-snapshot-drift"
# The gate itself: both committed snapshots must already equal what the two
# exports just wrote. A stale snapshot silently mis-declares the web backend's
# external surface to coord, which is why this fails the dispatch rather than
# warning. Run from the repo root (no working_dir) because the paths are
# repo-relative, exactly as the workflow's `git -C "$GITHUB_WORKSPACE" diff` is.
command = [
  "git",
  "diff",
  "--exit-code",
  "frontend/src/lib/api-client/openapi-schema.json",
  "frontend/src/lib/api-client/openapi-schema.base.json",
]
