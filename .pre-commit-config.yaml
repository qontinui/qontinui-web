repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        # The OpenAPI snapshots are generated artifacts kept authoritative by
        # the backend-ci drift check; size is inherent (600+ paths), not waste.
        exclude: 'tests/spec-ci/schemas\.json$|frontend/src/lib/api-client/openapi-schema(\.base)?\.json$'
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # NOT a free-floating pin: this must be the ruff version `poetry.lock`
    # resolves, because that is the ruff `backend-ci.yml` executes. A hook and a
    # CI gate running different formatters reproduce, one level up, exactly the
    # defect the `ruff-format` hook below was added to prevent. The
    # `ruff-version-parity` local hook enforces it and prints the token to write
    # here; move this line only together with the lockfiles.
    rev: v0.14.14
    hooks:
      # `ruff-check`, not `ruff`: upstream renamed this hook and kept `ruff` as
      # a "Legacy alias" whose entry is byte-identical (`ruff check
      # --force-exclude`). Running it under the old id changes nothing except
      # that pre-commit prints the hook as "ruff (legacy alias)" — so the rename
      # rides the rev bump rather than waiting for the alias to be dropped, and
      # the two hooks now read as the matched pair they are.
      - id: ruff-check
        args: [--fix]
      # `ruff-check` above is the LINTER only. backend-ci.yml runs BOTH
      # `ruff check .` and `ruff format --check .`, so without this hook a
      # backend change can pass every local gate and still red CI on
      # formatting alone -- which has happened at least four times, once
      # breaking `main` and blocking four PRs for 40+ merge-train cycles
      # (`0bb156dd`, "style: ruff format operations.py to unbreak main").
      # Formatting is the cheapest possible thing to get wrong and the most
      # expensive place to discover it.
      #
      # `files: ^backend/` mirrors the CI step's SCOPE, not just its command:
      # that job runs with `working-directory: ./backend`, so `ruff format
      # --check .` covers `backend/**` and nothing else. Unscoped, this hook
      # reformats six repo-root Python files CI has never checked
      # (`.github/scripts/`, `.pre-commit-hooks/`, `research_env/`,
      # `scripts/`) — unrelated churn in whatever PR happens to touch them
      # next, enforcing a rule no gate actually applies. Widen this only
      # together with the CI step, so the two cannot drift apart again.
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: ruff-version-parity
        name: pre-commit ruff pin == the ruff CI runs
        # SAME SCRIPT as .github/workflows/ruff-version-parity.yml and
        # .qontinui/ci.toml's `ruff-version-parity` step — the shape plan
        # 2026-08-08-ci-tool-registry-and-canonical-configuration-parity Phase 5
        # established, and the one .qontinui/ci.toml's header calls preferred:
        # three lanes, one copy of the logic, so the lanes cannot drift.
        #
        # Guards the `rev:` in the block above against `poetry.lock`. Stdlib
        # only (no PyYAML): the ci_node lane runs it on a checkout with nothing
        # installed. See the script's docstring for why the pin is not free.
        entry: python scripts/ci/check_ruff_version_parity.py
        language: system
        pass_filenames: false
        # A NARROW `files:`, unlike gitignore-tracked-files below, which needs
        # `always_run`. That hook guards a property of the (rules, index) pair,
        # which any commit can break. This one guards a property of two FILES:
        # nothing but an edit to the pre-commit config or to a lockfile can put
        # the two versions out of step, so the glob is exact, not a coverage
        # hole. The script reads both sides itself, hence `pass_filenames: false`.
        files: ^(\.pre-commit-config\.yaml|(.*/)?poetry\.lock)$

      - id: eslint
        name: ESLint (frontend)
        entry: bash -c 'args=(); for f in "$@"; do args+=("${f#frontend/}"); done; cd frontend && npx eslint --no-warn-ignored "${args[@]}"' --
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        types_or: [javascript, jsx, ts, tsx]

      - id: tsc-typecheck
        name: TypeScript type check (frontend)
        # `npm run type-check`, NOT a bare `npx tsc --noEmit`: the script
        # points tsc at tsconfig.typecheck.json, which is the only config
        # carrying the `@cloud/*` paths mapping. Next reads tsconfig.json and
        # feeds its paths to webpack, so `@cloud/*` deliberately cannot live
        # there (see tsconfig.typecheck.json's header). A bare tsc therefore
        # fails to resolve every route shim. Keep this in step with
        # frontend-ci.yml, which runs the same script in both build shapes.
        entry: bash -c 'cd frontend && npm run type-check'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

      - id: mypy
        name: Python type check (mypy)
        # Wrapper provisions the poetry env once in fresh worktrees, then runs
        # mypy strictly in-env — never the silent system-PATH fallback that
        # produced bogus stale-qontinui_schemas errors (see run_mypy.sh).
        entry: .pre-commit-hooks/run_mypy.sh
        language: script
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: alembic-schema-arg-gate
        name: Alembic ops require schema= (consolidation gate)
        entry: python .pre-commit-hooks/check_alembic_schema_args.py
        language: system
        files: ^backend/alembic/versions/.*\.py$
        # Two checks: (1) op.<gated_func>(..., schema=...) kwarg
        # presence, (2) raw SQL inside op.execute("...") names a
        # schema for every CREATE/ALTER/DROP/REFERENCES/INDEX-ON.
        # Pre-commit invokes with the changed-file list so the audit
        # only runs on migrations actually being touched — already-
        # applied legacy revisions aren't re-audited.
        # The pattern must stay in sync with SCOPED_DIRS in
        # check_alembic_schema_args.py: the script re-filters whatever
        # pre-commit hands it through _is_in_scope(), so a wider pattern
        # here buys nothing and misdescribes the coverage. It previously
        # also named `_staged_consolidation/`, which the transplant
        # removed from both the tree and SCOPED_DIRS.

      - id: alembic-single-head
        name: Alembic chain has exactly one head
        entry: python scripts/ci/count_alembic_heads.py
        language: system
        pass_filenames: false
        files: ^backend/alembic/versions/.*\.py$
        # SAME SCRIPT as .github/workflows/alembic-graph-pr.yml's required
        # `alembic-heads-pr` check, .qontinui/ci.toml's `alembic-single-head`
        # step, and alembic-graph-check.yml's post-land companion. A fourth
        # lane on one script, the pattern Phase 5 of
        # 2026-08-08-ci-tool-registry-and-canonical-configuration-parity
        # established.
        #
        # `pass_filenames: false` with a NARROW `files:`, unlike
        # gitignore-tracked-files below, which needs `always_run`. That hook
        # guards a property of the (rules, index) pair, which any commit can
        # break. This one guards a property of the REVISION SET, which only a
        # commit touching backend/alembic/versions/ can break — so the glob is
        # exact, not a coverage hole. The scan is over the whole dir either
        # way, hence `pass_filenames: false`.
        #
        # THIS HOOK IS SHIFT-LEFT CONVENIENCE, NOT THE GUARD. Do not describe
        # it as what closes the loop: it does not run in CI, it is bypassable
        # with --no-verify, and — measured — it would have caught 0 of the 3
        # forks on record, because in all three the declared parent WAS the
        # single head at `git commit` time and a sibling landed 83 minutes to
        # days later. The guard is the required CI check plus
        # scripts/ci/notify_forked_open_prs.py, which sweeps open PRs on every
        # land. What this hook buys is the genuinely-stale-parent path (a
        # branch that sat before the revision was written) and, more usefully,
        # a 2-second local reproduction that PRINTS THE CORRECT
        # `down_revision` TOKEN instead of a 17-minute wait for a red check —
        # naming that token was the entire fix in 3 of 3 cases.

      - id: coord-column-drop-guard
        name: coord.* DROP/RENAME is not still read by a deployed or main coord
        entry: python scripts/ci/check_coord_column_drops.py --files
        language: system
        files: ^backend/alembic/versions/.*\.py$
        # SAME SCRIPT as .github/workflows/coord-column-drop-guard.yml's
        # `coord-column-drop-guard` check and .qontinui/ci.toml's step of the
        # same name (plan 2026-09-03-coord-column-drop-guard-on-web-migrations,
        # Phase 2). pre-commit appends the changed revision files after
        # `--files`, so only the revisions in this commit are scanned.
        #
        # Offline unless a coord.* DROP/RENAME is found; then it fetches
        # coord's read-surface manifest and fails while a deployed or main
        # coord still reads the surface. A composed DROP (an f-string or
        # `.format()` template, the pdtier_01 shape) must declare
        # `COORD_SCHEMA_DROPS` at module level or the hook fails before any
        # network call. Shift-left: the CI check is the guard, this is the
        # early answer.

      - id: gitignore-tracked-files
        name: no tracked file is gitignored
        # SAME SCRIPT as .github/workflows/gitignore-tracked-files.yml and
        # .qontinui/ci.toml's `gitignore-tracked-files` step. Here for the
        # earliest possible feedback: this defect class is created by a commit
        # (a new file under an existing rule, or a rule widened over existing
        # files) and is then invisible — `git status` never mentions it, because
        # ignore rules do not apply to files already in the index. Two
        # `git ls-files` calls over the index, so it costs nothing.
        #
        # `always_run` with `pass_filenames: false`: the check is a property of
        # the (rules, index) PAIR, not of the staged file list. A commit that
        # adds `foo/bar.py` under an existing `foo/` rule touches no .gitignore,
        # so any `files:` pattern narrow enough to be worth writing would sit out
        # exactly the commit that breaks the invariant.
        entry: python scripts/ci/check_tracked_ignored.py
        language: system
        pass_filenames: false
        always_run: true

      - id: web-boundary-lint
        name: web/backend ↔ qontinui boundary lint
        entry: python scripts/ci/check_web_boundary.py --files
        language: system
        files: ^backend/app/.*\.py$
        # SAME SCRIPT as .github/workflows/web-boundary-lint.yml and
        # .qontinui/ci.toml's `web-boundary-lint` step — catches the boundary
        # violation before push. It used to be a third copy of the logic
        # (.pre-commit-hooks/check_web_boundary.sh, deleted by Phase 5 of plan
        # 2026-08-08-ci-tool-registry-and-canonical-configuration-parity);
        # `--files` is the same scan restricted to the changed-file list
        # pre-commit appends. `qontinui-schemas` is exempt (shared Pydantic
        # types). `backend/app/api/embeddings.py` is allowlisted defensively
        # pending Phase 8 (embeddings runner-bridge). See the script's module
        # docstring for the rule itself.

ci:
  autofix_prs: true
  autofix_commit_msg: "chore: pre-commit auto fixes"
